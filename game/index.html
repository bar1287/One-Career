<title>ONE CAREER</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
/* ═══════════════════════════════════════════════════════════════════
   ONE CAREER — playable prototype
   Light "Matchday Paper" shell. No blue anywhere in the chrome.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  color-scheme:light;
  --paper:#EFEBE3; --surface:#FFFFFF; --sunken:#F5F2EC; --hover:#F2EEE6;
  --ink:#17150F; --ink2:#514B41; --ink3:#6E6659;
  --line:#DFD8CB; --line2:#C4BAA8; --ctrl:#8E8474;
  --accent:#1F6F43; --accent-h:#175434; --accent-soft:#E3EFE7; --accent-ink:#12452A;
  --warn:#9A5400; --warn-soft:#FBEBD3; --warn-ink:#6F3C00;
  --bad:#AE2318; --bad-soft:#FBE6E3; --bad-ink:#851A12;
  --gold:#9A7212; --gold-soft:#FAF0D4;
  --turf:#3F8A52; --turf2:#48975B; --turf-line:rgba(255,255,255,.55);
  --sh:0 1px 0 rgba(80,68,48,.06),0 1px 3px rgba(80,68,48,.08);
  --sh2:0 18px 50px rgba(50,42,30,.22);
  --f:"Segoe UI","Noto Sans Hebrew","Arial Hebrew",system-ui,-apple-system,sans-serif;
  --club:#008D36;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --paper:#141311; --surface:#1E1C19; --sunken:#191714; --hover:#272420;
  --ink:#F4F1EA; --ink2:#C4BDB0; --ink3:#948C7E;
  --line:#2E2A25; --line2:#433D35; --ctrl:#6B6357;
  --accent:#4FA97A; --accent-h:#63BC8D; --accent-soft:#1A2C22; --accent-ink:#9AD8B5;
  --warn:#D2953A; --warn-soft:#2F230E; --warn-ink:#EDC382;
  --bad:#E0736A; --bad-soft:#321B18; --bad-ink:#F0A69E;
  --gold:#D6AC4A; --gold-soft:#2E2612;
  --turf:#2C6039; --turf2:#336B41; --turf-line:rgba(255,255,255,.4);
  --sh:0 1px 3px rgba(0,0,0,.45);
  --sh2:0 18px 50px rgba(0,0,0,.6);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    color-scheme:dark;
    --paper:#141311; --surface:#1E1C19; --sunken:#191714; --hover:#272420;
    --ink:#F4F1EA; --ink2:#C4BDB0; --ink3:#948C7E;
    --line:#2E2A25; --line2:#433D35; --ctrl:#6B6357;
    --accent:#4FA97A; --accent-h:#63BC8D; --accent-soft:#1A2C22; --accent-ink:#9AD8B5;
    --warn:#D2953A; --warn-soft:#2F230E; --warn-ink:#EDC382;
    --bad:#E0736A; --bad-soft:#321B18; --bad-ink:#F0A69E;
    --gold:#D6AC4A; --gold-soft:#2E2612;
    --turf:#2C6039; --turf2:#336B41; --turf-line:rgba(255,255,255,.4);
    --sh:0 1px 3px rgba(0,0,0,.45);
    --sh2:0 18px 50px rgba(0,0,0,.6);
  }
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);
  font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--accent);border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
.n{font-variant-numeric:tabular-nums lining-nums}
.lbl{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);font-weight:800}

/* ── app shell ─────────────────────────────────────────────────── */
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}

.hdr{
  display:flex;align-items:center;gap:14px;padding:0 16px;height:58px;flex:0 0 58px;
  background:var(--surface);border-bottom:1px solid var(--line2);position:relative;z-index:5;
}
.hdr::before{content:"";position:absolute;inset-inline:0;top:0;height:3px;background:var(--club)}
.crest{
  width:36px;height:36px;border-radius:8px;background:var(--club);color:#fff;
  display:grid;place-items:center;font-weight:900;font-size:12px;letter-spacing:.02em;flex:0 0 auto;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);
}
.hdr .who{line-height:1.15;min-width:0}
.hdr .who b{display:block;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .who span{font-size:11px;color:var(--ink3)}
.hdr .pill{
  display:flex;align-items:center;gap:7px;background:var(--sunken);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;
}
.hdr .pill i{font-style:normal;color:var(--ink3);font-weight:800;font-size:10px;letter-spacing:.1em}
.grow{flex:1 1 auto}
.iconbtn{
  background:var(--surface);border:1px solid var(--line2);border-radius:8px;
  width:34px;height:34px;display:grid;place-items:center;cursor:pointer;font-size:15px;
}
.iconbtn:hover{background:var(--hover)}

.main{flex:1 1 auto;display:flex;min-height:0}

.rail{
  flex:0 0 84px;background:var(--surface);border-inline-end:1px solid var(--line2);
  display:flex;flex-direction:column;padding:10px 8px;gap:4px;overflow-y:auto;
}
.rail button{
  background:none;border:none;cursor:pointer;border-radius:10px;padding:9px 4px;
  display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink3);
  font-size:10.5px;font-weight:700;position:relative;transition:background .15s,color .15s;
}
.rail button em{font-style:normal;font-size:19px;line-height:1}
.rail button:hover{background:var(--hover);color:var(--ink)}
.rail button.on{background:var(--accent-soft);color:var(--accent-ink)}
.rail button.on::before{
  content:"";position:absolute;inset-inline-start:-8px;top:50%;transform:translateY(-50%);
  width:3px;height:24px;border-radius:0 3px 3px 0;background:var(--club);
}
.rail .badge{
  position:absolute;top:5px;inset-inline-end:9px;min-width:16px;height:16px;border-radius:9px;
  background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;
}

.stage{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:18px 20px 28px;min-width:0}
.stage::-webkit-scrollbar{width:10px}
.stage::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:3px solid var(--paper)}

@media (max-width:720px){
  .rail{flex:0 0 62px}
  .rail button em{font-size:17px}
  .rail button span{display:none}
  .stage{padding:14px 12px 24px}
}

/* ── panels ────────────────────────────────────────────────────── */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1.5fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){.g2,.g3{grid-template-columns:1fr}}

.p{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);overflow:hidden}
.p>h3{
  margin:0;padding:11px 14px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);font-weight:800;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;background:var(--sunken);
}
.p>h3 .r{margin-inline-start:auto;letter-spacing:0;text-transform:none;font-size:12px;color:var(--ink2);font-weight:700}
.pb{padding:14px}
.pb.tight{padding:8px}

/* HUD chips */
.ovrchip{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:52px;height:40px;border-radius:9px;background:var(--ink);color:var(--paper);
  flex:0 0 auto;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);position:relative;overflow:hidden;
}
.ovrchip>u{
  position:absolute;inset-inline-start:0;bottom:0;height:3px;width:0;
  background:var(--accent);text-decoration:none;transition:width .45s cubic-bezier(.2,0,.1,1);
}
.ovrchip b{font-size:20px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ovrchip span{font-size:8px;font-weight:800;letter-spacing:.14em;opacity:.65}
.ovrchip.up{animation:ovrpop .7s cubic-bezier(.2,0,.1,1)}
@keyframes ovrpop{0%{transform:scale(1)}35%{transform:scale(1.22);background:var(--accent)}100%{transform:scale(1)}}
.valchip{display:flex;flex-direction:column;justify-content:center;flex:0 0 auto;min-width:74px}
.valchip b{font-size:15px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.valchip span{font-size:10px;font-weight:800;color:var(--ink3);min-height:12px}
.valchip span.up{color:var(--accent)} .valchip span.dn{color:var(--bad)}
.xpwrap{flex:0 1 190px;min-width:110px;display:flex;flex-direction:column;gap:3px}
.xptop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.xptop .lvl{font-size:11px;font-weight:900;color:var(--accent)}
.xptop .n{font-size:9.5px;font-weight:700;color:var(--ink3);direction:ltr;unicode-bidi:isolate}
.xpfoot span,.xphead b,.sbclk .m{direction:ltr;unicode-bidi:isolate}
.xpbar{height:7px;border-radius:99px;background:var(--sunken);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.xpbar>i{
  display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),#6FCB96);
  transition:width .8s cubic-bezier(.2,0,.1,1);
}
@media (max-width:900px){.xpwrap,.valchip{display:none}}

/* TP badge on rail */
.rail .tp{
  position:absolute;top:5px;inset-inline-end:9px;min-width:16px;height:16px;border-radius:9px;
  background:var(--gold);color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;padding:0 4px;
  animation:tppulse 1.6s infinite;
}
@keyframes tppulse{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}

/* matchday hero */
.hero{overflow:hidden}
.heroband{
  display:flex;align-items:center;gap:14px;padding:16px 18px;
  background:linear-gradient(135deg,var(--sunken),var(--surface));
  border-bottom:1px solid var(--line);position:relative;
}
.heroband::before{content:"";position:absolute;inset-inline:0;top:0;height:4px;background:var(--club)}
.hb{display:flex;align-items:center;gap:11px;flex:1 1 0;min-width:0}
.hb.away{flex-direction:row-reverse;text-align:end}
.hb b{display:block;font-size:15px;font-weight:850;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb span{display:block;font-size:11px;color:var(--ink3);font-weight:700}
.hbc{
  width:46px;height:46px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;
  font-size:13px;font-weight:900;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);
}
.hvs{display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 auto;padding-inline:8px}
.hvs b{font-size:19px;font-weight:900;letter-spacing:.04em;color:var(--ink3)}
@media (max-width:560px){.hb b{font-size:13px}.hbc{width:38px;height:38px}}

.stat{display:flex;flex-direction:column;gap:3px}
.stat b{font-size:26px;font-weight:850;line-height:1;letter-spacing:-.02em}
.stat span{font-size:11px;color:var(--ink3);font-weight:700}

.bar{height:7px;border-radius:99px;background:var(--sunken);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s cubic-bezier(.2,0,.1,1)}
.bar>i.w{background:var(--warn)} .bar>i.b{background:var(--bad)}

.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;padding:5px 0}
.kv+.kv{border-top:1px solid var(--line)}

.tag{
  display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 9px;
  font-size:11px;font-weight:800;background:var(--sunken);color:var(--ink2);white-space:nowrap;
}
.tag.ok{background:var(--accent-soft);color:var(--accent-ink)}
.tag.w{background:var(--warn-soft);color:var(--warn-ink)}
.tag.b{background:var(--bad-soft);color:var(--bad-ink)}
.tag.g{background:var(--gold-soft);color:var(--gold)}

.btn{
  border:1px solid var(--ctrl);background:var(--surface);border-radius:9px;padding:9px 15px;
  font-size:13.5px;font-weight:750;cursor:pointer;transition:background .15s,transform .06s;
}
.btn:hover{background:var(--hover)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.16)}
.btn.pri:hover{background:var(--accent-h)}
.btn.big{padding:13px 24px;font-size:15px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri:disabled{background:var(--ctrl);border-color:var(--ctrl)}

/* ── week planner ──────────────────────────────────────────────── */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{
  border:1px solid var(--line);border-radius:9px;padding:8px 4px;text-align:center;
  font-size:11px;min-height:62px;display:flex;flex-direction:column;gap:3px;justify-content:center;
}
.day b{font-size:10px;letter-spacing:.08em;color:var(--ink3);font-weight:800}
.day.f{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:800}
.day.d{background:var(--sunken);color:var(--ink3)}

.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:9px}
.act{
  border:1px solid var(--line2);background:var(--surface);border-radius:11px;padding:11px 12px;
  cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:5px;
  transition:border-color .15s,background .15s,transform .06s;position:relative;
}
.act:hover:not(:disabled){background:var(--hover);border-color:var(--ctrl)}
.act:active:not(:disabled){transform:translateY(1px)}
.act.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.act:disabled{opacity:.42;cursor:not-allowed}
.act .t{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:7px}
.act .t em{font-style:normal;font-size:16px}
.act .d{font-size:11.5px;color:var(--ink3);line-height:1.4}
.act .fx{display:flex;gap:5px;flex-wrap:wrap;margin-top:1px}
.act .fx span{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:5px;background:var(--sunken);color:var(--ink2)}
.act.on .fx span{background:rgba(255,255,255,.55)}
:root[data-theme=dark] .act.on .fx span{background:rgba(0,0,0,.28)}
.act .n{position:absolute;top:9px;inset-inline-end:10px;font-size:11px;font-weight:900;color:var(--accent)}

.slots{display:flex;gap:5px}
.slot{width:22px;height:7px;border-radius:99px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.slot.f{background:var(--accent);box-shadow:none}

/* ── FIFA-style card, four tiers ───────────────────────────────── */
.fcard{
  border-radius:14px;padding:14px;position:relative;overflow:hidden;
  color:var(--cink);background:var(--cbg);
  box-shadow:0 8px 24px rgba(50,40,15,.26),inset 0 0 0 1px rgba(255,255,255,.35);
}
.fcard::after{
  content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:150px;height:150px;
  border-radius:50%;background:var(--cc);opacity:.15;
}
.fcard::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 34%,rgba(255,255,255,.30) 48%,transparent 62%);
}
.fcard.elite{box-shadow:0 10px 34px rgba(20,14,40,.5),inset 0 0 0 1px rgba(232,199,102,.55)}
.fcard.elite::before{background:linear-gradient(115deg,transparent 32%,rgba(232,199,102,.28) 48%,transparent 64%)}
.tierbadge{
  position:absolute;inset-inline-start:12px;top:12px;z-index:2;
  font-size:9px;font-weight:900;letter-spacing:.16em;opacity:.55;
}
.fctop{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;gap:6px}
.fcovr{display:flex;flex-direction:column;align-items:center;line-height:1}
.fcovr b{font-size:44px;font-weight:900;letter-spacing:-.04em}
.fcovr span{font-size:13px;font-weight:900;letter-spacing:.06em;margin-top:2px;opacity:.72}
.fcradar{flex:0 0 auto;opacity:.95}
@media (max-width:400px){.fcradar{display:none}}
.fcbadges{display:flex;flex-direction:column;align-items:center;gap:6px}
.fcclub{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:900}
.fclvl{
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:var(--cchip);color:var(--cchipink);font-size:12px;font-weight:900;
}
.fcnat{font-size:16px;line-height:1}
.fcname{
  font-size:19px;font-weight:900;letter-spacing:-.02em;text-align:center;
  margin:8px 0 10px;padding-bottom:9px;position:relative;z-index:1;
  border-bottom:1.5px solid color-mix(in srgb, currentColor 30%, transparent);
}
.fcstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 4px;position:relative;z-index:1}
.fs{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.fs b{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.fs span{font-size:9.5px;font-weight:900;letter-spacing:.08em;opacity:.66}
.fcfoot{
  display:flex;justify-content:space-between;align-items:center;margin-top:11px;
  padding-top:9px;position:relative;z-index:1;
  border-top:1.5px solid color-mix(in srgb, currentColor 30%, transparent);
  font-size:11.5px;font-weight:800;
}
.fcfoot b{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}

/* ── attribute development ─────────────────────────────────────── */
.tpbanner{
  background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold);
  border-radius:10px;padding:10px 14px;font-size:13.5px;font-weight:700;margin-bottom:14px;
}
.grps{display:flex;flex-direction:column;gap:14px}
.grpblock{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.grphd{
  display:flex;align-items:center;gap:9px;padding:8px 12px;background:var(--sunken);
  border-bottom:1px solid var(--line);
}
.grphd b{font-size:13px;font-weight:850}
.grphd .grpv{margin-inline-start:auto;font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}
.grphd .grpk{font-size:9.5px;font-weight:900;letter-spacing:.1em;color:var(--ink3)}
.subs{padding:6px 10px 10px}
.sub{display:grid;grid-template-columns:1fr auto auto;gap:3px 9px;align-items:center;padding:6px 0}
.sub+.sub{border-top:1px solid var(--line)}
.sub .sn{font-size:12.5px;font-weight:600}
.sub.key .sn{font-weight:800}
.sub .sn i{color:var(--gold);font-style:normal;font-size:11px}
.sub .sv{font-size:13.5px;font-weight:900;min-width:24px;text-align:end}
.sub .sbar{
  grid-column:1/3;height:6px;border-radius:99px;background:var(--sunken);
  box-shadow:inset 0 0 0 1px var(--line);position:relative;overflow:hidden;
}
.sub .sbar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .45s}
.sub.key .sbar>i{background:linear-gradient(90deg,var(--accent),#6FCB96)}
.sub .sbar>u{position:absolute;inset-block:-2px;width:2px;background:var(--gold);text-decoration:none}
.spend{
  grid-row:1/3;width:44px;height:34px;border-radius:8px;cursor:pointer;
  border:1px solid var(--ctrl);background:var(--surface);
  font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:2px;
  transition:background .13s,transform .06s;
}
.spend em{font-style:normal;font-size:10px;font-weight:800;color:var(--ink3)}
.spend:hover:not(:disabled){background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.spend:hover:not(:disabled) em{color:var(--gold)}
.spend:active:not(:disabled){transform:translateY(1px)}
.spend:disabled{opacity:.32;cursor:not-allowed}

.sparks{display:flex;gap:5px;align-items:flex-end;min-height:64px}
.spk{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.spk>div{width:100%;max-width:22px;border-radius:4px 4px 0 0}
.spk>span{font-size:10px;font-weight:800;color:var(--ink3)}

/* coach card */
.coachrow{display:flex;align-items:center;gap:11px}
.coachrow b{display:block;font-size:14px;font-weight:850}
.coachrow span{display:block;font-size:11.5px;color:var(--ink3);line-height:1.35}
.cavatar{
  width:40px;height:40px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--sunken);border:1px solid var(--line2);font-size:17px;font-weight:900;color:var(--ink2);
}

/* traits */
.traitrow{display:flex;gap:10px;align-items:flex-start;padding:7px 0;opacity:.42}
.traitrow+.traitrow{border-top:1px solid var(--line)}
.traitrow.on{opacity:1}

/* build the club index; ids are namespaced by league */
var CLUBS = {};
var LG_IDS = Object.keys(LEAGUES);
LG_IDS.forEach(function(lid){
  var L = LEAGUES[lid];
  L.id = lid;
  L.clubs = L.raw.split(";").map(function(row){
    var f = row.split("|");
    var id = lid + "_" + f[0];
    var c = { id:id, lg:lid, n:f[1], ab:f[2], c:f[3], rep:+f[4] };
    c.t = textOn(f[3]);
    CLUBS[id] = c;
    return c;
  });
  delete L.raw;
});
function textOn(hex){
  var r = parseInt(hex.substr(1,2),16), g = parseInt(hex.substr(3,2),16), b = parseInt(hex.substr(5,2),16);
  return (0.299*r + 0.587*g + 0.114*b) > 150 ? "#241F20" : "#FFFFFF";
}
function club(id){ return CLUBS[id]; }
function lg(id){ return LEAGUES[id]; }
function leagueOf(clubId){ return LEAGUES[CLUBS[clubId].lg]; }

function grpVal(g){
  var subs = GRP[g].subs, t = 0;
  for(var i=0;i<subs.length;i++) t += S.a[subs[i]] || 0;
  return Math.round(t/subs.length);
}
function grpExact(g){
  var subs = GRP[g].subs, t = 0;
  for(var i=0;i<subs.length;i++) t += S.a[subs[i]] || 0;
  return t/subs.length;
}
function ovrExact(){
  var w = POS[S.pos].w, t = 0;
  for(var g in w) t += grpExact(g) * w[g];
  return clamp(t, 1, 99);
}
function ovr(){ return Math.round(ovrExact()); }
/* how far through the current OVR point we are — drives the HUD progress sliver */
function ovrFrac(){ var e = ovrExact(); return clamp(e - Math.floor(e), 0, 1); }
/* market value in euros — exponential in OVR, shaped by age and potential */
function value(){
  var o = ovr();
  var base = 25000 * Math.pow(1.185, o - 40);
  var age = S.age, m;
  if(age <= 19)      m = 1.55;
  else if(age <= 22) m = 1.40;
  else if(age <= 25) m = 1.20;
  else if(age <= 28) m = 1.00;
  else if(age <= 31) m = 0.72;
  else if(age <= 34) m = 0.42;
  else               m = 0.20;
  var pot = 1 + clamp(S.potential - o, 0, 25) * 0.022;      // headroom premium
  var fr = S.ratings.length ? avgRating() : (S.lastSeasonRating || 6.6);
  var form = 1 + clamp(fr - 6.6, -0.8, 1.2) * 0.16;
  var con  = S.contractYears <= 0 ? 0.55 : (S.contractYears === 1 ? 0.82 : 1);
  var idol = hasTrait("idol") ? 1.08 : 1;
  return Math.round(base * m * pot * form * con * idol);
}
function money(v){
  if(v >= 1000000) return "€" + (v/1000000).toFixed(v >= 10000000 ? 0 : 1) + "M";
  if(v >= 1000)    return "€" + Math.round(v/1000) + "K";
  return "€" + v;
}
/* XP & levels */
function xpNeed(l){ return Math.round(110 + l*72 + l*l*3.5); }
function tpCost(v){
  var c = v < 55 ? 1 : (v < 65 ? 2 : (v < 75 ? 3 : (v < 82 ? 5 : (v < 88 ? 8 : 13))));
  return c;
}
function isKey(k){ return POS[S.pos].key.indexOf(k) >= 0; }
/* game intelligence — drives how long the Read phase lasts */
function iq(){
  return S.pos === "GK"
    ? (S.a.gpos + S.a.cmp) / 2
    : (S.a.vis + S.a.cmp) / 2;
}

var S = null;

function newState(name, pos, startId){
  var st = STARTS.filter(function(s){return s.id===startId})[0];

  /* every sub-attribute starts low; the position's key five start meaningfully
     higher, and the position's weighted groups get a smaller lift. A prospect
     is not balanced — that is the point. */
  var a = {};
  var gk = pos === "GK";
  for(var k in ATTR){
    if(!!ATTR[k].gk !== gk && !(gk && (k === "acc" || k === "spd"))) { a[k] = 22; continue; }
    a[k] = 34 + Math.round(Math.random()*7);
  }
  var w = POS[pos].w;
  for(var k2 in ATTR){
    var g = ATTR[k2].g;
    if(w[g]) a[k2] = Math.round(a[k2] + w[g] * 26);
  }
  POS[pos].key.forEach(function(k3){ a[k3] = clamp(a[k3] + 9 + Math.round(Math.random()*4), 1, 99); });

  var s = {
    screen:"hub", name:name, pos:pos, age:18, club:st.id, league:CLUBS[st.id].lg,
    season:1, week:1, maxWeek:14,
    a:a,
    potential: 0,
    xp:0, level:1, tp:3,
    fit:86, sharp:48, load:22, morale:58,
    trust:st.trust, status:st.status,
    apps:0, minutes:0, goals:0, assists:0, ratings:[],
    careerApps:0, careerGoals:0, careerAssists:0, bestRating:0, streak:0, bestStreak:0,
    picked:[], slots:4,
    prep:{video:0, analyst:0, coach:0, unit:0, sp:0},
    tables:{}, scorers:{}, fixtures:[],
    interest:[], inbox:[], news:[], seen:0, offers:[],
    contractYears:2, wage:4,
    valuePrev:0, ovrPrev:0, badges:[], traits:[], squad:[], rivals:[],
    history:[], honours:[],
    natCaps:0, natGoals:0, natCalled:false, natWatch:0,
    cup:null, cupRound:0,
    coach:null, coachWeeks:0,
    readMode:"normal",
    seed: (Date.now()%100000)
  };
  S = s;
  resetWorld();
  s.fixtures = buildFixtures(st.id);
  s.potential = clamp(ovr() + 14 + Math.round(Math.random()*20), 45, 94);
  s.ovrPrev = ovr();
  s.valuePrev = value();
  s.squad = buildSquad();
  s.rivals = buildRivals();
  s.coach = newCoach();
  s.cup = newCup();
  return s;
}

function newCoach(){
  var st = COACH_STYLES[ri(0, COACH_STYLES.length-1)];
  return {
    n: COACH_FIRST[ri(0,COACH_FIRST.length-1)] + " " + COACH_LAST[ri(0,COACH_LAST.length-1)],
    style: st.id, styleName: st.n, styleDesc: st.d, likes: st.likes, bonus: st.bonus,
    patience: ri(50, 85), youth: st.id === "youth" ? 22 : ri(-6, 10)
  };
}

/* how well you fit what the manager actually wants */
function coachFit(){
  if(!S.coach) return 50;
  var t = 0;
  S.coach.likes.forEach(function(k){ t += (S.a[k] || 40); });

  for(var k=0;k<14;k++) fx.push({opp: others[k % others.length], home: k%2===0});

/* clubs that could plausibly want you right now — reputation-gated */
function suitorPool(){
  var o = ovr(), out = [];
  var ceiling = o + 14 + (S.interest.length ? 4 : 0);
  LG_IDS.forEach(function(lid){
    if(lid === S.league) return;
    LEAGUES[lid].clubs.forEach(function(c){
      if(c.rep <= ceiling && c.rep >= club(S.club).rep - 6) out.push(c);
    });
  });
  return out;
}

function agentMeeting(){
  var r = avgRating();
  var chance = (r-6.2)*0.5 + (S.minutes/900)*0.4;
  var pool = suitorPool();
  if(pool.length && rnd() < clamp(chance, 0.05, 0.8)){
    var e = pool[ri(0, pool.length-1)];
    if(!S.interest.some(function(x){return x.id===e.id})){
      S.interest.push({id:e.id, n:e.n, ab:e.ab, c:e.c, lg:LEAGUES[e.lg].n, rep:e.rep, lvl:1});
      push("הסוכן: ⁨" + e.n + "⁩ (⁨" + LEAGUES[e.lg].n + "⁩) ביקשו דוח עליך.", "ok");
      return;
    }
  }
  if(S.interest.length){
    var x = S.interest[ri(0, S.interest.length-1)];
    if(x.lvl < 3){
      x.lvl++;
      push("הסוכן: ⁨" + x.n + "⁩ העמיקו את הבירור.", "ok");
    } else {
      push("הסוכן: ⁨" + x.n + "⁩ מוכנים לדבר. חכה לחלון ההעברות.", "ok");
    }
  } else {
    push("הסוכן: אין תנועה. \"תן לי דקות ואני אתן לך שוק.\"", "");
  }
}

function push(txt, kind){ S.inbox.unshift({t:txt, k:kind||"", w:S.week}); if(S.inbox.length>40) S.inbox.pop(); }
function avgRating(){ if(!S.ratings.length) return 6.0; return S.ratings.reduce(function(a,b){return a+b},0)/S.ratings.length; }

/* grow a set of sub-attributes, respecting the potential ceiling.
   Returns [{k, amount}] so the UI can show "+1 דריבל" chips. */
function grow(keys, amount){
  var out = [], head = S.potential - ovr();
  keys.forEach(function(k){
    if(S.a[k] === undefined) return;
    var soft = head <= 0 ? 0.25 : (head < 5 ? 0.55 : 1);
    var gain = amount * soft * (isKey(k) ? 1.25 : 0.85);
    var before = Math.floor(S.a[k]);
    S.a[k] = clamp(S.a[k] + gain, 1, 99);
    var after = Math.floor(S.a[k]);
    if(after > before) out.push({k:k, amount:after-before});
  });
  return out;
}
function addXp(n){
  if(hasTrait("wonder")) n = Math.round(n*1.25);
  S.xp += n;
  var levels = 0;
  while(S.xp >= xpNeed(S.level)){
    S.xp -= xpNeed(S.level);
    S.level++;
    S.tp += 2 + (S.level % 5 === 0 ? 3 : 0);
    levels++;
  }
  return levels;
}

function oppPlace(id){
  var T = S.tables[S.league];
  var rows = LEAGUES[S.league].clubs.map(function(c){ return {id:c.id, t:T[c.id]}; })
    .sort(function(a,b){ return b.t.pts-a.t.pts || (b.t.gf-b.t.ga)-(a.t.gf-a.t.ga); });
  return rows.findIndex(function(r){return r.id===id}) + 1;
}

function meter(label, val, cls){
  return '<div><div class="kv" style="padding:0 0 5px"><span>'+label+'</span>'
    + '<b class="n">'+Math.round(clamp(val,0,100))+'%</b></div>'
    + '<div class="bar"><i class="'+(cls||"")+'" style="width:'+clamp(val,0,100)+'%"></i></div></div>';
}

function expectedMinutes(){
  var t = S.trust + (S.fit-70)*0.3 + (S.sharp-50)*0.2;
  if(t>=68) return {label:"הרכב פותח", start:true, mins:90};
  if(t>=48) return {label:"הרכב / חילוף מוקדם", start:true, mins:ri(60,90)};
  if(t>=32) return {label:"ספסל · כניסה סבירה", start:false, mins:ri(18,35)};
  return {label:"ספסל · כניסה לא בטוחה", start:false, mins:rnd()<0.5?ri(6,16):0};
}

function cardTier(o){
  if(o >= 85) return {id:"elite",  n:"אליט", bg:"linear-gradient(150deg,#33304A 0%,#17162A 55%,#443A63 100%)", ink:"#F3E9CB", chip:"#F3E9CB", chipInk:"#17162A"};
  if(o >= 75) return {id:"gold",   n:"זהב",  bg:"linear-gradient(150deg,#FAF2D8 0%,#E9D496 42%,#D6BA6E 100%)", ink:"#1A160C", chip:"#1A160C", chipInk:"#FAF2D8"};
  if(o >= 62) return {id:"silver", n:"כסף",  bg:"linear-gradient(150deg,#F5F5F3 0%,#DCDCD8 45%,#BEBEB9 100%)", ink:"#17150F", chip:"#17150F", chipInk:"#F5F5F3"};
  return                {id:"bronze", n:"ארד",  bg:"linear-gradient(150deg,#F2E2D0 0%,#DCBE9B 45%,#C39F76 100%)", ink:"#221609", chip:"#221609", chipInk:"#F2E2D0"};
}

/* six-axis radar — the shape of a player, not a list of numbers */
function radarSvg(vals, labels, ink){
  var R = 45, cx = 67, cy = 66, n = vals.length;
  function pt(i, r){
    var a = -Math.PI/2 + i*2*Math.PI/n;
    return [(cx + Math.cos(a)*r).toFixed(1), (cy + Math.sin(a)*r).toFixed(1)];
  }
  var rings = [0.25,0.5,0.75,1].map(function(f){
    var pts = []; for(var i=0;i<n;i++) pts.push(pt(i, R*f).join(","));
    return '<polygon points="'+pts.join(" ")+'" fill="none" stroke="'+ink+'" stroke-opacity="'+(f===1?.34:.15)+'" stroke-width="1"/>';
  }).join("");
  var spokes = ""; for(var i=0;i<n;i++){ var e = pt(i,R); spokes += '<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0]+'" y2="'+e[1]+'" stroke="'+ink+'" stroke-opacity=".15"/>'; }
  var shape = []; for(var j=0;j<n;j++) shape.push(pt(j, R*clamp(vals[j]/99,0.08,1)).join(","));
  var labs = ""; for(var k=0;k<n;k++){ var lp = pt(k, R+13);
    labs += '<text x="'+lp[0]+'" y="'+lp[1]+'" font-size="8.5" font-weight="900" text-anchor="middle" dominant-baseline="middle" fill="'+ink+'" fill-opacity=".62">'+labels[k]+'</text>'; }
  return '<svg viewBox="0 0 134 132" width="128" height="126" aria-hidden="true">'
    + rings + spokes
    + '<polygon points="'+shape.join(" ")+'" fill="'+ink+'" fill-opacity=".20" stroke="'+ink+'" stroke-opacity=".78" stroke-width="2" stroke-linejoin="round"/>'
    + labs + '</svg>';
}

  var p = POS[S.pos], c = club(S.club), o = ovr(), T = cardTier(o);

    return '<div class="fs"><b class="n">'+vals[i]+'</b><span>'+g+'</span></div>';
  }).join("");
  return '<div class="fcard '+T.id+'" style="--cc:'+c.c+';--cbg:'+T.bg+';--cink:'+T.ink+';--cchip:'+T.chip+';--cchipink:'+T.chipInk+'">'
    + '<span class="tierbadge">'+T.n+'</span>'
    + '<div class="fctop">'
      + '<div class="fcovr"><b class="n">'+o+'</b><span>'+S.pos+'</span></div>'
      + '<div class="fcradar">'+radarSvg(vals, p.face, T.ink)+'</div>'
      + '<div class="fcbadges">'
        + '<div class="fcclub" style="background:'+c.c+';color:'+c.t+'">'+c.ab+'</div>'

  + '</div>';
}

/* players competing for your shirt, drawn from the real squad */
function depthChart(){
  var fam = {GK:["GK"], CB:["CB"], RB:["RB","LB"], LB:["LB","RB"], CM:["CM"], W:["W"], ST:["ST"]};
  var want = fam[S.pos] || [S.pos];
  var list = S.squad.filter(function(pl){ return want.indexOf(pl.pos) >= 0; })
    .map(function(pl){ return {n:pl.n, age:pl.age, ovr:pl.ovr, inj:pl.inj, me:false, role:""}; });
  list.push({n:S.name+" (אתה)", age:S.age, ovr:ovr(), inj:0, me:true, role:""});
  list.sort(function(a,b){
    return (b.ovr + (b.me?S.trust*0.16:0) - (b.inj?25:0)) - (a.ovr + (a.me?S.trust*0.16:0) - (a.inj?25:0));
  });
  list.forEach(function(r,i){ r.role = i===0?"מפתח":(i===1?"מסובב":(i===2?"רוטציה":"מחוץ לרוטציה")); });
  return list;
}

function depthReason(){
  if(S.trust>=68) return "אתה בחירה ראשונה. המאמן סומך עליך גם כשהמשחק לא הולך — זה מה שמייצר רצף.";
  if(S.trust>=48) return "אתה בגבול ההרכב. עמידה בהוראות ודוח תפקיד טוב שווים כאן יותר משער בודד.";
  if(S.trust>=32) return "אתה אופציה מהספסל. הדרך פנימה עוברת דרך אימון טקטי, אמינות, ושתי כניסות טובות ברצף.";

/* ══════════════════════════════════════════════════════════════════
   BINDINGS
   ════════════════════════════════════════════════════════════════ */
function bind(){
  Array.prototype.forEach.call(stage.querySelectorAll("[data-act]"), function(b){
    b.onclick = function(){
      var id = b.getAttribute("data-act");
      var i = S.picked.indexOf(id);
      if(i>=0) S.picked.splice(i,1);
      else if(S.picked.length < S.slots) S.picked.push(id);
      render();
    };
  });
  var pl = document.getElementById("play"); if(pl) pl.onclick = startWeek;
  var cl = document.getElementById("clear"); if(cl) cl.onclick = function(){ S.picked=[]; render(); };

  Array.prototype.forEach.call(stage.querySelectorAll("[data-accept]"), function(b){
    b.onclick = function(){ acceptOffer(+b.getAttribute("data-accept")); };
  });
  var dec = document.getElementById("declineAll");
  if(dec) dec.onclick = declineOffers;
  var ry = document.getElementById("renewYes"); if(ry) ry.onclick = acceptRenewal;
  var rn = document.getElementById("renewNo");  if(rn) rn.onclick = rejectRenewal;

  Array.prototype.forEach.call(stage.querySelectorAll("[data-lg]"), function(b){
    b.onclick = function(){ viewLid = b.getAttribute("data-lg"); render(); };
  });

  Array.prototype.forEach.call(stage.querySelectorAll(".spend"), function(b){
    b.onclick = function(){
      var k = b.getAttribute("data-k");
      var v = Math.floor(S.a[k]);
      var cost = tpCost(v);
      if(S.tp < cost || v >= 99) return;
      var before = ovr(), beforeE = ovrExact(), bv = value();
      S.tp -= cost;
      S.a[k] = Math.min(99, Math.floor(S.a[k]) + 1);
      /* spillover: drilling one thing lifts its siblings a little */
      GRP[ATTR[k].g].subs.forEach(function(sib){
        if(sib !== k && S.a[sib] !== undefined) S.a[sib] = clamp(S.a[sib] + 0.4, 1, 99);
      });
      var after = ovr();
      render();
      if(after > before){
        S.valuePrev = bv;
        flashOvr();
        toast("OVR " + before + " → " + after + "   ·   " + money(value()));
      } else {
        var d = (ovrExact() - beforeE);
        toast(ATTR[k].n + " " + v + " → " + (v+1) + "   ·   OVR +" + d.toFixed(2));
      }
      var got = checkBadges();
      if(got.length) setTimeout(function(){ showBadge(got[0]); }, 320);
    };
  });
}

function flashOvr(){
  var el = document.getElementById("hOvr").parentNode;
  el.classList.remove("up"); void el.offsetWidth; el.classList.add("up");
}

document.getElementById("hRead").onclick = function(){

/* ══════════════════════════════════════════════════════════════════
   WEEK → MATCH
   ════════════════════════════════════════════════════════════════ */
function startWeek(){
  WEEK_GAINS = [];
  var xp = 0;
  S.picked.forEach(function(id){
    var a = ACTIONS.filter(function(x){return x.id===id})[0];
    if(a){ a.run(); xp += (a.xp||0); }
  });
  S.trainXp = xp;
  S.trainGains = WEEK_GAINS.slice();
  S.fit   = clamp(S.fit - S.load*0.06 + 4, 25, 100);
  S.sharp = clamp(S.sharp - 3, 0, 100);
  S.load  = clamp(S.load, 0, 100);
  S.morale= clamp(S.morale - 1, 0, 100);

  if(S.load > 86 && rnd() < (hasTrait("iron") ? 0.11 : 0.17)){
    var wks = ri(1,3);
    push("פציעה: מתיחה בירך. " + wks + " שבועות בחוץ. העומס לא היה סוד.", "b");
    S.load = 30; S.fit = 55; S.sharp = 30; S.trust -= 2;
    S.picked = [];
    for(var i=0;i<wks && S.week<=S.maxWeek;i++){ simWorld(null); S.week++; }
    S.prep = {video:0,analyst:0,coach:0,unit:0,sp:0};
    if(S.week>S.maxWeek) return endSeason();
    render();
    toast("פציעה — דילגת על " + wks + " מחזורים");
    return;
  }
  openMatch();
}

   MATCH ENGINE
   ════════════════════════════════════════════════════════════════ */
var M = null;

function openMatch(){
  var fx = S.fixtures[S.week-1] || S.fixtures[S.fixtures.length-1];
  var opp = club(fx.opp);
  var me  = club(S.club);
  var exp = expectedMinutes();

  M = {
    fx:fx, opp:opp, me:me,
    home: fx.home ? me : opp,
    away: fx.home ? opp : me,
    hg:0, ag:0, min:0,
    events:[], moments:[], mi:0,
    onPitch: exp.start, entryMin: exp.start ? 0 : ri(55,75),
    mins: exp.mins, playing: exp.mins>0,
    score:0, count:0, gAdded:0, aAdded:0,
    running:false, timer:null
  };

  M.moments = buildMoments(exp);

  var el = document.createElement("div");
  el.className = "match"; el.id = "matchLayer";
  el.innerHTML = matchHtml();
  document.body.appendChild(el);
  paintPitch();
  document.getElementById("mStart").onclick = runClock;
  document.getElementById("mSkip").onclick = skipToEnd;
}

function buildMoments(exp){
  if(exp.mins<=0) return [];
  var n = exp.start ? ri(6,9) : ri(3,5);
  var out = [];
  var from = exp.start ? 4 : M.entryMin+3;
  var to   = 89;
  for(var i=0;i<n;i++){
    var m = Math.round(from + (to-from) * ((i+0.5)/n) + ri(-3,3));
    out.push({min:clamp(m,3,89), done:false});
  }
  return out.sort(function(a,b){return a.min-b.min});
}

    + '<circle id="pBall" cx="500" cy="310" r="8.5" fill="#fff" stroke="#17150F" stroke-width="2.5"/>'
    + '</svg>';

  var g = document.getElementById("pPlayers");
  var myIdx = {GK:0, CB:2, W:8, CM:6, ST:9}[S.pos];
  var NUMS = [1,2,4,5,3,6,8,10,7,9,11];
  P = {ball:{x:50,y:50}, bt:{x:50,y:50}, poss:"h", men:[], possH:50, t:0, trail:[]};

  for(var side=0; side<2; side++){
    for(var i=0;i<11;i++){
      var f = FORM[i];
      var bx = side===0 ? f.x : 100-f.x;
      var by = side===0 ? f.y : 100-f.y;
      var team = side===0 ? M.home : M.away;
      var isMe = (side === (M.home===M.me ? 0 : 1)) && i===myIdx;

      if(isMe){
        var halo = document.createElementNS("http://www.w3.org/2000/svg","circle");
        halo.setAttribute("r", 20); halo.setAttribute("fill", "none");
        halo.setAttribute("stroke", "#FFE27A"); halo.setAttribute("stroke-width", 3);
        halo.setAttribute("stroke-opacity", ".85");
        g.appendChild(halo);
      }
      var el = document.createElementNS("http://www.w3.org/2000/svg","circle");
      el.setAttribute("r", isMe ? 13 : 10);
      el.setAttribute("fill", team.c);
      el.setAttribute("stroke", isMe ? "#17150F" : "rgba(255,255,255,.9)");
      el.setAttribute("stroke-width", isMe ? 3.5 : 2);
      g.appendChild(el);

      var lbl = document.createElementNS("http://www.w3.org/2000/svg","text");
      lbl.setAttribute("text-anchor","middle");
      lbl.setAttribute("font-size", isMe ? "11" : "9");
      lbl.setAttribute("font-weight","900");
      lbl.setAttribute("fill", team.t);
      lbl.setAttribute("pointer-events","none");
      lbl.textContent = isMe ? S.pos : NUMS[i];
      g.appendChild(lbl);

      P.men.push({bx:bx, by:by, x:bx, y:by, el:el, lbl:lbl, halo:isMe?halo:null,
                  side:side, me:isMe, gk:i===0});
    }
  }
  pitchFrame();
}

function pickBallTarget(){
  // possession drifts toward the stronger side; ball roams toward that goal
  var hs = M.home.rep + (M.home===M.me ? 5 : 0);
  var as = M.away.rep + (M.away===M.me ? 5 : 0);
  if(rnd() < 0.35) P.poss = rnd() < hs/(hs+as) ? "h" : "a";
  var bias = P.poss==="h" ? 1 : -1;
  P.bt.x = clamp(50 + bias*(10 + rnd()*36) + (rnd()-0.5)*14, 8, 92);
  P.bt.y = clamp(15 + rnd()*70, 8, 92);
  P.possH = clamp(P.possH + (P.poss==="h" ? 0.6 : -0.6), 28, 72);
}

function pitchFrame(){
  if(!P || !document.getElementById("pSvg")) return;
  P.t++;
  if(P.t % 34 === 0) pickBallTarget();

  P.ball.x += (P.bt.x - P.ball.x) * 0.055;
  P.ball.y += (P.bt.y - P.ball.y) * 0.055;

  var bx = 16 + P.ball.x*9.68, by = 16 + P.ball.y*5.88;
  var b = document.getElementById("pBall");
  if(b){ b.setAttribute("cx", bx); b.setAttribute("cy", by); }

  /* ball trail */
  P.trail.push([bx,by]);
  if(P.trail.length > 14) P.trail.shift();
  var tr = document.getElementById("pTrail");
  if(tr && P.t % 2 === 0){
    tr.setAttribute("points", P.trail.map(function(q){return q[0].toFixed(0)+","+q[1].toFixed(0)}).join(" "));
  }

  var shift = (P.ball.x - 50) * 0.30;
  for(var i=0;i<P.men.length;i++){
    var m = P.men[i];
    var tx = m.gk ? m.bx + shift*0.12 : m.bx + shift;
    var ty = m.gk ? 50 + (P.ball.y-50)*0.16 : m.by + (P.ball.y - 50) * 0.20;
    /* the closest outfielder on the possessing side steps toward the ball */
    if(!m.gk && ((P.poss==="h") === (m.side===0))){
      var d = Math.abs(m.x - P.ball.x) + Math.abs(m.y - P.ball.y);
      if(d < 22){ tx = tx + (P.ball.x - tx)*0.55; ty = ty + (P.ball.y - ty)*0.55; }
    }
    m.x += (clamp(tx,3,97) - m.x) * 0.045;
    m.y += (clamp(ty,5,95) - m.y) * 0.045;
    var px = 16 + m.x*9.68, py = 16 + m.y*5.88;
    m.el.setAttribute("cx", px); m.el.setAttribute("cy", py);
    if(m.lbl){ m.lbl.setAttribute("x", px); m.lbl.setAttribute("y", py + (m.me?4:3.2)); }
    if(m.halo){
      m.halo.setAttribute("cx", px); m.halo.setAttribute("cy", py);
      m.halo.setAttribute("r", 18 + Math.sin(P.t/12)*3);
    }
  }

  var pv = document.getElementById("mPoss");
  if(pv) pv.textContent = "החזקה " + Math.round(M.me===M.home ? P.possH : 100-P.possH) + "%";

  P.raf = requestAnimationFrame(pitchFrame);
}

function stopPitch(){ if(P && P.raf) cancelAnimationFrame(P.raf); }

function addEv(min, txt, kind){
  M.events.unshift({min:min, t:txt, k:kind||""});
  var f = document.getElementById("mFeed");
  if(!f) return;
  var d = document.createElement("div");
  d.className = "ev " + (kind||"");
  d.innerHTML = '<span class="m">'+min+'׳</span><span>'+txt+'</span>';
  f.insertBefore(d, f.firstChild);
}

function runClock(){
  var b = document.getElementById("mStart");
  if(b) b.style.display = "none";
  var cb = document.getElementById("mClkBox");
  if(cb){ cb.className = "sbclk live"; cb.querySelector(".l").textContent = "חי"; }
  M.running = true;
  addEv(0, "שריקת פתיחה ב" + (M.fx.home ? club(S.club).n : M.opp.n) + ".", "");
  tickMatch();
}

function tickMatch(){
  if(M.min>=90) return finishMatch();

  M.min += 1;
  var c = document.getElementById("mClk");
  if(c) c.textContent = M.min + "׳";

  if(!M.onPitch && M.playing && M.min===M.entryMin){
    M.onPitch = true;
    var r = document.getElementById("mRole"); if(r) r.textContent = "על המגרש";
    addEv(M.min, "חילוף: אתה נכנס. המאמן: \"לחץ את הבלם השמאלי, אל תרדוף אחרי שער.\"", "you");
  }

  var nm = M.moments.filter(function(m){return !m.done && m.min===M.min})[0];
  if(nm && M.onPitch){
    nm.done = true;
    M.timer = null;
    openMoment(nm);
    return;
  }

  if(rnd() < 0.028){
    var homeStr = (M.home.rep + (M.home===M.me?6:0));
    var awayStr = (M.away.rep + (M.away===M.me?6:0));
    var hs = rnd() < homeStr/(homeStr+awayStr);
    if(hs){ M.hg++; document.getElementById("mHG").textContent = M.hg; }
    else  { M.ag++; document.getElementById("mAG").textContent = M.ag; }
    var scorer = hs ? M.home : M.away;
    var good = (scorer === M.me);
    addEv(M.min, (good?"⚽ ":"😞 ") + "שער! " + scorer.n + " " + M.hg + "–" + M.ag, good?"goal":"bad");
    goalFlash(good);
  } else if(rnd() < 0.075){
    var ev = [
      "🎯 הזדמנות גדולה שהוחמצה.", "🟨 כרטיס צהוב.", "🚩 קרן.",
      "🔁 חילוף בקבוצה היריבה.", "⬜ הכדור יצא לקו.", "🧤 הצלה גדולה של השוער.",
      "🅾 העמוד! כמעט שער.", "⚕ הפסקה קצרה לטיפול רפואי.", "📣 הקהל דורש לחץ גבוה.",
      "🟥 כרטיס אדום! היריבה בעשרה.", "⏱ שלוש דקות תוספת."
    ];
    addEv(M.min, ev[ri(0,ev.length-1)], "");
  }

  M.timer = setTimeout(tickMatch, M.onPitch ? 105 : 42);
}

function skipToEnd(){
  if(M.timer) clearTimeout(M.timer);
  M.moments.forEach(function(m){
    if(!m.done){
      m.done = true;
      // auto-resolve at tactical difficulty: attribute-driven, no penalty
      var q = 0.42 + (iq()/240) + (S.sharp/400);
      resolveMoment(null, q>0.62?"good":"ok", true);
    }
  });
  while(M.min<90){
    M.min++;
    if(rnd()<0.028){
      var hs = rnd()<0.5;
      if(hs) M.hg++; else M.ag++;
    }
  }

  /* A simulated match still has to produce a scoreline for YOU. Without this,
     skipping meant a striker could play 40 games and score nothing. */
  if(M.playing){
    var share = M.mins/90;
    var gRate = {ST:0.52, W:0.30, CM:0.17, CB:0.07, GK:0}[S.pos] || 0.15;
    var aRate = {ST:0.20, W:0.34, CM:0.30, CB:0.06, GK:0.01}[S.pos] || 0.15;
    var quality = 0.55 + (grpVal("SHO")-45)/110 + (S.sharp-50)/220;
    var creat   = 0.55 + (grpVal("PAS")-45)/110 + (S.sharp-50)/220;
    var g = 0, a = 0;
    if(rnd() < gRate*share*clamp(quality,0.3,1.9)) g++;
    if(g && rnd() < 0.16) g++;
    if(rnd() < aRate*share*clamp(creat,0.3,1.9)) a++;
    for(var q=0;q<g;q++){ if(M.me===M.home) M.hg++; else M.ag++; }
    if(g){ S.goals+=g; S.careerGoals+=g; M.gAdded+=g; M.score += g*1.4; }
    if(a){ S.assists+=a; S.careerAssists+=a; M.aAdded+=a; M.score += a*1.0; }
  }

  document.getElementById("mHG").textContent = M.hg;
  document.getElementById("mAG").textContent = M.ag;
  finishMatch();
}

function openMoment(m){
  var pool = SITS[S.pos];
  var sit = pool[ri(0, pool.length-1)];

  /* Read time. The old numbers (1.0–2.6s) were unreadable — you could not
     finish three Hebrew options, let alone weigh them. Base is now generous
     and the attributes/preparation extend it further. */
  var readBase = 4.2 + iq()/16 + (S.prep.video ? 1.6 : 0)
               + (hasTrait("reader") ? 1.2 : 0)
               - (1 - S.fit/100)*1.6 - (S.load/100)*1.2;
  var mult = S.readMode === "long" ? 1.8 : 1;
  var readTime = S.readMode === "off" ? 999 : clamp(readBase*mult, 2.6, 14);

  var choices = sit.ch.slice();
  if(sit.unl && S.prep.analyst) choices.push(sit.unl);
  if(sit.unl && !S.prep.analyst && sit.unl.big && S.prep.coach) choices.push(sit.unl);

  MO = {m:m, sit:sit, choices:choices, pick:null, readTime:readTime,
        pos:0, dir:1, raf:null, fired:false, tLeft:readTime};

  var el = document.createElement("div");
  el.className = "moment"; el.id = "momentLayer";
  el.innerHTML = momentHtml();
  document.body.appendChild(el);
  drawMomentPitch();
  bindMoment();
  startRead();
}

function startRead(){
  if(S.readMode === "off"){
    var lbl0 = document.getElementById("moT");
    if(lbl0) lbl0.textContent = "∞";
    return;
  }
  var ring = document.getElementById("moRing");
  var t0 = performance.now();
  var total = MO.readTime*1000;
  (function step(now){
    if(!MO || MO.pick!==null) return;
    var el = now - t0;
    var left = Math.max(0, total-el);
    MO.tLeft = left/1000;
    var lbl = document.getElementById("moT");
    if(lbl) lbl.textContent = (left/1000).toFixed(1);
    if(ring) ring.setAttribute("stroke-dashoffset", String(113*(1-left/total)));
    if(left<=0){
      autoPick();
      return;
    }
    requestAnimationFrame(step);
  })(t0);
}

function autoPick(){
  if(!MO || MO.pick!==null) return;
  var safe = 0;
  MO.choices.forEach(function(c,i){ if(c.w > MO.choices[safe].w) safe = i; });
  var btns = document.getElementById("moCh").children;
  document.getElementById("moRes").innerHTML = "<b>נגמר הזמן</b>הגוף בחר בשבילך — הבחירה הבטוחה. זמן קריאה ארוך יותר מגיע מטקטיקה, כושר והכנה.";
  document.getElementById("moRes").className = "res poor";
  pickChoice(safe, btns[safe]);
}

function pickChoice(i, btn){
  if(MO.pick!==null) return;
  MO.pick = i;
  var all = document.getElementById("moCh").children;
  for(var k=0;k<all.length;k++){ all[k].disabled = true; all[k].classList.remove("on"); }
  if(btn) btn.classList.add("on");

  var c = MO.choices[i];
  var at = S.a[c.at] || 45;
  // sweet zone width: attribute + sharpness + coach intel − load − risk
  var w = 13 + at*0.22 + S.sharp*0.06 + (S.prep.coach?4:0) - S.load*0.05 + c.w*0.55;
  if(hasTrait("clutch") && M && M.min >= 75) w *= 1.15;
  w = clamp(w, 7, 42);
  MO.w = w;
  MO.center = clamp(30 + rnd()*40, 15, 80);

  var z = document.getElementById("moZone");
  z.style.insetInlineStart = Math.max(0, MO.center - w/2) + "%";
  z.style.width = w + "%";

  document.getElementById("moExec").style.display = "block";
  if(document.getElementById("moRes").className === "res")
    document.getElementById("moRes").textContent = "עצור את המד בתוך האזור הירוק.";

  MO.pos = 0; MO.dir = 1;
  var speed = 1.15 + S.load*0.012 + (100-S.fit)*0.009;
  var ndl = document.getElementById("moNdl");
  (function loop(){
    if(!MO || MO.fired) return;
    MO.pos += MO.dir*speed;
    if(MO.pos>=100){MO.pos=100;MO.dir=-1}
    if(MO.pos<=0){MO.pos=0;MO.dir=1}
    ndl.style.insetInlineStart = "calc("+MO.pos+"% - 2px)";
    MO.raf = requestAnimationFrame(loop);
  })();
}

function fireMoment(){
  if(!MO || MO.pick===null || MO.fired) return;
  MO.fired = true;
  if(MO.raf) cancelAnimationFrame(MO.raf);
  document.getElementById("moFire").disabled = true;

  var off = Math.abs(MO.pos - MO.center);
  var half = MO.w/2;
  var grade = off <= half*0.35 ? "great" : (off <= half ? "good" : (off <= half*1.9 ? "poor" : "fail"));
  resolveMoment(MO.choices[MO.pick], grade, false);
}

function resolveMoment(choice, grade, silent){
  var txt, cls, pts;
  var risky = choice ? choice.w < 2 : false;

  if(grade==="great"){ pts = risky ? 1.9 : 1.2; cls="great"; txt="ביצוע נקי. יצא בדיוק כפי שהתכוונת."; }
  else if(grade==="good" || grade==="ok"){ pts = risky ? 1.0 : 0.8; cls="good"; txt="יצא, אבל לא מושלם. עכשיו זה תלוי גם בחבר ליד וביריב."; }
  else if(grade==="poor"){ pts = -0.4; cls="poor"; txt="איבדת דיוק. דוח התפקיד עדיין יכיר בבחירה הנכונה."; }
  else { pts = risky ? -1.3 : -0.8; cls="fail"; txt="הכדור אבד. זה לא Game Over — זו שורה בדוח."; }

  M.score += pts; M.count++;

  var outcome = "";
  if(grade==="great" && risky && rnd() < (hasTrait("finisher") ? 0.55 : 0.42)){
    if(S.pos==="ST" || S.pos==="W"){
      if(M.me===M.home){M.hg++;} else {M.ag++;}
      S.goals++; S.careerGoals++; M.gAdded++; outcome = " שער!";
      if(!silent){ addEv(M.min, "⚽ שער שלך! "+M.home.ab+" "+M.hg+"–"+M.ag+" "+M.away.ab, "goal"); goalFlash(true); }
    } else {
      S.assists++; S.careerAssists++; M.aAdded++; outcome = " בישול!";
      if(M.me===M.home){M.hg++;} else {M.ag++;}
      if(!silent){ addEv(M.min, "🅰 בישול שלך — הכדור מגיע ומסתיים ברשת.", "goal"); goalFlash(true); }
    }
    var hg = document.getElementById("mHG"), ag = document.getElementById("mAG");
    if(hg) hg.textContent = M.hg; if(ag) ag.textContent = M.ag;
  } else if(grade==="great" && !silent){
    addEv(M.min, "פעולה נקייה שלך — האנליסט יסמן את זה.", "you");
  } else if(grade==="fail" && !silent){
    addEv(M.min, "איבוד כדור שלך באזור מסוכן.", "bad");
  }

  if(silent) return;

  var r = document.getElementById("moRes");
  r.className = "res " + cls;
  r.innerHTML = "<b>" + (grade==="great"?"מצוין":(grade==="good"?"סביר":(grade==="poor"?"לקוי":"כישלון"))) + outcome + "</b>" + txt;

  var t = document.getElementById("mTouch"); if(t) t.textContent = "מגעים " + M.count;
  var rt = document.getElementById("mRate"); if(rt) rt.textContent = "ציון " + liveRating().toFixed(1);

  var nx = document.getElementById("moNext");
  nx.style.display = "block";
  nx.onclick = closeMoment;
}

function liveRating(){
  if(!M.count) return 6.0;
  return clamp(6.0 + M.score*0.42, 3.5, 9.8);
}

function closeMoment(){
  var el = document.getElementById("momentLayer");
  if(el) el.remove();
  MO = null;
  M.timer = setTimeout(tickMatch, 120);
}

/* ── finish ────────────────────────────────────────────────────── */
function finishMatch(){
  if(M.timer) clearTimeout(M.timer);
  stopPitch();
  M.running = false;

  var rating = M.playing ? liveRating() : 0;
  var fx = M.fx;
  fx.res = M.hg + "–" + M.ag;

  var myG = M.me===M.home ? M.hg : M.ag;
  var opG = M.me===M.home ? M.ag : M.hg;

  applyResult(S.club, M.fx.opp, myG, opG);
  awardGoals(S.league, S.club, myG); awardGoals(S.league, M.fx.opp, opG);
  simWorld(S.club);

  if(M.playing){
    S.apps++; S.careerApps++; S.minutes += M.mins; S.ratings.push(rating);
    if(rating > S.bestRating) S.bestRating = rating;
    S.streak = rating >= 7 ? S.streak + 1 : 0;
    if(S.streak > S.bestStreak) S.bestStreak = S.streak;
    var dTrust = (rating-6.6)*4.2 + (myG>opG?1.5:(myG<opG?-0.8:0.3));
    if(hasTrait("leader") && dTrust < 0) dTrust *= 0.6;
    dTrust += (coachFit()-55) * 0.05;
    S.trust = clamp(S.trust + dTrust, 0, 100);
    S.sharp = clamp(S.sharp + 9, 0, 100);
    S.load  = clamp(S.load + M.mins*(hasTrait("engine") ? 0.21 : 0.28), 0, 100);
    S.fit   = clamp(S.fit - M.mins*0.09, 20, 100);
    S.morale= clamp(S.morale + (myG>opG?7:(myG<opG?-4:1)) + (rating-6.6)*3, 0, 100);
  } else {
    S.trust = clamp(S.trust - 1.5, 0, 100);
    S.morale = clamp(S.morale - 4, 0, 100);
  }

  var scoutHit = false;
  if(M.playing && rating>=7.4 && rnd()<0.45){
    var pool = suitorPool();
    if(pool.length){
      var e = pool[ri(0,pool.length-1)];
      if(!S.interest.some(function(x){return x.id===e.id})){
        S.interest.push({id:e.id, n:e.n, ab:e.ab, c:e.c, lg:LEAGUES[e.lg].n, rep:e.rep, lvl:1});
        scoutHit = true;
      }
    }
  }

  /* ── rewards ─────────────────────────────────────────────────── */
  var ovrBefore = ovr();
  S.valuePrev = value();

  var xp = S.trainXp || 0;
  var xpRows = [];
  if(S.trainXp) xpRows.push({l:"אימוני השבוע", v:S.trainXp});

  var matchGains = [];
  if(M.playing){
    var mx = 40 + Math.round(M.mins*0.9) + Math.round(Math.max(0,(rating-6))*70);
    xpRows.push({l:M.mins+" דקות משחק", v:40 + Math.round(M.mins*0.9)});
    if(rating>6) xpRows.push({l:"ציון "+rating.toFixed(1), v:Math.round((rating-6)*70)});
    xp += mx;
    if(M.gAdded){ xp += M.gAdded*120; xpRows.push({l:M.gAdded+" שערים", v:M.gAdded*120}); }
    if(M.aAdded){ xp += M.aAdded*80;  xpRows.push({l:M.aAdded+" בישולים", v:M.aAdded*80}); }
    if(myG>opG){ xp += 60; xpRows.push({l:"ניצחון", v:60}); }
    if(S.streak>=3){ xp += 50*S.streak; xpRows.push({l:"רצף "+S.streak+" משחקים", v:50*S.streak}); }

    /* learning by doing: the attributes you actually leaned on this match */
    var used = POS[S.pos].key.slice(0, 3);
    matchGains = grow(used, 0.16 + Math.max(0, rating-6.5)*0.22);
  }

  (S.trainGains||[]).forEach(function(g){ matchGains.push(g); });

  var levels = addXp(xp);
  var ovrAfter = ovr();
  S.ovrPrev = ovrBefore;

  var badges = checkBadges();
  var newTraits = checkTraits();

  showPostMatch(rating, myG, opG, scoutHit, {
    xp:xp, rows:xpRows, levels:levels, gains:matchGains,
    ovrBefore:ovrBefore, ovrAfter:ovrAfter, badges:badges, traits:newTraits
  });
  S.trainXp = 0; S.trainGains = [];
}

function applyResult(a, b, ga, gb){
  var T = S.tables[CLUBS[a].lg];
  var ta = T[a], tb = T[b];
  ta.p++; tb.p++; ta.gf+=ga; ta.ga+=gb; tb.gf+=gb; tb.ga+=ga;
  if(ga>gb){ta.w++;tb.l++;ta.pts+=3}
  else if(ga<gb){tb.w++;ta.l++;tb.pts+=3}
  else {ta.d++;tb.d++;ta.pts++;tb.pts++}
}

/* one matchday across every modelled league */
function simWorld(skipId){
  LG_IDS.forEach(function(lid){
    var pool = LEAGUES[lid].clubs.filter(function(c){
      return c.id !== skipId && c.id !== (S.fixtures[S.week-1]||{}).opp;
    }).map(function(c){ return c.id; });
    for(var i=pool.length-1;i>0;i--){ var j=ri(0,i); var tmp=pool[i]; pool[i]=pool[j]; pool[j]=tmp; }
    for(var k=0;k+1<pool.length;k+=2){
      var A = club(pool[k]), B = club(pool[k+1]);
      var sa = A.rep + ri(0,16), sb = B.rep + ri(0,16);
      var ga = clamp(Math.round((sa-sb)/17 + ri(0,2)), 0, 5);
      var gb = clamp(Math.round((sb-sa)/17 + ri(0,2)), 0, 5);
      applyResult(A.id, B.id, ga, gb);
      awardGoals(lid, A.id, ga); awardGoals(lid, B.id, gb);
    }
  });
  advanceRivals();
  makeNews();
}

function awardGoals(lid, clubId, n){
  if(!n) return;
  var list = S.scorers[lid].filter(function(s){ return s.club === clubId; });
  if(!list.length){
    var s = {n:playerName(), club:clubId, g:0};
    S.scorers[lid].push(s); list = [s];
  }
  for(var i=0;i<n;i++) list[ri(0,list.length-1)].g++;
}

function advanceRivals(){
  S.rivals.forEach(function(r){
    if(rnd() < 0.30 && r.ovr < r.pot) r.ovr += 1;
  });
}

var NEWS_T = [
  function(){ var l = LEAGUES[pickLg()]; var c = topOf(l.id);
    return {t:"⚽ "+c.n+" בראש "+l.n+".", k:""}; },
  function(){ var c = anyClub();
    return {t:"🔁 "+c.n+" פיטרו את המאמן אחרי רצף תוצאות רע.", k:"w"}; },
  function(){ var a = anyClub(), b = anyClub();
    if(a.id===b.id) return null;
    return {t:"💰 "+a.n+" רכשו קשר מ"+b.n+" תמורת "+money(ri(2,38)*1000000)+".", k:""}; },
  function(){ var l = LEAGUES[pickLg()]; var s = S.scorers[l.id].slice().sort(function(x,y){return y.g-x.g})[0];
    if(!s || s.g<3) return null;
    return {t:"🥇 "+s.n+" ("+club(s.club).ab+") מוביל את מלך השערים ב"+l.n+" עם "+s.g+".", k:""}; },
  function(){ var r = S.rivals[ri(0,S.rivals.length-1)];
    if(!r || r.ovr < ovr()) return null;
    return {t:"👀 "+r.n+" ("+club(r.club).ab+") מקבל דקות ועלה ל-OVR "+r.ovr+".", k:"w"}; },
  function(){ var c = anyClub();
    return {t:"🏟 "+c.n+" הודיעו על שדרוג האצטדיון.", k:""}; },
  function(){ var c = anyClub();
    return {t:"🩺 חלוץ "+c.n+" ייעדר 6 שבועות בעקבות פציעה.", k:"b"}; }
];
function pickLg(){ return LG_IDS[ri(0, LG_IDS.length-1)]; }
function anyClub(){ var l = LEAGUES[pickLg()]; return l.clubs[ri(0,l.clubs.length-1)]; }
function topOf(lid){
  var T = S.tables[lid];
  return LEAGUES[lid].clubs.slice().sort(function(a,b){
    return T[b.id].pts-T[a.id].pts || (T[b.id].gf-T[b.id].ga)-(T[a.id].gf-T[a.id].ga);
  })[0];
}
function makeNews(){
  for(var i=0;i<3;i++){
    var f = NEWS_T[ri(0,NEWS_T.length-1)];
    var item = f();
    if(item && !S.news.some(function(x){ return x.t === item.t; })){
      item.w = S.week; S.news.unshift(item);
    }
  }
  if(S.news.length > 60) S.news.length = 60;
}

  var prevTrust = S.trust;
  R = R || {xp:0, rows:[], levels:0, gains:[], ovrBefore:ovr(), ovrAfter:ovr(), badges:[]};

  var gainHtml = R.gains.length
    ? R.gains.map(function(g){
        return '<span class="gain">+'+g.amount+' '+ATTR[g.k].n+'</span>';
      }).join("")
    : '<span class="muted xs">אין שיפור מדיד השבוע — צריך יותר עומס אימון או יותר דקות.</span>';

  var rowsHtml = R.rows.map(function(r){
    return '<div class="kv"><span>'+r.l+'</span><b class="n" style="color:var(--accent)">+'+r.v+'</b></div>';
  }).join("");

  var el = document.getElementById("matchLayer");
  el.innerHTML = ''
  + '<div class="scorebug">'
    + '<div class="sbteam"><div class="sbmini" style="background:'+M.home.c+';color:'+M.home.t+'">'+M.home.ab+'</div><b>'+M.home.n+'</b></div>'
    + '<div class="sbscore"><span class="g">'+M.hg+'</span><span class="clk">סיום</span><span class="g">'+M.ag+'</span></div>'
    + '<div class="sbteam away"><div class="sbmini" style="background:'+M.away.c+';color:'+M.away.t+'">'+M.away.ab+'</div><b>'+M.away.n+'</b></div>'
  + '</div>'
  + '<div style="flex:1;overflow-y:auto;padding:18px;display:flex;justify-content:center">'
  + '<div style="width:min(880px,100%);display:flex;flex-direction:column;gap:14px">'

    + '<div class="p"><h3>הדוח שלך <span class="r">'+res+'</span></h3><div class="pb">'
      + (M.playing
        ? '<div class="ratebig"><div class="num '+cls+'">'+rating.toFixed(1)+'</div><div style="flex:1">'
          + '<div style="font-size:16px;font-weight:850">'+reportLine(rating)+'</div>'
          + '<div style="display:flex;gap:7px;margin-top:9px;flex-wrap:wrap">'

          + '<span class="tag '+(S.trust>=prevTrust?"ok":"b")+'">אמון '+(S.trust>=prevTrust?"▲":"▼")+' '+Math.round(S.trust)+'</span>'
          + '</div></div></div>'
        : '<div class="empty">לא היית בסגל. הצפייה מהיציע היא גם מידע — האמון ירד מעט.</div>')
    + '</div></div>'

    + '<div class="p rewards"><h3>התקדמות</h3><div class="pb">'
      + '<div class="xpbig">'
        + '<div class="xphead"><span class="lbl">ניסיון שנצבר</span>'
          + '<b class="n" id="xpCount">+0</b></div>'
        + '<div class="xpbar big"><i id="pmXp" style="width:'+clamp((S.xp/xpNeed(S.level))*100,0,100)+'%"></i></div>'
        + '<div class="xpfoot"><span class="n">רמה '+S.level+'</span>'
          + '<span class="n">'+Math.round(S.xp)+' / '+xpNeed(S.level)+' XP</span></div>'
      + '</div>'
      + '<div class="rewgrid">'
        + '<div>'+ (rowsHtml || '<span class="muted xs">אין XP השבוע.</span>') +'</div>'
        + '<div>'
          + '<div class="ovrdelta">'
            + '<span class="lbl">OVR</span>'
            + '<b class="n">'+R.ovrBefore+(R.ovrAfter>R.ovrBefore?' <em>→ '+R.ovrAfter+'</em>':'')+'</b>'
          + '</div>'

            + '<span class="lbl">שווי שוק</span>'

              + (Math.abs(dv)>value()*0.005 ? ' <em class="'+(dv>0?"up":"dn")+'">'+(dv>0?"▲":"▼")+' '+money(Math.abs(dv))+'</em>' : '')
            + '</b>'
          + '</div>'

        + '</div>'

          : '<p style="margin:0;font-size:13.5px;line-height:1.55;color:var(--ink3)">אין תנועה בשוק אחרי המשחק הזה. מדגם אחד לא מזיז תיק גיוס.</p>')

    + '<button class="btn pri big" id="pmNext" style="align-self:flex-start">לשבוע הבא ▸</button>'

  document.getElementById("pmNext").onclick = nextWeek;

  /* animated reward sequence */
  setTimeout(function(){ countXp(R.xp); }, 260);
  var q = 900;
  if(R.ovrAfter > R.ovrBefore){
    setTimeout(function(){ showOvrUp(R.ovrBefore, R.ovrAfter); }, q); q += 2200;
  }
  if(R.levels > 0){
    setTimeout(function(){ showLevelUp(R.levels); }, q); q += 2200;
  }
  (R.badges||[]).forEach(function(b){
    setTimeout(function(){ showBadge(b); }, q); q += 2000;
  });
  (R.traits||[]).forEach(function(tr){
    setTimeout(function(){ showTrait(tr); }, q); q += 2100;
  });
}

function countXp(total){
  var el = document.getElementById("xpCount");
  var bar = document.getElementById("pmXp");
  if(!el) return;
  var t0 = performance.now(), dur = 1100;
  var startPct = parseFloat(bar.style.width) || 0;
  var endPct = clamp((S.xp/xpNeed(S.level))*100, 0, 100);
  (function step(now){
    var k = clamp((now-t0)/dur, 0, 1);
    var e = 1 - Math.pow(1-k, 3);
    el.textContent = "+" + Math.round(total*e);
    bar.style.width = (startPct + (endPct-startPct)*e) + "%";
    if(k < 1) requestAnimationFrame(step);
  })(t0);
}

/* ── celebration overlays ──────────────────────────────────────── */
function celebrate(html, cls){
  var el = document.createElement("div");
  el.className = "celeb " + (cls||"");
  el.innerHTML = '<div class="celebcard">'+html+'</div>';
  document.body.appendChild(el);
  el.onclick = function(){ el.remove(); };
  setTimeout(function(){ if(el.parentNode) el.remove(); }, 1900);
}

function showOvrUp(a, b){
  confetti(60, ["#E8C766","#1F6F43","#FFFFFF"]);
  celebrate(

function nextWeek(){

/* ── cup: a tie every third week ────────────────────────────────── */
function runCupWeek(){
  if(!S.cup || S.cup.out || S.cup.won) return;
  if(S.week % 3 !== 0) return;
  var opp = anyClubIn(S.league);
  var edge = (club(S.club).rep - opp.rep)/26 + (avgRating()-6.5)*0.16 + 0.05;
  var win = rnd() < clamp(0.5 + edge, 0.16, 0.88);
  var label = CUP_ROUNDS[Math.min(S.cup.round, CUP_ROUNDS.length-1)];
  if(win){
    S.cup.round++;
    var scored = S.apps>0 && rnd()<0.3;
    if(scored){ S.goals++; S.careerGoals++; }
    push("🏆 " + S.cup.name + " · " + label + ": ניצחון על " + opp.n + (scored?" — ואתה כבשת.":"."), "ok");
    addXp(90);
    if(S.cup.round >= CUP_ROUNDS.length){
      S.cup.won = true;
      S.honours.push({s:S.season, t:"זכייה ב" + S.cup.name});
      confetti(120, ["#E8C766","#1F6F43","#FFFFFF"]);
      celebrate('<span class="ctag">תואר</span><div class="cbig" style="font-size:32px">🏆 '+S.cup.name+'</div>'
        + '<div class="csub">'+club(S.club).n+' אלופת הגביע</div>', "gold");
      addXp(400);
    }
  } else {
    S.cup.out = true;
    push("🏆 " + S.cup.name + " · " + label + ": הפסד ל" + opp.n + ". יצאתם מהגביע.", "b");
  }
}
function anyClubIn(lid){
  var pool = LEAGUES[lid].clubs.filter(function(c){ return c.id !== S.club; });
  return pool[ri(0, pool.length-1)];
}

/* ── the manager can be sacked, and the new one may not rate you ── */
function runCoachMarket(){
  if(S.coachWeeks < 5) return;
  var T = S.tables[S.league][S.club];
  var ppg = T.p ? T.pts/T.p : 1.4;
  var risk = ppg < 0.9 ? 0.22 : (ppg < 1.3 ? 0.08 : 0.02);
  if(rnd() > risk) return;

  var old = S.coach.n;
  S.coach = newCoach();
  S.coachWeeks = 0;
  var fit = coachFit();
  var delta = clamp((fit - 55) * 0.6, -22, 18);
  S.trust = clamp(50 + delta, 8, 92);
  push("🔁 " + old + " פוטר. " + S.coach.n + " נכנס — " + S.coach.styleName + ".",
       delta >= 0 ? "ok" : "b");
  push(delta >= 0
    ? "המאמן החדש אוהב את הפרופיל שלך. אתה מתחיל מנקודה טובה."
    : "השיטה החדשה לא מתאימה לך. תצטרך להוכיח את עצמך מחדש.", delta >= 0 ? "ok" : "w");
  celebrate('<span class="ctag">מאמן חדש</span>'
    + '<div class="cbig" style="font-size:26px">'+S.coach.n+'</div>'
    + '<div class="csub">'+S.coach.styleName+' · התאמה '+fit+'</div>',
    delta >= 0 ? "green" : "gold");
}

/* ── national team ──────────────────────────────────────────────── */
function runNationalTeam(){
  if(S.age < 18) return;
  if(S.week % 5 !== 0) return;
  var score = ovr() + (avgRating()-6.5)*12 + Math.min(20, S.minutes/40) + (S.natCaps?6:0);
  var bar = 62 + S.season*1.5;
  if(!S.natCalled && score >= bar){
    S.natCalled = true;
    push("🇮🇱 זומנת לנבחרת ישראל בפעם הראשונה.", "ok");
    confetti(80, ["#0A3A7A","#FFFFFF","#1F6F43"]);
    celebrate('<span class="ctag">זימון לנבחרת</span><div class="cbig" style="font-size:30px">🇮🇱 נבחרת ישראל</div>'
      + '<div class="csub">הבכורה שלך בדרך</div>', "green");
    addXp(320);
    return;
  }
  if(S.natCalled && score >= bar - 6){
    S.natCaps++;
    var g = rnd() < clamp((grpVal("SHO")-45)/160, 0.03, 0.34) ? 1 : 0;
    S.natGoals += g;
    S.load = clamp(S.load + 12, 0, 100);
    addXp(120 + g*160);
    push("🇮🇱 משחק נבחרת (" + S.natCaps + " הופעות)" + (g ? " — ואתה כבשת!" : "."), g ? "ok" : "");
    if(g) confetti(50, ["#0A3A7A","#FFFFFF"]);
  } else if(S.natCalled && score < bar - 14){
    S.natCalled = false;
    push("🇮🇱 לא נכללת בסגל הנבחרת הפעם.", "w");
  }
}

/* ── end-of-season awards ──────────────────────────────────────── */
function seasonAwards(place){
  var out = [];
  var board = S.rivals.concat([{n:S.name, ovr:ovr(), me:true}]);
  board.sort(function(a,b){ return b.ovr-a.ovr; });
  if(board[0] && board[0].me && S.age <= 23) out.push({t:"שחקן צעיר של העונה", d:LEAGUES[S.league].n});
  var top = S.scorers[S.league].slice().sort(function(a,b){return b.g-a.g})[0];
  if(S.goals > (top ? top.g : 999)) out.push({t:"מלך השערים", d:S.goals + " שערים"});
  if(avgRating() >= 7.4 && S.apps >= 8) out.push({t:"סגל העונה", d:"ציון ממוצע " + avgRating().toFixed(2)});
  if(place === 1) out.push({t:"אליפות " + LEAGUES[S.league].n, d:club(S.club).n});
  else if(place <= 3) out.push({t:"מקום " + place + " בליגה", d:club(S.club).n});
  if(S.cup && S.cup.won) out.push({t:"זכייה ב" + S.cup.name, d:club(S.club).n});
  out.forEach(function(a){ S.honours.push({s:S.season, t:a.t}); });
  return out;
}

/* ── contract renewal ──────────────────────────────────────────── */
function renewalOffer(){
  if(S.contractYears > 1) return null;
  return {
    wage: Math.max(S.wage + 1, Math.round(S.wage * (1 + (ovr()-50)/26) + ri(2,8))),
    years: ri(3,5),
    role: S.trust >= 66 ? "שחקן מפתח" : (S.trust >= 46 ? "מסובב ראשון" : "רוטציה")
  };
}
function acceptRenewal(){
  var r = S.pendingRenewal; if(!r) return;
  S.wage = r.wage; S.contractYears = r.years; S.status = r.role;
  S.pendingRenewal = null;
  S.honours.push({s:S.season, t:"חידש חוזה ב" + club(S.club).n});
  push("חתמת על חוזה חדש: ₪" + r.wage + "k לשבוע, " + r.years + " שנים, " + r.role + ".", "ok");
  saveGame(); render();
  celebrate('<span class="ctag">חוזה חדש</span><div class="cbig" style="font-size:30px">₪'+r.wage+'k</div>'
    + '<div class="csub">'+r.years+' שנים · '+r.role+'</div>', "green");
}
function rejectRenewal(){
  S.pendingRenewal = null;
  push("דחית את הצעת החידוש. החוזה שלך נגמר — והשוק יודע את זה.", "w");
  saveGame(); render();
}

    + '<div class="ratebig"><div class="num">'+avgRating().toFixed(1)+'</div><div style="flex:1">'
    + '<div style="font-size:18px;font-weight:900">'+S.name+' · גיל '+S.age+'</div>'
    + '<div style="color:var(--ink3);font-size:13px;margin-top:3px">'+club(S.club).n+' סיימו במקום '+place+'</div>'
    + '<div style="display:flex;gap:7px;margin-top:10px;flex-wrap:wrap">'
    + '<span class="tag">'+S.apps+' הופעות</span><span class="tag">'+S.minutes+' דקות</span>'
    + '<span class="tag g">'+S.goals+' שערים</span><span class="tag g">'+S.assists+' בישולים</span>'
    + '<span class="tag '+(S.trust>=55?"ok":"w")+'">אמון '+Math.round(S.trust)+'</span>'

    + '</div></div>'
    + '<p class="hint" style="margin:13px 0 0">'+seasonVerdict(place)+'</p>'
  + '</div></div>'
  + (awards.length ? '<div class="p" style="border-color:var(--gold)"><h3>🏅 פרסי העונה</h3><div class="pb">'
      + awards.map(function(a){
          return '<div class="awardrow"><span>🏅</span><div><b>'+a.t+'</b><span>'+a.d+'</span></div></div>';
        }).join("") + '</div></div>' : '')
  + '<div class="p"><h3>מי מסתכל</h3><div class="pb">'
    + (S.interest.length ? S.interest.map(function(x){
        return '<div class="kv"><span><span class="sw" style="background:'+x.c+'"></span><b><bdi>'+x.n+'</bdi></b> · <bdi>'+x.lg+'</bdi></span>'
          + '<span class="tag '+["","","w","ok"][x.lvl]+'">'+["","בירור","סקאוט","הצעה"][x.lvl]+'</span></div>';
      }).join("") : '<div class="empty">אף אחד. עונה נוספת.</div>')
  + '</div></div>'
  + '<button class="btn pri big" id="nsBtn" style="align-self:flex-start">לעונה הבאה ▸</button>'
  + '</div></div>';
  document.body.appendChild(el);

  if(awards.length){
    confetti(130, ["#E8C766","#1F6F43","#FFFFFF"]);
    setTimeout(function(){
      celebrate('<span class="ctag">פרס עונה</span><div class="cbig" style="font-size:30px">🏅 '+awards[0].t+'</div>'
        + '<div class="csub">'+awards[0].d+'</div>', "gold");
    }, 400);
  }

  document.getElementById("nsBtn").onclick = function(){
    el.remove();
    S.season++; S.age++; S.week=1; S.apps=0; S.minutes=0; S.goals=0; S.assists=0;
    S.lastSeasonRating = S.ratings.length ? avgRating() : (S.lastSeasonRating || 6.6);
    S.ratings=[]; S.picked=[]; S.inbox=[]; S.seen=0;
    /* off-season development: driven by minutes played, capped by potential.
       After 30 the physical attributes start going the other way. */
    var devKeys = Object.keys(ATTR).filter(function(k){ return S.a[k] > 25; });
    var mins = S.minutes;
    grow(devKeys, 0.5 + clamp(mins/1200, 0, 1.6));
    if(S.age >= 30){
      ["acc","spd","sta","jmp","agi"].forEach(function(k){
        if(S.a[k]) S.a[k] = clamp(S.a[k] - (1 + (S.age-30)*0.45), 1, 99);
      });
    }
    S.tp += 3;
    S.fit=88; S.sharp=45; S.load=15;
    S.contractYears=Math.max(0,S.contractYears-1);
    if(S.trust>62){ S.status="מסובב ראשון"; S.wage+=ri(2,5); }
    S.squad.forEach(function(pl){ pl.age++; pl.inj=0;
      pl.ovr = clamp(pl.ovr + (pl.age<24?ri(0,3):(pl.age>30?ri(-3,0):ri(-1,1))), 30, 94); });
    S.rivals.forEach(function(r){ r.age++; });
    resetWorld();
    S.fixtures = buildFixtures(S.club);
    S.cup = newCup();
    push("עונה חדשה. הכל מתאפס חוץ ממה שאנשים זוכרים.", "");
    if(openTransferWindow()){
      S.screen="career"; render();
      toast("חלון ההעברות נפתח — " + S.offers.length + " הצעות");
    } else { S.screen="hub"; render(); }
    saveGame();
  };
}

function seasonVerdict(place){
  if(S.apps===0) return "עונה בלי דקות. זה לא סוף — זו סיבה להחליט: להילחם, לבקש השאלה, או לשנות עמדה.";
  if(avgRating()>=7.2) return "עונה שמשנה תיקי גיוס. הבעיה הבאה שלך תהיה לבחור נכון, לא להיבחר.";
  if(S.apps<6) return "מעט דקות ומדגם קטן. סקאוטים לא מוחקים אותך — הם פשוט עוד לא ראו מספיק.";
  return "עונה שנבנתה על עקביות. זה איך שרוב הקריירות באמת מתקדמות.";

/* ══════════════════════════════════════════════════════════════════
   SAVE / LOAD — one slot, written after every week
   ════════════════════════════════════════════════════════════════ */
var SAVE_KEY = "onecareer.save.v1";
function saveGame(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e){}
}
function hasSave(){
  try { return !!localStorage.getItem(SAVE_KEY); } catch(e){ return false; }
}
function loadGame(){
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    var s = JSON.parse(raw);
    if(!s || !s.a || !s.pos) return false;
    /* forward-compat: fill anything a newer build expects */
    if(!s.traits) s.traits = [];
    if(!s.honours) s.honours = [];
    if(!s.news) s.news = [];
    if(!s.offers) s.offers = [];
    if(!s.coach) { S = s; s.coach = newCoach(); }
    if(s.natCaps === undefined){ s.natCaps = 0; s.natGoals = 0; s.natCalled = false; }
    S = s;
    if(!S.cup) S.cup = newCup();
    return true;
  } catch(e){ return false; }
}
function wipeSave(){ try { localStorage.removeItem(SAVE_KEY); } catch(e){} }

/* ══════════════════════════════════════════════════════════════════
   JUICE — confetti, goal flash, screen shake
   ════════════════════════════════════════════════════════════════ */
var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function confetti(n, colors){
  if(reduceMotion) return;
  var cv = document.createElement("canvas");
  cv.className = "fxcanvas";
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  document.body.appendChild(cv);
  var ctx = cv.getContext("2d");
  var cols = colors || ["#1F6F43","#E8C766","#E4574B","#4FA97A","#FFFFFF"];
  var ps = [];
  for(var i=0;i<n;i++){
    ps.push({
      x: cv.width*(0.3+Math.random()*0.4), y: cv.height*0.42,
      vx: (Math.random()-0.5)*13, vy: -7-Math.random()*11,
      s: 4+Math.random()*7, r: Math.random()*Math.PI,
      vr: (Math.random()-0.5)*0.34, c: cols[Math.floor(Math.random()*cols.length)],
      life: 1
    });
  }
  var t0 = performance.now();
  (function step(now){
    var el = now - t0;
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var i=0;i<ps.length;i++){
      var p = ps[i];
      p.vy += 0.36; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      p.life = Math.max(0, 1 - el/2100);
      ctx.save(); ctx.globalAlpha = p.life;
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s/2, -p.s/2, p.s, p.s*0.62);
      ctx.restore();
    }
    if(el < 2200) requestAnimationFrame(step);
    else cv.remove();
  })(t0);
}

function goalFlash(mine){
  var el = document.createElement("div");
  el.className = "goalflash " + (mine ? "mine" : "them");
  el.innerHTML = '<b>' + (mine ? "GOAL!" : "שער") + '</b>';
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, mine ? 1500 : 900);
  if(mine){
    confetti(90);
    shake();
  }
}

function shake(){
  if(reduceMotion) return;
  var a = document.getElementById("matchLayer") || document.getElementById("app");
  if(!a) return;
  a.classList.remove("shake"); void a.offsetWidth; a.classList.add("shake");
  setTimeout(function(){ a.classList.remove("shake"); }, 480);
}

function toast(msg){
  var t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2600);
}

          var c = club(s.id);
          return '<button class="opt'+(s.id===boot.start?" on":"")+'" data-start="'+s.id+'">'
            + '<b><span class="sw" style="background:'+c.c+'"></span>'+s.nm+'</b>'
            + '<span>'+s.d+'<br><b style="color:var(--ink2)">קושי: '+s.diff+'</b></span></button>';
        }).join("")
    + '</div></div>'
    + '<button class="btn pri big" id="bGo">התחל קריירה ▸</button>'
  + '</div></div>';
  document.body.appendChild(el);

  el.querySelectorAll("[data-pos]").forEach(function(b){
    b.onclick = function(){
      boot.pos = b.getAttribute("data-pos");
      el.querySelectorAll("[data-pos]").forEach(function(x){x.classList.remove("on")});
      b.classList.add("on");
    };
  });
  el.querySelectorAll("[data-start]").forEach(function(b){
    b.onclick = function(){
      boot.start = b.getAttribute("data-start");
      el.querySelectorAll("[data-start]").forEach(function(x){x.classList.remove("on")});
      b.classList.add("on");
    };
  });
  var cont = document.getElementById("bCont");
  if(cont) cont.onclick = function(){
    if(loadGame()){
      el.remove();
      S.screen = "hub";
      render();
      toast("נטענה קריירה — עונה " + S.season + ", מחזור " + S.week);
    } else {
      toast("השמירה פגומה. מתחילים חדש.");
      wipeSave();
      cont.remove();
    }
  };

  document.getElementById("bGo").onclick = function(){
    var nm = document.getElementById("bName").value.trim() || "יונתן אשל";
    wipeSave();
    S = newState(nm, boot.pos, boot.start);
    push("חתמת בחוזה נוער. עכשיו צריך שמישהו ישים לב.", "");
    push("המאמן: " + S.coach.n + " — " + S.coach.styleDesc + ".", "");
    saveGame();
    el.remove();
    render();
  };
}

showBoot();
</script>
