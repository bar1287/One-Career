<title>ONE CAREER</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
/* ═══════════════════════════════════════════════════════════════════
   ONE CAREER — playable prototype
   Light "Matchday Paper" shell. No blue anywhere in the chrome.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  color-scheme:light;
  --paper:#EFEBE3; --surface:#FFFFFF; --sunken:#F5F2EC; --hover:#F2EEE6;
  --ink:#17150F; --ink2:#514B41; --ink3:#6E6659;
  --line:#DFD8CB; --line2:#C4BAA8; --ctrl:#8E8474;
  --accent:#1F6F43; --accent-h:#175434; --accent-soft:#E3EFE7; --accent-ink:#12452A;
  --warn:#9A5400; --warn-soft:#FBEBD3; --warn-ink:#6F3C00;
  --bad:#AE2318; --bad-soft:#FBE6E3; --bad-ink:#851A12;
  --gold:#9A7212; --gold-soft:#FAF0D4;
  --turf:#3F8A52; --turf2:#48975B; --turf-line:rgba(255,255,255,.55);
  --sh:0 1px 0 rgba(80,68,48,.06),0 1px 3px rgba(80,68,48,.08);
  --sh2:0 18px 50px rgba(50,42,30,.22);
  --f:"Segoe UI","Noto Sans Hebrew","Arial Hebrew",system-ui,-apple-system,sans-serif;
  --club:#008D36;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --paper:#141311; --surface:#1E1C19; --sunken:#191714; --hover:#272420;
  --ink:#F4F1EA; --ink2:#C4BDB0; --ink3:#948C7E;
  --line:#2E2A25; --line2:#433D35; --ctrl:#6B6357;
  --accent:#4FA97A; --accent-h:#63BC8D; --accent-soft:#1A2C22; --accent-ink:#9AD8B5;
  --warn:#D2953A; --warn-soft:#2F230E; --warn-ink:#EDC382;
  --bad:#E0736A; --bad-soft:#321B18; --bad-ink:#F0A69E;
  --gold:#D6AC4A; --gold-soft:#2E2612;
  --turf:#2C6039; --turf2:#336B41; --turf-line:rgba(255,255,255,.4);
  --sh:0 1px 3px rgba(0,0,0,.45);
  --sh2:0 18px 50px rgba(0,0,0,.6);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    color-scheme:dark;
    --paper:#141311; --surface:#1E1C19; --sunken:#191714; --hover:#272420;
    --ink:#F4F1EA; --ink2:#C4BDB0; --ink3:#948C7E;
    --line:#2E2A25; --line2:#433D35; --ctrl:#6B6357;
    --accent:#4FA97A; --accent-h:#63BC8D; --accent-soft:#1A2C22; --accent-ink:#9AD8B5;
    --warn:#D2953A; --warn-soft:#2F230E; --warn-ink:#EDC382;
    --bad:#E0736A; --bad-soft:#321B18; --bad-ink:#F0A69E;
    --gold:#D6AC4A; --gold-soft:#2E2612;
    --turf:#2C6039; --turf2:#336B41; --turf-line:rgba(255,255,255,.4);
    --sh:0 1px 3px rgba(0,0,0,.45);
    --sh2:0 18px 50px rgba(0,0,0,.6);
  }
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);
  font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--accent);border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
.n{font-variant-numeric:tabular-nums lining-nums}
.lbl{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);font-weight:800}

/* ── app shell ─────────────────────────────────────────────────── */
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}

.hdr{
  display:flex;align-items:center;gap:14px;padding:0 16px;height:58px;flex:0 0 58px;
  background:var(--surface);border-bottom:1px solid var(--line2);position:relative;z-index:5;
}
.hdr::before{content:"";position:absolute;inset-inline:0;top:0;height:3px;background:var(--club)}
.crest{
  width:36px;height:36px;border-radius:8px;background:var(--club);color:#fff;
  display:grid;place-items:center;font-weight:900;font-size:12px;letter-spacing:.02em;flex:0 0 auto;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);
}
.hdr .who{line-height:1.15;min-width:0}
.hdr .who b{display:block;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .who span{font-size:11px;color:var(--ink3)}
.hdr .pill{
  display:flex;align-items:center;gap:7px;background:var(--sunken);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;
}
.hdr .pill i{font-style:normal;color:var(--ink3);font-weight:800;font-size:10px;letter-spacing:.1em}
.grow{flex:1 1 auto}
.iconbtn{
  background:var(--surface);border:1px solid var(--line2);border-radius:8px;
  width:34px;height:34px;display:grid;place-items:center;cursor:pointer;font-size:15px;
}
.iconbtn:hover{background:var(--hover)}

.main{flex:1 1 auto;display:flex;min-height:0}

.rail{
  flex:0 0 84px;background:var(--surface);border-inline-end:1px solid var(--line2);
  display:flex;flex-direction:column;padding:10px 8px;gap:4px;overflow-y:auto;
}
.rail button{
  background:none;border:none;cursor:pointer;border-radius:10px;padding:9px 4px;
  display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink3);
  font-size:10.5px;font-weight:700;position:relative;transition:background .15s,color .15s;
}
.rail button em{font-style:normal;font-size:19px;line-height:1}
.rail button:hover{background:var(--hover);color:var(--ink)}
.rail button.on{background:var(--accent-soft);color:var(--accent-ink)}
.rail button.on::before{
  content:"";position:absolute;inset-inline-start:-8px;top:50%;transform:translateY(-50%);
  width:3px;height:24px;border-radius:0 3px 3px 0;background:var(--club);
}
.rail .badge{
  position:absolute;top:5px;inset-inline-end:9px;min-width:16px;height:16px;border-radius:9px;
  background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;
}

.stage{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:18px 20px 28px;min-width:0}
.stage::-webkit-scrollbar{width:10px}
.stage::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:3px solid var(--paper)}

@media (max-width:720px){
  .rail{flex:0 0 62px}
  .rail button em{font-size:17px}
  .rail button span{display:none}
  .stage{padding:14px 12px 24px}
}

/* ── panels ────────────────────────────────────────────────────── */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1.5fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){.g2,.g3{grid-template-columns:1fr}}

.p{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);overflow:hidden}
.p>h3{
  margin:0;padding:11px 14px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);font-weight:800;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;background:var(--sunken);
}
.p>h3 .r{margin-inline-start:auto;letter-spacing:0;text-transform:none;font-size:12px;color:var(--ink2);font-weight:700}
.pb{padding:14px}
.pb.tight{padding:8px}

/* HUD chips */
.ovrchip{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:52px;height:40px;border-radius:9px;background:var(--ink);color:var(--paper);
  flex:0 0 auto;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);position:relative;overflow:hidden;
}
.ovrchip>u{
  position:absolute;inset-inline-start:0;bottom:0;height:3px;width:0;
  background:var(--accent);text-decoration:none;transition:width .45s cubic-bezier(.2,0,.1,1);
}
.ovrchip b{font-size:20px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ovrchip span{font-size:8px;font-weight:800;letter-spacing:.14em;opacity:.65}
.ovrchip.up{animation:ovrpop .7s cubic-bezier(.2,0,.1,1)}
@keyframes ovrpop{0%{transform:scale(1)}35%{transform:scale(1.22);background:var(--accent)}100%{transform:scale(1)}}
.valchip{display:flex;flex-direction:column;justify-content:center;flex:0 0 auto;min-width:74px}
.valchip b{font-size:15px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.valchip span{font-size:10px;font-weight:800;color:var(--ink3);min-height:12px}
.valchip span.up{color:var(--accent)} .valchip span.dn{color:var(--bad)}
.xpwrap{flex:0 1 190px;min-width:110px;display:flex;flex-direction:column;gap:3px}
.xptop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.xptop .lvl{font-size:11px;font-weight:900;color:var(--accent)}
.xptop .n{font-size:9.5px;font-weight:700;color:var(--ink3);direction:ltr;unicode-bidi:isolate}
.xpfoot span,.xphead b,.sbclk .m{direction:ltr;unicode-bidi:isolate}
.xpbar{height:7px;border-radius:99px;background:var(--sunken);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.xpbar>i{
  display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),#6FCB96);
  transition:width .8s cubic-bezier(.2,0,.1,1);
}
@media (max-width:900px){.xpwrap,.valchip{display:none}}

/* TP badge on rail */
.rail .tp{
  position:absolute;top:5px;inset-inline-end:9px;min-width:16px;height:16px;border-radius:9px;
  background:var(--gold);color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;padding:0 4px;
  animation:tppulse 1.6s infinite;
}
@keyframes tppulse{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}

/* matchday hero */
.hero{overflow:hidden}
.heroband{
  display:flex;align-items:center;gap:14px;padding:16px 18px;
  background:linear-gradient(135deg,var(--sunken),var(--surface));
  border-bottom:1px solid var(--line);position:relative;
}
.heroband::before{content:"";position:absolute;inset-inline:0;top:0;height:4px;background:var(--club)}
.hb{display:flex;align-items:center;gap:11px;flex:1 1 0;min-width:0}
.hb.away{flex-direction:row-reverse;text-align:end}
.hb b{display:block;font-size:15px;font-weight:850;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb span{display:block;font-size:11px;color:var(--ink3);font-weight:700}
.hbc{
  width:46px;height:46px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;
  font-size:13px;font-weight:900;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);
}
.hvs{display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 auto;padding-inline:8px}
.hvs b{font-size:19px;font-weight:900;letter-spacing:.04em;color:var(--ink3)}
@media (max-width:560px){.hb b{font-size:13px}.hbc{width:38px;height:38px}}

.stat{display:flex;flex-direction:column;gap:3px}
.stat b{font-size:26px;font-weight:850;line-height:1;letter-spacing:-.02em}
.stat span{font-size:11px;color:var(--ink3);font-weight:700}

.bar{height:7px;border-radius:99px;background:var(--sunken);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s cubic-bezier(.2,0,.1,1)}
.bar>i.w{background:var(--warn)} .bar>i.b{background:var(--bad)}

.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;padding:5px 0}
.kv+.kv{border-top:1px solid var(--line)}

.tag{
  display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 9px;
  font-size:11px;font-weight:800;background:var(--sunken);color:var(--ink2);white-space:nowrap;
}
.tag.ok{background:var(--accent-soft);color:var(--accent-ink)}
.tag.w{background:var(--warn-soft);color:var(--warn-ink)}
.tag.b{background:var(--bad-soft);color:var(--bad-ink)}
.tag.g{background:var(--gold-soft);color:var(--gold)}

.btn{
  border:1px solid var(--ctrl);background:var(--surface);border-radius:9px;padding:9px 15px;
  font-size:13.5px;font-weight:750;cursor:pointer;transition:background .15s,transform .06s;
}
.btn:hover{background:var(--hover)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.16)}
.btn.pri:hover{background:var(--accent-h)}
.btn.big{padding:13px 24px;font-size:15px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri:disabled{background:var(--ctrl);border-color:var(--ctrl)}

/* ── week planner ──────────────────────────────────────────────── */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{
  border:1px solid var(--line);border-radius:9px;padding:8px 4px;text-align:center;
  font-size:11px;min-height:62px;display:flex;flex-direction:column;gap:3px;justify-content:center;
}
.day b{font-size:10px;letter-spacing:.08em;color:var(--ink3);font-weight:800}
.day.f{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:800}
.day.d{background:var(--sunken);color:var(--ink3)}

.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:9px}
.act{
  border:1px solid var(--line2);background:var(--surface);border-radius:11px;padding:11px 12px;
  cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:5px;
  transition:border-color .15s,background .15s,transform .06s;position:relative;
}
.act:hover:not(:disabled){background:var(--hover);border-color:var(--ctrl)}
.act:active:not(:disabled){transform:translateY(1px)}
.act.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.act:disabled{opacity:.42;cursor:not-allowed}
.act .t{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:7px}
.act .t em{font-style:normal;font-size:16px}
.act .d{font-size:11.5px;color:var(--ink3);line-height:1.4}
.act .fx{display:flex;gap:5px;flex-wrap:wrap;margin-top:1px}
.act .fx span{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:5px;background:var(--sunken);color:var(--ink2)}
.act.on .fx span{background:rgba(255,255,255,.55)}
:root[data-theme=dark] .act.on .fx span{background:rgba(0,0,0,.28)}
.act .n{position:absolute;top:9px;inset-inline-end:10px;font-size:11px;font-weight:900;color:var(--accent)}

.slots{display:flex;gap:5px}
.slot{width:22px;height:7px;border-radius:99px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.slot.f{background:var(--accent);box-shadow:none}

/* ── FIFA-style card, four tiers ───────────────────────────────── */
.fcard{
  border-radius:14px;padding:14px;position:relative;overflow:hidden;
  color:var(--cink);background:var(--cbg);
  box-shadow:0 8px 24px rgba(50,40,15,.26),inset 0 0 0 1px rgba(255,255,255,.35);
}
.fcard::after{
  content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:150px;height:150px;
  border-radius:50%;background:var(--cc);opacity:.15;
}
.fcard::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 34%,rgba(255,255,255,.30) 48%,transparent 62%);
}
.fcard.elite{box-shadow:0 10px 34px rgba(20,14,40,.5),inset 0 0 0 1px rgba(232,199,102,.55)}
.fcard.elite::before{background:linear-gradient(115deg,transparent 32%,rgba(232,199,102,.28) 48%,transparent 64%)}
.tierbadge{
  position:absolute;inset-inline-start:12px;top:12px;z-index:2;
  font-size:9px;font-weight:900;letter-spacing:.16em;opacity:.55;
}
.fctop{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;gap:6px}
.fcovr{display:flex;flex-direction:column;align-items:center;line-height:1}
.fcovr b{font-size:44px;font-weight:900;letter-spacing:-.04em}
.fcovr span{font-size:13px;font-weight:900;letter-spacing:.06em;margin-top:2px;opacity:.72}
.fcradar{flex:0 0 auto;opacity:.95}
@media (max-width:400px){.fcradar{display:none}}
.fcbadges{display:flex;flex-direction:column;align-items:center;gap:6px}
.fcclub{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:900}
.fclvl{
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:var(--cchip);color:var(--cchipink);font-size:12px;font-weight:900;
}
.fcnat{font-size:16px;line-height:1}
.fcname{
  font-size:19px;font-weight:900;letter-spacing:-.02em;text-align:center;
  margin:8px 0 10px;padding-bottom:9px;position:relative;z-index:1;
  border-bottom:1.5px solid color-mix(in srgb, currentColor 30%, transparent);
}
.fcstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 4px;position:relative;z-index:1}
.fs{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.fs b{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.fs span{font-size:9.5px;font-weight:900;letter-spacing:.08em;opacity:.66}
.fcfoot{
  display:flex;justify-content:space-between;align-items:center;margin-top:11px;
  padding-top:9px;position:relative;z-index:1;
  border-top:1.5px solid color-mix(in srgb, currentColor 30%, transparent);
  font-size:11.5px;font-weight:800;
}
.fcfoot b{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}

/* ── attribute development ─────────────────────────────────────── */
.tpbanner{
  background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold);
  border-radius:10px;padding:10px 14px;font-size:13.5px;font-weight:700;margin-bottom:14px;
}
.grps{display:flex;flex-direction:column;gap:14px}
.grpblock{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.grphd{
  display:flex;align-items:center;gap:9px;padding:8px 12px;background:var(--sunken);
  border-bottom:1px solid var(--line);
}
.grphd b{font-size:13px;font-weight:850}
.grphd .grpv{margin-inline-start:auto;font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}
.grphd .grpk{font-size:9.5px;font-weight:900;letter-spacing:.1em;color:var(--ink3)}
.subs{padding:6px 10px 10px}
.sub{display:grid;grid-template-columns:1fr auto auto;gap:3px 9px;align-items:center;padding:6px 0}
.sub+.sub{border-top:1px solid var(--line)}
.sub .sn{font-size:12.5px;font-weight:600}
.sub.key .sn{font-weight:800}
.sub .sn i{color:var(--gold);font-style:normal;font-size:11px}
.sub .sv{font-size:13.5px;font-weight:900;min-width:24px;text-align:end}
.sub .sbar{
  grid-column:1/3;height:6px;border-radius:99px;background:var(--sunken);
  box-shadow:inset 0 0 0 1px var(--line);position:relative;overflow:hidden;
}
.sub .sbar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .45s}
.sub.key .sbar>i{background:linear-gradient(90deg,var(--accent),#6FCB96)}
.sub .sbar>u{position:absolute;inset-block:-2px;width:2px;background:var(--gold);text-decoration:none}
.spend{
  grid-row:1/3;width:44px;height:34px;border-radius:8px;cursor:pointer;
  border:1px solid var(--ctrl);background:var(--surface);
  font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:2px;
  transition:background .13s,transform .06s;
}
.spend em{font-style:normal;font-size:10px;font-weight:800;color:var(--ink3)}
.spend:hover:not(:disabled){background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.spend:hover:not(:disabled) em{color:var(--gold)}
.spend:active:not(:disabled){transform:translateY(1px)}
.spend:disabled{opacity:.32;cursor:not-allowed}

.sparks{display:flex;gap:5px;align-items:flex-end;min-height:64px}
.spk{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.spk>div{width:100%;max-width:22px;border-radius:4px 4px 0 0}
.spk>span{font-size:10px;font-weight:800;color:var(--ink3)}

/* coach card */
.coachrow{display:flex;align-items:center;gap:11px}
.coachrow b{display:block;font-size:14px;font-weight:850}
.coachrow span{display:block;font-size:11.5px;color:var(--ink3);line-height:1.35}
.cavatar{
  width:40px;height:40px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--sunken);border:1px solid var(--line2);font-size:17px;font-weight:900;color:var(--ink2);
}

/* traits */
.traitrow{display:flex;gap:10px;align-items:flex-start;padding:7px 0;opacity:.42}
.traitrow+.traitrow{border-top:1px solid var(--line)}
.traitrow.on{opacity:1}
.traitrow .ti{font-size:15px;color:var(--ink3);width:16px;text-align:center;flex:0 0 auto}
.traitrow.on .ti{color:var(--gold)}
.traitrow b{display:block;font-size:13px;font-weight:850}
.traitrow span{display:block;font-size:11.5px;color:var(--ink3);line-height:1.35}

.clauses{display:flex;flex-direction:column;gap:6px}
.clause{
  display:grid;grid-template-columns:1.1fr auto auto auto;gap:10px;align-items:center;
  padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);
}
.clause.moved{border-color:var(--accent);background:var(--accent-soft)}
.clause .cln{font-size:13px;font-weight:700}
.clause .clv{font-size:14px;font-weight:900}
.clause .clb{font-size:10.5px;color:var(--ink3);font-weight:700;min-width:64px;text-align:end;direction:ltr;unicode-bidi:isolate}
.clpush{
  border:1px solid var(--ctrl);background:var(--surface);border-radius:7px;padding:5px 10px;
  font-size:11.5px;font-weight:800;cursor:pointer;display:flex;gap:5px;align-items:center;
}
.clpush:hover{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.clpush em{font-style:normal;font-size:10px;color:var(--ink3)}
@media (max-width:640px){.clause{grid-template-columns:1fr auto auto}.clause .clb{display:none}}

/* storylet sheet */
.slcard{max-width:640px}
.slbd{padding:16px}
.sltext{margin:0 0 14px;font-size:14.5px;line-height:1.6}

/* dressing room */
.mate{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0}
.mate+.mate{border-top:1px solid var(--line)}
.mateav{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:var(--sunken);border:1px solid var(--line2);font-size:14px;font-weight:900;color:var(--ink2)}
.mate b{display:block;font-size:13px;font-weight:800}
.mate .mr{display:block;font-size:11px;color:var(--ink3)}
.rel3{display:flex;gap:4px}
.rel3 i{width:26px;height:5px;border-radius:99px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);position:relative;overflow:hidden}
.rel3 i>u{position:absolute;inset-block:0;inset-inline-start:0;background:var(--accent);text-decoration:none}

.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.shopitem{
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:start;
  border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:10px 11px;cursor:pointer;
  transition:all .14s;
}
.shopitem:hover:not(:disabled){background:var(--hover);border-color:var(--gold)}
.shopitem:disabled{opacity:.42;cursor:not-allowed}
.shopitem.owned{opacity:.62;border-color:var(--accent);background:var(--accent-soft)}
.shopitem .si{font-size:19px}
.shopitem b{display:block;font-size:13px;font-weight:850}
.shopitem div>span{display:block;font-size:11px;color:var(--ink3);line-height:1.35}
.shopitem .sc{font-size:12px;font-weight:900;white-space:nowrap;direction:ltr;unicode-bidi:isolate}

.moinfo{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.moinfo span{
  font-size:10.5px;font-weight:800;color:var(--ink3);background:var(--sunken);
  border:1px solid var(--line);border-radius:6px;padding:3px 7px;
}
.moinfo b{color:var(--ink);font-variant-numeric:tabular-nums}
.posopt{text-align:center}
.posopt b{font-size:15px;letter-spacing:.02em}
.posopt span{font-size:10.5px}

.awardrow{display:flex;gap:11px;align-items:center;padding:9px 0}
.awardrow+.awardrow{border-top:1px solid var(--line)}
.awardrow>span{font-size:20px}
.awardrow b{display:block;font-size:14px;font-weight:850}
.awardrow div>span{display:block;font-size:11.5px;color:var(--ink3)}

/* boot separator */
.bootsep{display:flex;align-items:center;gap:12px;color:var(--ink3);font-size:11.5px;font-weight:800}
.bootsep::before,.bootsep::after{content:"";flex:1;height:1px;background:var(--line)}

.badges{display:flex;flex-wrap:wrap;gap:6px}
.bdg{
  font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:99px;
  background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold);
}

/* ── table ─────────────────────────────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:6px 9px;text-align:start;border-bottom:1px solid var(--line)}
th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:800}
td.r{text-align:end;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* league switcher */
.lgtabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.lgtab{
  border:1px solid var(--line2);background:var(--surface);border-radius:99px;
  padding:7px 14px;font-size:12.5px;font-weight:750;cursor:pointer;transition:all .14s;
}
.lgtab:hover{background:var(--hover)}
.lgtab.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* news feed */
.newsrow{
  display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.45;
  padding:8px 10px;border-radius:8px;background:var(--sunken);border:1px solid var(--line);
}
.newsrow.w{background:var(--warn-soft);border-color:var(--warn);color:var(--warn-ink)}
.newsrow.b{background:var(--bad-soft);border-color:var(--bad);color:var(--bad-ink)}
.newsrow.ok{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.newsrow .nw{flex:0 0 32px;font-size:10.5px;font-weight:900;color:var(--ink3);padding-top:1px}

/* transfer offers */
.offer{border:1px solid var(--line2);border-radius:11px;padding:13px;margin-bottom:11px;background:var(--surface)}
.ohead{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.ohead b{display:block;font-size:15px;font-weight:850}
.ohead span{display:block;font-size:11.5px;color:var(--ink3);font-weight:700}
.ocrest{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:900;flex:0 0 auto}
.oterms{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:11px}
@media (max-width:640px){.oterms{grid-template-columns:repeat(2,1fr)}}
.oterms>div{background:var(--sunken);border-radius:8px;padding:7px 9px}
.oterms b{display:block;font-size:14px;font-weight:900;margin-top:2px;direction:ltr;unicode-bidi:isolate}
tr.me{background:var(--accent-soft)}
tr.me td{font-weight:850;color:var(--accent-ink)}
tr.cl{box-shadow:inset 3px 0 0 var(--gold)}
tr.rel{box-shadow:inset 3px 0 0 var(--bad)}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:7px}

/* ── boot / character creation ─────────────────────────────────── */
.boot{
  position:fixed;inset:0;z-index:60;background:var(--paper);
  display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;
}
.bootcard{
  width:min(760px,100%);background:var(--surface);border:1px solid var(--line2);
  border-radius:18px;box-shadow:var(--sh2);overflow:hidden;
}
.boothd{padding:26px 28px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--sunken),var(--surface))}
.boothd h1{margin:0;font-size:clamp(30px,5vw,44px);font-weight:900;letter-spacing:-.035em;line-height:1}
.boothd h1 span{color:var(--accent)}
.boothd p{margin:9px 0 0;color:var(--ink2);font-size:14px;max-width:56ch}
.bootbd{padding:22px 28px 26px;display:flex;flex-direction:column;gap:20px}
.field label{display:block;margin-bottom:7px}
.field input{
  width:100%;padding:11px 13px;border:1px solid var(--ctrl);border-radius:9px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:15px;font-weight:700;
}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.opt{
  border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:11px 10px;
  cursor:pointer;text-align:start;transition:all .15s;
}
.opt:hover{background:var(--hover)}
.opt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt b{display:block;font-size:13.5px;font-weight:850}
.opt span{display:block;font-size:11px;color:var(--ink3);margin-top:2px;line-height:1.35}
.opt.on span{color:var(--accent-ink);opacity:.9}

/* ── MATCH ─────────────────────────────────────────────────────── */
.match{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column}
.scorebug{
  flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line2);
  display:flex;align-items:center;gap:14px;padding:12px 18px;position:relative;
}
.sbteam{display:flex;align-items:center;gap:11px;flex:1 1 0;min-width:0}
.sbteam.away{flex-direction:row-reverse;text-align:end}
.sbteam b{font-size:16px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.sbmini{
  width:40px;height:40px;border-radius:10px;display:grid;place-items:center;
  font-size:12px;font-weight:900;flex:0 0 auto;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);
}
.sbscore{
  display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--paper);
  border-radius:12px;padding:7px 20px;flex:0 0 auto;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3);
}
.sbscore .g{font-size:32px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.sbclk{
  display:flex;flex-direction:column;align-items:center;gap:2px;min-width:44px;
}
.sbclk .m{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.sbclk .l{font-size:8.5px;font-weight:800;letter-spacing:.16em;opacity:.6}
.sbclk.live .l{color:#7BE0A4;opacity:1}
.sbclk.live .m::after{
  content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  background:#7BE0A4;margin-inline-start:5px;vertical-align:middle;animation:blip 1s infinite;
}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
.sbstats{display:flex;gap:14px;flex:0 0 auto;padding-inline:6px}
.sbstat{text-align:center;min-width:42px}
.sbstat b{display:block;font-size:14px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.sbstat span{font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--ink3)}
@media (max-width:900px){.sbstats{display:none}.sbteam b{font-size:13px}}

.field2{
  flex:1 1 auto;display:grid;grid-template-columns:1fr 320px;gap:1px;background:var(--line);min-height:0;
}
@media (max-width:840px){.field2{grid-template-columns:1fr;grid-template-rows:1fr auto}}
.pitchwrap{background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:11px;min-height:0}
.pitch{
  flex:1 1 auto;border-radius:12px;overflow:hidden;min-height:190px;
  background:repeating-linear-gradient(90deg,var(--turf) 0 8.33%,var(--turf2) 8.33% 16.66%);
  border:1px solid rgba(0,0,0,.18);position:relative;box-shadow:inset 0 2px 14px rgba(0,0,0,.18);
}
.pitch svg{position:absolute;inset:0;width:100%;height:100%}
.feed{background:var(--surface);padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:7px;min-height:0}
.ev{
  display:flex;gap:9px;align-items:flex-start;font-size:12.5px;padding:7px 9px;
  border-radius:8px;background:var(--sunken);border:1px solid var(--line);line-height:1.4;
  animation:pop .28s cubic-bezier(.2,0,.1,1);
}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ev .m{font-weight:900;color:var(--ink3);font-size:11px;flex:0 0 30px;padding-top:1px;font-variant-numeric:tabular-nums}
.ev.goal{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:750}
.ev.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad-ink)}
.ev.you{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);font-weight:750}
.matchfoot{
  flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line2);
  padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}

/* ── MOMENT overlay ────────────────────────────────────────────── */
.moment{
  position:fixed;inset:0;z-index:70;background:rgba(20,17,12,.62);
  display:flex;align-items:center;justify-content:center;padding:16px;
  backdrop-filter:blur(3px);animation:fade .2s;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mcard{
  width:min(880px,100%);max-height:100%;overflow-y:auto;background:var(--surface);
  border-radius:16px;box-shadow:var(--sh2);border:1px solid var(--line2);
  animation:rise .28s cubic-bezier(.2,0,.1,1);
}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.mhd{
  padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;
  background:var(--sunken);
}
.mhd .t{font-size:14px;font-weight:850}
.mhd .s{font-size:11.5px;color:var(--ink3)}
.ring{width:44px;height:44px;flex:0 0 auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{
  position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:900;
  font-variant-numeric:tabular-nums;
}
.mbd{padding:14px 16px 16px;display:grid;grid-template-columns:1fr 300px;gap:14px}
@media (max-width:760px){.mbd{grid-template-columns:1fr}}
.mpitch{
  border-radius:11px;overflow:hidden;aspect-ratio:16/10;
  background:repeating-linear-gradient(90deg,var(--turf) 0 8.33%,var(--turf2) 8.33% 16.66%);
  border:1px solid rgba(0,0,0,.2);box-shadow:inset 0 2px 14px rgba(0,0,0,.2);position:relative;
}
.mpitch svg{position:absolute;inset:0;width:100%;height:100%}

.choices{display:flex;flex-direction:column;gap:7px}
.ch{
  border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:10px 12px;
  cursor:pointer;text-align:start;transition:all .13s;position:relative;
}
.ch:hover:not(:disabled){background:var(--hover);border-color:var(--ctrl)}
.ch.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.ch:disabled{opacity:.5;cursor:not-allowed}
.ch b{display:block;font-size:13px;font-weight:800}
.ch span{display:block;font-size:11px;color:var(--ink3);margin-top:2px;line-height:1.35}
.ch.on span{color:var(--accent-ink);opacity:.9}
.ch.unl{border-inline-start:4px solid var(--gold)}
.ch .u{
  position:absolute;top:-8px;inset-inline-end:9px;font-size:9.5px;font-weight:900;
  background:var(--gold);color:#fff;padding:2px 7px;border-radius:99px;letter-spacing:.03em;
}

.power{
  position:relative;height:36px;border-radius:9px;background:var(--sunken);
  border:1px solid var(--line2);overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.07);
}
.power .zone{position:absolute;inset-block:0;background:var(--accent-soft);border-inline:2px solid var(--accent)}
.power .zone.perf{position:absolute;inset-block:0;background:var(--accent);opacity:.28;border:none}
.power .ndl{position:absolute;inset-block:2px;width:4px;background:var(--ink);border-radius:3px;box-shadow:0 0 0 1px var(--surface)}
.power .ticks{position:absolute;inset:0;display:flex;justify-content:space-between;padding:0 4px;align-items:flex-end;pointer-events:none}
.power .ticks i{width:1px;height:7px;background:var(--line2)}

.res{
  border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.45;
  border:1px solid var(--line);background:var(--sunken);min-height:56px;
}
.res.great{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.res.good{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.res.poor{background:var(--warn-soft);border-color:var(--warn);color:var(--warn-ink)}
.res.fail{background:var(--bad-soft);border-color:var(--bad);color:var(--bad-ink)}
.res b{display:block;font-size:14px;font-weight:900;margin-bottom:2px}

/* ── post-match ────────────────────────────────────────────────── */
.ratebig{
  display:flex;align-items:center;gap:16px;padding:16px;border-radius:12px;
  background:var(--sunken);border:1px solid var(--line);
}
.ratebig .num{
  width:78px;height:78px;border-radius:16px;display:grid;place-items:center;flex:0 0 auto;
  font-size:30px;font-weight:900;color:#fff;background:var(--accent);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);font-variant-numeric:tabular-nums;
}
.ratebig .num.w{background:var(--warn)} .ratebig .num.b{background:var(--bad)} .ratebig .num.g{background:var(--gold)}

/* ── the database: club pages and player cards ─────────────────── */
.db{background:var(--paper)}
.dbhead{display:flex;align-items:center;gap:14px;padding:16px 18px;position:relative}
.dbhead .dbcrest{
  width:52px;height:52px;border-radius:13px;background:#fff;display:grid;place-items:center;
  font-weight:900;font-size:16px;flex:0 0 auto;box-shadow:0 2px 0 rgba(0,0,0,.18)
}
.dbtitle h2{margin:0;font-size:19px;font-weight:900;letter-spacing:-.02em}
.dbtitle p{margin:3px 0 0;font-size:12px;opacity:.86;font-weight:700}
.dbx{
  position:absolute;inset-inline-end:14px;top:14px;width:32px;height:32px;border:0;cursor:pointer;
  border-radius:9px;background:rgba(255,255,255,.22);color:inherit;font-size:15px;font-weight:800
}
.dbwatch{
  margin-inline-start:auto;margin-inline-end:44px;border:0;cursor:pointer;border-radius:99px;
  padding:8px 14px;font-size:12px;font-weight:850;background:rgba(255,255,255,.9);color:#1B1A17
}
.dbwatch.on{background:var(--gold);color:#241F20}
.dbtabs{display:flex;gap:6px;padding:10px 18px 0;border-bottom:1px solid var(--line);background:var(--card)}
.dbtab{
  border:0;background:transparent;cursor:pointer;padding:9px 14px;border-radius:10px 10px 0 0;
  font-size:13px;font-weight:850;color:var(--ink3)
}
.dbtab.on{background:var(--sunken);color:var(--ink)}
.dbbody{flex:1;overflow-y:auto;padding:16px;display:flex;justify-content:center}
.dbbody>*{width:min(900px,100%)}
.xiwrap{display:flex;flex-direction:column;gap:14px}
.xipitch{
  position:relative;border-radius:14px;padding:14px 10px;display:grid;gap:9px;
  grid-template-columns:repeat(5,1fr);
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,.05) 0 26px, rgba(0,0,0,.03) 26px 52px),
    linear-gradient(180deg,#2E8B57,#1F6F43);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)
}
.xidot{
  border:0;cursor:pointer;border-radius:11px;padding:7px 4px;display:flex;flex-direction:column;
  align-items:center;gap:2px;background:rgba(255,255,255,.94);box-shadow:0 2px 0 rgba(0,0,0,.2)
}
.xidot .o{font-size:15px;font-weight:900;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.xidot .nm{font-size:10.5px;font-weight:800;line-height:1.15;text-align:center}
.xidot .ps{font-size:9.5px;font-weight:800;color:var(--ink3)}
.xidot.r0{grid-column:3}
.xidot.r1:nth-of-type(2){grid-column:1} .xidot.r1:nth-of-type(3){grid-column:2}
.xidot.r1:nth-of-type(4){grid-column:4} .xidot.r1:nth-of-type(5){grid-column:5}
.xidot.r2:nth-of-type(6){grid-column:2} .xidot.r2:nth-of-type(7){grid-column:3}
.xidot.r2:nth-of-type(8){grid-column:4}
.xidot.r3:nth-of-type(9){grid-column:2} .xidot.r3:nth-of-type(10){grid-column:4}
.xidot.r3:nth-of-type(11){grid-column:3}
.clickrow{cursor:pointer}
.clickrow:hover{background:var(--sunken)}
.sortbar{display:flex;gap:6px;margin-bottom:8px}
.sortb{
  border:1px solid var(--line);background:var(--card);cursor:pointer;border-radius:99px;
  padding:4px 11px;font-size:11.5px;font-weight:800;color:var(--ink2)
}
.sortb.on{background:var(--accent);color:#fff;border-color:transparent}
.clubchip{
  border:0;background:transparent;cursor:pointer;font:inherit;color:inherit;padding:0;
  text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px
}
.clubchip:hover{text-decoration-color:var(--accent);color:var(--accent-ink)}

.pcard .pcbox{
  width:min(460px,94vw);max-height:92vh;overflow-y:auto;border-radius:18px;background:var(--card);
  box-shadow:0 24px 60px rgba(0,0,0,.3)
}

/* build the club index; ids are namespaced by league */
var CLUBS = {};
var LG_IDS = Object.keys(LEAGUES);
LG_IDS.forEach(function(lid){
  var L = LEAGUES[lid];
  L.id = lid;
  L.clubs = L.raw.split(";").map(function(row){
    var f = row.split("|");
    var id = lid + "_" + f[0];
    var c = { id:id, lg:lid, n:f[1], ab:f[2], c:f[3], rep:+f[4] };
    c.t = textOn(f[3]);
    CLUBS[id] = c;
    return c;
  });
  delete L.raw;
});
function textOn(hex){
  var r = parseInt(hex.substr(1,2),16), g = parseInt(hex.substr(3,2),16), b = parseInt(hex.substr(5,2),16);
  return (0.299*r + 0.587*g + 0.114*b) > 150 ? "#241F20" : "#FFFFFF";
}
function club(id){ return CLUBS[id]; }
function lg(id){ return LEAGUES[id]; }
function leagueOf(clubId){ return LEAGUES[CLUBS[clubId].lg]; }

function famOf(p){ return POS[p].fam; }

function grpVal(g){
  var subs = GRP[g].subs, t = 0;
  for(var i=0;i<subs.length;i++) t += S.a[subs[i]] || 0;
  return Math.round(t/subs.length);
}
function grpExact(g){
  var subs = GRP[g].subs, t = 0;
  for(var i=0;i<subs.length;i++) t += S.a[subs[i]] || 0;
  return t/subs.length;
}
function ovrExact(){
  var w = POS[S.pos].w, t = 0;
  for(var g in w) t += grpExact(g) * w[g];
  return clamp(t, 1, 99);
}
function ovr(){ return Math.round(ovrExact()); }
/* how far through the current OVR point we are — drives the HUD progress sliver */
function ovrFrac(){ var e = ovrExact(); return clamp(e - Math.floor(e), 0, 1); }
/* market value in euros — exponential in OVR, shaped by age and potential */
function value(){
  var o = ovr();
  var base = 25000 * Math.pow(1.185, o - 40);
  var age = S.age, m;
  if(age <= 19)      m = 1.55;
  else if(age <= 22) m = 1.40;
  else if(age <= 25) m = 1.20;
  else if(age <= 28) m = 1.00;
  else if(age <= 31) m = 0.72;
  else if(age <= 34) m = 0.42;
  else               m = 0.20;
  var pot = 1 + clamp(S.potential - o, 0, 25) * 0.022;      // headroom premium
  var fr = S.ratings.length ? avgRating() : (S.lastSeasonRating || 6.6);
  var form = 1 + clamp(fr - 6.6, -0.8, 1.2) * 0.16;
  var con  = S.contractYears <= 0 ? 0.55 : (S.contractYears === 1 ? 0.82 : 1);
  var idol = hasTrait("idol") ? 1.08 : 1;
  return Math.round(base * m * pot * form * con * idol);
}
function money(v){
  if(v >= 1000000) return "€" + (v/1000000).toFixed(v >= 10000000 ? 0 : 1) + "M";
  if(v >= 1000)    return "€" + Math.round(v/1000) + "K";
  return "€" + v;
}
/* XP & levels */
function xpNeed(l){ return Math.round(110 + l*72 + l*l*3.5); }
function tpCost(v){
  var c = v < 55 ? 1 : (v < 65 ? 2 : (v < 75 ? 3 : (v < 82 ? 5 : (v < 88 ? 8 : 13))));
  return c;
}
function isKey(k){ return POS[S.pos].key.indexOf(k) >= 0; }
/* game intelligence — drives how long the Read phase lasts */
function iq(){
  return S.pos === "GK"
    ? (S.a.gpos + S.a.cmp) / 2
    : (S.a.vis + S.a.cmp) / 2;
}

function newState(name, pos, startId){
  var st = STARTS.filter(function(s){return s.id===startId})[0];

  /* every sub-attribute starts low; the position's key five start meaningfully
     higher, and the position's weighted groups get a smaller lift. A prospect
     is not balanced — that is the point. */
  var a = {};
  var gk = pos === "GK";
  for(var k in ATTR){
    if(!!ATTR[k].gk !== gk && !(gk && (k === "acc" || k === "spd"))) { a[k] = 22; continue; }
    a[k] = 34 + Math.round(Math.random()*7);
  }
  var w = POS[pos].w;
  for(var k2 in ATTR){
    var g = ATTR[k2].g;
    if(w[g]) a[k2] = Math.round(a[k2] + w[g] * 26);
  }
  POS[pos].key.forEach(function(k3){ a[k3] = clamp(a[k3] + 9 + Math.round(Math.random()*4), 1, 99); });

  var s = {
    screen:"hub", name:name, pos:pos, age:18, club:st.id, league:CLUBS[st.id].lg,
    season:1, week:1, maxWeek:14,

    watch:[], watchClubs:[],

}

var SQUAD_POS = ["GK","GK","CB","CB","CB","CB","RB","LB","LWB","CDM","CM","CM","CAM","RM","LM","RW","LW","ST","ST","CF"];

function buildSquad(){
  var rep = club(S.club).rep;
  var sq = SQUAD_POS.map(function(pp, i){
    var base = clamp(rep + ri(-11, 9), 32, 92);
    return {
      id:"p"+i, n:playerName(), pos:pp, ovr:base, age:ri(18,34), inj:0, me:false,
      /* three separate relationship axes, exactly as the GDD specifies */
      rel:{trust:ri(38,55), respect:ri(30,50), personal:ri(30,52)},
      role:"", mem:[]
    };
  });
  /* the captain is the oldest high-rated player; the mentor is an old head;
     the rival is whoever is closest to you in your own position */
  var cap = sq.slice().sort(function(a,b){ return (b.ovr + b.age*0.8) - (a.ovr + a.age*0.8); })[0];
  cap.role = "captain"; cap.rel.respect += 8;
  var men = sq.filter(function(x){ return x !== cap && x.age >= 29; })
              .sort(function(a,b){ return b.age - a.age; })[0];
  if(men){ men.role = "mentor"; }
  var myFam = famOf(S.pos);
  var riv = sq.filter(function(x){ return POS[x.pos] && famOf(x.pos) === myFam && !x.role; })
              .sort(function(a,b){ return b.ovr - a.ovr; })[0];
  if(riv){ riv.role = "rival"; riv.rel.personal -= 10; }
  return sq;
}

function squadBy(role){ return S.squad.filter(function(p){ return p.role === role; })[0]; }

function relLabel(v){
  if(v >= 78) return {t:"מצוין", k:"ok"};
  if(v >= 62) return {t:"טוב", k:"ok"};
  if(v >= 45) return {t:"תקין", k:""};
  if(v >= 30) return {t:"מתוח", k:"w"};
  return {t:"עוין", k:"b"};
}
function dressingRoom(){
  var t = 0;
  S.squad.forEach(function(p){ t += (p.rel.trust + p.rel.respect + p.rel.personal)/3; });
  return Math.round(t / S.squad.length);
}
function nudgeRel(p, d){
  p.rel.trust    = clamp(p.rel.trust    + (d.trust||0),    0, 100);
  p.rel.respect  = clamp(p.rel.respect  + (d.respect||0),  0, 100);
  p.rel.personal = clamp(p.rel.personal + (d.personal||0), 0, 100);

function buildRivals(){

      ovr: clamp(ovr() + ri(-6, 10), 38, 80),
      pot: clamp(ovr() + ri(6, 26), 50, 92),
      val: 0, age: ri(17,21)

}

function buildFixtures(myId){
  var others = LEAGUES[CLUBS[myId].lg].clubs
    .filter(function(c){return c.id!==myId}).map(function(c){return c.id});
  for(var i=others.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=others[i]; others[i]=others[j]; others[j]=t; }

  for(var k=0;k<14;k++) fx.push({opp: others[k % others.length], home: k%2===0});
  return fx;
}

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* clubs that could plausibly want you right now — reputation-gated */
function suitorPool(){
  var o = ovr(), out = [];
  var ceiling = o + 14 + (S.interest.length ? 4 : 0) + Math.min(14, S.euroRep||0) + (S.natCaps ? 5 : 0);
  LG_IDS.forEach(function(lid){
    if(lid === S.league) return;
    LEAGUES[lid].clubs.forEach(function(c){
      if(c.rep <= ceiling && c.rep >= club(S.club).rep - 6) out.push(c);
    });
  });
  return out;
}

function agentMeeting(){
  var r = avgRating();
  var chance = (r-6.2)*0.5 + (S.minutes/900)*0.4;
  var pool = suitorPool();
  if(pool.length && rnd() < clamp(chance, 0.05, 0.8)){
    var e = pool[ri(0, pool.length-1)];
    if(!S.interest.some(function(x){return x.id===e.id})){
      S.interest.push({id:e.id, n:e.n, ab:e.ab, c:e.c, lg:LEAGUES[e.lg].n, rep:e.rep, lvl:1});
      push("הסוכן: ⁨" + e.n + "⁩ (⁨" + LEAGUES[e.lg].n + "⁩) ביקשו דוח עליך.", "ok");
      return;
    }
  }
  if(S.interest.length){
    var x = S.interest[ri(0, S.interest.length-1)];
    if(x.lvl < 3){
      x.lvl++;
      push("הסוכן: ⁨" + x.n + "⁩ העמיקו את הבירור.", "ok");
    } else {
      push("הסוכן: ⁨" + x.n + "⁩ מוכנים לדבר. חכה לחלון ההעברות.", "ok");
    }
  } else {
    push("הסוכן: אין תנועה. \"תן לי דקות ואני אתן לך שוק.\"", "");
  }
}

/* ══════════════════════════════════════════════════════════════════
   NEGOTIATION BOARD — GDD §10א.2
   Every clause on one screen. Pushing one clause costs tension; the club
   has a finite budget, and spending it all makes them walk away.
   ════════════════════════════════════════════════════════════════ */
var CLAUSES = [
  {k:"wage",    n:"שכר שבועי",       unit:"₪", step:0.14, cost:11, fmt:function(v){return "₪"+Math.round(v)+"k"}},
  {k:"years",   n:"אורך חוזה",        unit:"",  step:1,    cost:6,  fmt:function(v){return Math.round(v)+" שנים"}},
  {k:"release", n:"סעיף שחרור",       unit:"",  step:-0.18,cost:14, fmt:function(v){return money(Math.round(v))}},
  {k:"signon",  n:"מענק חתימה",       unit:"",  step:0.22, cost:9,  fmt:function(v){return money(Math.round(v))}},
  {k:"appear",  n:"בונוס הופעה",      unit:"",  step:0.25, cost:7,  fmt:function(v){return "₪"+Math.round(v)+"k"}},
  {k:"goal",    n:"בונוס שער/בישול",  unit:"",  step:0.25, cost:7,  fmt:function(v){return "₪"+Math.round(v)+"k"}},
  {k:"roleIdx", n:"מעמד מובטח",       unit:"",  step:1,    cost:17, fmt:function(v){return ROLES[clamp(Math.round(v),0,3)]}},
  {k:"image",   n:"זכויות תדמית",     unit:"%", step:8,    cost:8,  fmt:function(v){return Math.round(v)+"%"}}
];
var ROLES = ["מחוץ לרוטציה","רוטציה","מסובב ראשון","שחקן מפתח"];

function openBoard(i){
  var o = S.offers[i];
  var c = club(o.id);
  S.board = {
    offerIndex:i, club:o,
    tension:0,
    max: 100 - clamp((c.rep - ovr()) * 2.2, -18, 34),   // stronger clubs concede less
    walked:false,
    terms:{
      wage:o.wage, years:o.years, release: value()*3.2, signon: value()*0.18,
      appear: Math.max(1, Math.round(o.wage*0.10)), goal: Math.max(1, Math.round(o.wage*0.14)),
      roleIdx: ROLES.indexOf(o.role) < 0 ? 1 : ROLES.indexOf(o.role), image: 12
    },
    base:null, pushes:{}
  };
  S.board.base = JSON.parse(JSON.stringify(S.board.terms));
  S.screen = "career"; render();
}

function pushClause(k){
  var B = S.board; if(!B || B.walked) return;
  var C = CLAUSES.filter(function(x){return x.k===k})[0];
  B.pushes[k] = (B.pushes[k]||0) + 1;
  var cost = C.cost * (1 + (B.pushes[k]-1)*0.55);
  B.tension += cost;

  if(C.k === "years" || C.k === "roleIdx") B.terms[k] = B.terms[k] + C.step;
  else B.terms[k] = B.terms[k] * (1 + C.step);
  if(C.k === "roleIdx") B.terms.roleIdx = clamp(B.terms.roleIdx, 0, 3);
  if(C.k === "years")   B.terms.years   = clamp(B.terms.years, 1, 6);

  if(B.tension > B.max){
    B.walked = true;
    push(B.club.n + " נסוגו מהמו״מ. דחפת חזק מדי.", "b");
    S.offers.splice(B.offerIndex, 1);
    S.board = null;
    render();
    celebrate('<span class="ctag">המו״מ נשבר</span><div class="cbig" style="font-size:28px">'+B.club.n+' פרשו</div>'
      + '<div class="csub">לכל צד יש תקציב מתח. זה נגמר.</div>', "gold");
    return;
  }
  render();
}

function signBoard(){
  var B = S.board; if(!B) return;
  var o = S.offers[B.offerIndex];
  o.wage = Math.round(B.terms.wage);
  o.years = Math.round(B.terms.years);
  o.role = ROLES[clamp(Math.round(B.terms.roleIdx),0,3)];
  o.signon = Math.round(B.terms.signon);
  S.board = null;
  acceptOffer(B.offerIndex);
}
function cancelBoard(){ S.board = null; render(); }

function acceptOffer(i){

function push(txt, kind){ S.inbox.unshift({t:txt, k:kind||"", w:S.week}); if(S.inbox.length>40) S.inbox.pop(); }
function avgRating(){ if(!S.ratings.length) return 6.0; return S.ratings.reduce(function(a,b){return a+b},0)/S.ratings.length; }

/* grow a set of sub-attributes, respecting the potential ceiling.
   Returns [{k, amount}] so the UI can show "+1 דריבל" chips. */
function grow(keys, amount){
  var out = [], head = S.potential - ovr();
  keys.forEach(function(k){
    if(S.a[k] === undefined) return;
    var soft = head <= 0 ? 0.25 : (head < 5 ? 0.55 : 1);
    var gain = amount * soft * (isKey(k) ? 1.25 : 0.85);
    var before = Math.floor(S.a[k]);
    S.a[k] = clamp(S.a[k] + gain, 1, 99);
    var after = Math.floor(S.a[k]);
    if(after > before) out.push({k:k, amount:after-before});
  });
  return out;
}
function addXp(n){
  if(hasTrait("wonder")) n = Math.round(n*1.25);
  S.xp += n;
  var levels = 0;
  while(S.xp >= xpNeed(S.level)){
    S.xp -= xpNeed(S.level);
    S.level++;
    S.tp += 2 + (S.level % 5 === 0 ? 3 : 0);
    levels++;
  }
  return levels;
}

function oppPlace(id){
  var T = S.tables[S.league];
  var rows = LEAGUES[S.league].clubs.map(function(c){ return {id:c.id, t:T[c.id]}; })
    .sort(function(a,b){ return b.t.pts-a.t.pts || (b.t.gf-b.t.ga)-(a.t.gf-a.t.ga); });
  return rows.findIndex(function(r){return r.id===id}) + 1;
}

function meter(label, val, cls){
  return '<div><div class="kv" style="padding:0 0 5px"><span>'+label+'</span>'
    + '<b class="n">'+Math.round(clamp(val,0,100))+'%</b></div>'
    + '<div class="bar"><i class="'+(cls||"")+'" style="width:'+clamp(val,0,100)+'%"></i></div></div>';
}

function expectedMinutes(){
  var t = S.trust + (S.fit-70)*0.3 + (S.sharp-50)*0.2;
  if(t>=68) return {label:"הרכב פותח", start:true, mins:90};
  if(t>=48) return {label:"הרכב / חילוף מוקדם", start:true, mins:ri(60,90)};
  if(t>=32) return {label:"ספסל · כניסה סבירה", start:false, mins:ri(18,35)};
  return {label:"ספסל · כניסה לא בטוחה", start:false, mins:rnd()<0.5?ri(6,16):0};
}

function cardTier(o){
  if(o >= 85) return {id:"elite",  n:"אליט", bg:"linear-gradient(150deg,#33304A 0%,#17162A 55%,#443A63 100%)", ink:"#F3E9CB", chip:"#F3E9CB", chipInk:"#17162A"};
  if(o >= 75) return {id:"gold",   n:"זהב",  bg:"linear-gradient(150deg,#FAF2D8 0%,#E9D496 42%,#D6BA6E 100%)", ink:"#1A160C", chip:"#1A160C", chipInk:"#FAF2D8"};
  if(o >= 62) return {id:"silver", n:"כסף",  bg:"linear-gradient(150deg,#F5F5F3 0%,#DCDCD8 45%,#BEBEB9 100%)", ink:"#17150F", chip:"#17150F", chipInk:"#F5F5F3"};
  return                {id:"bronze", n:"ארד",  bg:"linear-gradient(150deg,#F2E2D0 0%,#DCBE9B 45%,#C39F76 100%)", ink:"#221609", chip:"#221609", chipInk:"#F2E2D0"};
}

/* six-axis radar — the shape of a player, not a list of numbers */
function radarSvg(vals, labels, ink){
  var R = 45, cx = 67, cy = 66, n = vals.length;
  function pt(i, r){
    var a = -Math.PI/2 + i*2*Math.PI/n;
    return [(cx + Math.cos(a)*r).toFixed(1), (cy + Math.sin(a)*r).toFixed(1)];
  }
  var rings = [0.25,0.5,0.75,1].map(function(f){
    var pts = []; for(var i=0;i<n;i++) pts.push(pt(i, R*f).join(","));
    return '<polygon points="'+pts.join(" ")+'" fill="none" stroke="'+ink+'" stroke-opacity="'+(f===1?.34:.15)+'" stroke-width="1"/>';
  }).join("");
  var spokes = ""; for(var i=0;i<n;i++){ var e = pt(i,R); spokes += '<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0]+'" y2="'+e[1]+'" stroke="'+ink+'" stroke-opacity=".15"/>'; }
  var shape = []; for(var j=0;j<n;j++) shape.push(pt(j, R*clamp(vals[j]/99,0.08,1)).join(","));
  var labs = ""; for(var k=0;k<n;k++){ var lp = pt(k, R+13);
    labs += '<text x="'+lp[0]+'" y="'+lp[1]+'" font-size="8.5" font-weight="900" text-anchor="middle" dominant-baseline="middle" fill="'+ink+'" fill-opacity=".62">'+labels[k]+'</text>'; }
  return '<svg viewBox="0 0 134 132" width="128" height="126" aria-hidden="true">'
    + rings + spokes
    + '<polygon points="'+shape.join(" ")+'" fill="'+ink+'" fill-opacity=".20" stroke="'+ink+'" stroke-opacity=".78" stroke-width="2" stroke-linejoin="round"/>'
    + labs + '</svg>';
}

function playerCard(){
  var p = POS[S.pos], c = club(S.club), o = ovr(), T = cardTier(o);

  var faceHtml = p.face.map(function(g,i){
    return '<div class="fs"><b class="n">'+vals[i]+'</b><span>'+g+'</span></div>';
  }).join("");
  return '<div class="fcard '+T.id+'" style="--cc:'+c.c+';--cbg:'+T.bg+';--cink:'+T.ink+';--cchip:'+T.chip+';--cchipink:'+T.chipInk+'">'
    + '<span class="tierbadge">'+T.n+'</span>'
    + '<div class="fctop">'
      + '<div class="fcovr"><b class="n">'+o+'</b><span>'+S.pos+'</span></div>'
      + '<div class="fcradar">'+radarSvg(vals, p.face, T.ink)+'</div>'
      + '<div class="fcbadges">'
        + '<div class="fcclub" style="background:'+c.c+';color:'+c.t+'">'+c.ab+'</div>'
        + '<div class="fclvl" title="רמה">'+S.level+'</div>'

}

    + '<div class="p"><h3>הכרטיס שלך</h3><div class="pb">'+card
      + '<div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap">'

        + '<span class="tag '+(avgRating()>=7?"ok":"")+'">ציון '+avgRating().toFixed(2)+'</span>'

function depthChart(){
  var myFam = famOf(S.pos);
  var list = S.squad.filter(function(pl){ return POS[pl.pos] && famOf(pl.pos) === myFam; })
    .map(function(pl){ return {n:pl.n, age:pl.age, ovr:pl.ovr, inj:pl.inj, me:false, role:""}; });
  list.push({n:S.name+" (אתה)", age:S.age, ovr:ovr(), inj:0, me:true, role:""});
  list.sort(function(a,b){
    return (b.ovr + (b.me?S.trust*0.16:0) - (b.inj?25:0)) - (a.ovr + (a.me?S.trust*0.16:0) - (a.inj?25:0));
  });
  list.forEach(function(r,i){ r.role = i===0?"מפתח":(i===1?"מסובב":(i===2?"רוטציה":"מחוץ לרוטציה")); });
  return list;
}

function depthReason(){
  if(S.trust>=68) return "אתה בחירה ראשונה. המאמן סומך עליך גם כשהמשחק לא הולך — זה מה שמייצר רצף.";
  if(S.trust>=48) return "אתה בגבול ההרכב. עמידה בהוראות ודוח תפקיד טוב שווים כאן יותר משער בודד.";
  if(S.trust>=32) return "אתה אופציה מהספסל. הדרך פנימה עוברת דרך אימון טקטי, אמינות, ושתי כניסות טובות ברצף.";
  return "אתה מחוץ לתוכניות. או שינוי עמדה, או השאלה, או שיחה עם המאמן — אבל לא עוד שבוע של אותו דבר.";
}

/* ── LEAGUE ────────────────────────────────────────────────────── */
var viewLid = null;
function viewLeague(){
  var lid = viewLid || S.league;
  var L = LEAGUES[lid], T = S.tables[lid];
  var rows = L.clubs.map(function(c){
    var t = T[c.id];
    return {c:c, t:t, gd:t.gf-t.ga};
  }).sort(function(a,b){ return b.t.pts-a.t.pts || b.gd-a.gd || b.t.gf-a.t.gf; });

  var tabs = '<div class="lgtabs">' + LG_IDS.map(function(id){
    return '<button class="lgtab'+(id===lid?" on":"")+'" data-lg="'+id+'">'
      + LEAGUES[id].flag + ' ' + LEAGUES[id].n + '</button>';
  }).join("") + '</div>';

  var scorers = S.scorers[lid].slice().sort(function(a,b){return b.g-a.g}).slice(0,8);
  var myGoals = (lid === S.league) ? S.goals : 0;

  var relLine = L.clubs.length - 2;
  return tabs + '<div class="grid g2"><div class="p"><h3>'+L.flag+' '+L.n+' <span class="r">מחזור '+(S.week-1)+'</span></h3><div class="pb tight">'
  + '<table><thead><tr><th>#</th><th>מועדון</th><th class="r">מש׳</th><th class="r">נצ׳</th><th class="r">תק׳</th><th class="r">הפ׳</th><th class="r">הפרש</th><th class="r">נק׳</th></tr></thead><tbody>'
  + rows.map(function(r,i){
      var cls = r.c.id===S.club ? "me" : (i<2 ? "cl" : (i>=relLine ? "rel" : ""));
      return '<tr class="'+cls+'"><td class="n">'+(i+1)+'</td>'
        + '<td><button class="clubchip" data-club="'+r.c.id+'"><span class="sw" style="background:'+r.c.c+'"></span>'+r.c.n+'</button></td>'
        + '<td class="r">'+r.t.p+'</td><td class="r">'+r.t.w+'</td><td class="r">'+r.t.d+'</td><td class="r">'+r.t.l+'</td>'
        + '<td class="r">'+(r.gd>0?"+":"")+r.gd+'</td><td class="r"><b>'+r.t.pts+'</b></td></tr>';
    }).join("")
  + '</tbody></table></div></div>'

  + '<div style="display:flex;flex-direction:column;gap:14px">'
  + (lid===S.league
    ? '<div class="p"><h3>לוח המשחקים שלך</h3><div class="pb tight"><table><tbody>'
      + S.fixtures.map(function(f,i){
          var o = club(f.opp);
          var done = i < S.week-1;
          return '<tr'+(i===S.week-1?' class="me"':'')+'><td class="n">'+(i+1)+'</td>'
            + '<td><button class="clubchip" data-club="'+o.id+'"><span class="sw" style="background:'+o.c+'"></span>'+o.n+'</button></td>'
            + '<td>'+(f.home?"בית":"חוץ")+'</td>'
            + '<td class="r">'+(done?(f.res||"—"):(i===S.week-1?'<span class="tag ok">הבא</span>':""))+'</td></tr>';
        }).join("")
      + '</tbody></table></div></div>'
    : '')
  + '<div class="p"><h3>מלך השערים <span class="r">'+L.n+'</span></h3><div class="pb tight"><table><tbody>'
    + scorers.map(function(s,i){
        return '<tr><td class="n">'+(i+1)+'</td><td>'+s.n+'</td>'
          + '<td><span class="sw" style="background:'+club(s.club).c+'"></span>'+club(s.club).ab+'</td>'
          + '<td class="r"><b>'+s.g+'</b></td></tr>';
      }).join("")
    + (lid===S.league && myGoals>0
        ? '<tr class="me"><td class="n">—</td><td>'+S.name+' (אתה)</td>'
          + '<td><span class="sw" style="background:'+club(S.club).c+'"></span>'+club(S.club).ab+'</td>'
          + '<td class="r"><b>'+myGoals+'</b></td></tr>'
        : '')
  + '</tbody></table></div></div>'
  + '</div></div>';
}

/* ── WORLD: news + the league's young talents ──────────────────── */
function viewWorld(){
  var board = S.rivals.slice();
  board.push({n:S.name+" (אתה)", club:S.club, pos:S.pos, ovr:ovr(), pot:S.potential, age:S.age, me:true});
  board.sort(function(a,b){ return b.ovr-a.ovr || b.pot-a.pot; });
  var myRank = board.findIndex(function(r){return r.me}) + 1;

  var newsHtml = S.news.length
    ? S.news.slice(0,22).map(function(m){
        return '<div class="newsrow '+(m.k||"")+'"><span class="nw n">מ׳'+m.w+'</span><span>'+m.t+'</span></div>';
      }).join("")
    : '<div class="empty">העולם עוד לא התחיל לזוז. שחק מחזור.</div>';

  /* the market: the part of a management game you can lose an hour in */
  var mkt = marketRows(24);
  var FAMS = [["all","הכל"],["GK","שוער"],["CB","בלם"],["FB","מגן"],["CM","קשר"],["WIDE","כנף"],["ST","חלוץ"]];
  var mktHtml = '<div class="p"><h3>שוק השחקנים <span class="r">היקרים בעולם</span></h3><div class="pb tight">'
    + '<div class="mktbar">'
      + '<button class="sortb'+(MKT_LG==="all"?" on":"")+'" data-mkt="lg:all">כל הליגות</button>'
      + LG_IDS.map(function(id){
          return '<button class="sortb'+(MKT_LG===id?" on":"")+'" data-mkt="lg:'+id+'">'+LEAGUES[id].flag+' '+LEAGUES[id].n+'</button>';
        }).join("")
    + '</div>'
    + '<div class="mktbar">'
      + FAMS.map(function(f){
          return '<button class="sortb'+(MKT_POS===f[0]?" on":"")+'" data-mkt="pos:'+f[0]+'">'+f[1]+'</button>';
        }).join("")
    + '</div>'
    + '<table><thead><tr><th>#</th><th>שחקן</th><th>מועדון</th><th class="r">גיל</th>'
    + '<th class="r">OVR</th><th class="r">שווי</th></tr></thead><tbody>'
    + (mkt.length ? mkt.map(function(pl,i){
        return '<tr class="clickrow" data-pc="'+pl.club+'#'+pl.i+'"><td class="n">'+(i+1)+'</td>'
          + '<td><bdi>'+pl.n+'</bdi> <span class="muted xs">'+POS[pl.pos].short+'</span></td>'
          + '<td><span class="sw" style="background:'+club(pl.club).c+'"></span>'+club(pl.club).ab+'</td>'
          + '<td class="r">'+pl.age+'</td><td class="r"><b>'+pl.ovr+'</b></td>'
          + '<td class="r">'+money(pl.val)+'</td></tr>';
      }).join("") : '<tr><td colspan="6" class="muted">אין תוצאות לסינון הזה.</td></tr>')
    + '</tbody></table></div></div>';

  /* your own watchlist — the reason to open the database at all */
  var wl = (S.watch||[]).map(function(k){
    var q = k.split("#"), pl = clubSquad(q[0]).filter(function(x){ return x.i === +q[1]; })[0];
    return pl ? {p:pl, k:k} : null;
  }).filter(Boolean);
  var wc = (S.watchClubs||[]).filter(function(c){ return club(c); });
  var watchHtml = '<div class="p"><h3>רשימת המעקב שלך</h3><div class="pb tight">'
    + (wl.length || wc.length
      ? (wc.length ? '<div class="mktbar">' + wc.map(function(c){
            return '<button class="sortb" data-club="'+c+'"><span class="sw" style="background:'+club(c).c+'"></span>'+club(c).n+'</button>';
          }).join("") + '</div>' : '')
        + (wl.length ? '<table><tbody>' + wl.map(function(w){
            var cmp = w.p.ovr - ovr();
            return '<tr class="clickrow" data-pc="'+w.p.club+'#'+w.p.i+'">'
              + '<td><bdi>'+w.p.n+'</bdi></td><td>'+POS[w.p.pos].short+'</td>'
              + '<td><span class="sw" style="background:'+club(w.p.club).c+'"></span>'+club(w.p.club).ab+'</td>'
              + '<td class="r"><b>'+w.p.ovr+'</b></td>'
              + '<td class="r"><span class="tag '+(cmp>0?"b":"ok")+'">'+(cmp>0?"+"+cmp+" מעליך":(cmp===0?"שווה לך":(-cmp)+" מתחתיך"))+'</span></td>'
              + '<td class="r">'+money(w.p.val)+'</td></tr>';
          }).join("") + '</tbody></table>' : '')
      : '<div class="empty">עוד לא עקבת אחרי אף אחד. פתח מועדון מהטבלה, לחץ על שחקן — ותוכל לעקוב אחרי מי שמעניין אותך.</div>')
    + '</div></div>';

  return '<div class="grid g2">'
  + '<div style="display:flex;flex-direction:column;gap:14px">'
  + '<div class="p"><h3>חדשות העולם</h3><div class="pb" style="display:flex;flex-direction:column;gap:6px">'
    + newsHtml + '</div></div>'
  + watchHtml + '</div>'
  + '<div style="display:flex;flex-direction:column;gap:14px">'
    + '<div class="p"><h3>כישרונות צעירים <span class="r">'+LEAGUES[S.league].n+' · מקום '+myRank+'</span></h3>'
    + '<div class="pb tight"><table><thead><tr><th>#</th><th>שחקן</th><th>קבוצה</th><th class="r">גיל</th><th class="r">OVR</th><th class="r">פוט׳</th></tr></thead><tbody>'
    + board.slice(0,12).map(function(r,i){
        return '<tr'+(r.me?' class="me"':'')+'><td class="n">'+(i+1)+'</td><td>'+r.n+'</td>'
          + '<td><span class="sw" style="background:'+club(r.club).c+'"></span>'+club(r.club).ab+'</td>'
          + '<td class="r">'+r.age+'</td><td class="r"><b>'+r.ovr+'</b></td>'
          + '<td class="r muted">'+r.pot+'</td></tr>';
      }).join("")
    + '</tbody></table></div></div>'
    + '<div class="p"><h3>מובילות הליגות</h3><div class="pb tight"><table><tbody>'
    + LG_IDS.map(function(id){
        var c = topOf(id), pts = S.tables[id][c.id].pts, played = S.tables[id][c.id].p;
        return '<tr><td>'+LEAGUES[id].flag+' '+LEAGUES[id].n+'</td>'
          + (played
             ? '<td><button class="clubchip" data-club="'+c.id+'"><span class="sw" style="background:'+c.c+'"></span>'+c.n+'</button></td><td class="r n">'+pts+'</td>'
             : '<td class="muted">טרם החלה</td><td class="r muted">—</td>')
          + '</tr>';
      }).join("")
    + '</tbody></table></div></div>'
    + mktHtml
  + '</div></div>';
}

/* ── CAREER ────────────────────────────────────────────────────── */
function viewCareer(){
  var intHtml = S.interest.length ? S.interest.map(function(x){
    var lv = ["","בירור ראשוני","סקאוט בדרך","הצעה אפשרית"][x.lvl];
    var cls = ["","","w","ok"][x.lvl];
    return '<div class="kv"><span><span class="sw" style="background:'+x.c+'"></span><b><bdi>'+x.n+'</bdi></b> · <bdi>'+x.lg+'</bdi></span>'
      + '<span class="tag '+cls+'">'+lv+'</span></div>';
  }).join("") : '<div class="empty">אף אחד לא מסתכל עדיין.<br>דקות ודוחות תפקיד הם מה שפותח את השוק.</div>';

  var offersHtml = S.offers.length ? '<div class="p" style="border-color:var(--gold)"><h3>🔥 הצעות על השולחן</h3><div class="pb">'
    + S.offers.map(function(o,i){
        return '<div class="offer">'
          + '<div class="ohead"><span class="ocrest" style="background:'+o.c+';color:'+textOn(o.c)+'">'+o.ab+'</span>'
            + '<div><b>'+o.n+'</b><span>'+o.lgName+' · מוניטין '+o.rep+'</span></div></div>'
          + '<div class="oterms">'
            + '<div><span class="lbl">עמלת העברה</span><b>'+money(o.fee)+'</b></div>'
            + '<div><span class="lbl">שכר שבועי</span><b>₪'+o.wage+'k</b></div>'
            + '<div><span class="lbl">מעמד מובטח</span><b>'+o.role+'</b></div>'
            + '<div><span class="lbl">אורך חוזה</span><b>'+o.years+' שנים</b></div>'
          + '</div>'
          + '<button class="btn pri" data-accept="'+i+'">לפתוח מו״מ עם '+o.n+' ▸</button>'
        + '</div>';
      }).join("")
    + '<button class="btn" id="declineAll" style="margin-top:10px">להישאר ב'+club(S.club).n+'</button>'
    + '</div></div>' : '';

  var renewHtml = S.pendingRenewal ? '<div class="p" style="border-color:var(--accent);margin-bottom:14px">'
    + '<h3>📝 המועדון מציע חידוש חוזה</h3><div class="pb">'
    + '<div class="oterms">'
      + '<div><span class="lbl">שכר שבועי</span><b>₪'+S.pendingRenewal.wage+'k</b></div>'
      + '<div><span class="lbl">אורך</span><b>'+S.pendingRenewal.years+' שנים</b></div>'
      + '<div><span class="lbl">מעמד</span><b>'+S.pendingRenewal.role+'</b></div>'
      + '<div><span class="lbl">נוכחי</span><b>₪'+S.wage+'k</b></div>'
    + '</div>'
    + '<div class="row" style="margin-top:11px"><button class="btn pri" id="renewYes">לחתום</button>'
    + '<button class="btn" id="renewNo">לדחות</button></div>'
    + '<p class="hint" style="margin:9px 0 0">חוזה שנגמר מוריד את שווי השוק שלך ב-45%, אבל נותן כוח מיקוח מול מועדונים אחרים.</p>'
    + '</div></div>' : '';

  var shopHtml = '<div class="p"><h3>חנות <span class="r">₪'+Math.round(S.money)+'k בבנק</span></h3><div class="pb">'
    + '<div class="shop">' + SHOP.map(function(it){
        var owned = it.once && S.shopUsed[it.id];
        var can = !owned && S.money >= it.cost;
        return '<button class="shopitem'+(owned?" owned":"")+'" data-buy="'+it.id+'"'+(can?"":" disabled")+'>'
          + '<span class="si">'+it.i+'</span>'
          + '<div><b>'+it.n+'</b><span>'+it.d+'</span></div>'
          + '<span class="sc">'+(owned?"נרכש":"₪"+it.cost+"k")+'</span>'
        + '</button>';
      }).join("") + '</div>'
    + '<p class="hint" style="margin:10px 0 0">השכר נכנס כל שבוע, ובונוסים על הופעות, שערים ובישולים. פריטים קבועים משנים את מכניקת הרגע לצמיתות.</p>'
    + '</div></div>';

  var mhHtml = S.matches.length
    ? '<div class="p"><h3>המשחקים שלך <span class="r">ציון ממוצע '+avgRating().toFixed(2)+'</span></h3><div class="pb tight">'
      + '<table><thead><tr><th>מח׳</th><th>יריבה</th><th>תוצאה</th><th class="r">דק׳</th><th class="r">ש׳</th><th class="r">ב׳</th><th class="r">ציון</th></tr></thead><tbody>'
      + S.matches.slice(0,14).map(function(m){
          var cls = m.r>=7.5?"ok":(m.r>=6.5?"":(m.r>=5.8?"w":"b"));
          return '<tr><td class="n">'+m.w+'</td><td>'+m.oppN+(m.home?"":" (ח)")+'</td>'
            + '<td class="n">'+m.res+'</td><td class="r">'+m.mins+'</td>'
            + '<td class="r">'+(m.g||"")+'</td><td class="r">'+(m.a||"")+'</td>'
            + '<td class="r"><span class="tag '+cls+'">'+m.r.toFixed(1)+'</span></td></tr>';
        }).join("")
      + '</tbody></table></div></div>'
    : '';

  var honHtml = S.honours.length
    ? S.honours.map(function(h){ return '<div class="kv"><span>'+h.t+'</span><span class="tag">עונה '+h.s+'</span></div>'; }).join("")
    : '<div class="empty">עוד לא נכתבה היסטוריה.</div>';

  var boardHtml = "";
  if(S.board){
    var B = S.board;
    var pct = clamp(B.tension / B.max * 100, 0, 100);
    boardHtml = '<div class="p" style="border-color:var(--gold);margin-bottom:14px"><h3>לוח מו״מ · '+B.club.n+'</h3><div class="pb">'
      + '<div class="spread" style="margin-bottom:6px"><span class="lbl">תקציב מתח</span>'
        + '<b class="n" style="color:'+(pct>78?"var(--bad)":(pct>50?"var(--warn)":"var(--accent)"))+'">'+Math.round(pct)+'%</b></div>'
      + '<div class="tension"><i style="width:'+pct+'%"></i></div>'
      + '<p class="hint" style="margin:7px 0 12px">כל דחיפה עולה יותר מהקודמת. אם התקציב נגמר — הם קמים מהשולחן.</p>'
      + '<div class="clauses">'
      + CLAUSES.map(function(C){
          var cur = B.terms[C.k], base = B.base[C.k];
          var moved = Math.abs(cur - base) > 0.001;
          var nextCost = Math.round(C.cost * (1 + ((B.pushes[C.k]||0))*0.55));
          return '<div class="clause'+(moved?" moved":"")+'">'
            + '<span class="cln">'+C.n+'</span>'
            + '<span class="clv n">'+C.fmt(cur)+'</span>'
            + (moved ? '<span class="clb n">היה '+C.fmt(base)+'</span>' : '<span class="clb"></span>')
            + '<button class="clpush" data-push="'+C.k+'">לדחוף <em class="n">'+nextCost+'</em></button>'
          + '</div>';
        }).join("")
      + '</div>'
      + '<div class="row" style="margin-top:12px">'
        + '<button class="btn pri big" id="bSign">לחתום ▸</button>'
        + '<button class="btn" id="bCancel">לחזור להצעות</button>'
      + '</div>'
    + '</div></div>';
  }

  return boardHtml + renewHtml + offersHtml + mhHtml + '<div class="grid g2">' + shopHtml
  + '<div class="p"><h3>עניין ממועדונים</h3><div class="pb">'+intHtml
  + '<p class="hint" style="margin:11px 0 0">מסדרונות ההעברות אמיתיים: קפיצה של עד ~14 נקודות מוניטין מעל ה-OVR שלך. הצעה ממשית מגיעה רק אחרי שסקאוט באמת ראה אותך.</p>'
  + '</div></div>'
  + '<div class="p"><h3>נבחרת ישראל</h3><div class="pb">'
    + '<div class="kv"><span>סטטוס</span><b>'+(S.natCalled?'<span class="tag ok">בסגל</span>':'<span class="tag">מחוץ לסגל</span>')+'</b></div>'
    + '<div class="kv"><span>הופעות</span><b class="n">'+S.natCaps+'</b></div>'
    + '<div class="kv"><span>שערים</span><b class="n">'+S.natGoals+'</b></div>'
    + '<p class="hint" style="margin:10px 0 0">הזימון נגזר מ-OVR, מהציון הממוצע ומדקות המשחק — והרף עולה מעונה לעונה.</p>'
  + '</div></div>'
  + '<div class="p"><h3>היסטוריית קריירה</h3><div class="pb">'+honHtml+'</div></div>'
  + '<div class="p"><h3>חוזה</h3><div class="pb">'
    + '<div class="kv"><span>מועדון</span><b>'+club(S.club).n+'</b></div>'
    + '<div class="kv"><span>שנים שנותרו</span><b class="n">'+S.contractYears+'</b></div>'
    + '<div class="kv"><span>שכר שבועי</span><b class="n">₪'+S.wage+'k</b></div>'
    + '<div class="kv"><span>מעמד מובטח</span><b>'+S.status+'</b></div>'
    + '<div class="kv"><span>עונה</span><b class="n">'+S.season+'</b></div>'
    + '<p class="hint" style="margin:11px 0 0">לוח המו״מ המלא (12 סעיפים, תקציב מתח, מידע חלקי) מפורט ב-GDD §10א.2 — באב־הטיפוס החוזה מוצג בלבד.</p>'
  + '</div></div></div>';
}

/* ══════════════════════════════════════════════════════════════════
   BINDINGS
   ════════════════════════════════════════════════════════════════ */
function bind(){
  Array.prototype.forEach.call(stage.querySelectorAll("[data-act]"), function(b){
    b.onclick = function(){
      var id = b.getAttribute("data-act");
      var i = S.picked.indexOf(id);
      if(i>=0) S.picked.splice(i,1);
      else if(S.picked.length < S.slots) S.picked.push(id);
      render();
    };
  });
  var pl = document.getElementById("play"); if(pl) pl.onclick = startWeek;
  var cl = document.getElementById("clear"); if(cl) cl.onclick = function(){ S.picked=[]; render(); };

  Array.prototype.forEach.call(stage.querySelectorAll("[data-accept]"), function(b){
    b.onclick = function(){ openBoard(+b.getAttribute("data-accept")); };
  });
  var dec = document.getElementById("declineAll");
  if(dec) dec.onclick = declineOffers;
  Array.prototype.forEach.call(stage.querySelectorAll("[data-push]"), function(b){
    b.onclick = function(){ pushClause(b.getAttribute("data-push")); };
  });
  Array.prototype.forEach.call(stage.querySelectorAll("[data-buy]"), function(b){
    b.onclick = function(){ buyItem(b.getAttribute("data-buy")); };
  });
  var bs = document.getElementById("bSign");   if(bs) bs.onclick = signBoard;
  var bc = document.getElementById("bCancel"); if(bc) bc.onclick = cancelBoard;
  var ry = document.getElementById("renewYes"); if(ry) ry.onclick = acceptRenewal;
  var rn = document.getElementById("renewNo");  if(rn) rn.onclick = rejectRenewal;

  Array.prototype.forEach.call(stage.querySelectorAll("[data-lg]"), function(b){
    b.onclick = function(){ viewLid = b.getAttribute("data-lg"); render(); };
  });

  /* anything that names a club opens that club */
  Array.prototype.forEach.call(stage.querySelectorAll("[data-club]"), function(b){
    b.onclick = function(e){ e.stopPropagation(); openClub(b.getAttribute("data-club")); };
  });
  Array.prototype.forEach.call(stage.querySelectorAll("[data-mkt]"), function(b){
    b.onclick = function(){
      var v = b.getAttribute("data-mkt");
      if(v.indexOf("lg:") === 0) MKT_LG = v.slice(3); else MKT_POS = v.slice(4);
      render();
    };
  });
  Array.prototype.forEach.call(stage.querySelectorAll("[data-pc]"), function(b){
    b.onclick = function(){ var q = b.getAttribute("data-pc").split("#"); openPlayerCard(q[0], +q[1]); };
  });

  Array.prototype.forEach.call(stage.querySelectorAll(".spend"), function(b){
    b.onclick = function(){
      var k = b.getAttribute("data-k");
      var v = Math.floor(S.a[k]);
      var cost = tpCost(v);
      if(S.tp < cost || v >= 99) return;
      var before = ovr(), beforeE = ovrExact(), bv = value();
      S.tp -= cost;
      S.a[k] = Math.min(99, Math.floor(S.a[k]) + 1);
      /* spillover: drilling one thing lifts its siblings a little */
      GRP[ATTR[k].g].subs.forEach(function(sib){
        if(sib !== k && S.a[sib] !== undefined) S.a[sib] = clamp(S.a[sib] + 0.4, 1, 99);
      });
      var after = ovr();
      render();
      if(after > before){
        S.valuePrev = bv;
        flashOvr();
        toast("OVR " + before + " → " + after + "   ·   " + money(value()));
      } else {
        var d = (ovrExact() - beforeE);
        toast(ATTR[k].n + " " + v + " → " + (v+1) + "   ·   OVR +" + d.toFixed(2));
      }
      var got = checkBadges();
      if(got.length) setTimeout(function(){ showBadge(got[0]); }, 320);
    };
  });
}

function flashOvr(){
  var el = document.getElementById("hOvr").parentNode;
  el.classList.remove("up"); void el.offsetWidth; el.classList.add("up");
}

document.getElementById("hRead").onclick = function(){
  var modes = ["normal","long","off"];
  var names = {normal:"זמן קריאה: רגיל", long:"זמן קריאה: ארוך (×1.8)", off:"זמן קריאה: ללא הגבלה"};
  S.readMode = modes[(modes.indexOf(S.readMode)+1) % modes.length];
  toast(names[S.readMode]);
};

document.getElementById("hTheme").onclick = function(){
  var cur = document.documentElement.getAttribute("data-theme");
  var next = cur==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
};

/* ── the weekly director ────────────────────────────────────────── */
function runStorylets(){
  /* deliver anything that was scheduled to come back */
  var due = S.slEchoes.filter(function(e){ return e.w <= S.week; });
  due.forEach(function(e){ push(e.t, e.k); });
  S.slEchoes = S.slEchoes.filter(function(e){ return e.w > S.week; });

  /* broken promises are remembered */
  S.promises.forEach(function(pr){
    if(!pr.done && pr.due <= S.week){
      pr.done = true;
      if(S.trust < 50){
        S.trust = clamp(S.trust - 6, 0, 100);
        push("הבטחה שלא קוימה: " + pr.what + ". המאמן רשם.", "b");
      } else {
        S.trust = clamp(S.trust + 4, 0, 100);
        push("עמדת במה שהבטחת: " + pr.what + ".", "ok");
      }
    }
  });

  if(S.slPending) return;
  if(S.week < 2) return;
  if(rnd() > 0.62) return;              // quiet weeks are content too

  var pool = STORYLETS.filter(function(sl){
    if(S.slCd[sl.id] && S.week - S.slCd[sl.id] < sl.cd) return false;
    try { return sl.req(); } catch(e){ return false; }
  });
  if(!pool.length) return;

  var total = pool.reduce(function(a,s){ return a + s.w; }, 0);
  var roll = rnd() * total, acc = 0, pick = pool[0];
  for(var i=0;i<pool.length;i++){ acc += pool[i].w; if(roll <= acc){ pick = pool[i]; break; } }

  S.slCd[pick.id] = S.week;
  try { S.slPending = { id: pick.id, data: pick.build() }; }

/* ══════════════════════════════════════════════════════════════════
   WEEK → MATCH
   ════════════════════════════════════════════════════════════════ */
function startWeek(){
  WEEK_GAINS = [];
  var xp = 0;
  S.picked.forEach(function(id){
    var a = ACTIONS.filter(function(x){return x.id===id})[0];
    if(a){ a.run(); xp += (a.xp||0); }
  });
  S.trainXp = xp;
  S.trainGains = WEEK_GAINS.slice();
  /* natural weekly recovery — stamina and youth shed load faster */
  var shed = 18 + (S.a.sta||45)*0.14 + (S.age <= 23 ? 3 : 0) + (hasTrait("engine") ? 4 : 0);
  S.load  = clamp(S.load - shed, 0, 100);
  S.fit   = clamp(S.fit + 9 - S.load*0.06, 20, 100);
  S.sharp = clamp(S.sharp - 3, 0, 100);
  S.morale= clamp(S.morale - 1, 0, 100);

  if(S.load > 86 && rnd() < (hasTrait("iron") ? 0.11 : 0.17)){
    var wks = ri(1,3);
    push("פציעה: מתיחה בירך. " + wks + " שבועות בחוץ. העומס לא היה סוד.", "b");
    S.load = 30; S.fit = 55; S.sharp = 30; S.trust -= 2;
    S.picked = [];
    for(var i=0;i<wks && S.week<=S.maxWeek;i++){ simWorld(null); S.week++; }
    S.prep = {video:0,analyst:0,coach:0,unit:0,sp:0};
    if(S.week>S.maxWeek) return endSeason();
    render();
    toast("פציעה — דילגת על " + wks + " מחזורים");
    return;
  }
  openMatch();
}
