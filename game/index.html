var M = null;

function openMatch(){
  var fx = S.fixtures[S.week-1] || S.fixtures[S.fixtures.length-1];
  var opp = club(fx.opp);
  var me  = club(S.club);
  var exp = expectedMinutes();

  M = {
    fx:fx, opp:opp, me:me,
    home: fx.home ? me : opp,
    away: fx.home ? opp : me,
    hg:0, ag:0, min:0,
    events:[], moments:[], mi:0,
    onPitch: exp.start, entryMin: exp.start ? 0 : ri(55,75),
    mins: exp.mins, playing: exp.mins>0,
    score:0, count:0, gAdded:0, aAdded:0,
    st: blankStats(), rates:null, noise:undefined,
    running:false, timer:null
  };

  M.moments = buildMoments(exp);

  var el = document.createElement("div");
  el.className = "match"; el.id = "matchLayer";
  el.innerHTML = matchHtml();
  document.body.appendChild(el);
  paintPitch();
  document.getElementById("mStart").onclick = runClock;
  document.getElementById("mSkip").onclick = skipToEnd;
}

function buildMoments(exp){
  if(exp.mins<=0) return [];
  var n = exp.start ? ri(9,13) : ri(4,7);
  var out = [];
  var from = exp.start ? 4 : M.entryMin+3;
  var to   = 89;
  for(var i=0;i<n;i++){
    var m = Math.round(from + (to-from) * ((i+0.5)/n) + ri(-3,3));
    out.push({min:clamp(m,3,89), done:false});
  }
  return out.sort(function(a,b){return a.min-b.min});
}

function matchHtml(){

        + '<span class="tag" id="mRole">'+(M.playing ? (M.onPitch?"על המגרש":"ספסל · כניסה בדקה "+M.entryMin) : "לא בסגל להיום")+'</span>'
        + '<span class="tag" id="mTouch">מגעים 0</span>'

/* ── live pitch: 22 players + ball ─────────────────────────────── */
var P = null;
var FORM = [
  {x:7,  y:50},                                            // GK
  {x:24, y:16},{x:22, y:38},{x:22, y:62},{x:24, y:84},     // back 4
  {x:44, y:26},{x:42, y:50},{x:44, y:74},                  // mid 3
  {x:66, y:18},{x:68, y:50},{x:66, y:82}                   // front 3
];

function initPitch(){
  var p = document.getElementById("mPitch");
  if(!p) return;
  p.innerHTML = '<svg viewBox="0 0 1000 620" preserveAspectRatio="none" id="pSvg">'
    + '<g fill="none" stroke="var(--turf-line)" stroke-width="3">'
    + '<rect x="16" y="16" width="968" height="588" rx="4"/>'
    + '<line x1="500" y1="16" x2="500" y2="604"/><circle cx="500" cy="310" r="80"/>'
    + '<rect x="16" y="156" width="132" height="308"/><rect x="852" y="156" width="132" height="308"/>'
    + '<rect x="16" y="236" width="50" height="148"/><rect x="934" y="236" width="50" height="148"/>'
    + '</g><circle cx="500" cy="310" r="5" fill="var(--turf-line)"/>'
    + '<polyline id="pTrail" fill="none" stroke="#FFFFFF" stroke-opacity=".38" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'
    + '<g id="pPlayers"></g>'
    + '<circle id="pBall" cx="500" cy="310" r="8.5" fill="#fff" stroke="#17150F" stroke-width="2.5"/>'
    + '</svg>';

  var g = document.getElementById("pPlayers");
  var myIdx = POS[S.pos].slot;
  var NUMS = [1,2,4,5,3,6,8,10,7,9,11];
  P = {ball:{x:50,y:50}, bt:{x:50,y:50}, poss:"h", men:[], possH:50, t:0, trail:[]};

  for(var side=0; side<2; side++){
    for(var i=0;i<11;i++){
      var f = FORM[i];
      var bx = side===0 ? f.x : 100-f.x;
      var by = side===0 ? f.y : 100-f.y;
      var team = side===0 ? M.home : M.away;
      var isMe = (side === (M.home===M.me ? 0 : 1)) && i===myIdx;

      if(isMe){
        var halo = document.createElementNS("http://www.w3.org/2000/svg","circle");
        halo.setAttribute("r", 20); halo.setAttribute("fill", "none");
        halo.setAttribute("stroke", "#FFE27A"); halo.setAttribute("stroke-width", 3);
        halo.setAttribute("stroke-opacity", ".85");
        g.appendChild(halo);
      }
      var el = document.createElementNS("http://www.w3.org/2000/svg","circle");
      el.setAttribute("r", isMe ? 13 : 10);
      el.setAttribute("fill", team.c);
      el.setAttribute("stroke", isMe ? "#17150F" : "rgba(255,255,255,.9)");
      el.setAttribute("stroke-width", isMe ? 3.5 : 2);
      g.appendChild(el);

      var lbl = document.createElementNS("http://www.w3.org/2000/svg","text");
      lbl.setAttribute("text-anchor","middle");
      lbl.setAttribute("font-size", isMe ? "11" : "9");
      lbl.setAttribute("font-weight","900");
      lbl.setAttribute("fill", team.t);
      lbl.setAttribute("pointer-events","none");
      lbl.textContent = isMe ? S.pos : NUMS[i];
      g.appendChild(lbl);

      P.men.push({bx:bx, by:by, x:bx, y:by, el:el, lbl:lbl, halo:isMe?halo:null,
                  side:side, me:isMe, gk:i===0});
    }
  }
  pitchFrame();
}

function pickBallTarget(){
  // possession drifts toward the stronger side; ball roams toward that goal
  var hs = M.home.rep + (M.home===M.me ? 5 : 0);
  var as = M.away.rep + (M.away===M.me ? 5 : 0);
  if(rnd() < 0.35) P.poss = rnd() < hs/(hs+as) ? "h" : "a";
  var bias = P.poss==="h" ? 1 : -1;
  P.bt.x = clamp(50 + bias*(10 + rnd()*36) + (rnd()-0.5)*14, 8, 92);
  P.bt.y = clamp(15 + rnd()*70, 8, 92);
  P.possH = clamp(P.possH + (P.poss==="h" ? 0.6 : -0.6), 28, 72);
}

function pitchFrame(){
  if(!P || !document.getElementById("pSvg")) return;
  P.t++;
  if(P.t % 34 === 0) pickBallTarget();

  P.ball.x += (P.bt.x - P.ball.x) * 0.055;
  P.ball.y += (P.bt.y - P.ball.y) * 0.055;

  var bx = 16 + P.ball.x*9.68, by = 16 + P.ball.y*5.88;
  var b = document.getElementById("pBall");
  if(b){ b.setAttribute("cx", bx); b.setAttribute("cy", by); }

  /* ball trail */
  P.trail.push([bx,by]);
  if(P.trail.length > 14) P.trail.shift();
  var tr = document.getElementById("pTrail");
  if(tr && P.t % 2 === 0){
    tr.setAttribute("points", P.trail.map(function(q){return q[0].toFixed(0)+","+q[1].toFixed(0)}).join(" "));
  }

  var shift = (P.ball.x - 50) * 0.30;
  for(var i=0;i<P.men.length;i++){
    var m = P.men[i];
    var tx = m.gk ? m.bx + shift*0.12 : m.bx + shift;
    var ty = m.gk ? 50 + (P.ball.y-50)*0.16 : m.by + (P.ball.y - 50) * 0.20;
    /* the closest outfielder on the possessing side steps toward the ball */
    if(!m.gk && ((P.poss==="h") === (m.side===0))){
      var d = Math.abs(m.x - P.ball.x) + Math.abs(m.y - P.ball.y);
      if(d < 22){ tx = tx + (P.ball.x - tx)*0.55; ty = ty + (P.ball.y - ty)*0.55; }
    }
    m.x += (clamp(tx,3,97) - m.x) * 0.045;
    m.y += (clamp(ty,5,95) - m.y) * 0.045;
    var px = 16 + m.x*9.68, py = 16 + m.y*5.88;
    m.el.setAttribute("cx", px); m.el.setAttribute("cy", py);
    if(m.lbl){ m.lbl.setAttribute("x", px); m.lbl.setAttribute("y", py + (m.me?4:3.2)); }
    if(m.halo){
      m.halo.setAttribute("cx", px); m.halo.setAttribute("cy", py);
      m.halo.setAttribute("r", 18 + Math.sin(P.t/12)*3);
    }
  }

  var pv = document.getElementById("mPoss");
  if(pv) pv.textContent = "החזקה " + Math.round(M.me===M.home ? P.possH : 100-P.possH) + "%";

  P.raf = requestAnimationFrame(pitchFrame);
}

function stopPitch(){ if(P && P.raf) cancelAnimationFrame(P.raf); }

function paintPitch(){ initPitch(); }

function addEv(min, txt, kind){
  M.events.unshift({min:min, t:txt, k:kind||""});
  var f = document.getElementById("mFeed");
  if(!f) return;
  var d = document.createElement("div");
  d.className = "ev " + (kind||"");
  d.innerHTML = '<span class="m">'+min+'׳</span><span>'+txt+'</span>';
  f.insertBefore(d, f.firstChild);
}

function runClock(){
  var b = document.getElementById("mStart");
  if(b) b.style.display = "none";
  var cb = document.getElementById("mClkBox");
  if(cb){ cb.className = "sbclk live"; cb.querySelector(".l").textContent = "חי"; }
  M.running = true;
  addEv(0, "שריקת פתיחה ב" + (M.fx.home ? club(S.club).n : M.opp.n) + ".", "");
  tickMatch();
}

/* ══════════════════════════════════════════════════════════════════
   THE ORDINARY RUN OF PLAY
   A match report is not only the highlights. Between Skill Moments you
   are still passing, pressing, losing duels — and the rating engine
   counts all of it, exactly as the analytics providers do. The rates
   come from the position's own weights, so a CDM naturally fills a
   defensive line and a winger a dribbling one, without either being
   scripted, and every rate is scaled by fitness, load and sharpness.
   ════════════════════════════════════════════════════════════════ */
function ambientRates(){
  var W = POS[S.pos].w;
  if(S.pos === "GK") return {pass:0.26, drib:0, def:0.062, aer:0.022, shot:0, key:0.008};
  return {
    pass: 0.20 + (W.PAS||0)*1.90 + (W.DEF||0)*0.55,
    drib: 0.012 + (W.DRI||0)*0.20,
    def:  0.010 + (W.DEF||0)*0.28 + (W.PHY||0)*0.07,
    aer:  0.005 + (W.PHY||0)*0.085 + (W.SHO||0)*0.03,
    shot: 0.004 + (W.SHO||0)*0.055,
    key:  0.003 + (W.PAS||0)*0.055 + (W.DRI||0)*0.022
  };
}

/* one number for "how well is your body carrying you today" */
function formEdge(){
  return (S.sharp-50)/500 - Math.max(0, S.load-55)/420 - Math.max(0, 70-S.fit)/380;
}

function ambientOdds(){
  var f = formEdge(), q = (ovr() - (M ? M.opp.rep : 60))/900;
  return {
    pass: S.pos === "GK"
          ? clamp(0.700 + ((S.a.gkic||45)-45)/260 + f, 0.52, 0.94)
          : clamp(0.745 + (grpVal("PAS")-50)/300 + f + q, 0.55, 0.945),
    def:  clamp(0.600 + (grpVal("DEF")-50)/280 + f + q, 0.36, 0.87),
    aer:  clamp(0.480 + ((S.a.hdr||45)+(S.a.str||45)-100)/300 + f + q, 0.22, 0.88),
    drib: clamp(0.545 + (grpVal("DRI")-50)/260 + f + q, 0.28, 0.90),
    shot: clamp(0.330 + (grpVal("SHO")-50)/320 + f, 0.18, 0.62)
  };
}

/* one minute of unremarkable football */
function ambientTick(){
  if(!M || !M.playing || !M.onPitch || !M.st) return;
  var R = M.rates || (M.rates = ambientRates());
  var O = ambientOdds();
  var i, n;

  n = R.pass + (rnd()-0.5)*R.pass*0.7;
  for(i=0;i<4;i++){
    if(rnd() >= n) break;
    n -= 1;
    stat("passes");
    if(rnd() < O.pass) stat("passCompleted");
    else { stat("passFailed"); if(rnd() < 0.45) stat("possessionLost"); }
    if(n <= 0) break;
  }

  if(rnd() < R.key)  stat("keyPass");
  if(rnd() < R.drib){ if(rnd() < O.drib) stat("dribbleWon"); else stat("dribbleLost"); }
  if(rnd() < R.aer) { if(rnd() < O.aer) stat("aerialWon"); else stat("aerialLost"); }
  if(rnd() < R.shot){ stat("shots"); if(rnd() < O.shot) stat("shotOnTarget"); else stat("shotOffTarget"); }

  if(rnd() < R.def){
    var won = rnd() < O.def;
    if(S.pos === "GK"){
      if(won){ if(rnd() < 0.62){ stat("save"); if(rnd() < 0.20) stat("bigSave"); } else stat("recovery"); }
      else if(rnd() < 0.03) stat("error");
    } else if(won){
      var roll = rnd();
      if(roll < 0.24) stat("tackle");
      else if(roll < 0.46) stat("interception");
      else if(roll < 0.66) stat("clearance");
      else if(roll < 0.74) stat("block");
      else stat("recovery");
      stat("duelWon");
    } else {
      stat("duelLost");
      if(rnd() < 0.34){ stat("foul"); if(rnd() < 0.055) stat("yellow"); }
      if(rnd() < 0.012) stat("error");
    }
  }
  if(rnd() < 0.006 + (S.a.agi||45)/9000) stat("fouled");
}

function tickMatch(){
  if(M.min>=90) return finishMatch();

  M.min += 1;
  var c = document.getElementById("mClk");
  if(c) c.textContent = M.min + "׳";

  if(!M.onPitch && M.playing && M.min===M.entryMin){
    M.onPitch = true;
    var r = document.getElementById("mRole"); if(r) r.textContent = "על המגרש";
    addEv(M.min, "חילוף: אתה נכנס. המאמן: \"לחץ את הבלם השמאלי, אל תרדוף אחרי שער.\"", "you");
  }

  if(M.onPitch && M.playing) ambientTick();

  var nm = M.moments.filter(function(m){return !m.done && m.min===M.min})[0];
  if(nm && M.onPitch){
    nm.done = true;
    M.timer = null;
    openMoment(nm);
    return;
  }

  if(rnd() < 0.028){
    var homeStr = (M.home.rep + (M.home===M.me?6:0));
    var awayStr = (M.away.rep + (M.away===M.me?6:0));
    var hs = rnd() < homeStr/(homeStr+awayStr);
    if(hs){ M.hg++; document.getElementById("mHG").textContent = M.hg; }
    else  { M.ag++; document.getElementById("mAG").textContent = M.ag; }
    var scorer = hs ? M.home : M.away;
    var good = (scorer === M.me);
    addEv(M.min, (good?"⚽ ":"😞 ") + "שער! " + scorer.n + " " + M.hg + "–" + M.ag, good?"goal":"bad");
    goalFlash(good);
  } else if(rnd() < 0.075){
    var ev = [
      "🎯 הזדמנות גדולה שהוחמצה.", "🟨 כרטיס צהוב.", "🚩 קרן.",
      "🔁 חילוף בקבוצה היריבה.", "⬜ הכדור יצא לקו.", "🧤 הצלה גדולה של השוער.",
      "🅾 העמוד! כמעט שער.", "⚕ הפסקה קצרה לטיפול רפואי.", "📣 הקהל דורש לחץ גבוה.",
      "🟥 כרטיס אדום! היריבה בעשרה.", "⏱ שלוש דקות תוספת."
    ];
    addEv(M.min, ev[ri(0,ev.length-1)], "");
  }

  M.timer = setTimeout(tickMatch, M.onPitch ? 105 : 42);
}

/* When you are not in the room, your on-pitch self still makes decisions,
   and it makes them like a player of your position would: a centre-back
   picks the clearance far more often than the shot — but not always. */
function autoChoice(sit){
  var W = POS[S.pos].w, best = [], tot = 0;
  for(var i=0;i<sit.ch.length;i++){
    var o = sit.ch[i].out || "none", wt;
    if(o === "goal")        wt = 0.20 + (W.SHO||0)*3.0 + (W.DRI||0)*0.5;
    else if(o === "assist") wt = 0.30 + (W.PAS||0)*2.0 + (W.DRI||0)*0.8;
    else if(o === "chance") wt = 0.35 + (W.PAS||0)*1.5;
    else if(o === "win")    wt = 0.30 + (W.DEF||0)*2.2 + (W.PHY||0)*0.8;
    else if(o === "save")   wt = 0.15 + (W.DEF||0)*1.4 + (S.pos === "GK" ? 2.5 : 0);
    else if(o === "keep")   wt = 0.50;
    else                    wt = 0.40;
    if(hasTrait("gambler") && sit.ch[i].risk < 0) wt *= 1.4;
    best.push(wt); tot += wt;
  }
  var roll = rnd()*tot, acc = 0;
  for(var j=0;j<sit.ch.length;j++){ acc += best[j]; if(roll <= acc) return sit.ch[j]; }
  return sit.ch[sit.ch.length-1];
}

function skipToEnd(){
  if(M.timer) clearTimeout(M.timer);
  M.moments.forEach(function(m){ m.done = true; });
  while(M.min<90){
    M.min++;
    if(rnd()<0.028){
      var hs = rnd()<0.5;
      if(hs) M.hg++; else M.ag++;
    }
  }

  /* A simulated match is played by the same engine, not by a shortcut:
     real situations are drawn for your position, a grade is rolled from
     your attributes against the opponent, and resolveMoment writes the
     same box-score lines a live match would write. */
  if(M.playing){
    var wasOn = M.onPitch; M.onPitch = true;
    for(var t=0;t<M.mins;t++) ambientTick();
    M.onPitch = wasOn;

    var strength = (ovr() - M.opp.rep)/26 + (S.sharp-52)/120
                 - Math.max(0,S.load-70)/170 - Math.max(0,70-S.fit)/140;
    strength = clamp(strength, -0.85, 0.85);

    var pool = sitsFor(S.pos);
    if(!pool.length) pool = sitsFor("CM");
    var n = Math.max(1, Math.round(M.mins/8.5));
    for(var i=0;i<n;i++){
      var sit = pool[ri(0,pool.length-1)];
      var ch  = autoChoice(sit);
      var roll = (rnd()+rnd())/2 + strength*0.30 + (ch.risk||0)*0.010;
      var grade = roll > 0.70 ? "great" : (roll > 0.46 ? "good" : (roll > 0.26 ? "poor" : "fail"));
      resolveMoment(ch, grade, true, sit.k);
    }
  }

  document.getElementById("mHG").textContent = M.hg;
  document.getElementById("mAG").textContent = M.ag;
  finishMatch();
}


/* ══════════════════════════════════════════════════════════════════
   THE DATABASE
   Every club in the world has a squad you can open, read and compare
   yourself against — the part of a management game that has nothing to
   do with the next ninety minutes. Squads are generated deterministically
   from the club id, so the same club always has the same players, and
   they are generated by their own random stream so that browsing never
   disturbs the match engine's seed.
   ════════════════════════════════════════════════════════════════ */

/* names by country, transliterated — a Bundesliga squad should not read
   like a Ligat ha'Al squad */
var NAMES = {
  isr:{f:FIRST, l:LAST},
  eng:{f:["ג׳יימי","הארי","קאלום","מייסון","ריס","ג׳ורדן","טיילר","קונור","אוליבר","ג׳ק","לואיס","דקלן","פיל","טרנט","בן","קיל","מרקוס","ארצ׳י"],
       l:["סמית׳","טיילור","וילסון","ג׳ונסון","בראון","ווקר","קלארק","הריסון","בייקר","טרנר","מיטשל","קרול","וורד","גריי","האנט","פרייס","דיקסון","בנט"]},
  esp:{f:["פאבלו","סרחיו","חאבי","מרקו","אלכס","הוגו","דני","איקר","ראול","קרלוס","מיקל","גאבי","אדריאן","חורחה","ניקו","פרן","מרטין","איבן"],
       l:["גרסיה","מרטינס","לופס","סאנצ׳ס","רודריגס","פרננדס","גומס","טורס","רמוס","נאבארו","מורנו","קסטרו","אורטגה","סרנו","וגה","בלנקו","סוארס","דלגאדו"]},
  ita:{f:["מרקו","לורנצו","מטאו","אנדריאה","דויד","ג׳אקומו","ריקרדו","סימונה","פדריקו","סטפאנו","לוקה","אלסנדרו","ניקולו","טומאזו","פביו","דניאלה","מנואל","פייטרו"],
       l:["רוסי","פרארי","קונטי","ריצי","גאלו","קוסטה","ברוני","מרינו","גרקו","לומברדי","מורטי","ביאנקי","קטלנו","סנטורו","פונטנה","באסו","וילה","מרטיני"]},
  ger:{f:["לוקאס","יונאס","פליקס","טים","ניקלס","מקס","לאון","פין","דויד","מוריץ","יאן","פאול","טוביאס","קווין","מריוס","סבן","נילס","אליאס"],
       l:["מולר","שמידט","וגנר","בקר","הופמן","קלר","נוימן","ריכטר","וולף","שולץ","קרוגר","וובר","הרטמן","לנג","זימר","בראון","קונץ","האס"]},
  fra:{f:["לוקא","הוגו","נתן","תיאו","אנזו","מתיס","ז׳ול","קלמן","רומן","אקסל","נואה","גבריאל","אנטואן","ז׳ורדן","יוסף","קרים","אמין","סמיר"],
       l:["מרטן","ברנאר","דיבואה","לורן","ז׳ירארד","מורו","פורנייה","רו","בונה","לפב","מרסייה","ריאר","נואל","פראן","דיאלו","טראורה","סי","קמארה"]}
};
function countryOf(lid){ return (lid||"isr").replace(/[0-9]/g, ""); }

/* a small independent generator — never touches S.seed */
function hashOf(str){
  var h = 2166136261;
  for(var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = (h * 16777619) >>> 0; }
  return h >>> 0;
}
function streamFrom(seed){
  var st = seed >>> 0;
  return function(){ st = (st * 1664525 + 1013904223) >>> 0; return st / 4294967296; };
}

var DB_FORMATION = ["GK","GK","GK","CB","CB","CB","CB","LB","LB","RB","RB","LWB","RWB",
  "CDM","CDM","CM","CM","CM","CAM","CAM","LM","RM","LW","LW","RW","RW","CF","ST","ST","ST"];

/* market value for anyone who is not you — same curve as your own */
function valueOf(o, age, pot){
  var base = 25000 * Math.pow(1.185, o - 40), m;
  if(age <= 19)      m = 1.55;
  else if(age <= 22) m = 1.40;
  else if(age <= 25) m = 1.20;
  else if(age <= 28) m = 1.00;
  else if(age <= 31) m = 0.72;
  else if(age <= 34) m = 0.42;
  else               m = 0.20;
  var ph = 1 + clamp((pot||o) - o, 0, 25) * 0.022;
  return Math.round(base * m * ph);
}

var DB_CACHE = {};
function clubSquad(cid){
  if(DB_CACHE[cid]) return DB_CACHE[cid];
  var c = club(cid);
  var R = streamFrom(hashOf(cid) ^ 0x5f3a);
  var pool = NAMES[countryOf(c.lg)] || NAMES.isr;
  var used = {};
  var sq = DB_FORMATION.map(function(pp, i){
    /* the spine is stronger than the fringe, the way a real squad is */
    var tier = i < 14 ? 1 : (i < 22 ? 0.55 : 0.2);
    var o = clamp(Math.round(c.rep + (R()-0.34)*15 + tier*6 - 4), 30, 94);
    var age = 17 + Math.floor(Math.pow(R(), 0.75) * 20);
    var pot = clamp(o + Math.round((R()*22) * clamp((26-age)/9, 0, 1)), o, 95);
    var nm, guard = 0;
    do { nm = pool.f[Math.floor(R()*pool.f.length)] + " " + pool.l[Math.floor(R()*pool.l.length)]; }
    while(used[nm] && ++guard < 12);
    used[nm] = 1;
    return {
      i:i, n:nm, pos:pp, ovr:o, age:age, pot:pot, club:cid,
      val: valueOf(o, age, pot),
      wage: Math.max(2, Math.round(o*o/95 + R()*6)),
      years: 1 + Math.floor(R()*4),
      form: Math.round((5.9 + R()*1.7) * 10) / 10,
      g: Math.floor(Math.pow(R(), 2.2) * (["ST","CF","LW","RW","CAM"].indexOf(pp)>=0 ? 19 : 6)),
      a: Math.floor(Math.pow(R(), 2.0) * (["CAM","LW","RW","LM","RM"].indexOf(pp)>=0 ? 14 : 5)),
      apps: 4 + Math.floor(R()*30),
      nat: R() < 0.22
    };
  });
  sq.sort(function(a,b){ return b.ovr - a.ovr; });
  DB_CACHE[cid] = sq;
  return sq;
}

/* the eleven a manager would actually pick out of that squad */
var XI_SHAPE = [
  {slot:"GK",  fam:["GK"]},
  {slot:"RB",  fam:["RB","RWB","CB"]},
  {slot:"CB",  fam:["CB"]},
  {slot:"CB",  fam:["CB"]},
  {slot:"LB",  fam:["LB","LWB","CB"]},
  {slot:"CDM", fam:["CDM","CM"]},
  {slot:"CM",  fam:["CM","CDM","CAM"]},
  {slot:"CAM", fam:["CAM","CM","CF"]},
  {slot:"RW",  fam:["RW","RM","LW"]},
  {slot:"LW",  fam:["LW","LM","RW"]},
  {slot:"ST",  fam:["ST","CF"]}
];
function bestXI(sq){
  var taken = {}, out = [];
  XI_SHAPE.forEach(function(sh){
    var pick = null;
    for(var t=0;t<sh.fam.length && !pick;t++){
      for(var i=0;i<sq.length;i++){
        if(taken[i]) continue;
        if(sq[i].pos === sh.fam[t]){ pick = {p:sq[i], idx:i, slot:sh.slot}; break; }
      }
    }
    if(!pick){
      for(var j=0;j<sq.length;j++){ if(!taken[j] && sq[j].pos !== "GK"){ pick = {p:sq[j], idx:j, slot:sh.slot}; break; } }
    }
    if(pick){ taken[pick.idx] = 1; out.push(pick); }
  });
  return out;
}

function clubStanding(cid){
  var c = club(cid), T = S.tables[c.lg];
  if(!T) return null;
  var rows = LEAGUES[c.lg].clubs.map(function(x){ return {c:x, t:T[x.id], gd:T[x.id].gf - T[x.id].ga}; })
    .sort(function(a,b){ return b.t.pts - a.t.pts || b.gd - a.gd || b.t.gf - a.t.gf; });
  for(var i=0;i<rows.length;i++) if(rows[i].c.id === cid) return {pos:i+1, t:rows[i].t, of:rows.length, gd:rows[i].gd};
  return null;
}

  + '</div>'
  + '<div class="dbbody">'+body+'</div>';

  document.getElementById("dbClose").onclick = closeDb;
  var wb = document.getElementById("dbWatch");
  if(wb) wb.onclick = function(){ toggleWatchClub(cid); paintClub(); };

}

function toggleWatchPlayer(cid, idx){

        + '<div class="cmprow"><span>OVR</span>'
          + '<b class="'+(myOvr>=p.ovr?"up":"dn")+'">'+myOvr+' מול '+p.ovr+'</b></div>'
        + '<div class="cmprow"><span>שווי שוק</span>'
          + '<b class="'+(myVal>=p.val?"up":"dn")+'">'+money(myVal)+' מול '+money(p.val)+'</b></div>'
        + '<div class="cmprow"><span>גיל</span>'
          + '<b class="'+(S.age<=p.age?"up":"dn")+'">'+S.age+' מול '+p.age+'</b></div>'
        + '<p class="scoutline">'+scoutLine(p, myOvr, same)+'</p>'
      + '</div>'
      + '<div class="pcacts">'
        + '<button class="btn ghost" id="pcWatch">'+(watched?"👁 במעקב — הסר":"👁 הוסף לרשימת המעקב")+'</button>'
        + '<button class="btn ghost" id="pcClub">לעמוד המועדון</button>'
      + '</div>'
    + '</div></div>';
  document.body.appendChild(el);
  document.getElementById("pcX").onclick = function(){ el.remove(); };
  document.getElementById("pcWatch").onclick = function(){ toggleWatchPlayer(cid, idx); el.remove(); openPlayerCard(cid, idx); };
  document.getElementById("pcClub").onclick = function(){ el.remove(); openClub(cid); };
}

function scoutLine(p, myOvr, same){
  var d = p.ovr - myOvr;
  if(same && d >= 8)  return "בעמדה שלך, והוא לפניך בבירור. אם הוא במועדון שלך — אתה יושב.";
  if(same && d >= 2)  return "אותה עמדה, קצת מעליך. פער שנסגר בשלוש עונות טובות.";
  if(same && d > -3)  return "אותה עמדה, אותו מפלס. זה הכי קרוב שיש לשחקן שמתחרה בך על המשבצת.";
  if(same)            return "אותה עמדה, ואתה כבר לפניו. סוכן טוב היה מזכיר את זה בשיחה הבאה.";
  if(d >= 10)         return "רמה אחרת. שווה ללמוד ממנו ולא להשוות.";
  if(d >= 3)          return "טיפה מעליך, ובעמדה אחרת — כדאי לראות איך הוא נכנס למרחבים.";
  if(p.pot - p.ovr >= 12) return "עוד לא הגיע לשיא שלו. בעוד שנתיים השם הזה יעלה בכל שיחה.";
  return "שחקן שאתה כבר יכול להסתכל עליו בגובה העיניים.";
}

/* ── the world market: everyone, sortable ──────────────────────── */
var MKT_LG = "all", MKT_POS = "all";
function marketRows(limit){
  var out = [];
  var ids = MKT_LG === "all" ? LG_IDS : [MKT_LG];
  ids.forEach(function(lid){
    LEAGUES[lid].clubs.forEach(function(c){
      clubSquad(c.id).slice(0, 14).forEach(function(p){
        if(MKT_POS !== "all" && famOf(p.pos) !== MKT_POS) return;
        out.push(p);
      });
    });
  });
  out.sort(function(a,b){ return b.val - a.val; });
  return out.slice(0, limit || 25);
}

function sitsFor(pos){
  return SITS.filter(function(s){ return s.pos.indexOf(pos) >= 0; });
}

function openMoment(m){
  var pool = sitsFor(S.pos);
  if(!pool.length) pool = sitsFor("CM");
  var late = M.min >= 78;
  var cand = pool.filter(function(s){
    if(s.id === "late_game" && !(late && M.hg !== M.ag)) return false;
    if(s.id === "tired_choice" && S.load < 55) return false;
    return S.slSit !== s.id;          // never the same situation twice running
  });
  if(!cand.length) cand = pool;
  var tot = cand.reduce(function(x,s){ return x + s.w; }, 0);
  var roll = rnd()*tot, acc = 0, sit = cand[0];
  for(var q=0;q<cand.length;q++){ acc += cand[q].w; if(roll <= acc){ sit = cand[q]; break; } }
  S.slSit = sit.id;

  /* Read time. The old numbers (1.0–2.6s) were unreadable — you could not
     finish three Hebrew options, let alone weigh them. Base is now generous
     and the attributes/preparation extend it further. */
  var readBase = 4.2 + iq()/16 + ((S.prep.video || S.perkAnalyst) ? 1.6 : 0)
               + (hasTrait("reader") ? 1.2 : 0) + (S.perkPsych ? 1.0 : 0)
               - (1 - S.fit/100)*1.6 - (S.load/100)*1.2;
  var mult = S.readMode === "long" ? 1.8 : 1;
  var readTime = S.readMode === "off" ? 999 : clamp(readBase*mult, 2.6, 14);

  var choices = sit.ch.slice();
  if(sit.unl && (S.prep.analyst || S.perkAnalyst)) choices.push(sit.unl);
  if(sit.unl && !S.prep.analyst && sit.unl.big && S.prep.coach) choices.push(sit.unl);

  MO = {m:m, sit:sit, choices:choices, pick:null, readTime:readTime,
        pos:0, dir:1, raf:null, fired:false, tLeft:readTime};

  var el = document.createElement("div");
  el.className = "moment"; el.id = "momentLayer";
  el.innerHTML = momentHtml();
  document.body.appendChild(el);
  drawMomentPitch();
  bindMoment();
  startRead();
}

function bindMoment(){

    b.onclick = function(){ pickChoice(i, b); };
    box.appendChild(b);

function startRead(){
  if(S.readMode === "off"){
    var lbl0 = document.getElementById("moT");
    if(lbl0) lbl0.textContent = "∞";
    return;
  }
  var ring = document.getElementById("moRing");
  var t0 = performance.now();
  var total = MO.readTime*1000;
  (function step(now){
    if(!MO || MO.pick!==null) return;
    var el = now - t0;
    var left = Math.max(0, total-el);
    MO.tLeft = left/1000;
    var lbl = document.getElementById("moT");
    if(lbl) lbl.textContent = (left/1000).toFixed(1);
    if(ring) ring.setAttribute("stroke-dashoffset", String(113*(1-left/total)));
    if(left<=0){
      autoPick();
      return;
    }
    requestAnimationFrame(step);
  })(t0);
}

function autoPick(){
  if(!MO || MO.pick!==null) return;
  var safe = 0;
  MO.choices.forEach(function(c,i){ if(c.w > MO.choices[safe].w) safe = i; });
  var btns = document.getElementById("moCh").children;
  document.getElementById("moRes").innerHTML = "<b>נגמר הזמן</b>הגוף בחר בשבילך — הבחירה הבטוחה. זמן קריאה ארוך יותר מגיע מטקטיקה, כושר והכנה.";
  document.getElementById("moRes").className = "res poor";
  pickChoice(safe, btns[safe]);
}

function pickChoice(i, btn){
  if(MO.pick!==null) return;
  MO.pick = i;
  var all = document.getElementById("moCh").children;
  for(var k=0;k<all.length;k++){ all[k].disabled = true; all[k].classList.remove("on"); }
  if(btn) btn.classList.add("on");

  var c = MO.choices[i];
  var at = S.a[c.at] || 45;
  /* Sweet-zone width is where your stats become difficulty you can feel.
     A 40-rated attribute gives a sliver; an 85 gives a comfortable window. */
  var w = 6 + at*0.34 + S.sharp*0.07 + (S.prep.coach?4:0)
        - ((M && M.opp ? M.opp.rep : 50) - 48)*0.085
        - Math.max(0, S.load-45)*0.13 - Math.max(0, 70-S.fit)*0.16
        + c.risk*0.55;
  if(hasTrait("clutch") && M && M.min >= 75) w *= 1.15;
  if(S.perkBoots) w += 6;
  w = clamp(w, 7, 42);
  MO.w = w;
  MO.center = clamp(30 + rnd()*40, 15, 80);

  var z = document.getElementById("moZone");
  z.style.insetInlineStart = Math.max(0, MO.center - w/2) + "%";
  z.style.width = w + "%";

  document.getElementById("moExec").style.display = "block";
  var info = document.getElementById("moInfo");
  if(info){
    info.innerHTML = '<span>' + (ATTR[c.at] ? ATTR[c.at].n : "יכולת") + ' <b>' + Math.round(at) + '</b></span>'
      + '<span>אזור מתוק <b>' + Math.round(w) + '%</b></span>'
      + '<span>כשירות <b>' + Math.round(S.fit) + '%</b></span>'
      + '<span>עומס <b>' + Math.round(S.load) + '%</b></span>';
  }
  if(document.getElementById("moRes").className === "res")
    document.getElementById("moRes").textContent = "עצור את המד בתוך האזור הירוק.";

  MO.pos = 0; MO.dir = 1;
  var speed = 0.95 + Math.max(0,S.load-40)*0.019 + Math.max(0,75-S.fit)*0.016
            + (M && M.min>=70 ? Math.max(0,S.load-50)*0.010 : 0);
  var ndl = document.getElementById("moNdl");
  (function loop(){
    if(!MO || MO.fired) return;
    MO.pos += MO.dir*speed;
    if(MO.pos>=100){MO.pos=100;MO.dir=-1}
    if(MO.pos<=0){MO.pos=0;MO.dir=1}
    ndl.style.insetInlineStart = "calc("+MO.pos+"% - 2px)";
    MO.raf = requestAnimationFrame(loop);
  })();
}

function fireMoment(){
  if(!MO || MO.pick===null || MO.fired) return;
  MO.fired = true;
  if(MO.raf) cancelAnimationFrame(MO.raf);
  document.getElementById("moFire").disabled = true;

  var off = Math.abs(MO.pos - MO.center);
  var half = MO.w/2;
  var grade = off <= half*0.35 ? "great" : (off <= half ? "good" : (off <= half*1.9 ? "poor" : "fail"));
  resolveMoment(MO.choices[MO.pick], grade, false);
}

/* every Skill Moment leaves a line in the box score — that line, not the
   position, is what the rating engine later reads */
function momentStats(kind, out, grade, made){
  var ok  = (grade === "great" || grade === "good");
  var bad = (grade === "fail");
  var gk  = (S.pos === "GK");

  if(out === "goal"){
    stat("shots");
    if(made) stat("shotOnTarget");
    else if(ok){ stat("shotOnTarget"); if((kind === "shoot" || kind === "aerial") && rnd() < 0.45) stat("bigChanceMissed"); }
    else { stat("shotOffTarget"); if(bad && rnd() < 0.5) stat("bigChanceMissed"); }
  }
  else if(out === "assist"){
    if(made){ stat("keyPass"); stat("bigChanceCreated"); }
    else if(ok){
      if(rnd() < 0.5){ stat("keyPass"); if(rnd() < 0.30) stat("bigChanceCreated"); }
      else { stat("passes"); stat("passCompleted"); }
    }
    else { stat("passes"); stat("passFailed"); stat("possessionLost"); }
  }
  else if(out === "chance"){
    if(ok){
      if(rnd() < 0.55){ stat("keyPass"); if(grade === "great" && rnd() < 0.4) stat("bigChanceCreated"); }
      else { stat("passes"); stat("passCompleted"); }
    }
    else { stat("passes"); stat("passFailed"); if(bad) stat("possessionLost"); }
  }
  else if(out === "win"){
    if(ok){
      if(kind === "aerial") stat("aerialWon");
      else { stat("duelWon"); stat(rnd() < 0.5 ? "tackle" : "interception"); }
    } else {
      if(kind === "aerial") stat("aerialLost"); else stat("duelLost");
      if(bad && rnd() < 0.5){ stat("foul"); if(rnd() < 0.18) stat("yellow"); }
      if(bad && rnd() < 0.14) stat("error");
    }
  }
  else if(out === "save"){
    if(gk){
      if(ok){ stat("save"); if(grade === "great") stat("bigSave"); }
      else { stat("goalConceded"); if(bad && rnd() < 0.30) stat("error"); }
    } else {
      if(ok){ stat("block"); if(rnd() < 0.5) stat("clearance"); }
      else { stat("duelLost"); if(bad && rnd() < 0.35) stat("error"); }
    }
  }
  else if(out === "keep"){
    if(ok){ stat("passes"); stat("passCompleted"); if(rnd() < 0.5) stat("recovery"); if(rnd() < 0.3) stat("fouled"); }
    else { stat("passes"); stat("passFailed"); stat("possessionLost"); }
  }
  else {                       /* off-ball work, leadership, image — rarely a box-score line */
    if(grade === "great") stat("recovery");
    else if(bad) stat("possessionLost");
  }

  if(kind === "carry" && out !== "keep"){ if(ok) stat("dribbleWon"); else { stat("dribbleLost"); stat("possessionLost"); } }
  if(kind === "setpiece" && ok && out !== "goal" && rnd() < 0.35) stat("fouled");
}

function resolveMoment(choice, grade, silent, kind){
  var txt, cls, pts;
  var out  = choice ? (choice.out || "none") : "none";
  var risky = choice ? choice.risk < 2 : false;
  if(kind === undefined) kind = (MO && MO.sit) ? MO.sit.k : "";

  if(grade==="great"){ pts = risky ? 1.9 : 1.2; cls="great"; txt="ביצוע נקי. יצא בדיוק כפי שהתכוונת."; }
  else if(grade==="good" || grade==="ok"){ pts = risky ? 1.0 : 0.8; cls="good"; txt="יצא, אבל לא מושלם. עכשיו זה תלוי גם בחבר ליד וביריב."; }
  else if(grade==="poor"){ pts = -0.4; cls="poor"; txt="איבדת דיוק. דוח התפקיד עדיין יכיר בבחירה הנכונה."; }
  else { pts = risky ? -1.3 : -0.8; cls="fail"; txt="לא יצא. זה לא Game Over — זו שורה בדוח."; }

  M.score += pts; M.count++;
  if(grade==="fail") M.errors = (M.errors||0)+1;

  /* WHAT the action produces comes from the choice, never from the position.
     A centre-back who wins a header at a corner can score; a striker who
     slides a through ball gets the assist. */
  var landed = (grade === "great") || (grade === "good" && rnd() < 0.38);
  var outcome = "";

  var made = false;

  if(landed && out === "goal" && rnd() < (hasTrait("finisher") ? 0.44 : 0.34)){
    made = true;
    if(M.me===M.home) M.hg++; else M.ag++;
    S.goals++; S.careerGoals++; M.gAdded++; M.score += 1.2; stat("goals");
    outcome = " שער!";
    if(!silent){ addEv(M.min, "⚽ שער שלך! "+M.home.ab+" "+M.hg+"–"+M.ag+" "+M.away.ab, "goal"); goalFlash(true); }
  }
  else if(landed && out === "assist" && rnd() < 0.34){
    made = true;
    if(M.me===M.home) M.hg++; else M.ag++;
    S.assists++; S.careerAssists++; M.aAdded++; M.score += 0.9; stat("assists");
    outcome = " בישול!";
    if(!silent){ addEv(M.min, "🅰 בישול שלך — הכדור מגיע ומסתיים ברשת.", "goal"); goalFlash(true); }
  }
  else if(landed && out === "chance"){
    M.chances = (M.chances||0)+1; M.score += 0.3;
    outcome = " הזדמנות נוצרה.";
    if(!silent) addEv(M.min, "✳ יצרת מצב — האנליסט יסמן את זה.", "you");
  }
  else if(landed && (out === "win" || out === "save")){
    M.duels = (M.duels||0)+1; M.score += 0.35;
    outcome = out === "save" ? " הצלה!" : " ניצחת את הדו־קרב.";
    if(!silent) addEv(M.min, (out==="save" ? "🧤 הצלה שלך." : "🛡 חילוץ נקי שלך."), "you");
  }
  else if(landed && out === "keep"){
    M.keeps = (M.keeps||0)+1; M.score += 0.12;
  }
  else if(grade === "fail" && !silent){
    addEv(M.min, (out==="save" ? "🥅 הכדור עבר אותך." : "❌ איבוד כדור שלך באזור מסוכן."), "bad");
  }
  else if(grade === "great" && !silent){
    addEv(M.min, "✔ פעולה נקייה שלך.", "you");
  }

  momentStats(kind, out, grade, made);

  if(silent) return;

  var hg = document.getElementById("mHG"), ag = document.getElementById("mAG");
  if(hg) hg.textContent = M.hg; if(ag) ag.textContent = M.ag;

  var r = document.getElementById("moRes");
  r.className = "res " + cls;
  r.innerHTML = "<b>" + (grade==="great"?"מצוין":(grade==="good"?"סביר":(grade==="poor"?"לקוי":"כישלון"))) + outcome + "</b>" + txt;

  var tEl = document.getElementById("mTouch"); if(tEl) tEl.textContent = "מגעים " + M.count;
  var rt = document.getElementById("mRate"); if(rt) rt.textContent = "ציון " + liveRating().toFixed(1);

  var nx = document.getElementById("moNext");
  nx.style.display = "block";
  nx.onclick = closeMoment;
}

/* ══════════════════════════════════════════════════════════════════
   MATCH RATING — event-weighted, in the style of the public analytics
   providers. Every player starts at 6.0 and moves on what they actually
   did. Weights sit in one table so they can be tuned in one place.

   Positional multipliers reflect how NOTABLE an action is for that role:
   a centre-back's clearance is routine (x1.0) while his assist is
   exceptional (x1.5); a striker's tackle is unusual (x1.4) while his
   shot is his job (x1.0). Volume does the rest — defenders accumulate
   many defensive actions, attackers accumulate many attacking ones.
   A striker with no goal but two assists therefore rates well.
   ════════════════════════════════════════════════════════════════ */
var RW = {
  /* the headline events — these are what a rating is actually made of */
  goals:1.00, assists:0.80, bigChanceCreated:0.26, keyPass:0.13,
  shotOnTarget:0.07, shotOffTarget:-0.030, bigChanceMissed:-0.30,
  penaltyWon:0.42, penaltyMissed:-0.55, ownGoal:-1.10,
  /* carrying and contesting */
  dribbleWon:0.070, dribbleLost:-0.055, duelWon:0.030, duelLost:-0.035,
  aerialWon:0.050, aerialLost:-0.035,
  /* defending — small per action, meaningful in volume */
  tackle:0.060, interception:0.060, clearance:0.025, block:0.060, recovery:0.018,
  /* the run of play */
  passCompleted:0.004, passFailed:-0.014, possessionLost:-0.018,
  foul:-0.040, fouled:0.015, yellow:-0.22, red:-1.30,
  /* the goal itself */
  save:0.13, bigSave:0.26, goalConceded:-0.18, cleanSheet:0.38, error:-0.70
};

var RW_GROUP = {
  goals:"att", assists:"att", bigChanceCreated:"att", keyPass:"att",
  shotOnTarget:"att", shotOffTarget:"att", bigChanceMissed:"att",
  dribbleWon:"att", dribbleLost:"att", penaltyWon:"att", penaltyMissed:"att",
  duelWon:"neu", duelLost:"neu", recovery:"neu", passCompleted:"neu",
  passFailed:"neu", possessionLost:"neu", foul:"neu", fouled:"neu",
  yellow:"neu", red:"neu", error:"neu", ownGoal:"neu",
  aerialWon:"def", aerialLost:"def", tackle:"def", interception:"def",
  clearance:"def", block:"def",
  save:"gk", bigSave:"gk", goalConceded:"gk", cleanSheet:"gk"
};

/* att = attacking actions, def = defensive actions, gk = goalkeeping */
var RATE_POS = {
  GK :{att:1.3, def:1.0, gk:1.00, neu:1.0, par:0.55},
  CB :{att:1.5, def:1.00, gk:0, neu:1.0, par:1.51},
  LB :{att:1.3, def:1.05, gk:0, neu:1.0, par:1.33},
  RB :{att:1.3, def:1.05, gk:0, neu:1.0, par:1.33},
  LWB:{att:1.2, def:1.05, gk:0, neu:1.0, par:1.47},
  RWB:{att:1.2, def:1.05, gk:0, neu:1.0, par:1.47},
  CDM:{att:1.3, def:1.05, gk:0, neu:1.0, par:1.35},
  CM :{att:1.1, def:1.15, gk:0, neu:1.0, par:1.48},
  CAM:{att:1.0, def:1.30, gk:0, neu:1.0, par:1.39},
  LM :{att:1.05,def:1.20, gk:0, neu:1.0, par:1.63},
  RM :{att:1.05,def:1.20, gk:0, neu:1.0, par:1.63},
  LW :{att:1.0, def:1.40, gk:0, neu:1.0, par:1.65},
  RW :{att:1.0, def:1.40, gk:0, neu:1.0, par:1.65},
  CF :{att:1.0, def:1.40, gk:0, neu:1.0, par:1.42},
  ST :{att:1.0, def:1.45, gk:0, neu:1.0, par:1.35}
};

function blankStats(){
  return {
    goals:0, assists:0, shots:0, shotOnTarget:0, shotOffTarget:0,
    bigChanceCreated:0, bigChanceMissed:0, keyPass:0,
    passes:0, passCompleted:0, passFailed:0,
    dribbleWon:0, dribbleLost:0, duelWon:0, duelLost:0,
    aerialWon:0, aerialLost:0,
    tackle:0, interception:0, clearance:0, block:0, recovery:0,
    possessionLost:0, foul:0, fouled:0, yellow:0, red:0, error:0,
    save:0, bigSave:0, goalConceded:0, cleanSheet:0,
    penaltyWon:0, penaltyMissed:0, ownGoal:0
  };
}
function stat(k, n){
  if(!M || !M.st) return;
  M.st[k] = (M.st[k]||0) + (n===undefined ? 1 : n);
}

function ratingFrom(st, mins, pos, teamGoals, oppGoals, oppRep){
  var mult = RATE_POS[pos] || RATE_POS.CM;
  var r = 6.0, contrib = 0;

  for(var k in RW){
    var n = st[k] || 0;
    if(!n) continue;
    var g = RW_GROUP[k] || "neu";
    var m = g === "gk" ? (mult.gk || 0) : (mult[g] === undefined ? 1 : mult[g]);
    if(RW[k] < 0 && g !== "gk") m = 1;   /* the bonus is for the rare deed, not the rare mistake */
    contrib += RW[k] * n * m;
  }
  /* PAR — what a competent player in this role accumulates in a normal
     ninety minutes. Subtracting it is what makes 6.0 mean "average" and
     not "showed up": a goalkeeper makes saves every week, so saves alone
     are not a good game; a striker's par is low, so a goal really moves
     the needle. Scaled by minutes, because a substitute cannot be
     expected to reach a full match's par. */
  /* Expectation rises with ability. A 6.8 for a 48-rated teenager and a 6.8
     for an 85-rated international are not the same afternoon, and it is the
     same scale for both — so par grows as you do, and it saturates, because
     the ceiling on how much football one player can do is not infinite.
     Without this term, improving would quietly inflate every rating you
     ever get again: exactly how you end up "above 7.0 for 25 straight". */
  var par = (mult.par || 0) + 1.35 * (1 - Math.exp(-Math.max(0, ovr()-47)/16));
  par *= clamp(mins/90, 0.15, 1);
  r += contrib - par;

  /* being anonymous is its own penalty — no shots, no key passes, no
     defensive actions in a full match is a 5.9, whatever your position */
  var involvement = (st.shots||0) + (st.keyPass||0) + (st.tackle||0) + (st.interception||0)
                  + (st.dribbleWon||0) + (st.aerialWon||0) + (st.save||0) + (st.clearance||0)
                  + (st.goals||0)*3 + (st.assists||0)*3;
  if(mins >= 60 && involvement <= 1) r -= 0.45;
  else if(mins >= 60 && involvement <= 3) r -= 0.18;

  /* keeping the ball out is part of the job in proportion to the job:
     a clean sheet is worth a lot to a centre-back and almost nothing to
     a winger, and conceding costs on the same scale. Keepers already got
     paid for it through the gk weights above. */
  if(pos !== "GK"){
    var dw = (POS[pos] && POS[pos].w.DEF) || 0;
    if(st.cleanSheet) r += 0.08 + dw*0.80;
    else r -= clamp(oppGoals, 0, 4) * dw * 0.15;
  }

  /* team context, lightly */
  r += teamGoals > oppGoals ? 0.18 : (teamGoals < oppGoals ? -0.14 : 0.02);
  r += clamp((oppRep - club(S.club).rep)/60, -0.18, 0.22);

  /* a cameo cannot swing to the extremes */
  var w = clamp(mins/70, 0.34, 1);
  r = 6.15 + (r - 6.15) * w;

  /* Both ends of the scale are compressed, the way published ratings are:
     a hat-trick is a 9, four goals is not a 12, and one bad afternoon is
     a 4.9 rather than a 3.1. Tens exist — they are just very expensive. */
  if(r > 7.6) r = 7.6 + (r - 7.6) * 0.70;
  if(r > 8.4) r = 8.4 + (r - 8.4) * 0.55;
  if(r < 5.6) r = 5.6 - (5.6 - r) * 0.70;

  return clamp(r, 3.0, 10);
}

/* minutes YOU have played, which is not the same as the clock — a
   substitute must be judged against a substitute's share of the match */
function minutesPlayed(){
  if(!M || !M.playing) return 0;
  if(M.min >= 90) return M.mins;
  return clamp(M.min - (M.entryMin || 0), 0, 90);
}

function liveRating(){
  if(!M || !M.playing) return 0;
  var myG = M.me===M.home ? M.hg : M.ag;
  var opG = M.me===M.home ? M.ag : M.hg;
  if(M.noise === undefined) M.noise = (rnd()-0.5) * 0.20;
  return clamp(ratingFrom(M.st, Math.max(minutesPlayed(), 10), S.pos, myG, opG, M.opp.rep) + M.noise, 3.0, 10);
}

/* the stat line, grouped the way a match report groups it */
var STAT_GROUPS = [
  {n:"התקפה", keys:[["goals","שערים"],["assists","בישולים"],["shots","בעיטות"],
    ["shotOnTarget","למסגרת"],["bigChanceMissed","החמצות גדולות"],["penaltyWon","פנדלים שהושגו"]]},
  {n:"יצירה", keys:[["keyPass","מסירות מפתח"],["bigChanceCreated","מצבים גדולים שנוצרו"],
    ["passCompleted","מסירות שהגיעו"],["passFailed","מסירות שאבדו"]]},
  {n:"נשיאת כדור", keys:[["dribbleWon","דריבלים מוצלחים"],["dribbleLost","דריבלים שנכשלו"],
    ["fouled","עבירות שספגת"],["possessionLost","איבודי כדור"]]},
  {n:"הגנה", keys:[["tackle","תיקולים"],["interception","יירוטים"],["clearance","הרחקות"],
    ["block","חסימות"],["recovery","כדורים שנאספו"],["duelWon","דו־קרבות שנוצחו"],
    ["duelLost","דו־קרבות שאבדו"],["aerialWon","ניצחונות אוויריים"],["aerialLost","הפסדים אוויריים"]]},
  {n:"שוער", keys:[["save","הצלות"],["bigSave","הצלות גדולות"],["goalConceded","ספג"],["cleanSheet","שער נקי"]]},
  {n:"משמעת", keys:[["foul","עבירות"],["yellow","צהובים"],["red","אדומים"],["error","טעויות שהובילו לשער"]]}
];

var STAT_NAME = (function(){
  var m = {};
  for(var i=0;i<STAT_GROUPS.length;i++)
    for(var j=0;j<STAT_GROUPS[i].keys.length;j++)
      m[STAT_GROUPS[i].keys[j][0]] = STAT_GROUPS[i].keys[j][1];
  m.possessionLost = "איבודי כדור"; m.shotOffTarget = "בעיטות שהחטיאו";
  m.ownGoal = "שער עצמי"; m.penaltyMissed = "פנדל שהוחמץ";
  m.bigChanceCreated = "מצבים גדולים שנוצרו"; m.passes = "מסירות";
  return m;
})();

/* the same arithmetic the rating used, opened up so you can read it —
   this is the part the published ratings never show you */
function ratingBreakdown(st, pos){
  var mult = RATE_POS[pos] || RATE_POS.CM, out = [];
  for(var k in RW){
    var n = st[k] || 0; if(!n) continue;
    var g = RW_GROUP[k] || "neu";
    var m = g === "gk" ? (mult.gk || 0) : (mult[g] === undefined ? 1 : mult[g]);
    if(RW[k] < 0 && g !== "gk") m = 1;
    var d = RW[k] * n * m;
    if(Math.abs(d) < 0.03) continue;
    out.push({k:k, n:n, d:d, name:(STAT_NAME[k] || k), boost:(m > 1.05)});
  }
  out.sort(function(a,b){ return Math.abs(b.d) - Math.abs(a.d); });
  return out;
}

function statLineHtml(st, pos){
  var groups = STAT_GROUPS.map(function(g){
    var rows = g.keys.filter(function(kk){ return (st[kk[0]]||0) !== 0; });
    if(!rows.length) return "";
    return '<div class="statgrp"><p class="lbl">'+g.n+'</p>'
      + rows.map(function(kk){
          return '<div class="kv"><span>'+kk[1]+'</span><b class="n">'+(st[kk[0]]||0)+'</b></div>';
        }).join("")
      + '</div>';
  }).filter(Boolean).join("");

  var pa = st.passes ? Math.round((st.passCompleted/st.passes)*100) : 0;
  var head = '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px">'
    + '<span class="tag">'+(st.passes||0)+' מסירות</span>'
    + (st.passes ? '<span class="tag '+(pa>=85?"ok":(pa>=75?"":"w"))+'">'+pa+'% דיוק</span>' : '')
    + '<span class="tag">'+((st.duelWon||0)+(st.duelLost||0))+' דו־קרבות · '+(st.duelWon||0)+' נוצחו</span>'
    + (st.shots ? '<span class="tag">'+st.shots+' בעיטות</span>' : '')
    + '</div>';

  var bd = ratingBreakdown(st, pos);
  var max = bd.length ? Math.abs(bd[0].d) : 1;
  var bdHtml = bd.slice(0,9).map(function(b){
    var w = clamp(Math.abs(b.d)/max*50, 3, 50);
    var up = b.d > 0;
    return '<div class="bdrow">'
      + '<span class="bn">'+b.name+' <span class="muted">×'+b.n+'</span>'+(b.boost?' <span class="tag g" style="padding:1px 6px">נדיר בעמדה</span>':'')+'</span>'
      + '<span class="bt"><i class="'+(up?"":"dn")+'" style="'+(up?"left:50%":"right:50%;left:auto")+';width:'+w+'%"></i><span class="bdmid"></span></span>'
      + '<span class="bv '+(up?"up":"dn")+'">'+(up?"+":"−")+Math.abs(b.d).toFixed(2)+'</span>'
      + '</div>';
  }).join("");

  return '<div class="p"><h3>גיליון הביצועים</h3><div class="pb">'
    + head
    + (groups ? '<div class="statwrap">'+groups+'</div>' : '<div class="empty">אין נתונים.</div>')
    + '<p class="lbl" style="margin:16px 0 2px">מה הזיז את הציון</p>'
    + '<p class="muted xs" style="margin:0 0 8px">בסיס 6.0 · כל פעולה נשקלת לפי סוגה ולפי כמה היא חריגה לעמדה שלך</p>'
    + '<div class="bd">'+bdHtml+'</div>'
    + '</div></div>';
}

function closeMoment(){
  var el = document.getElementById("momentLayer");
  if(el) el.remove();
  MO = null;
  M.timer = setTimeout(tickMatch, 120);
}

/* ── finish ────────────────────────────────────────────────────── */
function finishMatch(){
  if(M.timer) clearTimeout(M.timer);
  stopPitch();
  M.running = false;

  if(M.playing && M.st){
    var conc = (M.me===M.home ? M.ag : M.hg);
    if(S.pos === "GK") M.st.goalConceded = conc;
    if(conc === 0 && M.mins >= 55) M.st.cleanSheet = 1;
  }

  var rating = M.playing ? liveRating() : 0;
  var fx = M.fx;
  fx.res = M.hg + "–" + M.ag;

  var myG = M.me===M.home ? M.hg : M.ag;
  var opG = M.me===M.home ? M.ag : M.hg;

  applyResult(S.club, M.fx.opp, myG, opG);
  awardGoals(S.league, S.club, myG); awardGoals(S.league, M.fx.opp, opG);
  simWorld(S.club);

  if(M.playing){
    S.apps++; S.careerApps++; S.minutes += M.mins; S.ratings.push(rating);
    if(rating > S.bestRating) S.bestRating = rating;
    S.streak = rating >= 7 ? S.streak + 1 : 0;
    if(S.streak > S.bestStreak) S.bestStreak = S.streak;
    var dTrust = (rating-6.6)*4.2 + (myG>opG?1.5:(myG<opG?-0.8:0.3));
    if(hasTrait("leader") && dTrust < 0) dTrust *= 0.6;
    dTrust += (coachFit()-55) * 0.05;
    S.trust = clamp(S.trust + dTrust, 0, 100);
    S.sharp = clamp(S.sharp + 9, 0, 100);
    S.load  = clamp(S.load + M.mins*(hasTrait("engine") ? 0.12 : 0.16), 0, 100);
    S.fit   = clamp(S.fit - M.mins*0.09, 20, 100);
    S.morale= clamp(S.morale + (myG>opG?7:(myG<opG?-4:1)) + (rating-6.6)*3, 0, 100);
  } else {
    S.trust = clamp(S.trust - 1.5, 0, 100);
    S.morale = clamp(S.morale - 4, 0, 100);
  }

  if(M.playing){
    S.matches.unshift({
      s:S.season, w:S.week, opp:M.opp.ab, oppN:M.opp.n, home:M.fx.home,
      res:(M.me===M.home ? M.hg+"–"+M.ag : M.ag+"–"+M.hg),
      mins:M.mins, r:Number(rating.toFixed(1)), g:M.gAdded||0, a:M.aAdded||0,
      st:M.st, comp:"ליגה"
    });
    if(S.matches.length > 60) S.matches.pop();
  }

  var scoutHit = false;
  if(M.playing && rating>=7.4 && rnd()<0.45){
    var pool = suitorPool();
    if(pool.length){
      var e = pool[ri(0,pool.length-1)];
      if(!S.interest.some(function(x){return x.id===e.id})){
        S.interest.push({id:e.id, n:e.n, ab:e.ab, c:e.c, lg:LEAGUES[e.lg].n, rep:e.rep, lvl:1});
        scoutHit = true;
      }
    }
  }

  /* ── rewards ─────────────────────────────────────────────────── */
  var ovrBefore = ovr();
  S.valuePrev = value();

  var xp = S.trainXp || 0;
  var xpRows = [];
  if(S.trainXp) xpRows.push({l:"אימוני השבוע", v:S.trainXp});

  var matchGains = [];
  if(M.playing){
    var mx = 40 + Math.round(M.mins*0.9) + Math.round(Math.max(0,(rating-6))*70);
    xpRows.push({l:M.mins+" דקות משחק", v:40 + Math.round(M.mins*0.9)});
    if(rating>6) xpRows.push({l:"ציון "+rating.toFixed(1), v:Math.round((rating-6)*70)});
    xp += mx;
    if(M.gAdded){ xp += M.gAdded*120; xpRows.push({l:M.gAdded+" שערים", v:M.gAdded*120}); }
    if(M.aAdded){ xp += M.aAdded*80;  xpRows.push({l:M.aAdded+" בישולים", v:M.aAdded*80}); }
    if(myG>opG){ xp += 60; xpRows.push({l:"ניצחון", v:60}); }
    if(S.streak>=3){ xp += 50*S.streak; xpRows.push({l:"רצף "+S.streak+" משחקים", v:50*S.streak}); }

    /* learning by doing: the attributes you actually leaned on this match */
    var used = POS[S.pos].key.slice(0, 3);
    matchGains = grow(used, 0.16 + Math.max(0, rating-6.5)*0.22);
  }

  (S.trainGains||[]).forEach(function(g){ matchGains.push(g); });

  var levels = addXp(xp);
  var ovrAfter = ovr();
  S.ovrPrev = ovrBefore;

  var badges = checkBadges();
  var newTraits = checkTraits();

  showPostMatch(rating, myG, opG, scoutHit, {
    xp:xp, rows:xpRows, levels:levels, gains:matchGains,
    ovrBefore:ovrBefore, ovrAfter:ovrAfter, badges:badges, traits:newTraits
  });
  S.trainXp = 0; S.trainGains = [];
}

function applyResult(a, b, ga, gb){
  var T = S.tables[CLUBS[a].lg];
  var ta = T[a], tb = T[b];
  ta.p++; tb.p++; ta.gf+=ga; ta.ga+=gb; tb.gf+=gb; tb.ga+=ga;
  if(ga>gb){ta.w++;tb.l++;ta.pts+=3}
  else if(ga<gb){tb.w++;ta.l++;tb.pts+=3}
  else {ta.d++;tb.d++;ta.pts++;tb.pts++}
}

/* one matchday across every modelled league */
function simWorld(skipId){
  LG_IDS.forEach(function(lid){
    var pool = LEAGUES[lid].clubs.filter(function(c){
      return c.id !== skipId && c.id !== (S.fixtures[S.week-1]||{}).opp;
    }).map(function(c){ return c.id; });
    for(var i=pool.length-1;i>0;i--){ var j=ri(0,i); var tmp=pool[i]; pool[i]=pool[j]; pool[j]=tmp; }
    for(var k=0;k+1<pool.length;k+=2){
      var A = club(pool[k]), B = club(pool[k+1]);
      var sa = A.rep + ri(0,16), sb = B.rep + ri(0,16);
      var ga = clamp(Math.round((sa-sb)/17 + ri(0,2)), 0, 5);
      var gb = clamp(Math.round((sb-sa)/17 + ri(0,2)), 0, 5);
      applyResult(A.id, B.id, ga, gb);
      awardGoals(lid, A.id, ga); awardGoals(lid, B.id, gb);
    }
  });
  advanceRivals();
  makeNews();
}

function awardGoals(lid, clubId, n){
  if(!n) return;
  var list = S.scorers[lid].filter(function(s){ return s.club === clubId; });
  if(!list.length){
    var s = {n:playerName(), club:clubId, g:0};
    S.scorers[lid].push(s); list = [s];
  }
  for(var i=0;i<n;i++) list[ri(0,list.length-1)].g++;
}

function advanceRivals(){
  S.rivals.forEach(function(r){
    if(rnd() < 0.30 && r.ovr < r.pot) r.ovr += 1;
  });
}

var NEWS_T = [
  function(){ var l = LEAGUES[pickLg()]; var c = topOf(l.id);
    return {t:"⚽ "+c.n+" בראש "+l.n+".", k:""}; },
  function(){ var c = anyClub();
    return {t:"🔁 "+c.n+" פיטרו את המאמן אחרי רצף תוצאות רע.", k:"w"}; },
  function(){ var a = anyClub(), b = anyClub();
    if(a.id===b.id) return null;
    return {t:"💰 "+a.n+" רכשו קשר מ"+b.n+" תמורת "+money(ri(2,38)*1000000)+".", k:""}; },
  function(){ var l = LEAGUES[pickLg()]; var s = S.scorers[l.id].slice().sort(function(x,y){return y.g-x.g})[0];
    if(!s || s.g<3) return null;
    return {t:"🥇 "+s.n+" ("+club(s.club).ab+") מוביל את מלך השערים ב"+l.n+" עם "+s.g+".", k:""}; },
  function(){ var r = S.rivals[ri(0,S.rivals.length-1)];
    if(!r || r.ovr < ovr()) return null;
    return {t:"👀 "+r.n+" ("+club(r.club).ab+") מקבל דקות ועלה ל-OVR "+r.ovr+".", k:"w"}; },
  function(){ var c = anyClub();
    return {t:"🏟 "+c.n+" הודיעו על שדרוג האצטדיון.", k:""}; },
  function(){ var c = anyClub();
    return {t:"🩺 חלוץ "+c.n+" ייעדר 6 שבועות בעקבות פציעה.", k:"b"}; }
];
function pickLg(){ return LG_IDS[ri(0, LG_IDS.length-1)]; }
function anyClub(){ var l = LEAGUES[pickLg()]; return l.clubs[ri(0,l.clubs.length-1)]; }
function topOf(lid){
  var T = S.tables[lid];
  return LEAGUES[lid].clubs.slice().sort(function(a,b){
    return T[b.id].pts-T[a.id].pts || (T[b.id].gf-T[b.id].ga)-(T[a.id].gf-T[a.id].ga);
  })[0];
}
function makeNews(){
  for(var i=0;i<3;i++){
    var f = NEWS_T[ri(0,NEWS_T.length-1)];
    var item = f();
    if(item && !S.news.some(function(x){ return x.t === item.t; })){
      item.w = S.week; S.news.unshift(item);
    }
  }
  if(S.news.length > 60) S.news.length = 60;
}

function showPostMatch(rating, myG, opG, scoutHit, R){
  var res = myG>opG ? "ניצחון" : (myG<opG ? "הפסד" : "תיקו");
  var cls = rating>=7.4?"":(rating>=6.5?"g":(rating>=5.8?"w":"b"));
  var prevTrust = S.trust;
  R = R || {xp:0, rows:[], levels:0, gains:[], ovrBefore:ovr(), ovrAfter:ovr(), badges:[]};

  var gainHtml = R.gains.length
    ? R.gains.map(function(g){

function countXp(total){
  var el = document.getElementById("xpCount");
  var bar = document.getElementById("pmXp");
  if(!el) return;
  var t0 = performance.now(), dur = 1100;
  var startPct = parseFloat(bar.style.width) || 0;
  var endPct = clamp((S.xp/xpNeed(S.level))*100, 0, 100);
  (function step(now){
    var k = clamp((now-t0)/dur, 0, 1);
    var e = 1 - Math.pow(1-k, 3);
    el.textContent = "+" + Math.round(total*e);
    bar.style.width = (startPct + (endPct-startPct)*e) + "%";
    if(k < 1) requestAnimationFrame(step);
  })(t0);
}

function reportLine(r){
  if(r>=8.2) return "משחק שמזיזים בגללו קלסרים.";
  if(r>=7.4) return "משחק חזק. דוח התפקיד גבוה.";
  if(r>=6.6) return "עמדת בתפקיד. בלי זיקוקים, בלי טעויות.";
  if(r>=5.8) return "משחק חיוור. נשארת בתוך המערכת אבל לא השפעת.";
  return "ערב קשה. זה קורה, וזה גם תוכן.";

function coachLine(r, won){
  if(!M.playing) return "\"אני יודע שאתה רוצה לשחק. תראה לי את זה באימון ולא בשיחה.\"";
  if(r>=7.4) return won ? "\"זה בדיוק מה שביקשתי. תמשיך ככה ואתה בהרכב.\"" : "\"אתה לא הבעיה היום. תזכור את זה.\"";
  if(r>=6.6) return "\"סביר. עשית את העבודה, אבל אני צריך יותר בשליש האחרון.\"";
  if(r>=5.8) return "\"הייתי צריך יותר. תעבוד על החדות — זה נראה בכל מגע.\"";
  return "\"נדבר ביום שני. לא ככה.\"";

function nextWeek(){
  var el = document.getElementById("matchLayer"); if(el) el.remove();

  S.week++;
  S.picked = [];
  S.prep = {video:0, analyst:0, coach:0, unit:0, sp:0};
  S.coachWeeks++;

  S.money += S.wage;
  if(M && M.playing){
    S.money += Math.round(S.wage*0.10);                       // appearance
    S.money += (M.gAdded||0)*Math.round(S.wage*0.35) + (M.aAdded||0)*Math.round(S.wage*0.2);
  }

  runCupWeek();
  runEuroWeek();

/* ── cup: a tie every third week ────────────────────────────────── */
function runCupWeek(){
  if(!S.cup || S.cup.out || S.cup.won) return;
  if(S.week % 3 !== 0) return;
  var opp = anyClubIn(S.league);
  var edge = (club(S.club).rep - opp.rep)/26 + (avgRating()-6.5)*0.16 + 0.05;
  var win = rnd() < clamp(0.5 + edge, 0.16, 0.88);
  var label = CUP_ROUNDS[Math.min(S.cup.round, CUP_ROUNDS.length-1)];
  if(win){
    S.cup.round++;
    var scored = S.apps>0 && rnd()<0.3;
    if(scored){ S.goals++; S.careerGoals++; }
    push("🏆 " + S.cup.name + " · " + label + ": ניצחון על " + opp.n + (scored?" — ואתה כבשת.":"."), "ok");
    addXp(90);
    if(S.cup.round >= CUP_ROUNDS.length){
      S.cup.won = true;
      S.honours.push({s:S.season, t:"זכייה ב" + S.cup.name});
      confetti(120, ["#E8C766","#1F6F43","#FFFFFF"]);
      celebrate('<span class="ctag">תואר</span><div class="cbig" style="font-size:32px">🏆 '+S.cup.name+'</div>'
        + '<div class="csub">'+club(S.club).n+' אלופת הגביע</div>', "gold");
      addXp(400);
    }
  } else {
    S.cup.out = true;
    push("🏆 " + S.cup.name + " · " + label + ": הפסד ל" + opp.n + ". יצאתם מהגביע.", "b");
  }
}
/* ── Europe: qualification is earned, not given ─────────────────── */
var EURO_COMPS = {
  ucl:  {n:"ליגת האלופות",  short:"UCL",  prestige:100, xp:260, stages:["בתים","שמינית","רבע","חצי","גמר"]},
  uel:  {n:"הליגה האירופית", short:"UEL", prestige:72,  xp:170, stages:["בתים","שמינית","רבע","חצי","גמר"]},
  uecl: {n:"ליגת הקונפרנס",  short:"UECL",prestige:54,  xp:120, stages:["בתים","שמינית","רבע","חצי","גמר"]}
};

/* which European competition the club qualified for, from final position */
function euroSpotFor(place){
  var L = LEAGUES[S.league];
  var ucl = L.ucl || 0, uel = L.uel || 0, uecl = L.uecl || 0;
  if(place <= ucl) return "ucl";
  if(place <= ucl + uel) return "uel";
  if(place <= ucl + uel + uecl) return "uecl";
  return null;
}

function runEuroWeek(){
  if(!S.euro || S.euro.out || S.euro.won) return;
  if(S.week % 4 !== 0) return;
  var C = EURO_COMPS[S.euro.comp];
  var opp = anyEuroClub();
  var stage = C.stages[clamp(S.euro.stage, 0, C.stages.length-1)];

  /* European nights are harder than your league — that is the point */
  var edge = (club(S.club).rep - opp.rep)/30 + (avgRating()-6.6)*0.14 - 0.06;
  var pWin = clamp(0.5 + edge, 0.12, 0.85);
  var win = rnd() < pWin;

  S.load = clamp(S.load + 9, 0, 100);
  S.euro.apps = (S.euro.apps||0) + 1;

  /* the group phase is six matches, not sudden death — one bad night in
     Turin should not end a European campaign */
  if(S.euro.stage === 0){
    var draw = !win && rnd() < 0.3;
    S.euro.gp = (S.euro.gp||0) + (win ? 3 : (draw ? 1 : 0));
    S.euro.gm = (S.euro.gm||0) + 1;
    var gScored = S.apps > 0 && win && rnd() < 0.24;
    if(gScored){ S.goals++; S.careerGoals++; S.euro.goals = (S.euro.goals||0)+1; }
    S.euroRep = (S.euroRep||0) + (S.euro.comp === "ucl" ? 2 : 1);
    addXp(Math.round(C.xp * 0.6));
    push("🌍 " + C.n + " · מחזור בתים " + S.euro.gm + ": "
      + (win ? "ניצחון" : (draw ? "תיקו" : "הפסד")) + " מול " + opp.n
      + (gScored ? " — ואתה כבשת." : "") + " (" + S.euro.gp + " נק׳)",
      win ? "ok" : (draw ? "" : "b"));
    if(S.euro.gm >= 3){
      if(S.euro.gp >= 4){
        S.euro.stage = 1;
        push("🌍 עלית משלב הבתים ב" + C.n + " עם " + S.euro.gp + " נקודות.", "ok");
        addXp(C.xp);
        confetti(70, ["#4a3aa7","#E8C766","#FFFFFF"]);
      } else {
        S.euro.out = true;
        push("🌍 סיימתם שלישיים בבית עם " + S.euro.gp + " נקודות. נגמר באירופה.", "b");
      }
    }
    return;
  }

  if(win){
    S.euro.stage++;
    var scored = S.apps > 0 && rnd() < 0.26;
    if(scored){ S.goals++; S.careerGoals++; S.euro.goals = (S.euro.goals||0)+1; }
    push("🌍 " + C.n + " · " + stage + ": ניצחון על " + opp.n + (scored ? " — ואתה כבשת." : "."), "ok");
    addXp(C.xp);
    /* European minutes are the thing that unlocks the biggest moves */
    S.euroRep = (S.euroRep||0) + (S.euro.comp === "ucl" ? 4 : 2);
    if(S.euro.stage >= C.stages.length){
      S.euro.won = true;
      S.honours.push({s:S.season, t:"זכייה ב" + C.n});
      confetti(160, ["#E8C766","#4a3aa7","#FFFFFF"]);
      celebrate('<span class="ctag">תואר אירופי</span><div class="cbig" style="font-size:30px">🏆 '+C.n+'</div>'
        + '<div class="csub">'+club(S.club).n+'</div>', "gold");
      addXp(900);
    }
  } else {
    S.euro.out = true;
    push("🌍 " + C.n + " · " + stage + ": הפסד ל" + opp.n + ". נגמר באירופה השנה.", "b");
    addXp(Math.round(C.xp/2));
  }
}
function anyEuroClub(){
  var pool = [];
  LG_IDS.forEach(function(lid){
    if(LEAGUES[lid].tier !== 1) return;
    LEAGUES[lid].clubs.forEach(function(c){ if(c.id !== S.club && c.rep >= 60) pool.push(c); });
  });
  if(!pool.length) return anyClubIn(S.league);
  return pool[ri(0, pool.length-1)];
}

function anyClubIn(lid){
  var pool = LEAGUES[lid].clubs.filter(function(c){ return c.id !== S.club; });
  return pool[ri(0, pool.length-1)];
}

/* ── the manager can be sacked, and the new one may not rate you ── */
function runCoachMarket(){
  if(S.coachWeeks < 5) return;
  var T = S.tables[S.league][S.club];
  var ppg = T.p ? T.pts/T.p : 1.4;
  var risk = ppg < 0.9 ? 0.22 : (ppg < 1.3 ? 0.08 : 0.02);
  if(rnd() > risk) return;

  var old = S.coach.n;
  S.coach = newCoach();
  S.coachWeeks = 0;
  var fit = coachFit();
  var delta = clamp((fit - 55) * 0.6, -22, 18);
  S.trust = clamp(50 + delta, 8, 92);
  push("🔁 " + old + " פוטר. " + S.coach.n + " נכנס — " + S.coach.styleName + ".",
       delta >= 0 ? "ok" : "b");
  push(delta >= 0
    ? "המאמן החדש אוהב את הפרופיל שלך. אתה מתחיל מנקודה טובה."
    : "השיטה החדשה לא מתאימה לך. תצטרך להוכיח את עצמך מחדש.", delta >= 0 ? "ok" : "w");
  celebrate('<span class="ctag">מאמן חדש</span>'
    + '<div class="cbig" style="font-size:26px">'+S.coach.n+'</div>'
    + '<div class="csub">'+S.coach.styleName+' · התאמה '+fit+'</div>',
    delta >= 0 ? "green" : "gold");
}

/* ── national team ──────────────────────────────────────────────── */
function runNationalTeam(){
  if(S.age < 18) return;
  if(S.week % 5 !== 0) return;
  var score = ovr() + (avgRating()-6.5)*12 + Math.min(20, S.minutes/40) + (S.natCaps?6:0);
  var bar = 62 + S.season*1.5;
  if(!S.natCalled && score >= bar){
    S.natCalled = true;
    push("🇮🇱 זומנת לנבחרת ישראל בפעם הראשונה.", "ok");
    confetti(80, ["#0A3A7A","#FFFFFF","#1F6F43"]);
    celebrate('<span class="ctag">זימון לנבחרת</span><div class="cbig" style="font-size:30px">🇮🇱 נבחרת ישראל</div>'
      + '<div class="csub">הבכורה שלך בדרך</div>', "green");
    addXp(320);
    return;
  }
  if(S.natCalled && score >= bar - 6){
    S.natCaps++;
    var g = rnd() < clamp((grpVal("SHO")-45)/160, 0.03, 0.34) ? 1 : 0;
    S.natGoals += g;
    S.load = clamp(S.load + 12, 0, 100);
    addXp(120 + g*160);
    push("🇮🇱 משחק נבחרת (" + S.natCaps + " הופעות)" + (g ? " — ואתה כבשת!" : "."), g ? "ok" : "");
    if(g) confetti(50, ["#0A3A7A","#FFFFFF"]);
  } else if(S.natCalled && score < bar - 14){
    S.natCalled = false;
    push("🇮🇱 לא נכללת בסגל הנבחרת הפעם.", "w");
  }
}

/* ── end-of-season awards ──────────────────────────────────────── */
function seasonAwards(place){
  var out = [];
  var board = S.rivals.concat([{n:S.name, ovr:ovr(), me:true}]);
  board.sort(function(a,b){ return b.ovr-a.ovr; });
  if(board[0] && board[0].me && S.age <= 23) out.push({t:"שחקן צעיר של העונה", d:LEAGUES[S.league].n});
  var top = S.scorers[S.league].slice().sort(function(a,b){return b.g-a.g})[0];
  if(S.goals > (top ? top.g : 999)) out.push({t:"מלך השערים", d:S.goals + " שערים"});
  if(avgRating() >= 7.4 && S.apps >= 8) out.push({t:"סגל העונה", d:"ציון ממוצע " + avgRating().toFixed(2)});
  if(place === 1) out.push({t:"אליפות " + LEAGUES[S.league].n, d:club(S.club).n});
  else if(place <= 3) out.push({t:"מקום " + place + " בליגה", d:club(S.club).n});
  if(S.cup && S.cup.won) out.push({t:"זכייה ב" + S.cup.name, d:club(S.club).n});
  out.forEach(function(a){ S.honours.push({s:S.season, t:a.t}); });
  return out;
}

   THE SHOP — wages come in weekly, and money buys real edges
   ════════════════════════════════════════════════════════════════ */
var SHOP = [
  {id:"drink", i:"🥤", n:"משקה אנרגיה", d:"‎−18 עומס, ‎+8 חדות. מיידי.", cost:6, once:false,
   run:function(){ S.load = clamp(S.load-18,0,100); S.sharp = clamp(S.sharp+8,0,100); }},
  {id:"physio", i:"💆", n:"פיזיו פרטי", d:"‎−26 עומס, ‎+14 כשירות.", cost:14, once:false,
   run:function(){ S.load = clamp(S.load-26,0,100); S.fit = clamp(S.fit+14,20,100); }},
  {id:"chef", i:"🥗", n:"שף אישי", d:"קבוע: ‎+4 להתאוששות השבועית.", cost:55, once:true,
   run:function(){ S.a.sta = clamp(S.a.sta+3,1,99); }},
  {id:"boots", i:"👟", n:"נעליים מותאמות", d:"קבוע: אזור מתוק ‎+6%.", cost:48, once:true,
   run:function(){ S.perkBoots = true; }},
  {id:"camp", i:"🏕", n:"מחנה אימון פרטי", d:"‎+2 לכל תכונת מפתח בעמדה.", cost:70, once:false,
   run:function(){ grow(POS[S.pos].key, 2.2); }},
  {id:"psych", i:"🧠", n:"פסיכולוג ספורט", d:"קבוע: ‎+1.0 שניות לזמן הקריאה.", cost:60, once:true,
   run:function(){ S.perkPsych = true; }},
  {id:"analyst", i:"📊", n:"אנליסט פרטי", d:"קבוע: מודיעין וידאו בכל משחק.", cost:80, once:true,
   run:function(){ S.perkAnalyst = true; }}
];
function buyItem(id){
  var it = SHOP.filter(function(x){return x.id===id})[0];
  if(!it || S.money < it.cost) return;
  if(it.once && S.shopUsed[id]) return;
  S.money -= it.cost;
  if(it.once) S.shopUsed[id] = true;
  it.run();
  saveGame(); render();
  toast(it.i + " " + it.n + " נרכש · נותרו ₪" + Math.round(S.money) + "k");
}

/* ── contract renewal ──────────────────────────────────────────── */
function renewalOffer(){
  if(S.contractYears > 1) return null;
  return {
    wage: Math.max(S.wage + 1, Math.round(S.wage * (1 + (ovr()-50)/26) + ri(2,8))),
    years: ri(3,5),
    role: S.trust >= 66 ? "שחקן מפתח" : (S.trust >= 46 ? "מסובב ראשון" : "רוטציה")
  };
}
function acceptRenewal(){
  var r = S.pendingRenewal; if(!r) return;
  S.wage = r.wage; S.contractYears = r.years; S.status = r.role;
  S.pendingRenewal = null;
  S.honours.push({s:S.season, t:"חידש חוזה ב" + club(S.club).n});
  push("חתמת על חוזה חדש: ₪" + r.wage + "k לשבוע, " + r.years + " שנים, " + r.role + ".", "ok");
  saveGame(); render();
  celebrate('<span class="ctag">חוזה חדש</span><div class="cbig" style="font-size:30px">₪'+r.wage+'k</div>'
    + '<div class="csub">'+r.years+' שנים · '+r.role+'</div>', "green");
}
function rejectRenewal(){
  S.pendingRenewal = null;
  push("דחית את הצעת החידוש. החוזה שלך נגמר — והשוק יודע את זה.", "w");
  saveGame(); render();
}

function endSeason(){
  var T = S.tables[S.league];
  var rows = LEAGUES[S.league].clubs.map(function(c){ return {c:c, t:T[c.id]}; })
    .sort(function(a,b){ return b.t.pts-a.t.pts || (b.t.gf-b.t.ga)-(a.t.gf-a.t.ga); });
  var place = rows.findIndex(function(r){return r.c.id===S.club}) + 1;
  var awards = seasonAwards(place);
  S.pendingRenewal = renewalOffer();
  var euroSpot = euroSpotFor(place);

  var el = document.createElement("div");
  el.className = "match"; el.id = "matchLayer";
  el.innerHTML = '<div class="scorebug"><div class="sbteam"><div class="sbmini" style="background:'+club(S.club).c+';color:'+club(S.club).t+'">'+club(S.club).ab+'</div><b>סיכום עונה '+S.season+'</b></div></div>'
  + '<div style="flex:1;overflow-y:auto;padding:20px;display:flex;justify-content:center">'
  + '<div style="width:min(760px,100%);display:flex;flex-direction:column;gap:14px">'
  + '<div class="p"><h3>העונה שלך</h3><div class="pb">'
    + '<div class="ratebig"><div class="num">'+avgRating().toFixed(1)+'</div><div style="flex:1">'
    + '<div style="font-size:18px;font-weight:900">'+S.name+' · גיל '+S.age+'</div>'
    + '<div style="color:var(--ink3);font-size:13px;margin-top:3px">'+club(S.club).n+' סיימו במקום '+place+'</div>'
    + '<div style="display:flex;gap:7px;margin-top:10px;flex-wrap:wrap">'
    + '<span class="tag">'+S.apps+' הופעות</span><span class="tag">'+S.minutes+' דקות</span>'
    + '<span class="tag g">'+S.goals+' שערים</span><span class="tag g">'+S.assists+' בישולים</span>'
    + '<span class="tag '+(S.trust>=55?"ok":"w")+'">אמון '+Math.round(S.trust)+'</span>'
    + '<span class="tag">OVR '+ovr()+'</span><span class="tag g">'+money(value())+'</span></div>'
    + '</div></div>'
    + (euroSpot ? '<div class="tpline" style="margin-top:12px">🌍 העפלתם ל'+EURO_COMPS[euroSpot].n+' לעונה הבאה</div>' : '')
    + '<p class="hint" style="margin:13px 0 0">'+seasonVerdict(place)+'</p>'
  + '</div></div>'
  + (awards.length ? '<div class="p" style="border-color:var(--gold)"><h3>🏅 פרסי העונה</h3><div class="pb">'
      + awards.map(function(a){
          return '<div class="awardrow"><span>🏅</span><div><b>'+a.t+'</b><span>'+a.d+'</span></div></div>';
        }).join("") + '</div></div>' : '')
  + '<div class="p"><h3>מי מסתכל</h3><div class="pb">'
    + (S.interest.length ? S.interest.map(function(x){
        return '<div class="kv"><span><span class="sw" style="background:'+x.c+'"></span><b><bdi>'+x.n+'</bdi></b> · <bdi>'+x.lg+'</bdi></span>'
          + '<span class="tag '+["","","w","ok"][x.lvl]+'">'+["","בירור","סקאוט","הצעה"][x.lvl]+'</span></div>';
      }).join("") : '<div class="empty">אף אחד. עונה נוספת.</div>')
  + '</div></div>'
  + '<button class="btn pri big" id="nsBtn" style="align-self:flex-start">לעונה הבאה ▸</button>'
  + '</div></div>';
  document.body.appendChild(el);

  if(awards.length){
    confetti(130, ["#E8C766","#1F6F43","#FFFFFF"]);
    setTimeout(function(){
      celebrate('<span class="ctag">פרס עונה</span><div class="cbig" style="font-size:30px">🏅 '+awards[0].t+'</div>'
        + '<div class="csub">'+awards[0].d+'</div>', "gold");
    }, 400);
  }

  document.getElementById("nsBtn").onclick = function(){
    el.remove();
    S.season++; S.age++; S.week=1; S.apps=0; S.minutes=0; S.goals=0; S.assists=0;
    S.lastSeasonRating = S.ratings.length ? avgRating() : (S.lastSeasonRating || 6.6);
    S.ratings=[]; S.picked=[]; S.inbox=[]; S.seen=0;
    /* off-season development: driven by minutes played, capped by potential.
       After 30 the physical attributes start going the other way. */
    var devKeys = Object.keys(ATTR).filter(function(k){ return S.a[k] > 25; });
    var mins = S.minutes;
    grow(devKeys, 0.5 + clamp(mins/1200, 0, 1.6));
    if(S.age >= 30){
      ["acc","spd","sta","jmp","agi"].forEach(function(k){
        if(S.a[k]) S.a[k] = clamp(S.a[k] - (1 + (S.age-30)*0.45), 1, 99);
      });
    }
    S.tp += 3;
    S.fit=88; S.sharp=45; S.load=15;
    S.contractYears=Math.max(0,S.contractYears-1);
    if(S.trust>62){ S.status="מסובב ראשון"; S.wage+=ri(2,5); }
    S.squad.forEach(function(pl){ pl.age++; pl.inj=0;
      pl.ovr = clamp(pl.ovr + (pl.age<24?ri(0,3):(pl.age>30?ri(-3,0):ri(-1,1))), 30, 94); });
    S.rivals.forEach(function(r){ r.age++; });
    resetWorld();
    S.fixtures = buildFixtures(S.club);
    S.cup = newCup();
    S.euro = euroSpot ? {comp:euroSpot, stage:0, out:false, won:false, apps:0, goals:0} : null;
    if(S.euro){
      push("🌍 העונה תשחקו ב" + EURO_COMPS[euroSpot].n + ".", "ok");
    }
    push("עונה חדשה. הכל מתאפס חוץ ממה שאנשים זוכרים.", "");
    if(openTransferWindow()){
      S.screen="career"; render();
      toast("חלון ההעברות נפתח — " + S.offers.length + " הצעות");
    } else { S.screen="hub"; render(); }
    saveGame();
  };
}

function seasonVerdict(place){
  if(S.apps===0) return "עונה בלי דקות. זה לא סוף — זו סיבה להחליט: להילחם, לבקש השאלה, או לשנות עמדה.";
  if(avgRating()>=7.2) return "עונה שמשנה תיקי גיוס. הבעיה הבאה שלך תהיה לבחור נכון, לא להיבחר.";
  if(S.apps<6) return "מעט דקות ומדגם קטן. סקאוטים לא מוחקים אותך — הם פשוט עוד לא ראו מספיק.";
  return "עונה שנבנתה על עקביות. זה איך שרוב הקריירות באמת מתקדמות.";
}

/* ══════════════════════════════════════════════════════════════════
   SAVE / LOAD — one slot, written after every week
   ════════════════════════════════════════════════════════════════ */
var SAVE_KEY = "onecareer.save.v1";
function saveGame(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e){}
}
function hasSave(){
  try { return !!localStorage.getItem(SAVE_KEY); } catch(e){ return false; }
}
function loadGame(){
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    var s = JSON.parse(raw);
    if(!s || !s.a || !s.pos) return false;
    /* forward-compat: fill anything a newer build expects */
    if(!s.traits) s.traits = [];
    if(!s.slCd) s.slCd = {};
    if(!s.slEchoes) s.slEchoes = [];
    if(!s.promises) s.promises = [];
    if(s.money === undefined) s.money = 14;
    if(!s.shopUsed) s.shopUsed = {};
    if(!s.matches) s.matches = [];
    s.board = null;
    if(s.euro === undefined) s.euro = null;
    if(s.squad && s.squad.length && !s.squad[0].rel){
      s.squad.forEach(function(pl,i){
        pl.id = pl.id || ("p"+i); pl.rel = {trust:45,respect:42,personal:42}; pl.role = pl.role||""; pl.mem = pl.mem||[];
      });
    }
    if(!s.honours) s.honours = [];
    if(!s.news) s.news = [];
    if(!s.offers) s.offers = [];
    if(!s.coach) { S = s; s.coach = newCoach(); }
    if(s.natCaps === undefined){ s.natCaps = 0; s.natGoals = 0; s.natCalled = false; }
    S = s;
    if(!S.cup) S.cup = newCup();
    return true;
  } catch(e){ return false; }
}
function wipeSave(){ try { localStorage.removeItem(SAVE_KEY); } catch(e){} }

/* ══════════════════════════════════════════════════════════════════
   JUICE — confetti, goal flash, screen shake
   ════════════════════════════════════════════════════════════════ */
var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function confetti(n, colors){
  if(reduceMotion) return;
  var cv = document.createElement("canvas");
  cv.className = "fxcanvas";
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  document.body.appendChild(cv);
  var ctx = cv.getContext("2d");
  var cols = colors || ["#1F6F43","#E8C766","#E4574B","#4FA97A","#FFFFFF"];
  var ps = [];
  for(var i=0;i<n;i++){
    ps.push({
      x: cv.width*(0.3+Math.random()*0.4), y: cv.height*0.42,
      vx: (Math.random()-0.5)*13, vy: -7-Math.random()*11,
      s: 4+Math.random()*7, r: Math.random()*Math.PI,
      vr: (Math.random()-0.5)*0.34, c: cols[Math.floor(Math.random()*cols.length)],
      life: 1
    });
  }
  var t0 = performance.now();
  (function step(now){
    var el = now - t0;
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var i=0;i<ps.length;i++){
      var p = ps[i];
      p.vy += 0.36; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      p.life = Math.max(0, 1 - el/2100);
      ctx.save(); ctx.globalAlpha = p.life;
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s/2, -p.s/2, p.s, p.s*0.62);
      ctx.restore();
    }
    if(el < 2200) requestAnimationFrame(step);
    else cv.remove();
  })(t0);
}

function goalFlash(mine){
  var el = document.createElement("div");
  el.className = "goalflash " + (mine ? "mine" : "them");
  el.innerHTML = '<b>' + (mine ? "GOAL!" : "שער") + '</b>';
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, mine ? 1500 : 900);
  if(mine){
    confetti(90);
    shake();
  }
}

function shake(){
  if(reduceMotion) return;
  var a = document.getElementById("matchLayer") || document.getElementById("app");
  if(!a) return;
  a.classList.remove("shake"); void a.offsetWidth; a.classList.add("shake");
  setTimeout(function(){ a.classList.remove("shake"); }, 480);
}

function toast(msg){
  var t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2600);
}

/* ══════════════════════════════════════════════════════════════════
   BOOT — character creation
   ════════════════════════════════════════════════════════════════ */
var boot = {name:"", pos:"CM", start:"isr1_itb"};

function showBoot(){
  var el = document.createElement("div");
  el.className = "boot"; el.id = "bootLayer";
  el.setAttribute("dir","rtl");
  el.innerHTML = ''
  + '<div class="bootcard">'
  + '<div class="boothd"><h1>ONE <span>CAREER</span></h1>'
  + '<p>שחקן אחד. מהאקדמיה עד הפרישה. אתה לא מנהל את הקבוצה — אתה נאבק על דקות, קורא מאמן, ומחליט מה לעשות ברגע שהכדור מגיע אליך.</p></div>'
  + '<div class="bootbd">'
    + (hasSave() ? '<button class="btn pri big" id="bCont">המשך קריירה שמורה ▸</button>'
        + '<div class="bootsep"><span>או התחל חדשה</span></div>' : '')
    + '<div class="field"><span class="lbl">שם השחקן</span>'
      + '<input id="bName" maxlength="22" placeholder="למשל: יונתן אשל" value="">'
    + '</div>'
    + '<div class="field"><span class="lbl">עמדה</span><div class="opts" id="bPos">'
      + POS_ORDER.map(function(k){
          return '<button class="opt posopt'+(k===boot.pos?" on":"")+'" data-pos="'+k+'">'
            + '<b>'+k+'</b><span>'+POS[k].n+'</span></button>';
        }).join("")
    + '</div></div>'
    + '<div class="field"><span class="lbl">נקודת פתיחה</span><div class="opts" id="bStart">'
      + STARTS.map(function(s){
          var c = club(s.id);
          return '<button class="opt'+(s.id===boot.start?" on":"")+'" data-start="'+s.id+'">'
            + '<b><span class="sw" style="background:'+c.c+'"></span>'+s.nm+'</b>'
            + '<span>'+s.d+'<br><b style="color:var(--ink2)">קושי: '+s.diff+'</b></span></button>';
        }).join("")
    + '</div></div>'
    + '<button class="btn pri big" id="bGo">התחל קריירה ▸</button>'
  + '</div></div>';
  document.body.appendChild(el);

  el.querySelectorAll("[data-pos]").forEach(function(b){
    b.onclick = function(){
      boot.pos = b.getAttribute("data-pos");
      el.querySelectorAll("[data-pos]").forEach(function(x){x.classList.remove("on")});
      b.classList.add("on");
    };
  });
  el.querySelectorAll("[data-start]").forEach(function(b){
    b.onclick = function(){
      boot.start = b.getAttribute("data-start");
      el.querySelectorAll("[data-start]").forEach(function(x){x.classList.remove("on")});
      b.classList.add("on");
    };
  });
  var cont = document.getElementById("bCont");
  if(cont) cont.onclick = function(){
    if(loadGame()){
      el.remove();
      S.screen = "hub";
      render();
      toast("נטענה קריירה — עונה " + S.season + ", מחזור " + S.week);
    } else {
      toast("השמירה פגומה. מתחילים חדש.");
      wipeSave();
      cont.remove();
    }
  };

  document.getElementById("bGo").onclick = function(){
    var nm = document.getElementById("bName").value.trim() || "יונתן אשל";
    wipeSave();
    S = newState(nm, boot.pos, boot.start);
    push("חתמת בחוזה נוער. עכשיו צריך שמישהו ישים לב.", "");
    push("המאמן: " + S.coach.n + " — " + S.coach.styleDesc + ".", "");
    saveGame();
    el.remove();
    render();
  };
}

showBoot();
</script>
