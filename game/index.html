        '<rect x="-15" y="-31" width="30" height="13" rx="4" fill="#2A3B4E"/>' +
      '</g>' +
      '<g fill="#E8C766" opacity=".8"><circle cx="'+(W*0.18)+'" cy="34" r="5"/>' +
      '<circle cx="'+(W*0.84)+'" cy="24" r="5"/><circle cx="'+(W*0.32)+'" cy="14" r="4"/>' +
      '<circle cx="'+(W*0.72)+'" cy="48" r="4"/></g>' +
      '</svg>';
  };

  /* A LEAGUE TABLE WANTS THE PITCH FROM ABOVE */
  A.pitch = function(c, c2, W){
    var k = esc(c);
    return head(W) + stripes(W, 0, H, GA, GB) +
      '<rect width="'+W+'" height="'+H+'" fill="'+mul(k,.85)+'" opacity=".26"/>' +
      '<g stroke="#FFFFFF" stroke-opacity=".45" fill="none" stroke-width="2">' +
      '<rect x="12" y="8" width="'+(W-24)+'" height="92" rx="2"/>' +
      '<line x1="'+(W/2)+'" y1="8" x2="'+(W/2)+'" y2="100"/><circle cx="'+(W/2)+'" cy="54" r="24"/>' +
      '<rect x="12" y="26" width="46" height="56"/><rect x="'+(W-58)+'" y="26" width="46" height="56"/>' +
      '</g><circle cx="'+(W/2)+'" cy="54" r="4" fill="#fff" fill-opacity=".7"/>' +
      '</svg>';
  };

  /* A FACE FOR A CARD — deterministic from the name, so the same player
     wears the same face everywhere he appears in the game. */
  A.face = function(name, kit, size){
    var r = streamFrom(hashOf(String(name||"x")));
    var skin = ["#F0C27A","#E0A96D","#C68642","#8D5524","#FFE0BD"][Math.floor(r()*5)];
    var hair = ["#2A2620","#4A3323","#8C6239","#1B1B1B","#B08245","#5A5A5A"][Math.floor(r()*6)];
    var s = size || 64, style = r();
    return '<svg class="artface" viewBox="0 0 64 64" width="'+s+'" height="'+s+'" aria-hidden="true">'
      + '<circle cx="32" cy="32" r="32" fill="'+(kit||"#1F6F43")+'" opacity=".18"/>'
      + '<path d="M10,64 q6,-20 22,-20 q16,0 22,20 z" fill="'+(kit||"#1F6F43")+'"/>'
      + '<circle cx="32" cy="28" r="15" fill="'+skin+'"/>'
      + (style < 0.32
          ? '<path d="M17,26 q3,-16 15,-16 q12,0 15,16 q-6,-8 -15,-8 q-9,0 -15,8 z" fill="'+hair+'"/>'
          : style < 0.62
            ? '<path d="M17,27 q0,-17 15,-17 q15,0 15,17 q-4,-4 -6,-9 q-9,5 -24,3 z" fill="'+hair+'"/>'
            : style < 0.85
              ? '<path d="M18,24 q4,-14 14,-14 q10,0 14,14 q-14,-6 -28,0 z" fill="'+hair+'"/>'
              : '')
      + '<circle cx="26" cy="30" r="1.9" fill="#2A2620"/><circle cx="38" cy="30" r="1.9" fill="#2A2620"/>'
      + '<path d="M27,38 q5,4 10,0" stroke="#2A2620" stroke-width="1.6" fill="none" stroke-linecap="round"/>'
      + '</svg>';
  };

  A.get = function(key, c, c2, W){
    var f = A[key];
    if(!f) return "";
    return f(c, c2, clamp(Math.round(W || 400), 260, 1800));
  };
  return A;
})();

/* Paints the artwork band into every panel that asked for one. Panels
   declare their picture with data-art="stadium" and nothing else — the
   band, the scrim and the club colours are added here at render time so
   the view functions stay pure string builders. */
function paintArt(root){
  if(!root || !window.ART) return;
  var me = (typeof S !== "undefined" && S && S.club) ? club(S.club) : null;
  var c1 = (me && me.c) || "#1F6F43";
  var c2 = (me && me.t) || "#FFFFFF";
  var list = root.querySelectorAll("[data-art]");
  Array.prototype.forEach.call(list, function(el){
    var band = el.firstChild;
    if(!band || band.className !== "artband"){
      band = document.createElement("div");
      band.className = "artband";
      el.insertBefore(band, el.firstChild);
      el.classList.add("hasart");
    }
    /* the scene is drawn to the band it actually has to fill, so a
       full-width card gets a wide scene rather than a cropped one — which
       is why this runs after the packer has decided the column widths */
    var w = band.clientWidth || el.clientWidth || 400;
    var h = band.clientHeight || 78;
    if(Math.abs(w - (+el.getAttribute("data-art-w") || 0)) < 8) return;
    el.setAttribute("data-art-w", w);
    var svg = "";
    try {
      svg = ART.get(el.getAttribute("data-art"),
                    el.getAttribute("data-art-c")  || c1,
                    el.getAttribute("data-art-c2") || c2,
                    108 * w / h);
    } catch(e){ svg = ""; }
    if(!svg){ el.removeChild(band); el.classList.remove("hasart"); el.removeAttribute("data-art-w"); return; }
    band.innerHTML = svg;
  });
}

/* ══════════════════════════════════════════════════════════════════
   NAVIGATION — the FIFA career shape: six categories across the top,
   the sections of the active category down the side, one focused board
   in the middle. Every panel in the game declares where it lives with
   data-panel="category/section", so the menu is the source of truth and
   a panel can be moved by editing one attribute.
   ════════════════════════════════════════════════════════════════ */

    {id:"status",     n:"מעמד ומאמן"}
  ]},
  {id:"player", n:"השחקן", i:"◉", subs:[
    {id:"card",    n:"כרטיס שחקן"},
    {id:"attrs",   n:"פיתוח תכונות"},
    {id:"moves",   n:"מהלכי חתימה"},
    {id:"kpi",     n:"דוח תפקיד"},
    {id:"traits",  n:"תכונות והישגים"},
    {id:"matches", n:"המשחקים שלך"}
  ]},
  {id:"club", n:"המועדון", i:"▤", subs:[
    {id:"depth", n:"מעמד בסגל"},
    {id:"room",  n:"חדר הלבשה"},
    {id:"squad", n:"הסגל המלא"}
  ]},

    {id:"fixtures", n:"לוח משחקים"},
    {id:"scorers",  n:"מלך השערים"},
    {id:"talents",  n:"כישרונות"},

  ]},

    {id:"offers",   n:"הצעות ומו״מ"},
    {id:"interest", n:"מי מתעניין"},
    {id:"contract", n:"החוזה שלך"},
    {id:"search",   n:"מסד השחקנים"},
    {id:"watch",    n:"רשימת מעקב"}
  ]},
  {id:"life", n:"קריירה", i:"✦", subs:[
    {id:"history", n:"היסטוריה"},
    {id:"brand",   n:"מיתוג וספונסרים"},
    {id:"assets",  n:"נכסים"},
    {id:"shop",    n:"חנות"},
    {id:"nemesis", n:"היריב שלך"},
    {id:"nat",     n:"נבחרת"}
  ]}
];

function secDef(id){ for(var i=0;i<SECTIONS.length;i++) if(SECTIONS[i].id===id) return SECTIONS[i]; return SECTIONS[0]; }
function navNow(){
  if(!S.nav || !S.nav.sec) S.nav = {sec:"home", sub:"today"};
  var sec = secDef(S.nav.sec);
  var ok = sec.subs.some(function(x){ return x.id === S.nav.sub; });
  if(!ok) S.nav.sub = sec.subs[0].id;
  return S.nav;
}
function goNav(sec, sub){
  S.nav = {sec:sec, sub: sub || secDef(sec).subs[0].id};
  if(sec === "home" && S.nav.sub === "inbox") S.seen = S.inbox.length;
  S.screen = sec;
  render();
}

/* badge counts that appear on the tabs, the way FIFA flags an inbox */
function navBadge(secId){
  if(secId === "home")   return Math.max(0, S.inbox.length - S.seen);
  if(secId === "player") return S.tp || 0;
  if(secId === "market") return (S.offers ? S.offers.length : 0) + (S.pendingRenewal ? 1 : 0);
  return 0;
}

var NAV = [
  {id:"hub",    i:"◧", t:"היום"},
  {id:"player", i:"◉", t:"השחקן"},
  {id:"squad",  i:"▤", t:"הסגל"},
  {id:"league", i:"≡", t:"ליגות"},
  {id:"world",  i:"🌍", t:"עולם"},
  {id:"career", i:"✦", t:"קריירה"}
];

function renderShell(){
  var c = club(S.club);
  document.documentElement.style.setProperty("--club", c.c);
  var cr = document.getElementById("hCrest");
  cr.textContent = c.ab; cr.style.background = c.c; cr.style.color = c.t;
  document.getElementById("hClub").textContent = S.name + " · " + POS[S.pos].n;
  document.getElementById("hMeta").textContent = c.n + " · " + LEAGUES[S.league].flag + " " + LEAGUES[S.league].n;
  document.getElementById("hSeason").textContent = S.season;
  document.getElementById("hWeek").textContent = S.week + "/" + S.maxWeek;
  document.getElementById("hAge").textContent = S.age;

  var o = ovr(), v = value();
  document.getElementById("hOvr").textContent = o;
  document.getElementById("hOvrFrac").style.width = Math.round(ovrFrac()*100) + "%";
  document.getElementById("hVal").textContent = money(v);
  var vd = document.getElementById("hValD");
  var dv = v - S.valuePrev;
  if(S.valuePrev && Math.abs(dv) > v*0.005){
    vd.textContent = (dv>0?"▲ ":"▼ ") + money(Math.abs(dv));
    vd.className = dv>0 ? "up" : "dn";
  } else { vd.textContent = "שווי שוק"; vd.className = ""; }

  document.getElementById("hMoney").textContent = "₪" + Math.round(S.money) + "k";
  document.getElementById("hLvl").textContent = "רמה " + S.level;
  document.getElementById("hXpTxt").textContent = Math.round(S.xp) + " / " + xpNeed(S.level) + " XP";
  document.getElementById("hXpTxt").dir = "ltr";
  document.getElementById("hXpFill").style.width = clamp(S.xp/xpNeed(S.level)*100, 0, 100) + "%";

  renderNav();
}

function renderNav(){
  var nav = navNow();
  var tabs = document.getElementById("tabs");
  var subnav = document.getElementById("subnav");
  if(!tabs || !subnav) return;

  tabs.innerHTML = "";
  SECTIONS.forEach(function(sec){
    var b = document.createElement("button");
    b.className = "tab" + (sec.id === nav.sec ? " on" : "");
    var badge = navBadge(sec.id);
    b.innerHTML = '<em>' + sec.i + '</em><span>' + sec.n + '</span>'
      + (badge ? '<i class="tbadge">' + badge + '</i>' : '');
    b.onclick = function(){ goNav(sec.id); };
    tabs.appendChild(b);
  });

  var sec = secDef(nav.sec);
  subnav.innerHTML = '<p class="snhead">' + sec.n + '</p>';
  sec.subs.forEach(function(sub){
    var b = document.createElement("button");
    b.className = "snitem" + (sub.id === nav.sub ? " on" : "");
    b.innerHTML = '<span>' + sub.n + '</span><i>›</i>';
    b.onclick = function(){ goNav(sec.id, sub.id); };
    subnav.appendChild(b);
  });
}

/* Which of the old screen builders a category needs. Panels are tagged, so
   a category simply renders its sources and keeps what belongs to it. */
var SEC_SOURCES = {
  home:   ["hub", "world"],
  player: ["player", "career"],
  club:   ["squad"],
  comp:   ["league", "world"],
  market: ["career", "world"],
  life:   ["career", "world"]
};
function sourceHtmlFor(sec){
  var VIEWS = {hub:viewHub, player:viewPlayer, squad:viewSquad,
               league:viewLeague, world:viewWorld, career:viewCareer};
  var out = "";
  (SEC_SOURCES[sec] || ["hub"]).forEach(function(v){
    try { out += VIEWS[v](); } catch(e){ reportIssue("מקור " + v, e); }
  });
  return out;
}
function subName(nav){
  var sec = secDef(nav.sec);
  for(var i=0;i<sec.subs.length;i++) if(sec.subs[i].id === nav.sub) return sec.subs[i].n;
  return sec.n;
}
function emptyLine(nav){
  var k = nav.sec + "/" + nav.sub;
  var L = {
    "home/inbox":      "אין הודעות חדשות. הן מגיעות מהמאמן, מהסוכן ומהמועדון.",
    "home/news":       "העולם עוד לא התחיל לזוז. שחק מחזור.",
    "market/offers":   "אין הצעות על השולחן. דקות, ציונים ודוחות תפקיד הם מה שפותח את השוק.",
    "market/interest": "אף מועדון לא מסתכל עדיין.",
    "market/watch":    "לא עקבת אחרי אף אחד. פתח מועדון מהטבלה ולחץ על שחקן.",
    "life/nemesis":    "עוד לא הוגדר לך יריב.",
    "player/matches":  "עוד לא שיחקת. הדוחות יופיעו כאן.",
    "comp/talents":    "רשימת הכישרונות תיפתח אחרי המחזור הראשון."
  };
  return L[k] || "אין כאן מידע עדיין.";
}

function render(){
  try { renderShell(); } catch(e){ reportIssue("HUD", e); }
  var nav = navNow();
  try {
    stage.innerHTML = "";
    var buf = document.createElement("div");
    buf.innerHTML = sourceHtmlFor(nav.sec);
    var want = nav.sec + "/" + nav.sub;
    var picked = buf.querySelectorAll('[data-panel="' + want + '"]');

    if(!picked.length){
      stage.innerHTML = '<div class="p"><h3>' + subName(nav) + '</h3><div class="pb">'
        + '<div class="empty">' + emptyLine(nav) + '</div></div></div>';
    } else {
      Array.prototype.forEach.call(picked, function(pl){ stage.appendChild(pl); });
    }
  } catch(e){
    reportIssue("מסך " + nav.sec + "/" + nav.sub, e);
    stage.innerHTML = '<div class="p"><h3>שגיאה במסך הזה</h3><div class="pb">'
      + '<p style="margin:0 0 8px;font-size:13px;line-height:1.5">משהו נשבר בציור המסך. '
      + 'שאר המשחק ממשיך לעבוד — נסה מסך אחר מהתפריט.</p>'
      + '<code style="font-size:11px;color:var(--bad-ink);word-break:break-word">'
      + String(e && e.message ? e.message : e) + '</code></div></div>';
  }
  try { bind(); } catch(e){ reportIssue("קישור", e); }
  layoutBoards();
}

  var me = club(S.club);
  var loadCls = S.load>72 ? "b" : (S.load>52 ? "w" : "");
  var expect = expectedMinutes();

  var days = ["ב׳","ג׳","ד׳","ה׳","ו׳","ש׳","א׳"];
  var pool = availableActions();
  var dayHtml = days.map(function(d,i){

function oppPlace(id){
  var T = S.tables[S.league];
  var rows = LEAGUES[S.league].clubs.map(function(c){ return {id:c.id, t:T[c.id]}; })
    .sort(function(a,b){ return b.t.pts-a.t.pts || (b.t.gf-b.t.ga)-(a.t.gf-a.t.ga); });
  return rows.findIndex(function(r){return r.id===id}) + 1;
}

function meter(label, val, cls){
  return '<div><div class="kv" style="padding:0 0 5px"><span>'+label+'</span>'
    + '<b class="n">'+Math.round(clamp(val,0,100))+'%</b></div>'
    + '<div class="bar"><i class="'+(cls||"")+'" style="width:'+clamp(val,0,100)+'%"></i></div></div>';
}

function expectedMinutes(){
  if(isInjured()) return {label:"פצוע", start:false, mins:0};
  var t = S.trust + (S.fit-70)*0.3 + (S.sharp-50)*0.2 - (S.knock > 0 ? 6 : 0)
        - (S.comeback ? 8 : 0);
  if(t>=68) return {label:"הרכב פותח", start:true, mins:90};
  if(t>=48) return {label:"הרכב / חילוף מוקדם", start:true, mins:ri(60,90)};
  if(t>=32) return {label:"ספסל · כניסה סבירה", start:false, mins:ri(18,35)};
  return {label:"ספסל · כניסה לא בטוחה", start:false, mins:rnd()<0.5?ri(6,16):0};
}

function cardTier(o){
  if(o >= 85) return {id:"elite",  n:"אליט", bg:"linear-gradient(150deg,#33304A 0%,#17162A 55%,#443A63 100%)", ink:"#F3E9CB", chip:"#F3E9CB", chipInk:"#17162A"};
  if(o >= 75) return {id:"gold",   n:"זהב",  bg:"linear-gradient(150deg,#FAF2D8 0%,#E9D496 42%,#D6BA6E 100%)", ink:"#1A160C", chip:"#1A160C", chipInk:"#FAF2D8"};
  if(o >= 62) return {id:"silver", n:"כסף",  bg:"linear-gradient(150deg,#F5F5F3 0%,#DCDCD8 45%,#BEBEB9 100%)", ink:"#17150F", chip:"#17150F", chipInk:"#F5F5F3"};
  return                {id:"bronze", n:"ארד",  bg:"linear-gradient(150deg,#F2E2D0 0%,#DCBE9B 45%,#C39F76 100%)", ink:"#221609", chip:"#221609", chipInk:"#F2E2D0"};
}

/* six-axis radar — the shape of a player, not a list of numbers */
function radarSvg(vals, labels, ink){
  var R = 45, cx = 67, cy = 66, n = vals.length;
  function pt(i, r){
    var a = -Math.PI/2 + i*2*Math.PI/n;
    return [(cx + Math.cos(a)*r).toFixed(1), (cy + Math.sin(a)*r).toFixed(1)];
  }
  var rings = [0.25,0.5,0.75,1].map(function(f){
    var pts = []; for(var i=0;i<n;i++) pts.push(pt(i, R*f).join(","));
    return '<polygon points="'+pts.join(" ")+'" fill="none" stroke="'+ink+'" stroke-opacity="'+(f===1?.34:.15)+'" stroke-width="1"/>';
  }).join("");
  var spokes = ""; for(var i=0;i<n;i++){ var e = pt(i,R); spokes += '<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0]+'" y2="'+e[1]+'" stroke="'+ink+'" stroke-opacity=".15"/>'; }
  var shape = []; for(var j=0;j<n;j++) shape.push(pt(j, R*clamp(vals[j]/99,0.08,1)).join(","));
  var labs = ""; for(var k=0;k<n;k++){ var lp = pt(k, R+13);
    labs += '<text x="'+lp[0]+'" y="'+lp[1]+'" font-size="8.5" font-weight="900" text-anchor="middle" dominant-baseline="middle" fill="'+ink+'" fill-opacity=".62">'+labels[k]+'</text>'; }
  return '<svg viewBox="0 0 134 132" width="128" height="126" aria-hidden="true">'
    + rings + spokes
    + '<polygon points="'+shape.join(" ")+'" fill="'+ink+'" fill-opacity=".20" stroke="'+ink+'" stroke-opacity=".78" stroke-width="2" stroke-linejoin="round"/>'
    + labs + '</svg>';
}

  var p = POS[S.pos], c = club(S.club), o = ovr(), T = cardTier(o);

    return '<div class="fs"><b class="n">'+vals[i]+'</b><span>'+g+'</span></div>';
  }).join("");
  return '<div class="fcard '+T.id+'" style="--cc:'+c.c+';--cbg:'+T.bg+';--cink:'+T.ink+';--cchip:'+T.chip+';--cchipink:'+T.chipInk+'">'
    + '<span class="tierbadge">'+T.n+'</span>'
    + '<div class="fctop">'
      + '<div class="fcovr"><b class="n">'+o+'</b><span>'+S.pos+'</span></div>'
      + '<div class="fcport">'+ART.face(S.name, c.c, 58)+'</div>'
      + '<div class="fcradar">'+radarSvg(vals, p.face, T.ink)+'</div>'
      + '<div class="fcbadges">'
        + '<div class="fcclub" style="background:'+c.c+';color:'+c.t+'">'+c.ab+'</div>'

    + '</div>'
    + '<div class="fcname">'+S.name+'</div>'

    + '<div class="fcfoot"><span>'+p.n+' · גיל '+S.age+'</span><b>'+money(value())+'</b></div>'

/* players competing for your shirt, drawn from the real squad */
function depthChart(){
  var myFam = famOf(S.pos);
  var list = S.squad.filter(function(pl){ return POS[pl.pos] && famOf(pl.pos) === myFam; })
    .map(function(pl){ return {n:pl.n, age:pl.age, ovr:pl.ovr, inj:pl.inj, me:false, role:""}; });
  list.push({n:S.name+" (אתה)", age:S.age, ovr:ovr(), inj:0, me:true, role:""});
  list.sort(function(a,b){
    return (b.ovr + (b.me?S.trust*0.16:0) - (b.inj?25:0)) - (a.ovr + (a.me?S.trust*0.16:0) - (a.inj?25:0));
  });
  list.forEach(function(r,i){ r.role = i===0?"מפתח":(i===1?"מסובב":(i===2?"רוטציה":"מחוץ לרוטציה")); });
  return list;
}

function depthReason(){
  if(S.trust>=68) return "אתה בחירה ראשונה. המאמן סומך עליך גם כשהמשחק לא הולך — זה מה שמייצר רצף.";
  if(S.trust>=48) return "אתה בגבול ההרכב. עמידה בהוראות ודוח תפקיד טוב שווים כאן יותר משער בודד.";
  if(S.trust>=32) return "אתה אופציה מהספסל. הדרך פנימה עוברת דרך אימון טקטי, אמינות, ושתי כניסות טובות ברצף.";
  return "אתה מחוץ לתוכניות. או שינוי עמדה, או השאלה, או שיחה עם המאמן — אבל לא עוד שבוע של אותו דבר.";
}

    var t = T[c.id];
    return {c:c, t:t, gd:t.gf-t.ga};

  var tabs = '<div class="lgtabs">' + LG_IDS.map(function(id){

  + rows.map(function(r,i){

            + '<td>'+(f.home?"בית":"חוץ")+'</td>'

    + scorers.map(function(s,i){

      + S.matches.slice(0,14).map(function(m){

      + '<div class="clauses">'
      + CLAUSES.map(function(C){
          var cur = B.terms[C.k], base = B.base[C.k];
          var moved = Math.abs(cur - base) > 0.001;
          var nextCost = Math.round(C.cost * (1 + ((B.pushes[C.k]||0))*0.55));

            + '<span class="cln">'+C.n+'</span>'

      + '</div>'
    + '</div></div>';
  }

  return boardHtml + renewHtml + offersHtml + mhHtml + '<div class="grid g2">'
  + brandPanel()

    + '<div class="kv"><span>סטטוס</span><b>'+(S.natCalled?'<span class="tag ok">בסגל</span>':'<span class="tag">מחוץ לסגל</span>')+'</b></div>'
    + '<div class="kv"><span>הופעות</span><b class="n">'+S.natCaps+'</b></div>'

    + '<div class="kv"><span>מועדון</span><b>'+club(S.club).n+'</b></div>'
    + '<div class="kv"><span>שנים שנותרו</span><b class="n">'+S.contractYears+'</b></div>'
    + '<div class="kv"><span>שכר שבועי</span><b class="n">₪'+S.wage+'k</b></div>'
    + '<div class="kv"><span>מעמד מובטח</span><b>'+S.status+'</b></div>'
    + '<div class="kv"><span>עונה</span><b class="n">'+S.season+'</b></div>'
    + '<p class="hint" style="margin:11px 0 0">לוח המו״מ המלא (12 סעיפים, תקציב מתח, מידע חלקי) מפורט ב-GDD §10א.2 — באב־הטיפוס החוזה מוצג בלבד.</p>'
  + '</div></div></div>';

/* ══════════════════════════════════════════════════════════════════
   BINDINGS
   ════════════════════════════════════════════════════════════════ */
function bind(){
  Array.prototype.forEach.call(stage.querySelectorAll("[data-act]"), function(b){
    b.onclick = function(){
      var id = b.getAttribute("data-act");
      var i = S.picked.indexOf(id);
      if(i>=0) S.picked.splice(i,1);
      else if(S.picked.length < S.slots) S.picked.push(id);
      render();
    };
  });
  var pl = document.getElementById("play"); if(pl) pl.onclick = startWeek;
  var cl = document.getElementById("clear"); if(cl) cl.onclick = function(){ S.picked=[]; render(); };

  Array.prototype.forEach.call(stage.querySelectorAll("[data-accept]"), function(b){
    b.onclick = function(){ openBoard(+b.getAttribute("data-accept")); };
  });
  var dec = document.getElementById("declineAll");
  if(dec) dec.onclick = declineOffers;
  Array.prototype.forEach.call(stage.querySelectorAll("[data-push]"), function(b){
    b.onclick = function(){ pushClause(b.getAttribute("data-push")); };
  });
  Array.prototype.forEach.call(stage.querySelectorAll("[data-buy]"), function(b){
    b.onclick = function(){ buyItem(b.getAttribute("data-buy")); };
  });
  Array.prototype.forEach.call(stage.querySelectorAll("[data-asset]"), function(b){
    b.onclick = function(){ buyAsset(b.getAttribute("data-asset")); };
  });
  Array.prototype.forEach.call(stage.querySelectorAll("[data-spon]"), function(b){
    b.onclick = function(){ signSponsor(b.getAttribute("data-spon")); };
  });
  var spd = document.getElementById("spDrop");
  if(spd) spd.onclick = function(){ dropSponsor("החלטה שלך"); saveGame(); render(); };
  var bs = document.getElementById("bSign");   if(bs) bs.onclick = signBoard;
  var bc = document.getElementById("bCancel"); if(bc) bc.onclick = cancelBoard;
  var ry = document.getElementById("renewYes"); if(ry) ry.onclick = acceptRenewal;
  var rn = document.getElementById("renewNo");  if(rn) rn.onclick = rejectRenewal;

  Array.prototype.forEach.call(stage.querySelectorAll("[data-lg]"), function(b){
    b.onclick = function(){ viewLid = b.getAttribute("data-lg"); render(); };
  });

  /* anything that names a club opens that club */
  Array.prototype.forEach.call(stage.querySelectorAll("[data-club]"), function(b){
    b.onclick = function(e){ e.stopPropagation(); openClub(b.getAttribute("data-club")); };
  });
  Array.prototype.forEach.call(stage.querySelectorAll("[data-mkt]"), function(b){
    b.onclick = function(){
      var v = b.getAttribute("data-mkt");
      if(v.indexOf("lg:") === 0) MKT_LG = v.slice(3); else MKT_POS = v.slice(4);
      render();
    };
  });
  Array.prototype.forEach.call(stage.querySelectorAll("[data-pc]"), function(b){
    b.onclick = function(){ var q = b.getAttribute("data-pc").split("#"); openPlayerCard(q[0], +q[1]); };
  });

  Array.prototype.forEach.call(stage.querySelectorAll(".spend"), function(b){
    b.onclick = function(){
      var k = b.getAttribute("data-k");
      var v = Math.floor(S.a[k]);
      var cost = tpCost(v);
      if(S.tp < cost || v >= 99) return;
      var before = ovr(), beforeE = ovrExact(), bv = value();
      S.tp -= cost;
      S.a[k] = Math.min(99, Math.floor(S.a[k]) + 1);
      /* spillover: drilling one thing lifts its siblings a little */
      GRP[ATTR[k].g].subs.forEach(function(sib){
        if(sib !== k && S.a[sib] !== undefined) S.a[sib] = clamp(S.a[sib] + 0.4, 1, 99);
      });
      var after = ovr();
      render();
      if(after > before){
        S.valuePrev = bv;
        flashOvr();
        toast("OVR " + before + " → " + after + "   ·   " + money(value()));
      } else {
        var d = (ovrExact() - beforeE);
        toast(ATTR[k].n + " " + v + " → " + (v+1) + "   ·   OVR +" + d.toFixed(2));
      }
      var got = checkBadges();
      if(got.length) setTimeout(function(){ showBadge(got[0]); }, 320);
      var mvs = checkMoves();
      if(mvs.length) setTimeout(function(){ showMove(mvs[0]); }, got.length ? 1400 : 400);
    };
  });
}

function flashOvr(){
  var el = document.getElementById("hOvr").parentNode;
  el.classList.remove("up"); void el.offsetWidth; el.classList.add("up");
}

document.getElementById("hRead").onclick = function(){
  var modes = ["normal","long","off"];
  var names = {normal:"זמן קריאה: רגיל", long:"זמן קריאה: ארוך (×1.8)", off:"זמן קריאה: ללא הגבלה"};
  S.readMode = modes[(modes.indexOf(S.readMode)+1) % modes.length];
  toast(names[S.readMode]);
};

document.getElementById("hTheme").onclick = function(){
  var cur = document.documentElement.getAttribute("data-theme");
  var next = cur==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
};

/* ══════════════════════════════════════════════════════════════════
   STORYLET ENGINE — GDD §19
   Each storylet declares when it may appear, who is in it, what you can
   do about it, and what it leaves behind. The weekly director filters
   candidates, weights them, and fires at most one.
   ════════════════════════════════════════════════════════════════ */
function echo(weeks, txt, kind){
  S.slEchoes.push({w: S.week + weeks, s: S.season, t: txt, k: kind || ""});
}
function promise(what, weeks){
  S.promises.push({what: what, due: S.week + weeks, season: S.season, done: false});
}

/* ── the weekly director ────────────────────────────────────────── */
function runStorylets(){
  /* deliver anything that was scheduled to come back */
  var due = S.slEchoes.filter(function(e){ return e.w <= S.week; });
  due.forEach(function(e){ push(e.t, e.k); });
  S.slEchoes = S.slEchoes.filter(function(e){ return e.w > S.week; });

  /* broken promises are remembered */
  S.promises.forEach(function(pr){
    if(!pr.done && pr.due <= S.week){
      pr.done = true;
      if(S.trust < 50){
        S.trust = clamp(S.trust - 6, 0, 100);
        push("הבטחה שלא קוימה: " + pr.what + ". המאמן רשם.", "b");
      } else {
        S.trust = clamp(S.trust + 4, 0, 100);
        push("עמדת במה שהבטחת: " + pr.what + ".", "ok");
      }
    }
  });

  if(S.slPending) return;
  if(S.week < 2) return;
  if(rnd() > 0.62) return;              // quiet weeks are content too

  var pool = STORYLETS.filter(function(sl){
    if(S.slCd[sl.id] && S.week - S.slCd[sl.id] < sl.cd) return false;
    try { return sl.req(); } catch(e){ return false; }
  });
  if(!pool.length) return;

  var total = pool.reduce(function(a,s){ return a + s.w; }, 0);
  var roll = rnd() * total, acc = 0, pick = pool[0];
  for(var i=0;i<pool.length;i++){ acc += pool[i].w; if(roll <= acc){ pick = pool[i]; break; } }

  S.slCd[pick.id] = S.week;
  try { S.slPending = { id: pick.id, data: pick.build() }; }
  catch(e){ S.slPending = null; }
}

  if(!S.slPending) return;

/* ══════════════════════════════════════════════════════════════════
   WEEK → MATCH
   ════════════════════════════════════════════════════════════════ */
function startWeek(){
  if(isInjured()) return rehabWeek();
  WEEK_GAINS = [];
  var xp = 0;
  S.picked.forEach(function(id){
    var a = ACTIONS.filter(function(x){return x.id===id})[0];
    if(a){ a.run(); xp += (a.xp||0); }
  });
  S.trainXp = xp;
  S.trainGains = WEEK_GAINS.slice();
  /* natural weekly recovery — stamina and youth shed load faster */
  if(S.knock > 0) S.knock--;
  comebackTick();
  brandDecay();
  var shed = 18 + (S.a.sta||45)*0.14 + (S.age <= 23 ? 3 : 0) + (hasTrait("engine") ? 4 : 0)
           + (hasAsset("flat") ? 4 : 0);
  S.load  = clamp(S.load - shed, 0, 100);
  S.fit   = clamp(S.fit + 9 - S.load*0.06, 20, 100);
  S.sharp = clamp(S.sharp - 3, 0, 100);
  S.morale= clamp(S.morale - 1, 0, 100);

  if(S.load > 86 && rnd() < (hasTrait("iron") ? 0.11 : 0.17)){
    var wks = ri(1,3);
    push("פציעה: מתיחה בירך. " + wks + " שבועות בחוץ. העומס לא היה סוד.", "b");
    S.load = 30; S.fit = 55; S.sharp = 30; S.trust -= 2;
    S.picked = [];
    for(var i=0;i<wks && S.week<=S.maxWeek;i++){ simWorld(null); S.week++; }
    S.prep = {video:0,analyst:0,coach:0,unit:0,sp:0};
    if(S.week>S.maxWeek) return endSeason();
    render();
    toast("פציעה — דילגת על " + wks + " מחזורים");
    return;
  }
  openMatch();
}

function openMatch(){
  var fx = S.fixtures[S.week-1] || S.fixtures[S.fixtures.length-1];
  var opp = club(fx.opp);
  var me  = club(S.club);
  var exp = expectedMinutes();

  M = {
    fx:fx, opp:opp, me:me,
    home: fx.home ? me : opp,
    away: fx.home ? opp : me,
    hg:0, ag:0, min:0,
    events:[], moments:[], mi:0,
    onPitch: exp.start, entryMin: exp.start ? 0 : ri(55,75),
    mins: exp.mins, playing: exp.mins>0,
    score:0, count:0, gAdded:0, aAdded:0,
    st: blankStats(), rates:null, noise:undefined,
    mom:0, htDone:false, htPlan:null, load2:0, extraMoments:0, sigLanded:0,
    running:false, timer:null
  };

  M.moments = buildMoments(exp);

  var el = document.createElement("div");
  el.className = "match"; el.id = "matchLayer";
  el.innerHTML = matchHtml();
  layerHost().appendChild(el);
  paintPitch();
  document.getElementById("mStart").onclick = runClock;
  document.getElementById("mSkip").onclick = skipToEnd;
}

function buildMoments(exp){
  if(exp.mins<=0) return [];
  var n = exp.start ? ri(9,13) : ri(4,7);
  var out = [];
  var from = exp.start ? 4 : M.entryMin+3;
  var to   = 89;
  for(var i=0;i<n;i++){
    var m = Math.round(from + (to-from) * ((i+0.5)/n) + ri(-3,3));
    out.push({min:clamp(m,3,89), done:false});
  }
  return out.sort(function(a,b){return a.min-b.min});
}

/* ── live pitch: 22 players + ball ─────────────────────────────── */
var P = null;
var FORM = [
  {x:7,  y:50},                                            // GK
  {x:24, y:16},{x:22, y:38},{x:22, y:62},{x:24, y:84},     // back 4
  {x:44, y:26},{x:42, y:50},{x:44, y:74},                  // mid 3
  {x:66, y:18},{x:68, y:50},{x:66, y:82}                   // front 3
];

function initPitch(){
  var p = document.getElementById("mPitch");
  if(!p) return;
  p.innerHTML = '<svg viewBox="0 0 1000 620" preserveAspectRatio="none" id="pSvg">'
    + '<g fill="none" stroke="var(--turf-line)" stroke-width="3">'
    + '<rect x="16" y="16" width="968" height="588" rx="4"/>'
    + '<line x1="500" y1="16" x2="500" y2="604"/><circle cx="500" cy="310" r="80"/>'
    + '<rect x="16" y="156" width="132" height="308"/><rect x="852" y="156" width="132" height="308"/>'
    + '<rect x="16" y="236" width="50" height="148"/><rect x="934" y="236" width="50" height="148"/>'
    + '</g><circle cx="500" cy="310" r="5" fill="var(--turf-line)"/>'
    + '<polyline id="pTrail" fill="none" stroke="#FFFFFF" stroke-opacity=".38" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'
    + '<g id="pPlayers"></g>'
    + '<circle id="pBall" cx="500" cy="310" r="8.5" fill="#fff" stroke="#17150F" stroke-width="2.5"/>'
    + '</svg>';

  var g = document.getElementById("pPlayers");
  var myIdx = POS[S.pos].slot;
  var NUMS = [1,2,4,5,3,6,8,10,7,9,11];
  P = {ball:{x:50,y:50}, bt:{x:50,y:50}, poss:"h", men:[], possH:50, t:0, trail:[]};

  for(var side=0; side<2; side++){
    for(var i=0;i<11;i++){
      var f = FORM[i];
      var bx = side===0 ? f.x : 100-f.x;
      var by = side===0 ? f.y : 100-f.y;
      var team = side===0 ? M.home : M.away;
      var isMe = (side === (M.home===M.me ? 0 : 1)) && i===myIdx;

      if(isMe){
        var halo = document.createElementNS("http://www.w3.org/2000/svg","circle");
        halo.setAttribute("r", 20); halo.setAttribute("fill", "none");
        halo.setAttribute("stroke", "#FFE27A"); halo.setAttribute("stroke-width", 3);
        halo.setAttribute("stroke-opacity", ".85");
        g.appendChild(halo);
      }
      var el = document.createElementNS("http://www.w3.org/2000/svg","circle");
      el.setAttribute("r", isMe ? 13 : 10);
      el.setAttribute("fill", team.c);
      el.setAttribute("stroke", isMe ? "#17150F" : "rgba(255,255,255,.9)");
      el.setAttribute("stroke-width", isMe ? 3.5 : 2);
      g.appendChild(el);

      var lbl = document.createElementNS("http://www.w3.org/2000/svg","text");
      lbl.setAttribute("text-anchor","middle");
      lbl.setAttribute("font-size", isMe ? "11" : "9");
      lbl.setAttribute("font-weight","900");
      lbl.setAttribute("fill", team.t);
      lbl.setAttribute("pointer-events","none");
      lbl.textContent = isMe ? S.pos : NUMS[i];
      g.appendChild(lbl);

      P.men.push({bx:bx, by:by, x:bx, y:by, el:el, lbl:lbl, halo:isMe?halo:null,
                  side:side, me:isMe, gk:i===0});
    }
  }
  pitchFrame();
}

function pickBallTarget(){
  // possession drifts toward the stronger side; ball roams toward that goal
  var hs = M.home.rep + (M.home===M.me ? 5 : 0);
  var as = M.away.rep + (M.away===M.me ? 5 : 0);
  if(rnd() < 0.35) P.poss = rnd() < hs/(hs+as) ? "h" : "a";
  var bias = P.poss==="h" ? 1 : -1;
  P.bt.x = clamp(50 + bias*(10 + rnd()*36) + (rnd()-0.5)*14, 8, 92);
  P.bt.y = clamp(15 + rnd()*70, 8, 92);
  P.possH = clamp(P.possH + (P.poss==="h" ? 0.6 : -0.6), 28, 72);
}

function pitchFrame(){
  if(!P || !document.getElementById("pSvg")) return;
  P.t++;
  if(P.t % 34 === 0) pickBallTarget();

  P.ball.x += (P.bt.x - P.ball.x) * 0.055;
  P.ball.y += (P.bt.y - P.ball.y) * 0.055;

  var bx = 16 + P.ball.x*9.68, by = 16 + P.ball.y*5.88;
  var b = document.getElementById("pBall");
  if(b){ b.setAttribute("cx", bx); b.setAttribute("cy", by); }

  /* ball trail */
  P.trail.push([bx,by]);
  if(P.trail.length > 14) P.trail.shift();
  var tr = document.getElementById("pTrail");
  if(tr && P.t % 2 === 0){
    tr.setAttribute("points", P.trail.map(function(q){return q[0].toFixed(0)+","+q[1].toFixed(0)}).join(" "));
  }

  var shift = (P.ball.x - 50) * 0.30;
  for(var i=0;i<P.men.length;i++){
    var m = P.men[i];
    var tx = m.gk ? m.bx + shift*0.12 : m.bx + shift;
    var ty = m.gk ? 50 + (P.ball.y-50)*0.16 : m.by + (P.ball.y - 50) * 0.20;
    /* the closest outfielder on the possessing side steps toward the ball */
    if(!m.gk && ((P.poss==="h") === (m.side===0))){
      var d = Math.abs(m.x - P.ball.x) + Math.abs(m.y - P.ball.y);
      if(d < 22){ tx = tx + (P.ball.x - tx)*0.55; ty = ty + (P.ball.y - ty)*0.55; }
    }
    m.x += (clamp(tx,3,97) - m.x) * 0.045;
    m.y += (clamp(ty,5,95) - m.y) * 0.045;
    var px = 16 + m.x*9.68, py = 16 + m.y*5.88;
    m.el.setAttribute("cx", px); m.el.setAttribute("cy", py);
    if(m.lbl){ m.lbl.setAttribute("x", px); m.lbl.setAttribute("y", py + (m.me?4:3.2)); }
    if(m.halo){
      m.halo.setAttribute("cx", px); m.halo.setAttribute("cy", py);
      m.halo.setAttribute("r", 18 + Math.sin(P.t/12)*3);
    }
  }

  var pv = document.getElementById("mPoss");
  if(pv) pv.textContent = "החזקה " + Math.round(M.me===M.home ? P.possH : 100-P.possH) + "%";

  P.raf = requestAnimationFrame(pitchFrame);
}

function stopPitch(){ if(P && P.raf) cancelAnimationFrame(P.raf); }

function paintPitch(){ initPitch(); }

function addEv(min, txt, kind){
  M.events.unshift({min:min, t:txt, k:kind||""});
  var f = document.getElementById("mFeed");
  if(!f) return;
  var d = document.createElement("div");
  d.className = "ev " + (kind||"");
  d.innerHTML = '<span class="m">'+min+'׳</span><span>'+txt+'</span>';
  f.insertBefore(d, f.firstChild);
}

function runClock(){
  var b = document.getElementById("mStart");
  if(b) b.style.display = "none";
  var cb = document.getElementById("mClkBox");
  if(cb){ cb.className = "sbclk live"; cb.querySelector(".l").textContent = "חי"; }
  M.running = true;
  addEv(0, "שריקת פתיחה ב" + (M.fx.home ? club(S.club).n : M.opp.n) + ".", "");
  tickMatch();

/* ══════════════════════════════════════════════════════════════════
   THE ORDINARY RUN OF PLAY
   A match report is not only the highlights. Between Skill Moments you
   are still passing, pressing, losing duels — and the rating engine
   counts all of it, exactly as the analytics providers do. The rates
   come from the position's own weights, so a CDM naturally fills a
   defensive line and a winger a dribbling one, without either being
   scripted, and every rate is scaled by fitness, load and sharpness.
   ════════════════════════════════════════════════════════════════ */
function ambientRates(){
  var W = POS[S.pos].w;
  if(S.pos === "GK") return {pass:0.26, drib:0, def:0.062, aer:0.022, shot:0, key:0.008};
  return {
    pass: 0.20 + (W.PAS||0)*1.90 + (W.DEF||0)*0.55,
    drib: 0.012 + (W.DRI||0)*0.20,
    def:  0.010 + (W.DEF||0)*0.28 + (W.PHY||0)*0.07,
    aer:  0.005 + (W.PHY||0)*0.085 + (W.SHO||0)*0.03,
    shot: 0.004 + (W.SHO||0)*0.055,
    key:  0.003 + (W.PAS||0)*0.055 + (W.DRI||0)*0.022
  };
}

/* one number for "how well is your body carrying you today" */
function formEdge(){
  return (S.sharp-50)/500 - Math.max(0, S.load-55)/420 - Math.max(0, 70-S.fit)/380;
}

function ambientOdds(){
  var f = formEdge(), q = (ovr() - (M ? M.opp.rep : 60))/900;
  return {
    pass: S.pos === "GK"
          ? clamp(0.700 + ((S.a.gkic||45)-45)/260 + f, 0.52, 0.94)
          : clamp(0.775 + (grpVal("PAS")-50)/300 + f + q, 0.58, 0.955),
    def:  clamp(0.600 + (grpVal("DEF")-50)/280 + f + q, 0.36, 0.87),
    aer:  clamp(0.480 + ((S.a.hdr||45)+(S.a.str||45)-100)/300 + f + q, 0.22, 0.88),
    drib: clamp(0.545 + (grpVal("DRI")-50)/260 + f + q, 0.28, 0.90),
    shot: clamp(0.330 + (grpVal("SHO")-50)/320 + f, 0.18, 0.62)
  };
}

/* one minute of unremarkable football */
function ambientTick(){
  if(!M || !M.playing || !M.onPitch || !M.st) return;
  var R = M.rates || (M.rates = ambientRates());
  var O = ambientOdds();
  var i, n;

  n = R.pass + (rnd()-0.5)*R.pass*0.7;
  for(i=0;i<4;i++){
    if(rnd() >= n) break;
    n -= 1;
    stat("passes");
    if(rnd() < O.pass) stat("passCompleted");
    else { stat("passFailed"); if(rnd() < 0.45) stat("possessionLost"); }
    if(n <= 0) break;
  }

  if(rnd() < R.key)  stat("keyPass");
  if(rnd() < R.drib){ if(rnd() < O.drib) stat("dribbleWon"); else stat("dribbleLost"); }
  if(rnd() < R.aer) { if(rnd() < O.aer) stat("aerialWon"); else stat("aerialLost"); }
  if(rnd() < R.shot){ stat("shots"); if(rnd() < O.shot) stat("shotOnTarget"); else stat("shotOffTarget"); }

  if(rnd() < R.def){
    var won = rnd() < O.def;
    if(S.pos === "GK"){
      if(won){ if(rnd() < 0.62){ stat("save"); if(rnd() < 0.20) stat("bigSave"); } else stat("recovery"); }
      else if(rnd() < 0.03) stat("error");
    } else if(won){
      var roll = rnd();
      if(roll < 0.24) stat("tackle");
      else if(roll < 0.46) stat("interception");
      else if(roll < 0.66) stat("clearance");
      else if(roll < 0.74) stat("block");
      else stat("recovery");
      stat("duelWon");
    } else {
      stat("duelLost");
      if(rnd() < 0.20){ stat("foul"); if(rnd() < 0.06) stat("yellow"); }
      if(rnd() < 0.012) stat("error");
    }
  }
  if(rnd() < 0.006 + (S.a.agi||45)/9000) stat("fouled");
}

function tickMatch(){
  if(M.min>=90) return finishMatch();

  M.min += 1;
  var c = document.getElementById("mClk");
  if(c) c.textContent = M.min + "׳";

  /* halftime: the one moment in the match that is not about the ball */
  if(M.min === 45 && !M.htDone && M.playing && M.onPitch) return openHalftime();

  /* momentum bleeds back to level — nothing holds for ninety minutes */
  if(M.mom) { M.mom *= 0.985; if(Math.abs(M.mom) < 1) M.mom = 0; paintMom(); }

  if(!M.onPitch && M.playing && M.min===M.entryMin){
    M.onPitch = true;
    var r = document.getElementById("mRole"); if(r) r.textContent = "על המגרש";
    addEv(M.min, "חילוף: אתה נכנס. המאמן: \"לחץ את הבלם השמאלי, אל תרדוף אחרי שער.\"", "you");
  }

  if(M.onPitch && M.playing){
    ambientTick();
    if(M.load2 && M.min > 45 && M.min % 9 === 0) S.load = clamp(S.load + 0.7, 0, 100);
  }

  var nm = M.moments.filter(function(m){return !m.done && m.min===M.min})[0];
  if(nm && M.onPitch){
    nm.done = true;
    M.timer = null;
    openMoment(nm);
    return;
  }

  /* momentum tilts both the volume of chances and who gets them */
  var momGoal = 0.028 * (1 + Math.abs(momEdge())*0.30);
  if(rnd() < momGoal){
    var homeStr = (M.home.rep + (M.home===M.me?6:0)) * (M.home===M.me ? 1 + momEdge()*0.45 : 1 - momEdge()*0.45);
    var awayStr = (M.away.rep + (M.away===M.me?6:0)) * (M.away===M.me ? 1 + momEdge()*0.45 : 1 - momEdge()*0.45);
    var hs = rnd() < homeStr/(homeStr+awayStr);
    if(hs){ M.hg++; document.getElementById("mHG").textContent = M.hg; }
    else  { M.ag++; document.getElementById("mAG").textContent = M.ag; }
    var scorer = hs ? M.home : M.away;
    var good = (scorer === M.me);
    addEv(M.min, (good?"⚽ ":"😞 ") + "שער! " + scorer.n + " " + M.hg + "–" + M.ag, good?"goal":"bad");
    goalFlash(good);
    M.mom = clamp((M.mom||0) + (good ? 26 : -26), -100, 100); paintMom();
  } else if(rnd() < 0.075){
    var ev = [
      "🎯 הזדמנות גדולה שהוחמצה.", "🟨 כרטיס צהוב.", "🚩 קרן.",
      "🔁 חילוף בקבוצה היריבה.", "⬜ הכדור יצא לקו.", "🧤 הצלה גדולה של השוער.",
      "🅾 העמוד! כמעט שער.", "⚕ הפסקה קצרה לטיפול רפואי.", "📣 הקהל דורש לחץ גבוה.",
      "🟥 כרטיס אדום! היריבה בעשרה.", "⏱ שלוש דקות תוספת."
    ];
    addEv(M.min, ev[ri(0,ev.length-1)], "");
  }

  M.timer = setTimeout(tickMatch, M.onPitch ? 105 : 42);
}

/* When you are not in the room, your on-pitch self still makes decisions,
   and it makes them like a player of your position would: a centre-back
   picks the clearance far more often than the shot — but not always. */
function autoChoice(sit){
  var W = POS[S.pos].w, best = [], tot = 0;
  for(var i=0;i<sit.ch.length;i++){
    var o = sit.ch[i].out || "none", wt;
    if(o === "goal")        wt = 0.20 + (W.SHO||0)*3.0 + (W.DRI||0)*0.5;
    else if(o === "assist") wt = 0.30 + (W.PAS||0)*2.0 + (W.DRI||0)*0.8;
    else if(o === "chance") wt = 0.35 + (W.PAS||0)*1.5;
    else if(o === "win")    wt = 0.30 + (W.DEF||0)*2.2 + (W.PHY||0)*0.8;
    else if(o === "save")   wt = 0.15 + (W.DEF||0)*1.4 + (S.pos === "GK" ? 2.5 : 0);
    else if(o === "keep")   wt = 0.50;
    else                    wt = 0.40;
    if(hasTrait("gambler") && sit.ch[i].risk < 0) wt *= 1.4;
    best.push(wt); tot += wt;
  }
  var roll = rnd()*tot, acc = 0;
  for(var j=0;j<sit.ch.length;j++){ acc += best[j]; if(roll <= acc) return sit.ch[j]; }
  return sit.ch[sit.ch.length-1];
}

function skipToEnd(){
  if(M.timer) clearTimeout(M.timer);
  M.moments.forEach(function(m){ m.done = true; });
  while(M.min<90){
    M.min++;
    if(rnd()<0.028){
      var hs = rnd()<0.5;
      if(hs) M.hg++; else M.ag++;
    }
  }

  /* A simulated match is played by the same engine, not by a shortcut:
     real situations are drawn for your position, a grade is rolled from
     your attributes against the opponent, and resolveMoment writes the
     same box-score lines a live match would write. */
  if(M.playing){
    var wasOn = M.onPitch; M.onPitch = true;
    for(var t=0;t<M.mins;t++) ambientTick();
    M.onPitch = wasOn;

    var strength = (ovr() - M.opp.rep)/26 + (S.sharp-52)/120
                 - Math.max(0,S.load-70)/170 - Math.max(0,70-S.fit)/140;
    strength = clamp(strength, -0.85, 0.85);

    var C = matchCtx();
    var pool = sitsFor(S.pos).filter(function(x){ return !x.cond || x.cond(C); });
    if(!pool.length) pool = sitsFor("CM").filter(function(x){ return !x.cond || x.cond(C); });
    if(!pool.length) pool = sitsFor("CM");
    var n = Math.max(1, Math.round(M.mins/8.5));
    for(var i=0;i<n;i++){
      var sit = pool[ri(0,pool.length-1)];
      var ch  = autoChoice(sit);
      var roll = (rnd()+rnd())/2 + strength*0.30 + (ch.risk||0)*0.010;
      var grade = roll > 0.70 ? "great" : (roll > 0.46 ? "good" : (roll > 0.26 ? "poor" : "fail"));
      resolveMoment(ch, grade, true, sit.k);
    }
  }

  document.getElementById("mHG").textContent = M.hg;
  document.getElementById("mAG").textContent = M.ag;
  finishMatch();
}







/* ══════════════════════════════════════════════════════════════════
   SHELL: FIT, ORIENTATION, AND PAGED BOARDS
   The game is drawn once for a 1100x520 stage and then scaled. Nothing
   scrolls: after each render the panels are measured and packed into
   pages that fit the stage exactly, long tables are windowed into their
   own pagers, and the player moves between pages with the arrows, the
   dots, a swipe, or the arrow keys.
   ════════════════════════════════════════════════════════════════ */
var STAGE_W = 1100, STAGE_H = 520, ROT_SKIP = false, APP_K = 1, MINI_place = null;

function layerHost(){ return document.getElementById("layers") || document.body; }

function fitStage(){
  var app = document.getElementById("app");
  if(!app) return;
  /* the visual viewport, minus whatever the notch and home bar are taking */
  var vv = window.visualViewport;
  var vw = (vv ? vv.width : window.innerWidth);
  var vh = (vv ? vv.height : window.innerHeight);
  var cs = getComputedStyle(document.documentElement);
  function ins(n){ return parseFloat(cs.getPropertyValue("--sa-" + n)) || 0; }
  vw -= ins("l") + ins("r");
  vh -= ins("t") + ins("b");
  var k = Math.min(vw/STAGE_W, vh/STAGE_H);
  var dx = ins("l") + (vw - STAGE_W*k)/2, dy = ins("t") + (vh - STAGE_H*k)/2;
  /* explicit translate + scale from the top-left corner: no alignment guesswork,
     and it behaves the same in RTL as in LTR */
  app.style.transform = "translate(" + dx + "px," + dy + "px) scale(" + k + ")";
  APP_K = k;
  if(typeof MINI !== "undefined" && MINI.place && document.getElementById("miniCanvas")) MINI.place();
  app.style.setProperty("--k", k);
  var portrait = vh > vw * 1.02;
  var small = Math.min(vw, vh) < 520;          /* phones and small tablets */
  /* the gate is a suggestion, not a wall: a phone with rotation locked must
     still be able to get into the game */
  document.getElementById("rotate").classList.toggle("on", portrait && small && !ROT_SKIP);
}

/* browsers only grant these from a gesture, and only in fullscreen */
function goFullscreen(){
  var el = document.documentElement;
  var rq = el.requestFullscreen || el.webkitRequestFullscreen;
  if(rq) { try { rq.call(el).then(lockLandscape, lockLandscape); } catch(e){ lockLandscape(); } }
  else lockLandscape();
}
function lockLandscape(){
  try {
    if(screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function(){});
  } catch(e){}
}

/* ── the pager ────────────────────────────────────────────────── */
var BOARD = {page:0, pages:0};

/* a table longer than the space it has becomes its own little pager */
function windowTables(root, maxRows){
  var tables = root.querySelectorAll("table");
  Array.prototype.forEach.call(tables, function(tb){
    var body = tb.querySelector("tbody");
    if(!body) return;
    var rows = Array.prototype.slice.call(body.children);
    if(rows.length <= maxRows) return;
    var pages = Math.ceil(rows.length/maxRows), cur = 0;
    var bar = document.createElement("div");
    bar.className = "twpager";
    bar.innerHTML = '<button class="twbtn tprev">◀</button>'
      + '<span class="n"></span>'
      + '<button class="twbtn tnext">▶</button>';
    tb.parentNode.insertBefore(bar, tb.nextSibling);
    var lab = bar.querySelector(".n"), prev = bar.querySelector(".tprev"), next = bar.querySelector(".tnext");
    function paint(){
      rows.forEach(function(r,i){ r.hidden = (i < cur*maxRows || i >= (cur+1)*maxRows); });
      lab.textContent = (cur*maxRows+1) + "–" + Math.min(rows.length, (cur+1)*maxRows) + " מתוך " + rows.length;
      prev.disabled = cur === 0; next.disabled = cur >= pages-1;
    }
    prev.onclick = function(e){ e.stopPropagation(); if(cur>0){ cur--; paint(); } };
    next.onclick = function(e){ e.stopPropagation(); if(cur<pages-1){ cur++; paint(); } };
    paint();
  });
}

/* ── the packer ───────────────────────────────────────────────────
   Panels are distributed into columns that fit the stage's width and
   scroll on their own. Nothing is clipped, nothing is hidden, and the
   page itself never moves — that last part is what made it feel like a
   document. Long tables still get a windowed pager so a thirty-row table
   does not turn a column into a mile of scrolling. */
function packBoards(stage, pager, colsHint, state){
  if(!stage) return state || {};
  state = state || {};

  function isWrapper(el){
    if(el.tagName !== "DIV") return false;
    var c = (typeof el.className === "string") ? el.className : "";
    if(/\bp\b|standalone|xipitch|shop|badges|gains|rewgrid|oterms|statwrap|mombar/.test(c)) return false;
    if(c === "") return true;
    if(/\bgrid\b|\bg2\b|\bg3\b|xiwrap|boardhost/.test(c)) return true;
    var st = el.getAttribute("style") || "";
    return /flex-direction\s*:\s*column/.test(st);
  }
  var panels = [];
  function collect(el){
    if(!el.children.length){ if(el.textContent.trim()) panels.push(el); return; }
    if(!isWrapper(el)){ panels.push(el); return; }
    Array.prototype.slice.call(el.children).forEach(collect);
  }
  Array.prototype.slice.call(stage.children).forEach(collect);
  if(!panels.length){
    if(pager){ pager.innerHTML = ""; pager.className = "pager off"; }
    return state;
  }

  var budget = stage.clientHeight;
  var wide = stage.clientWidth;
  var cols = colsHint || (wide >= 900 ? 3 : (wide >= 560 ? 2 : 1));
  if(panels.length < cols) cols = Math.max(1, panels.length);

  var shape = document.createElement("div");
  shape.className = "boardpage" + (cols===2?" c2":(cols===1?" c1":""));
  for(var c0=0;c0<cols;c0++) shape.appendChild(document.createElement("div"));
  stage.innerHTML = "";
  stage.appendChild(shape);
  var colW = shape.firstChild ? shape.firstChild.getBoundingClientRect().width : 0;
  if(!colW) colW = Math.max(160, wide/cols);
  stage.innerHTML = "";

  var probe = document.createElement("div");
  probe.style.cssText = "position:absolute;left:-9999px;top:0;width:"
    + colW + "px;visibility:hidden;pointer-events:none";
  stage.appendChild(probe);
  panels.forEach(function(pl){ probe.appendChild(pl); });
  if(budget > 90) panels.forEach(function(pl){ windowTables(pl, 14); });
  var heights = panels.map(function(pl){ return pl.getBoundingClientRect().height || 120; });
  probe.remove();

  /* fill the shortest column, in reading order — RTL puts column 0 on the right */
  var colH = [], byCol = [];
  for(var i=0;i<cols;i++){ colH.push(0); byCol.push([]); }
  panels.forEach(function(pl, i){
    var best = 0;
    for(var c=1;c<cols;c++) if(colH[c] < colH[best]) best = c;
    colH[best] += heights[i] + 9;
    byCol[best].push(pl);
  });

  stage.innerHTML = "";
  var page = document.createElement("div");
  page.className = "boardpage" + (cols===2?" c2":(cols===1?" c1":""));
  for(var c2=0;c2<cols;c2++){
    var wrap = document.createElement("div");
    wrap.className = "bcolwrap";
    var colEl = document.createElement("div");
    colEl.className = "bcol";
    byCol[c2].forEach(function(x){ colEl.appendChild(x); });
    var fade = document.createElement("i");
    fade.className = "bfade";
    wrap.appendChild(colEl);
    wrap.appendChild(fade);
    page.appendChild(wrap);
    markScroll(colEl, fade);
  }
  stage.appendChild(page);

  if(pager){ pager.innerHTML = ""; pager.className = "pager off"; }
  state.pages = 1; state.page = 0; state.stage = stage; state.pager = pager;
  return state;
}

/* a column that can scroll says so, and stops saying it at the bottom */
function markScroll(col, fade){
  function paint(){
    var more = col.scrollHeight - col.clientHeight - col.scrollTop;
    fade.classList.toggle("on", more > 6);
  }
  col.addEventListener("scroll", paint, {passive:true});
  setTimeout(paint, 0);
  setTimeout(paint, 120);
}

function layoutBoards(){
  var stage = document.getElementById("stage");
  if(!stage) return;
  var backup = stage.innerHTML;
  try {
    BOARD = packBoards(stage, null, 0, BOARD);
    var shown = 0;
    Array.prototype.forEach.call(stage.querySelectorAll(".p"), function(pl){
      if(pl.getBoundingClientRect().height > 4) shown++;
    });
    if(!shown) throw new Error("board packed to nothing (h=" + stage.clientHeight + ")");
    paintArt(stage);
  } catch(err){
    stage.innerHTML = backup;
    stage.classList.add("nopack");
    reportIssue("פריסה", err);
  }
  renderActionBar();
}

/* an overlay uses the same columns */
function packOverlay(bodyEl, cols){
  if(!bodyEl) return null;
  try {
    var host = bodyEl.parentNode, used = 0;
    Array.prototype.forEach.call(host.children, function(ch){
      if(ch !== bodyEl) used += ch.getBoundingClientRect().height;
    });
    var h = Math.round(host.getBoundingClientRect().height - used);
    if(h > 90) bodyEl.style.height = h + "px";
  } catch(e){}
  return packBoards(bodyEl, null, cols || 0, {});
}

/* one place that surfaces a failure instead of swallowing it */
function reportIssue(where, err){
  try {
    var msg = (err && err.message) ? err.message : String(err);
    var el = document.getElementById("errbar");
    if(!el){
      el = document.createElement("div");
      el.id = "errbar";
      (document.getElementById("app") || document.body).appendChild(el);
      el.onclick = function(){ el.remove(); };
    }
    el.textContent = "⚠ " + where + ": " + msg;
  } catch(e){}
}

function paintPagerFor(st){}
function goPage(st, n){}
function paintPager(){}

function bindShell(){
  var stage = document.getElementById("stage");
  var x0 = null, y0 = null;
  stage.addEventListener("touchstart", function(e){
    if(e.touches.length !== 1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, {passive:true});
  stage.addEventListener("touchend", function(e){
    if(x0 === null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
  }, {passive:true});

  document.addEventListener("keydown", function(e){
    if(document.querySelector("#layers > *")) return;      /* an overlay owns the keys */
    if(e.key === "ArrowRight") showPage(BOARD.page + 1);
    if(e.key === "ArrowLeft")  showPage(BOARD.page - 1);
  });

  var rs = document.getElementById("rotSkip");
  if(rs) rs.onclick = function(){ ROT_SKIP = true; fitStage(); };

  window.addEventListener("resize", fitStage);
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", fitStage);
    window.visualViewport.addEventListener("scroll", fitStage);
  }
  window.addEventListener("orientationchange", function(){ setTimeout(fitStage, 120); });
  document.addEventListener("click", function once(){
    document.removeEventListener("click", once);
    if(Math.min(window.innerWidth, window.innerHeight) < 560) goFullscreen();
  });
  fitStage();
}

/* ══════════════════════════════════════════════════════════════════
   SEASON OBJECTIVES
   Somebody is always expecting something. The manager wants minutes and
   a role delivered; the board wants a league position; you want the
   number that gets you the next contract. Objectives are generated from
   where you actually are, tracked live off state, and paid on completion.
   ════════════════════════════════════════════════════════════════ */
var OBJ_LIB = [
  {id:"apps", who:"coach", t:function(n){ return n+" הופעות בליגה"; },
   tgt:function(){ return clamp(Math.round(S.maxWeek*(0.35 + S.trust/240)), 4, S.maxWeek); },
   cur:function(){ return S.apps; }, rw:{money:28, xp:400, trust:5}},

function buildObjectives(){
  var pool = OBJ_LIB.filter(function(o){ return !o.only || o.only.indexOf(S.pos) >= 0; });
  /* one from the board, two from the manager, one of your own */
  var byWho = {coach:[], board:[], you:[]};
  pool.forEach(function(o){ byWho[o.who].push(o); });
  function pick(arr, n){
    var out = [], c = arr.slice();
    while(out.length < n && c.length) out.push(c.splice(ri(0,c.length-1), 1)[0]);
    return out;
  }
  var chosen = pick(byWho.board,1).concat(pick(byWho.coach,2)).concat(pick(byWho.you,1));
  return chosen.map(function(o){
    var tgt = o.tgt();
    return {id:o.id, who:o.who, tgt:tgt, done:false, failed:false};
  });
}
function objDef(id){ return OBJ_LIB.filter(function(o){ return o.id === id; })[0]; }

function objState(ob){
  var d = objDef(ob.id);
  var cur = d.cur();
  var pct = d.lower
    ? clamp((ob.tgt + 6 - cur)/6, 0, 1)
    : clamp(cur/Math.max(1, ob.tgt), 0, 1);
  var met = d.lower ? cur <= ob.tgt : cur >= ob.tgt;
  return {cur:cur, pct:pct, met:met, t:d.t(ob.tgt), d:d};
}

/* called after every match — objectives that complete pay immediately */
function checkObjectives(){
  if(!S.objectives) return [];
  var paid = [];
  S.objectives.forEach(function(ob){
    if(ob.done) return;
    var st = objState(ob);
    /* league position is only settled at the end of the season */
    if(st.d.lower && S.week <= S.maxWeek) return;
    if(!st.met) return;
    ob.done = true;
    var rw = st.d.rw;
    if(rw.money){ S.money += rw.money; }
    if(rw.xp){ addXp(rw.xp); }
    if(rw.trust){ S.trust = clamp(S.trust + rw.trust, 0, 100); }
    if(rw.brand){ S.brand = clamp((S.brand||0) + rw.brand, 0, 100); }
    paid.push({t:st.t, rw:rw, who:ob.who});
  });
  return paid;
}

/* ══════════════════════════════════════════════════════════════════
   BRAND, SPONSORS AND A LIFE
   Money in a career game is only interesting if it buys things that
   change the game, and income is only interesting if it has to be
   earned. Brand is earned on the pitch and in the room; sponsors pay
   for brand and ask for something back; assets are permanent and
   mechanical, unlike the shop's consumables.
   ════════════════════════════════════════════════════════════════ */
function brandGain(rating, role, g, a, sig){
  var v = 0;
  v += Math.max(0, rating - 6.9) * 1.6;
  v += g*2.2 + a*1.3 + sig*1.1;
  v += (role >= 78 ? 0.8 : 0);
  v += (club(S.club).rep - 45)/90;
  if(S.euro) v += 0.5;
  if(hasTrait("idol")) v *= 1.15;
  /* the closer to a household name, the harder every point is */
  v *= clamp(1 - (S.brand||0)/118, 0.12, 1);
  return v;
}
/* reputation fades if you stop giving it reasons. Each week brand pulls
   towards a floor set by the club you play for and how much you play. */
function brandDecay(){
  var floor = clamp((club(S.club).rep - 35)*0.9 + (S.natCaps ? 12 : 0), 0, 70);
  var b = S.brand || 0;
  if(b > floor) S.brand = Math.max(floor, b - (0.5 + b*0.022));
  else S.brand = Math.min(floor, b + 0.3);
}
function brandTier(){
  var b = S.brand || 0;
  if(b >= 85) return {n:"שם עולמי", i:"🌍"};
  if(b >= 65) return {n:"כוכב ליגה", i:"⭐"};
  if(b >= 45) return {n:"שם מוכר", i:"📣"};
  if(b >= 25) return {n:"מתחיל להיות מדובר", i:"📰"};
  return {n:"אנונימי", i:"·"};
}

/* ══════════════════════════════════════════════════════════════════
   THE NEMESIS
   One name, chosen at the start, in your position, roughly your age.
   He develops on his own schedule whether you watch or not, the press
   compares you, and when your clubs meet it means something.
   ════════════════════════════════════════════════════════════════ */
function pickNemesis(){
  var fam = famOf(S.pos), best = null;
  /* A rival you never play is just a name. Look in the clubs you actually
     face this season first, then the rest of your league, then the world. */
  var pools = [];
  if(S.fixtures && S.fixtures.length) pools.push(S.fixtures.map(function(f){ return club(f.opp); }));
  pools.push(LEAGUES[S.league].clubs);
  pools.push(LG_IDS.reduce(function(t,l){ return t.concat(LEAGUES[l].clubs); }, []));

  for(var pi=0; pi<pools.length && !best; pi++){
    var pool = pools[pi];
    for(var t=0;t<Math.min(60, pool.length*3);t++){
      var cl = pool[ri(0, pool.length-1)];
      if(!cl || cl.id === S.club) continue;
      var sq = clubSquad(cl.id).filter(function(pl){
        return famOf(pl.pos) === fam && pl.age <= S.age + 3 && pl.ovr >= ovr() - 5 && pl.ovr <= ovr() + 14;
      });
      if(!sq.length) continue;
      var cand = sq[ri(0, sq.length-1)];
      if(!best || Math.abs(cand.ovr - ovr()) < Math.abs(best.ovr - ovr())) best = cand;
    }
  }
  if(!best) return null;
  return {n:best.n, club:best.club, i:best.i, pos:best.pos, ovr:best.ovr, age:best.age,
          g:0, a:0, apps:0, seasons:[], h2h:{w:0, d:0, l:0}, lead:0};
}
/* he plays a season while you play yours */
function nemesisWeek(){
  var N = S.nemesis;
  if(!N) return;
  var w = POS[N.pos] ? POS[N.pos].w : POS.CM.w;
  var quality = clamp((N.ovr - 45)/45, 0.1, 1);
  if(rnd() < 0.82){
    N.apps++;
    if(rnd() < (w.SHO||0.05)*1.5*quality) N.g++;
    if(rnd() < (w.PAS||0.05)*1.1*quality) N.a++;
  }
  if(rnd() < 0.05){
    var lines = [
      "📰 " + N.n + " שוב על השער של העיתונים.",
      "📰 סקאוטים מדווחים: " + N.n + " הוא הכי מבוקש בעמדה.",
      "📰 " + N.n + " הוזמן לנבחרת."
    ];
    news(lines[ri(0,lines.length-1)], "w");
  }
}
function nemesisSeason(){
  var N = S.nemesis;
  if(!N) return;
  N.seasons.push({s:S.season, g:N.g, a:N.a, apps:N.apps, ovr:N.ovr});
  /* he improves, faster if he is ahead of you */
  var lead = (N.g*2 + N.a) - (S.goals*2 + S.assists);
  N.lead = lead;
  N.ovr = clamp(N.ovr + (lead > 4 ? ri(2,5) : ri(0,3)), 30, 95);
  N.age++;
  N.g = 0; N.a = 0; N.apps = 0;
}
function nemesisCard(){
  var N = S.nemesis;
  if(!N) return "";
  var mine = S.goals*2 + S.assists, his = N.g*2 + N.a;
  return '<div data-art="rival" data-art-c2="'+club(N.club).c+'" class="p" style="border-color:var(--accent)" data-panel="life/nemesis"><h3>היריב שלך <span class="r">'+POS[N.pos].short+'</span></h3><div class="pb">'
    + '<div class="nemhead">'
      + '<div class="nemside">'+ART.face(S.name, club(S.club).c, 40)
        + '<span class="lbl">אתה</span><b class="n">'+ovr()+'</b>'
        + '<span class="xs">'+S.goals+' שערים · '+S.assists+' בישולים</span></div>'
      + '<div class="nemvs '+(mine>=his?"up":"dn")+'">'+(mine>=his?"מוביל":"מפגר")+'</div>'
      + '<div class="nemside e">'+ART.face(N.n, club(N.club).c, 40)
        + '<span class="lbl"><bdi>'+N.n+'</bdi></span><b class="n">'+N.ovr+'</b>'
        + '<span class="xs">'+N.g+' שערים · '+N.a+' בישולים</span></div>'
    + '</div>'
    + '<div class="kv"><span>מועדון</span><b><bdi>'+club(N.club).n+'</bdi></b></div>'
    + '<div class="kv"><span>ראש בראש</span><b class="n">'+N.h2h.w+'-'+N.h2h.d+'-'+N.h2h.l+'</b></div>'
    + '<div class="kv"><span>שווי שוק שלו</span><b class="n">'+money(valueOf(N.ovr, N.age, N.ovr+6))+'</b></div>'
    + '<button class="btn ghost" data-pc="'+N.club+'#'+N.i+'" style="margin-top:10px;width:100%">לכרטיס שלו</button>'
  + '</div></div>';

/* ══════════════════════════════════════════════════════════════════
   INJURY, REHAB AND THE COST OF PLAYING HURT
   The GDD asked for a graded model and the prototype had a flag. This is
   the model: five severities, a rehab that takes real weeks, a comeback
   that is not the same player who went off, and a re-injury window that
   punishes rushing back. Playing through a knock is always available and
   always costs something.
   ════════════════════════════════════════════════════════════════ */
var INJ = [
  {id:"knock",  n:"חבטה",              w:[0,0], sev:1, d:"כואב, לא מסוכן. אפשר לשחק."},
  {id:"strain", n:"מתיחה בשריר",       w:[1,2], sev:2, d:"שבוע-שבועיים. חוזרים בזהירות."},
  {id:"muscle", n:"קרע שריר",          w:[3,5], sev:3, d:"חודש. הכשירות תיפול."},
  {id:"joint",  n:"נזק ברצועה",        w:[6,11],sev:4, d:"עונה חצי. חוזרים אחרים."},
  {id:"severe", n:"פציעה קשה",         w:[14,26],sev:5,d:"החזרה עצמה תהיה הסיפור."}
];
var INJ_PART = ["ירך אחורית","שריר מפשעה","קרסול","ברך","שוק","גב תחתון","כתף","ירך קדמית"];

/* the chance of getting hurt this match, before anything you chose */
function injuryRisk(mins){
  var base = 0.020 + mins/90*0.020;
  base += Math.max(0, S.load-60)/100*0.055;          /* load is the main driver */
  base += Math.max(0, 70-S.fit)/100*0.045;
  base += Math.max(0, S.age-30)*0.0035;
  base -= (S.a.sta||45)/100*0.010;
  if(S.perkPhysio) base *= 0.72;
  if(S.perkChef)   base *= 0.90;
  if(hasTrait("engine")) base *= 0.85;
  if(S.injHistory && S.injHistory.length >= 3) base *= 1.15;
  return clamp(base, 0.004, 0.22);
}

function rollSeverity(){
  var r = rnd();
  var loadTilt = Math.max(0, S.load-70)/100;         /* tired bodies break worse */
  if(r < 0.40 - loadTilt*0.15) return INJ[0];
  if(r < 0.72 - loadTilt*0.10) return INJ[1];
  if(r < 0.90) return INJ[2];
  if(r < 0.98) return INJ[3];
  return INJ[4];
}

function applyInjury(kind, part){
  var weeks = kind.w[0] === 0 ? 0 : ri(kind.w[0], kind.w[1]);
  if(S.perkPhysio && weeks > 1) weeks = Math.max(1, weeks - 1);
  S.injury = weeks > 0
    ? {n:kind.n, part:part, sev:kind.sev, weeks:weeks, left:weeks, rehab:0, id:kind.id}
    : null;
  S.knock = weeks > 0 ? 0 : ri(2,3);                 /* a knock is carried, not treated */
  if(weeks > 0){
    if(!S.injHistory) S.injHistory = [];
    S.injHistory.push({s:S.season, w:S.week, n:kind.n, part:part, weeks:weeks});
    S.fit = clamp(S.fit - 8 - kind.sev*4, 15, 100);
    S.sharp = clamp(S.sharp - 10 - kind.sev*5, 0, 100);
    S.morale = clamp(S.morale - 6 - kind.sev*4, 0, 100);
    S.trust = clamp(S.trust - kind.sev*1.2, 0, 100);
  }
  return weeks;
}

function isInjured(){ return !!(S.injury && S.injury.left > 0); }

/* every week out is a week of choices, not a skipped screen */
var REHAB = [
  {id:"rehab_slow", i:"🧊", t:"שיקום שמרני", d:"עובדים לפי הספר. חוזרים שלמים.",
   fx:["+1.0 שבוע שיקום","+5 כשירות"],

  {id:"rehab_push", i:"🔥", t:"לדחוף את הקצב", d:"חוזרים מוקדם — ומגדילים סיכון להישנות.",
   fx:["+1.9 שבוע שיקום","+16% הישנות","+9 עומס"],

  {id:"rehab_gym", i:"🏋", t:"חדר כושר וליבה", d:"לא מקצר, אבל חוזרים חזקים יותר.",
   fx:["+0.7 שבוע שיקום","++PHY"],
   run:function(){ S.injury.rehab += 0.7; grow(["str","jmp","sta"], 0.5); }, xp:60},
  {id:"rehab_film", i:"▶", t:"וידאו ולמידה", d:"הראש ממשיך להתקדם גם כשהגוף עוצר.",
   fx:["+0.7 שבוע שיקום","++ראיית משחק"],
   run:function(){ S.injury.rehab += 0.7; grow(["vis","gpos","cmp"], 0.45); }, xp:60},
  {id:"rehab_room", i:"🤝", t:"להישאר עם הקבוצה", d:"שומר על החיבור בחדר ועל אמון המאמן.",
   fx:["+0.6 שבוע שיקום","+אמון","+מורל"],
   run:function(){ S.injury.rehab += 0.6; S.trust = clamp(S.trust + 1.6, 0, 100);
                   S.morale = clamp(S.morale + 7, 0, 100);
                   if(S.squad) S.squad.slice(0,4).forEach(function(pl){ pl.rel.personal = clamp(pl.rel.personal+3, 0, 100); }); }, xp:45}
];

/* the week that passes while you are out */
function rehabWeek(){
  var picked = S.picked.slice();
  S.injury.rehab = S.injury.rehab || 0;
  var xp = 0;
  picked.forEach(function(id){
    var a = REHAB.filter(function(x){ return x.id === id; })[0];
    if(a){ a.run(); xp += a.xp; }
  });
  if(!picked.length){ S.injury.rehab += 0.8; }        /* doing nothing still heals */

  S.trainXp = xp;
  S.load = clamp(S.load - 14, 0, 100);
  S.sharp = clamp(S.sharp - 4, 0, 100);
  S.injury.left = Math.max(0, S.injury.weeks - S.injury.rehab);

  var back = S.injury.left <= 0;
  if(back){
    /* you come back, but not as the player who went off */
    S.comeback = {risk: clamp(8 + (S.injury.risk||0) + S.injury.sev*4, 0, 60), weeks: 2 + S.injury.sev};
    S.sharp = clamp(S.sharp - 6, 0, 100);
    S.fit = clamp(S.fit - 4, 15, 100);
    news("🩹 " + S.name + " חוזר לאימונים אחרי " + S.injury.n + ".", "you");
    S.injury = null;
  }
  S.week++;
  S.picked = [];
  S.money += S.wage;
  runCoachMarket(); runStorylets(); saveGame();
  if(S.week > S.maxWeek) return endSeason();
  goNav("home","today");
  var got = addXp(xp);
  if(back) toast("🩹 חזרת לכושר. שבועות ראשונים — סיכון להישנות.");
  else toast("שבוע שיקום. עוד " + Math.ceil(S.injury.left) + " שבועות.");
}

/* the second injury inside the comeback window is the one that ends seasons */
function comebackTick(){
  if(!S.comeback) return;
  S.comeback.weeks--;
  if(S.comeback.weeks <= 0) S.comeback = null;
}
function reinjuryRisk(){ return S.comeback ? S.comeback.risk/100 : 0; }

function moveReady(mv){
  for(var k in mv.req) if((S.a[k]||0) < mv.req[k]) return false;
  return true;
}
function hasMove(id){ return S.moves && S.moves.indexOf(id) >= 0; }
function checkMoves(){
  if(!S.moves) S.moves = [];
  var got = [];
  MOVES.forEach(function(mv){
    if(S.moves.indexOf(mv.id) < 0 && moveReady(mv)){ S.moves.push(mv.id); got.push(mv); }
  });
  return got;
}
function showMove(mv){
  celebrate('<span class="ctag">מהלך חתימה נפתח</span>'
    + '<div class="cbig" style="font-size:32px">'+mv.i+' '+mv.n+'</div>'
    + '<div class="csub">'+mv.d+'</div>', "gold");
}
/* the moves that could appear in this situation */
function movesFor(kind){
  if(!S.moves) return [];
  return MOVES.filter(function(mv){
    return S.moves.indexOf(mv.id) >= 0 && mv.on.indexOf(kind) >= 0;
  });
}
/* how close the next one is — shown on the player screen */
function moveProgress(mv){
  var t = 0, n = 0;
  for(var k in mv.req){ t += clamp((S.a[k]||0)/mv.req[k], 0, 1); n++; }
  return n ? t/n : 0;
}

/* ══════════════════════════════════════════════════════════════════
   MOMENTUM
   Football is not 90 independent events. A team that has just scored,
   or that has just been told the right thing at halftime, plays
   differently for the next ten minutes — and so does yours. Momentum
   runs -100..100, decays towards zero, and feeds the execution meter,
   both teams' scoring chances, and how much space you get.
   ════════════════════════════════════════════════════════════════ */
function momShift(v, why){
  if(!M) return;
  M.mom = clamp((M.mom||0) + v, -100, 100);
  if(why) addEv(M.min, (v > 0 ? "📈 " : "📉 ") + why, v > 0 ? "you" : "");
  paintMom();
}
function momEdge(){ return M ? (M.mom||0)/100 : 0; }
function paintMom(){
  var el = document.getElementById("momFill");
  if(!el) return;
  var m = M.mom || 0;
  el.style.width = Math.abs(m)/2 + "%";
  el.style.insetInlineStart = m >= 0 ? "50%" : "auto";
  el.style.insetInlineEnd = m < 0 ? "50%" : "auto";
  el.className = m >= 0 ? "up" : "dn";
  var t = document.getElementById("momTxt");
  if(t) t.textContent = m >= 45 ? "המשחק שלכם" : (m >= 15 ? "יתרון קטן" :
    (m > -15 ? "שקול" : (m > -45 ? "הם מובילים בקצב" : "אתם תחת מצור")));
}

/* ── the halftime talk ────────────────────────────────────────── */
var HT_TALKS = [
  {id:"calm",  n:"להרגיע ולהחזיק כדור", d:"פחות סיכון, יותר שליטה", at:"cmp", mom:14, kind:"control"},
  {id:"press", n:"לדרוש לחץ גבוה", d:"מתיש · מחזיר כדורים גבוה", at:"agg", mom:22, kind:"press"},

];

function openHalftime(){
  M.htDone = true;
  if(M.timer) clearTimeout(M.timer);
  var myG = M.me===M.home ? M.hg : M.ag, opG = M.me===M.home ? M.ag : M.hg;
  var head = myG > opG ? "אתם מובילים במחצית" : (myG < opG ? "אתם מפגרים במחצית" : "תיקו במחצית");
  var talks = HT_TALKS.slice();
  if(S.trust < 40) talks = talks.filter(function(t){ return t.id !== "me"; });

  var el = document.createElement("div");
  el.className = "moment"; el.id = "htLayer";
  el.innerHTML = '<div class="mcard" style="max-width:520px">'
    + '<div class="mhd"><div><div class="t">מחצית · '+head+'</div>'
      + '<div class="s">'+M.home.ab+' '+M.hg+'–'+M.ag+' '+M.away.ab+' · מה אתה אומר בחדר?</div></div>'
      + '<div style="flex:1"></div><span class="tag">'+Math.round(S.load)+'% עומס</span></div>'
    + '<div class="mbd" style="grid-template-columns:1fr">'
      + '<div class="choices" id="htCh"></div>'
      + '<div class="res" id="htRes">חדר ההלבשה מסתכל עליך.</div>'
    + '</div></div>';
  layerHost().appendChild(el);

  var box = document.getElementById("htCh");
  talks.forEach(function(t){
    var b = document.createElement("button");
    b.className = "ch";
    b.innerHTML = '<b>'+t.n+'</b><span>'+t.d+'</span>';
    b.onclick = function(){ resolveHalftime(t, el); };
    box.appendChild(b);
  });
}

function resolveHalftime(t, el){
  var at = S.a[t.at] || 45;
  /* your standing in the room decides whether the room listens */
  var weight = 0.45 + (at-45)/150 + (S.trust-50)/220 + (hasTrait("leader") ? 0.18 : 0);
  var landed = rnd() < clamp(weight, 0.15, 0.95);
  var gain = landed ? t.mom : -Math.round(t.mom*0.45);

  M.mom = clamp((M.mom||0) + gain, -100, 100);
  M.htPlan = t.kind;
  if(t.kind === "press") M.load2 = 1;            // the second half will cost you
  if(t.kind === "me")    M.extraMoments = 2;     // you asked for the ball

  var res = document.getElementById("htRes");
  res.className = "res " + (landed ? "great" : "poor");
  res.innerHTML = landed
    ? '<b>הם הקשיבו.</b>' + (t.kind==="press" ? "הלחץ עולה — והרגליים ישלמו." :
      (t.kind==="me" ? "הכדור יגיע אליך יותר. עכשיו תעשה עם זה משהו." : "הקבוצה יוצאת מסודרת יותר."))
    : '<b>זה לא נתפס.</b>לא כל מה שאומרים בחדר עובד. חצי שנייה של שקט מגושם.';

  S.trust = clamp(S.trust + (landed ? 1.6 : -0.8), 0, 100);

  setTimeout(function(){
    el.remove();
    if(M.extraMoments){
      /* the moments you asked for, inserted into the second half */
      for(var i=0;i<M.extraMoments;i++)
        M.moments.push({min:clamp(52 + i*13 + ri(-4,4), 47, 88), done:false});
      M.moments.sort(function(a,b){ return a.min-b.min; });
      M.extraMoments = 0;
    }
    paintMom();
    M.timer = setTimeout(tickMatch, 200);
  }, landed ? 1100 : 1300);
}

/* ══════════════════════════════════════════════════════════════════
   THE ROLE REPORT
   A rating says how well you played. It does not say whether you played
   the job you were given. Every position carries three KPIs (POS.kpi),
   and these are the formulas that read them out of the box score, each
   scaled against what a competent player in that role returns per 90.
   The manager's trust moves on THIS, not only on the rating — which is
   why a winger with a 7.2 built entirely on defensive work still loses
   ground with a coach who signed him to beat full-backs.
   ════════════════════════════════════════════════════════════════ */
function p90(v, mins){ return (v||0) * 90 / Math.max(20, mins); }
function kscore(v, target){ return clamp(v/target, 0, 1.3); }
function accOf(st){ return st.passes ? st.passCompleted/st.passes : 0.7; }
function xgOf(st){ return (st.shots||0)*0.085 + (st.shotOnTarget||0)*0.06
                        + (st.bigChanceMissed||0)*0.22 + (st.goals||0)*0.22; }
function xaOf(st){ return (st.keyPass||0)*0.09 + (st.bigChanceCreated||0)*0.26 + (st.assists||0)*0.20; }
function defActs(st){ return (st.tackle||0)+(st.interception||0)+(st.clearance||0)+(st.block||0); }

var ROLE_KPI = {
  GK :[function(st,m){ return kscore((st.save||0)*1.0 + (st.bigSave||0)*0.8 - (st.goalConceded||0)*0.75 + (st.cleanSheet?1.2:0), 3.4); },
       function(st,m){ return kscore(p90((st.aerialWon||0)+(st.clearance||0)+(st.recovery||0), m), 3.4); },
       function(st,m){ return kscore((accOf(st)-0.45)/0.45, 1); }],

  CB :[function(st,m){ return kscore(p90(defActs(st), m), 8.2); },
       function(st,m){ return kscore(p90(st.aerialWon, m) / Math.max(0.8, p90((st.aerialWon||0)+(st.aerialLost||0), m)) * 3.2, 2.1); },
       function(st,m){ return kscore((accOf(st)-0.5)/0.42, 1); }],

  LB :[function(st,m){ return kscore(p90((st.keyPass||0)+(st.bigChanceCreated||0)*2, m), 3.4); },
       function(st,m){ return kscore(p90((st.tackle||0)+(st.interception||0), m), 6.2); },
       function(st,m){ return kscore(p90((st.dribbleWon||0)+(st.fouled||0), m), 4.0); }],

  CDM:[function(st,m){ return kscore(p90((st.interception||0)+(st.block||0), m), 3.2); },
       function(st,m){ return kscore(p90((st.tackle||0)+(st.recovery||0)+(st.duelWon||0)*0.35, m), 5.8); },
       function(st,m){ return kscore((accOf(st)-0.55)/0.38, 1); }],

  CM :[function(st,m){ return kscore(p90((st.passCompleted||0), m), 60); },
       function(st,m){ return kscore(p90((st.keyPass||0)*1.4 + (st.bigChanceCreated||0)*2, m), 3.9); },
       function(st,m){ return kscore(1 - p90(st.possessionLost, m)/12.5, 1); }],

  CAM:[function(st,m){ return kscore(p90(st.keyPass, m), 3.8); },
       function(st,m){ return kscore(p90(xaOf(st), m), 0.70); },
       function(st,m){ return kscore(p90((st.shots||0)+(st.dribbleWon||0), m), 5.3); }],

  LM :[function(st,m){ return kscore(p90((st.keyPass||0)+(st.bigChanceCreated||0)*1.6, m), 3.0); },
       function(st,m){ return kscore(p90(st.dribbleWon, m), 3.1); },
       function(st,m){ return kscore(p90((st.tackle||0)+(st.interception||0)+(st.recovery||0), m), 4.4); }],

  LW :[function(st,m){ return kscore(p90(st.dribbleWon, m) / Math.max(0.9, p90((st.dribbleWon||0)+(st.dribbleLost||0), m)) * 3.4, 2.9); },
       function(st,m){ return kscore(p90(xgOf(st)+xaOf(st), m), 0.86); },
       function(st,m){ return kscore(p90((st.shots||0)+(st.keyPass||0), m), 5.6); }],

  CF :[function(st,m){ return kscore(p90(xgOf(st), m), 0.44); },
       function(st,m){ return kscore(p90((st.passCompleted||0)*0.08 + (st.dribbleWon||0), m), 3.0); },
       function(st,m){ return kscore(p90(st.keyPass, m), 1.9); }],

  ST :[function(st,m){ return kscore(p90(xgOf(st), m), 0.43); },
       function(st,m){ return st.shots ? kscore((st.goals||0)/st.shots/0.19, 1) : 0.12; },
       function(st,m){ return kscore(p90((st.fouled||0)+(st.aerialWon||0)+(st.passCompleted||0)*0.06, m), 2.6); }]
};
ROLE_KPI.RB = ROLE_KPI.LB; ROLE_KPI.LWB = ROLE_KPI.LB; ROLE_KPI.RWB = ROLE_KPI.LB;
ROLE_KPI.RM = ROLE_KPI.LM; ROLE_KPI.RW = ROLE_KPI.LW;

function roleReport(st, mins, pos){
  var fns = ROLE_KPI[pos] || ROLE_KPI.CM, names = POS[pos].kpi, out = [], tot = 0;
  for(var i=0;i<3;i++){
    var v = clamp(fns[i](st, mins) || 0, 0, 1.3);
    out.push({n:names[i], v:v});
    tot += v;
  }
  return {rows:out, score:clamp(Math.round(tot/3*72), 0, 100)};
}

/* what the manager says when he compares the job to the job description */
function roleLine(rep, rating){
  var low = rep.rows.slice().sort(function(a,b){ return a.v - b.v; })[0];
  var high = rep.rows.slice().sort(function(a,b){ return b.v - a.v; })[0];
  if(rep.score >= 78) return "בדיוק מה שביקשתי. " + high.n + " היה ברמה אחרת.";
  if(rep.score >= 60) return "עשית את התפקיד. " + low.n + " עוד צריך עבודה.";
  if(rep.score >= 42) return "היית במשחק, אבל לא בתפקיד. " + low.n + " — שם אני מאבד אותך.";
  if(rating >= 7)     return "ציון נחמד, אבל לא בשביל זה העמדתי אותך שם. " + low.n + " הוא כל התפקיד.";
  return "זה לא התפקיד שדיברנו עליו. " + low.n + " היה חסר לאורך כל המשחק.";
}

/* ══════════════════════════════════════════════════════════════════
   THE DATABASE
   Every club in the world has a squad you can open, read and compare
   yourself against — the part of a management game that has nothing to
   do with the next ninety minutes. Squads are generated deterministically
   from the club id, so the same club always has the same players, and
   they are generated by their own random stream so that browsing never
   disturbs the match engine's seed.
   ════════════════════════════════════════════════════════════════ */

/* names by country, transliterated — a Bundesliga squad should not read

var NAMES = {

  esp:{f:["פאבלו","סרחיו","חאבי","מרקו","אלכס","הוגו","דני","איקר","ראול","קרלוס","מיקל","גאבי","אדריאן","חורחה","ניקו","פרן","מרטין","איבן"],
