};
function countryOf(lid){ return (lid||"isr").replace(/[0-9]/g, ""); }

/* a small independent generator — never touches S.seed */
function hashOf(str){
  var h = 2166136261;
  for(var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = (h * 16777619) >>> 0; }
  return h >>> 0;
}
function streamFrom(seed){
  var st = seed >>> 0;
  return function(){ st = (st * 1664525 + 1013904223) >>> 0; return st / 4294967296; };
}

var DB_FORMATION = ["GK","GK","GK","CB","CB","CB","CB","LB","LB","RB","RB","LWB","RWB",
  "CDM","CDM","CM","CM","CM","CAM","CAM","LM","RM","LW","LW","RW","RW","CF","ST","ST","ST"];

/* market value for anyone who is not you — same curve as your own */
function valueOf(o, age, pot){
  var base = 25000 * Math.pow(1.185, o - 40), m;
  if(age <= 19)      m = 1.55;
  else if(age <= 22) m = 1.40;
  else if(age <= 25) m = 1.20;
  else if(age <= 28) m = 1.00;
  else if(age <= 31) m = 0.72;
  else if(age <= 34) m = 0.42;
  else               m = 0.20;
  var ph = 1 + clamp((pot||o) - o, 0, 25) * 0.022;
  return Math.round(base * m * ph);
}

var DB_CACHE = {};
function clubSquad(cid){
  if(DB_CACHE[cid]) return DB_CACHE[cid];
  var c = club(cid);
  var R = streamFrom(hashOf(cid) ^ 0x5f3a);
  var pool = NAMES[countryOf(c.lg)] || NAMES.isr;
  var used = {};
  var sq = DB_FORMATION.map(function(pp, i){
    /* the spine is stronger than the fringe, the way a real squad is */
    var tier = i < 14 ? 1 : (i < 22 ? 0.55 : 0.2);
    var o = clamp(Math.round(c.rep + (R()-0.34)*15 + tier*6 - 4), 30, 94);
    var age = 17 + Math.floor(Math.pow(R(), 0.75) * 20);
    var pot = clamp(o + Math.round((R()*22) * clamp((26-age)/9, 0, 1)), o, 95);
    var nm, guard = 0;
    do { nm = pool.f[Math.floor(R()*pool.f.length)] + " " + pool.l[Math.floor(R()*pool.l.length)]; }
    while(used[nm] && ++guard < 12);
    used[nm] = 1;
    return {
      i:i, n:nm, pos:pp, ovr:o, age:age, pot:pot, club:cid,
      val: valueOf(o, age, pot),
      wage: Math.max(2, Math.round(o*o/95 + R()*6)),
      years: 1 + Math.floor(R()*4),
      form: Math.round((5.9 + R()*1.7) * 10) / 10,
      g: Math.floor(Math.pow(R(), 2.2) * (["ST","CF","LW","RW","CAM"].indexOf(pp)>=0 ? 19 : 6)),
      a: Math.floor(Math.pow(R(), 2.0) * (["CAM","LW","RW","LM","RM"].indexOf(pp)>=0 ? 14 : 5)),
      apps: 4 + Math.floor(R()*30),
      nat: R() < 0.22
    };
  });
  sq.sort(function(a,b){ return b.ovr - a.ovr; });
  DB_CACHE[cid] = sq;
  return sq;
}

/* the eleven a manager would actually pick out of that squad */
var XI_SHAPE = [
  {slot:"GK",  fam:["GK"]},
  {slot:"RB",  fam:["RB","RWB","CB"]},
  {slot:"CB",  fam:["CB"]},
  {slot:"CB",  fam:["CB"]},
  {slot:"LB",  fam:["LB","LWB","CB"]},
  {slot:"CDM", fam:["CDM","CM"]},
  {slot:"CM",  fam:["CM","CDM","CAM"]},
  {slot:"CAM", fam:["CAM","CM","CF"]},
  {slot:"RW",  fam:["RW","RM","LW"]},
  {slot:"LW",  fam:["LW","LM","RW"]},
  {slot:"ST",  fam:["ST","CF"]}
];
function bestXI(sq){
  var taken = {}, out = [];
  XI_SHAPE.forEach(function(sh){
    var pick = null;
    for(var t=0;t<sh.fam.length && !pick;t++){
      for(var i=0;i<sq.length;i++){
        if(taken[i]) continue;
        if(sq[i].pos === sh.fam[t]){ pick = {p:sq[i], idx:i, slot:sh.slot}; break; }
      }
    }
    if(!pick){
      for(var j=0;j<sq.length;j++){ if(!taken[j] && sq[j].pos !== "GK"){ pick = {p:sq[j], idx:j, slot:sh.slot}; break; } }
    }
    if(pick){ taken[pick.idx] = 1; out.push(pick); }
  });
  return out;
}

function clubStanding(cid){
  var c = club(cid), T = S.tables[c.lg];
  if(!T) return null;
  var rows = LEAGUES[c.lg].clubs.map(function(x){ return {c:x, t:T[x.id], gd:T[x.id].gf - T[x.id].ga}; })
    .sort(function(a,b){ return b.t.pts - a.t.pts || b.gd - a.gd || b.t.gf - a.t.gf; });
  for(var i=0;i<rows.length;i++) if(rows[i].c.id === cid) return {pos:i+1, t:rows[i].t, of:rows.length, gd:rows[i].gd};
  return null;
}

function toggleWatchPlayer(cid, idx){

     centre-back reads like a centre-back and not like a diluted striker */

function scoutLine(p, myOvr, same){
  var d = p.ovr - myOvr;
  if(same && d >= 8)  return "בעמדה שלך, והוא לפניך בבירור. אם הוא במועדון שלך — אתה יושב.";
  if(same && d >= 2)  return "אותה עמדה, קצת מעליך. פער שנסגר בשלוש עונות טובות.";
  if(same && d > -3)  return "אותה עמדה, אותו מפלס. זה הכי קרוב שיש לשחקן שמתחרה בך על המשבצת.";
  if(same)            return "אותה עמדה, ואתה כבר לפניו. סוכן טוב היה מזכיר את זה בשיחה הבאה.";
  if(d >= 10)         return "רמה אחרת. שווה ללמוד ממנו ולא להשוות.";
  if(d >= 3)          return "טיפה מעליך, ובעמדה אחרת — כדאי לראות איך הוא נכנס למרחבים.";
  if(p.pot - p.ovr >= 12) return "עוד לא הגיע לשיא שלו. בעוד שנתיים השם הזה יעלה בכל שיחה.";
  return "שחקן שאתה כבר יכול להסתכל עליו בגובה העיניים.";
}

/* ── the world market: everyone, sortable ──────────────────────── */
var MKT_LG = "all", MKT_POS = "all";
function marketRows(limit){
  var out = [];
  var ids = MKT_LG === "all" ? LG_IDS : [MKT_LG];
  ids.forEach(function(lid){
    LEAGUES[lid].clubs.forEach(function(c){
      clubSquad(c.id).slice(0, 14).forEach(function(p){
        if(MKT_POS !== "all" && famOf(p.pos) !== MKT_POS) return;
        out.push(p);
      });
    });
  });
  out.sort(function(a,b){ return b.val - a.val; });
  return out.slice(0, limit || 25);
}

function sitsFor(pos){
  return SITS.filter(function(s){ return s.pos.indexOf(pos) >= 0; });
}

/* Everything a situation might want to ask about the moment it fires in.
   Situations declare a cond(C) instead of the engine hard-coding them, so
   the library can grow without the picker growing with it. */
function matchCtx(){
  var myG = M.me === M.home ? M.hg : M.ag;
  var opG = M.me === M.home ? M.ag : M.hg;
  return {
    min:M.min, myG:myG, opG:opG, lead:myG - opG,
    home:M.me === M.home,
    early:M.min <= 22, mid:M.min > 22 && M.min < 70, late:M.min >= 70, veryLate:M.min >= 84,
    winning:myG > opG, losing:myG < opG, level:myG === opG,
    tired:S.load >= 55 || S.fit <= 62, fresh:S.load < 40 && S.fit > 78,
    underdog:M.opp.rep - club(S.club).rep >= 8,
    favourite:club(S.club).rep - M.opp.rep >= 8,
    trusted:S.trust >= 62, shaky:S.trust < 42,
    scored:M.gAdded > 0, assisted:M.aAdded > 0,
    hot:M.gAdded + M.aAdded >= 1, young:S.age <= 21, veteran:S.age >= 30,
    derby:S.rivals && S.rivals.some(function(r){ return r.club === M.fx.opp; })
  };
}

function openMoment(m){
  var pool = sitsFor(S.pos);
  if(!pool.length) pool = sitsFor("CM");
  var C = matchCtx();
  var cand = pool.filter(function(s){
    if(s.cond && !s.cond(C)) return false;
    return S.slSit !== s.id;          // never the same situation twice running
  });
  if(!cand.length) cand = pool;
  var tot = cand.reduce(function(x,s){ return x + s.w; }, 0);
  var roll = rnd()*tot, acc = 0, sit = cand[0];
  for(var q=0;q<cand.length;q++){ acc += cand[q].w; if(roll <= acc){ sit = cand[q]; break; } }
  S.slSit = sit.id;

  /* Read time. The old numbers (1.0–2.6s) were unreadable — you could not
     finish three Hebrew options, let alone weigh them. Base is now generous
     and the attributes/preparation extend it further. */
  var readBase = 4.2 + iq()/16 + ((S.prep.video || S.perkAnalyst) ? 1.6 : 0)
               + (hasTrait("reader") ? 1.2 : 0) + (S.perkPsych ? 1.0 : 0)
               - (1 - S.fit/100)*1.6 - (S.load/100)*1.2;
  var mult = S.readMode === "long" ? 1.8 : 1;
  var readTime = S.readMode === "off" ? 999 : clamp(readBase*mult, 2.6, 14);

  var choices = sit.ch.slice();
  if(sit.unl && (S.prep.analyst || S.perkAnalyst)) choices.push(sit.unl);
  if(sit.unl && !S.prep.analyst && sit.unl.big && S.prep.coach) choices.push(sit.unl);

  /* a signature move shows up when the situation fits it — not every time,
     or it stops being special */
  var mvs = movesFor(sit.k);
  if(mvs.length && rnd() < 0.55){
    var mv = mvs[ri(0, mvs.length-1)];
    var mc = {};
    for(var mk in mv.ch) mc[mk] = mv.ch[mk];
    mc.b = mv.i + " " + mc.b;
    mc.sig = mv.id;
    choices.push(mc);
  }

  MO = {m:m, sit:sit, choices:choices, pick:null, readTime:readTime,
        pos:0, dir:1, raf:null, fired:false, tLeft:readTime};

  var el = document.createElement("div");
  el.className = "moment"; el.id = "momentLayer";
  el.innerHTML = momentHtml();
  layerHost().appendChild(el);
  drawMomentPitch();
  bindMoment();
  startRead();
}

function startRead(){
  if(S.readMode === "off"){
    var lbl0 = document.getElementById("moT");
    if(lbl0) lbl0.textContent = "∞";
    return;
  }
  var ring = document.getElementById("moRing");
  var t0 = performance.now();
  var total = MO.readTime*1000;
  (function step(now){
    if(!MO || MO.pick!==null) return;
    var el = now - t0;
    var left = Math.max(0, total-el);
    MO.tLeft = left/1000;
    var lbl = document.getElementById("moT");
    if(lbl) lbl.textContent = (left/1000).toFixed(1);
    if(ring) ring.setAttribute("stroke-dashoffset", String(113*(1-left/total)));
    if(left<=0){
      autoPick();
      return;
    }
    requestAnimationFrame(step);
  })(t0);
}

function autoPick(){
  if(!MO || MO.pick!==null) return;
  var safe = 0;
  MO.choices.forEach(function(c,i){ if(c.w > MO.choices[safe].w) safe = i; });
  var btns = document.getElementById("moCh").children;
  document.getElementById("moRes").innerHTML = "<b>נגמר הזמן</b>הגוף בחר בשבילך — הבחירה הבטוחה. זמן קריאה ארוך יותר מגיע מטקטיקה, כושר והכנה.";
  document.getElementById("moRes").className = "res poor";
  pickChoice(safe, btns[safe]);
}

function pickChoice(i, btn){
  if(MO.pick!==null) return;
  MO.pick = i;
  var all = document.getElementById("moCh").children;
  for(var k=0;k<all.length;k++){ all[k].disabled = true; all[k].classList.remove("on"); }
  if(btn) btn.classList.add("on");

  var c = MO.choices[i];
  var mg = miniFor(c, MO.sit ? MO.sit.k : "");
  if(mg) return startMini(mg, c);
  if(isShotChoice(c)){ MO.shooting = true; return startShot(c); }
  return startMeterFor(c);
}

/* the execution meter — for everything that is a decision rather than a
   touch of the ball, and the fallback when the engine is not there */
function startMeterFor(c){
  var at = S.a[c.at] || 45;
  /* Sweet-zone width is where your stats become difficulty you can feel.
     A 40-rated attribute gives a sliver; an 85 gives a comfortable window. */
  var w = 6 + at*0.34 + S.sharp*0.07 + (S.prep.coach?4:0)
        + momEdge()*5.5 - (S.knock > 0 ? 3.5 : 0)
        + (hasAsset("coach2") ? 2 : 0)
        + (S.sponsor && S.sponsor.id === "boots" ? 3 : 0)
        - ((M && M.opp ? M.opp.rep : 50) - 48)*0.085
        - Math.max(0, S.load-45)*0.13 - Math.max(0, 70-S.fit)*0.16
        + c.risk*0.55;
  if(hasTrait("clutch") && M && M.min >= 75) w *= 1.15;
  if(S.perkBoots) w += 6;
  w = clamp(w, 7, 42);
  MO.w = w;
  MO.center = clamp(30 + rnd()*40, 15, 80);

  var z = document.getElementById("moZone");
  z.style.insetInlineStart = Math.max(0, MO.center - w/2) + "%";
  z.style.width = w + "%";

  document.getElementById("moExec").style.display = "block";
  var info = document.getElementById("moInfo");
  if(info){
    info.innerHTML = '<span>' + (ATTR[c.at] ? ATTR[c.at].n : "יכולת") + ' <b>' + Math.round(at) + '</b></span>'
      + '<span>אזור מתוק <b>' + Math.round(w) + '%</b></span>'
      + '<span>כשירות <b>' + Math.round(S.fit) + '%</b></span>'
      + '<span>עומס <b>' + Math.round(S.load) + '%</b></span>';
  }
  if(document.getElementById("moRes").className === "res")
    document.getElementById("moRes").textContent = "עצור את המד בתוך האזור הירוק.";

  MO.pos = 0; MO.dir = 1;
  var speed = 0.95 + Math.max(0,S.load-40)*0.019 + Math.max(0,75-S.fit)*0.016
            + (M && M.min>=70 ? Math.max(0,S.load-50)*0.010 : 0);
  var ndl = document.getElementById("moNdl");
  (function loop(){
    if(!MO || MO.fired) return;
    MO.pos += MO.dir*speed;
    if(MO.pos>=100){MO.pos=100;MO.dir=-1}
    if(MO.pos<=0){MO.pos=0;MO.dir=1}
    ndl.style.insetInlineStart = "calc("+MO.pos+"% - 2px)";
    MO.raf = requestAnimationFrame(loop);
  })();
}


/* ══════════════════════════════════════════════════════════════════
   THE PITCH ENGINE — Phaser
   Everything with a ball in it is a Phaser scene now: the shot, the
   pass, the dribble and the free kick. The menus stay in the DOM, where
   Hebrew belongs; the canvas gets the part canvas is good at — motion,
   physics, particles and input. All four mini-games share one WebGL
   context: scenes are swapped, never re-created.

   Every scene reports back the same way — a grade and a forced outcome —
   so the rating engine, the box score and the storylets do not know or
   care that the ball moved on a canvas.
   ════════════════════════════════════════════════════════════════ */
var MINI = (function(){
  var game = null, mount = null, cb = null, curKey = null;
  var W = 430, H = 250;

  function ok(){ return typeof Phaser !== "undefined" && !!Phaser.Game; }

  /* ── the one input this game has ───────────────────────────────
     Press the ball, drag where you want it to go, let go. The drag
     length is power. Where on the ball you pressed is where you struck
     it, and that is what bends the flight — press the left of the ball
     and it curls right. Skill makes the bend bite harder and the strike
     land closer to where you meant. Nothing sweeps, nothing is timed;
     it is the same input for a shot, a pass, a cross and a free kick. */
  var Aim = {
    attach: function(sc, ball, cfg, onRelease){
      var g = sc.add.graphics();
      var ring = sc.add.graphics();
      var st = {live:false, strike:0, power:0, tx:0, ty:0, len:0};
      sc.aimState = st;

      function pointOnBall(p){
        var dx = p.x - ball.x, dy = p.y - ball.y;
        var d = Math.sqrt(dx*dx + dy*dy);
        return d <= cfg.grab;
      }
      function begin(p){
        if(sc.locked) return;
        /* the strike point: how far off centre you pressed, -1..1 */
        st.strike = Phaser.Math.Clamp((p.x - ball.x) / (cfg.ballR*1.25), -1, 1);
        if(!pointOnBall(p)) st.strike = 0;
        st.live = true;
        st.tx = p.x; st.ty = p.y;
      }
      function move(p){
        if(!st.live) return;
        st.tx = p.x; st.ty = p.y;
        st.len = Phaser.Math.Distance.Between(ball.x, ball.y, p.x, p.y);
        st.power = Phaser.Math.Clamp(st.len / cfg.maxDrag, 0, 1);
        draw();
      }
      function end(){
        if(!st.live) return;
        st.live = false;
        g.clear(); ring.clear();
        if(st.power < 0.08){             /* a tap is not a strike */
          MINI.stage("גרור מהכדור — כמה שיותר רחוק, כך חזק יותר");
          return;
        }
        sc.locked = true;
        onRelease({
          tx: st.tx, ty: st.ty, power: st.power,
          curve: st.strike * cfg.curveGain,
          strike: st.strike
        });
      }

      /* the flight the current drag would produce */
      function path(tx, ty, curve, steps){
        var mx = (ball.x + tx)/2, my = (ball.y + ty)/2;
        var nx = -(ty - ball.y), ny = (tx - ball.x);
        var nl = Math.sqrt(nx*nx + ny*ny) || 1;
        var bend = curve * cfg.bendPx;
        var cx = mx + (nx/nl)*bend, cy = my + (ny/nl)*bend;
        var pts = [];
        for(var i=0;i<=steps;i++){
          var s = i/steps;
          pts.push({
            x:(1-s)*(1-s)*ball.x + 2*(1-s)*s*cx + s*s*tx,
            y:(1-s)*(1-s)*ball.y + 2*(1-s)*s*cy + s*s*ty
          });
        }
        return pts;
      }
      sc.aimPath = path;

      function draw(){
        g.clear(); ring.clear();
        var pts = path(st.tx, st.ty, st.strike*cfg.curveGain, 22);
        /* the aim line thickens and warms with power, like a drawn bow */
        var col = st.power > 0.86 ? 0xEB6834 : (st.power > 0.5 ? 0xE8C766 : 0xffffff);
        for(var i=0;i<pts.length-1;i++){
          g.lineStyle(1 + st.power*3.4, col, 0.35 + 0.5*(i/pts.length));
          g.lineBetween(pts[i].x, pts[i].y, pts[i+1].x, pts[i+1].y);
        }
        var last = pts[pts.length-1];
        g.fillStyle(col, 0.95); g.fillCircle(last.x, last.y, 4 + st.power*4);
        /* and the mark on the ball showing where you are striking it */
        ring.lineStyle(2, 0x17150F, 0.8);
        ring.strokeCircle(ball.x + st.strike*cfg.ballR*0.72, ball.y, 3.5);
      }

      sc.input.on("pointerdown", begin);
      sc.input.on("pointermove", move);
      sc.input.on("pointerup", end);
      sc.input.on("pointerupoutside", end);
      /* the ball is always pressable even if the pointer starts beside it */
      MINI.tapFn = null;
      return st;
    }
  };

  var Base = {
    grass: function(sc, top, dark){
      var g = sc.add.graphics();
      var h = H - (top||0);
      for(var i=0;i<9;i++){
        g.fillStyle(i%2 ? 0x24784B : 0x1B6540, 1);
        g.fillRect(0, (top||0) + i*(h/9), W, h/9);
      }
      return g;
    },
    ball: function(sc, x, y, r){
      var b = sc.add.circle(x, y, r||10, 0xffffff);
      b.setStrokeStyle(2.5, 0x17150F, 0.9);
      return b;
    },
    man: function(sc, x, y, colour, r){
      var c = sc.add.container(x, y);
      var sh = sc.add.ellipse(0, (r||9)*1.25, (r||9)*2.1, (r||9)*0.6, 0x000000, 0.22);
      var body = sc.add.ellipse(0, 0, (r||9)*2, (r||9)*2.4, colour);
      var head = sc.add.circle(0, -(r||9)*1.5, (r||9)*0.62, 0xF0C27A);
      c.add([sh, body, head]);
      c.rad = r || 9;
      return c;
    },
    puff: function(sc, x, y, colour, n){
      for(var i=0;i<(n||10);i++){
        var p = sc.add.circle(x, y, 2 + Math.random()*2.5, colour, 0.9);
        sc.tweens.add({targets:p, x:x+(Math.random()-0.5)*80, y:y+(Math.random()-0.5)*66,
          alpha:0, duration:300+Math.random()*320, onComplete:function(){ p.destroy(); }});
      }
    },
    /* fly the ball down the exact path the player drew */
    fly: function(sc, ball, pts, ms, onDone){
      var t = {i:0};
      var trail = sc.time.addEvent({delay:24, loop:true, callback:function(){
        var d = sc.add.circle(ball.x, ball.y, 3.6, 0xffffff, 0.45);
        sc.tweens.add({targets:d, alpha:0, scale:0.2, duration:280, onComplete:function(){ d.destroy(); }});
      }});
      sc.tweens.add({targets:t, i:pts.length-1, duration:ms, ease:"Sine.easeOut",
        onUpdate:function(){
          var p = pts[Math.round(t.i)];
          if(p){ ball.x = p.x; ball.y = p.y; }
        },
        onComplete:function(){ trail.remove(); onDone && onDone(); }});
    },
    finish: function(sc, res){
      /* a plain timer, not the scene clock: the hand-off out of the engine
         must not depend on the scene still being alive to deliver it */
      if(cb){ var f = cb; cb = null; setTimeout(function(){ f(res); }, 640); }
    }
  };

  /* ══ 1. SHOT ═════════════════════════════════════════════════ */
  function ShotScene(){ Phaser.Scene.call(this, {key:"shot"}); }
  ShotScene.prototype = Object.create(Phaser.Scene.prototype);
  ShotScene.prototype.init = function(d){ this.cfg = d || {}; this.locked = false; this.done = false; };
  ShotScene.prototype.create = function(){
    var sc = this, c = this.cfg;
    sc.cameras.main.setBackgroundColor(0x2C3E50);
    var cr = sc.add.graphics();
    for(var i=0;i<170;i++){
      cr.fillStyle([0xF7F5F1,0xE8C766,0x8FA3B8,0xEB6834][i%4], 0.5);
      cr.fillCircle(Math.random()*W, Math.random()*58, 1.7);
    }
    Base.grass(sc, 62);

    var gx = W*0.13, gw = W*0.74, gy = 52, gh = 96;
    this.gx=gx; this.gw=gw; this.gy=gy; this.gh=gh;
    var net = sc.add.graphics();
    net.fillStyle(0xffffff, 0.08).fillRect(gx, gy, gw, gh);
    net.lineStyle(1, 0xffffff, 0.3);
    for(var x=gx;x<=gx+gw;x+=11) net.lineBetween(x, gy, x, gy+gh);
    for(var y=gy;y<=gy+gh;y+=11) net.lineBetween(gx, y, gx+gw, y);
    var fr = sc.add.graphics();
    fr.fillStyle(0xF7F5F1,1);
    fr.fillRoundedRect(gx-5, gy-5, 5, gh+5, 2);
    fr.fillRoundedRect(gx+gw, gy-5, 5, gh+5, 2);
    fr.fillRoundedRect(gx-5, gy-5, gw+10, 5, 2);

    this.keeper = Base.man(sc, gx+gw/2, gy+gh-12, 0x4A3AA7, 10);
    this.keepX = 0.5; this.keepDir = Math.random()<0.5?-1:1;
    this.keepSpeed = 0.00020 + c.gk*0.0000072;

    this.ball = Base.ball(sc, W/2, H-26, 11);
    Aim.attach(sc, this.ball, c, function(a){ sc.strike(a); });
  };
  ShotScene.prototype.update = function(t, dt){
    if(this.locked) return;
    this.keepX += this.keepDir*this.keepSpeed*dt;
    if(this.keepX > 0.78){ this.keepX = 0.78; this.keepDir = -1; }
    if(this.keepX < 0.22){ this.keepX = 0.22; this.keepDir = 1; }
    this.keeper.x = this.gx + this.gw*this.keepX;
  };
  ShotScene.prototype.strike = function(a){
    var sc = this, c = this.cfg;
    /* the ball does not go exactly where you meant — skill shrinks that */
    var sx = (Math.random()-0.5)*c.err*W, sy = (Math.random()-0.5)*c.err*H*0.5;
    var tx = a.tx + sx, ty = a.ty + sy;
    var pts = sc.aimPath(tx, ty, a.curve, 26);

    /* where the flight crosses the goal line is what counts */
    var cross = null;
    for(var i=1;i<pts.length;i++){
      if(pts[i-1].y > this.gy+this.gh*0.55 && pts[i].y <= this.gy+this.gh*0.55){ cross = pts[i]; break; }
    }
    if(!cross) cross = pts[pts.length-1];
    var relX = (cross.x - this.gx)/this.gw;
    var relY = (cross.y - this.gy)/this.gh;

    var read = Math.random() < c.readChance;
    if(read) this.keepX = Phaser.Math.Clamp(this.keepX + (relX - this.keepX)*(0.5+Math.random()*0.4), 0.1, 0.9);

    var reach = 0.10 + c.gk*0.0016 - a.power*0.05 - (Math.abs(a.curve) > 0.4 ? 0.03 : 0);
    var beaten = Math.abs(relX - this.keepX) > reach;
    var inFrame = relX > 0.01 && relX < 0.99 && ty < this.gy + this.gh && ty > this.gy - 6;

    var res = ty < this.gy - 6 ? "over"
            : (relX <= 0.01 || relX >= 0.99) ? "wide"
            : a.power < 0.22 ? "weak"
            : !beaten ? "save" : "goal";

    Base.fly(sc, this.ball, pts, 340 + (1-a.power)*260, function(){
      if(res === "goal"){
        Base.puff(sc, sc.ball.x, sc.ball.y, 0x1baf7a, 22);
        sc.cameras.main.shake(170, 0.013);
        var fl = sc.add.rectangle(W/2, H/2, W, H, 0x1baf7a, 0.2);
        sc.tweens.add({targets:fl, alpha:0, duration:420, onComplete:function(){ fl.destroy(); }});
      } else Base.puff(sc, sc.ball.x, sc.ball.y, res==="save"?0x4A3AA7:0xeb6834, 12);
    });
    sc.tweens.add({targets:this.keeper, x:this.gx+this.gw*Phaser.Math.Clamp(relX,0.08,0.92),
      angle: relX < this.keepX ? -60 : 60, duration:300, delay:90, ease:"Back.easeOut"});

    MINI.msg({goal:"⚽ גול!", save:(read?"🧤 הוא קרא אותך":"🧤 השוער הדף"),
      wide:"↗ החוצה", over:"⤴ מעל המסגרת", weak:"😐 חלש מדי"}[res], res==="goal");
    var grade = res==="goal" ? (a.power>0.5?"great":"good")
              : res==="save" ? "good" : res==="weak" ? "poor" : "fail";
    Base.finish(sc, {grade:grade, forced:{shot:res, goal:res==="goal",
      onTarget:(res==="goal"||res==="save")}});
  };

  /* ══ 2. PASS ═════════════════════════════════════════════════ */
  function PassScene(){ Phaser.Scene.call(this, {key:"pass"}); }
  PassScene.prototype = Object.create(Phaser.Scene.prototype);
  PassScene.prototype.init = function(d){ this.cfg = d || {}; this.locked = false; this.done = false; };
  PassScene.prototype.create = function(){
    var sc = this, c = this.cfg;
    sc.cameras.main.setBackgroundColor(0x1F6F43);
    Base.grass(sc, 0);
    var ln = sc.add.graphics();
    ln.lineStyle(2, 0xffffff, 0.26);
    ln.strokeRect(8, 8, W-16, H-16);
    ln.strokeRect(W*0.3, 8, W*0.4, 36);

    this.me = Base.man(sc, W/2, H-30, c.myColour, 10);
    this.ball = Base.ball(sc, W/2, H-42, 10);

    this.mates = [];
    for(var i=0;i<(c.mates||2);i++){
      var m = Base.man(sc, W*(0.24+0.52*(i/Math.max(1,(c.mates||2)-1))), 44+Math.random()*44, c.myColour, 9);
      m.vx = (Math.random()-0.5)*0.040;
      this.mates.push(m);
    }
    this.foes = [];
    for(var k=0;k<(c.foes||2);k++){
      var f = Base.man(sc, W*(0.26+0.48*Math.random()), H*0.44+(Math.random()-0.5)*44, c.oppColour, 10);
      f.vx = (Math.random()<0.5?-1:1)*(0.022+Math.random()*0.030);
      this.foes.push(f);
    }
    Aim.attach(sc, this.ball, c, function(a){ sc.strike(a); });
  };
  PassScene.prototype.update = function(t, dt){
    if(this.locked) return;
    this.mates.forEach(function(m){ m.x += m.vx*dt; if(m.x<30||m.x>W-30) m.vx*=-1; });
    this.foes.forEach(function(f){ f.x += f.vx*dt; if(f.x<24||f.x>W-24) f.vx*=-1; });
  };
  PassScene.prototype.strike = function(a){
    var sc = this, c = this.cfg;
    var tx = a.tx + (Math.random()-0.5)*c.err*W, ty = a.ty + (Math.random()-0.5)*c.err*H;
    var pts = sc.aimPath(tx, ty, a.curve, 26);

    var best = null, bestD = 1e9;
    this.mates.forEach(function(m){
      var d = Phaser.Math.Distance.Between(tx, ty, m.x, m.y);
      if(d < bestD){ bestD = d; best = m; }
    });
    var cut = null;
    this.foes.forEach(function(f){
      for(var i=2;i<pts.length-2;i++){
        if(Phaser.Math.Distance.Between(f.x, f.y, pts[i].x, pts[i].y) < c.cutRadius){ cut = f; return; }
      }
    });
    /* a firm pass is harder to read, a floated one is not */
    if(cut && a.power > 0.72 && Math.random() < 0.45) cut = null;

    var res = cut ? "cut" : (bestD < c.tolerance*0.55 ? "perfect"
            : bestD < c.tolerance ? "good" : "loose");

    Base.fly(sc, this.ball, pts, 300 + (1-a.power)*300, function(){
      if(res==="cut") Base.puff(sc, cut.x, cut.y, 0xeb6834, 14);
      else if(res!=="loose"){
        Base.puff(sc, best.x, best.y, 0x1baf7a, 14);
        sc.tweens.add({targets:best, scale:1.22, yoyo:true, duration:180});
      }
    });
    MINI.msg({perfect:"🎯 בול לרגל!", good:"✔ הגיעה", loose:"↗ רחוק ממנו", cut:"⛔ נחתכה"}[res],
      res==="perfect"||res==="good");
    var grade = res==="perfect"?"great":res==="good"?"good":res==="loose"?"poor":"fail";
    Base.finish(sc, {grade:grade, forced:{pass:res, made:(res==="perfect"),
      onTarget:(res==="perfect"||res==="good")}});
  };

  /* ══ 3. DRIBBLE ══════════════════════════════════════════════ */
  function DribbleScene(){ Phaser.Scene.call(this, {key:"dribble"}); }
  DribbleScene.prototype = Object.create(Phaser.Scene.prototype);
  DribbleScene.prototype.init = function(d){ this.cfg = d || {}; this.locked = false; this.done = false; };
  DribbleScene.prototype.create = function(){
    var sc = this, c = this.cfg;
    sc.cameras.main.setBackgroundColor(0x1F6F43);
    Base.grass(sc, 0);
    var ln = sc.add.graphics();
    ln.lineStyle(2, 0xffffff, 0.24); ln.strokeRect(8, 8, W-16, H-16);

    this.me = Base.man(sc, W/2, H-38, c.myColour, 11);
    this.ball = Base.ball(sc, W/2, H-52, 10);
    this.foe = Base.man(sc, W/2+(Math.random()-0.5)*50, 44, c.oppColour, 11);
    this.foe.vx = (Math.random()<0.5?-1:1)*0.045;
    this.commit = null; this.t = 0;
    this.hint = sc.add.graphics();
    Aim.attach(sc, this.ball, c, function(a){ sc.strike(a); });
  };
  DribbleScene.prototype.update = function(t, dt){
    if(this.locked || this.done) return;
    this.t += dt;
    var c = this.cfg;
    var closing = Phaser.Math.Clamp(this.t/c.closeMs, 0, 1);
    this.foe.y = 44 + closing*(H-120);
    this.foe.x += this.foe.vx*dt;
    if(this.foe.x<40||this.foe.x>W-40) this.foe.vx*=-1;

    if(!this.commit && closing > 0.58){
      this.commit = Math.random()<0.5 ? -1 : 1;
      this.commitAt = this.t;
      this.hint.clear();
      this.hint.fillStyle(0xEB6834, 0.7);
      this.hint.fillCircle(this.foe.x + this.commit*26, this.foe.y + 16, 15);
      this.tweens.add({targets:this.foe, angle:this.commit*20, duration:130});
      MINI.stage("הוא נשבר לצד — גרור לצד השני");
    }
    if(closing >= 1 && !this.done) this.strike(null);
  };
  DribbleScene.prototype.strike = function(a){
    if(this.done) return;
    this.done = true; this.locked = true;
    var sc = this, c = this.cfg;
    MINI.stage("");
    var dir = a ? (a.tx < this.ball.x ? -1 : 1) : 0;
    var res = !a ? "late"
            : !this.commit ? "early"
            : (this.t - this.commitAt > c.window) ? "late"
            : (dir !== this.commit) ? "beat" : "blocked";

    var tx = a ? Phaser.Math.Clamp(a.tx, 24, W-24) : this.ball.x;
    var ty = a ? Phaser.Math.Clamp(a.ty, 20, H-20) : this.ball.y;
    var pts = a ? sc.aimPath(tx, ty, a.curve, 20) : null;
    if(pts) Base.fly(sc, this.ball, pts, 300);
    sc.tweens.add({targets:this.me, x:tx, y: res==="beat" ? ty+20 : this.me.y-6,
      duration:360, ease:"Quad.easeOut"});
    if(res === "beat"){ Base.puff(sc, this.foe.x, this.foe.y, 0x1baf7a, 14); sc.cameras.main.shake(90, 0.006); }
    else Base.puff(sc, this.foe.x, this.foe.y, 0xeb6834, 12);

    MINI.msg({beat:"⚡ עברת אותו!", blocked:"⛔ הוא היה שם", early:"⏱ מוקדם מדי", late:"🐌 איחרת"}[res],
      res==="beat");
    var grade = res==="beat"?"great":res==="blocked"?"poor":"fail";
    Base.finish(sc, {grade:grade, forced:{dribble:res, made:(res==="beat")}});
  };

  /* ══ 4. FREE KICK ════════════════════════════════════════════ */
  function FreeKickScene(){ Phaser.Scene.call(this, {key:"freekick"}); }
  FreeKickScene.prototype = Object.create(Phaser.Scene.prototype);
  FreeKickScene.prototype.init = function(d){ this.cfg = d || {}; this.locked = false; this.done = false; };
  FreeKickScene.prototype.create = function(){
    var sc = this, c = this.cfg;
    sc.cameras.main.setBackgroundColor(0x2C3E50);
    var cr = sc.add.graphics();
    for(var i=0;i<130;i++){
      cr.fillStyle([0xF7F5F1,0xE8C766,0x8FA3B8][i%3], 0.45);
      cr.fillCircle(Math.random()*W, Math.random()*44, 1.6);
    }
    Base.grass(sc, 48);
    var gx=W*0.19, gw=W*0.62, gy=44, gh=72;
    this.gx=gx; this.gw=gw; this.gy=gy; this.gh=gh;
    var net = sc.add.graphics();
    net.fillStyle(0xffffff,0.08).fillRect(gx,gy,gw,gh);
    net.lineStyle(1,0xffffff,0.28);
    for(var x=gx;x<=gx+gw;x+=10) net.lineBetween(x,gy,x,gy+gh);
    for(var y=gy;y<=gy+gh;y+=10) net.lineBetween(gx,y,gx+gw,y);
    var fr = sc.add.graphics();
    fr.fillStyle(0xF7F5F1,1);
    fr.fillRoundedRect(gx-4,gy-4,4,gh+4,2);
    fr.fillRoundedRect(gx+gw,gy-4,4,gh+4,2);
    fr.fillRoundedRect(gx-4,gy-4,gw+8,4,2);

    this.keeper = Base.man(sc, gx+gw*0.5, gy+gh-10, 0x4A3AA7, 9);
    this.wallX = W*0.5 + (Math.random()-0.5)*44;
    this.wallY = H*0.60;
    this.wall = [];
    for(var k=0;k<4;k++) this.wall.push(Base.man(sc, this.wallX-27+k*18, this.wallY, c.oppColour, 9));

    this.ball = Base.ball(sc, W/2, H-22, 10);
    Aim.attach(sc, this.ball, c, function(a){ sc.strike(a); });
  };
  FreeKickScene.prototype.strike = function(a){
    var sc = this, c = this.cfg;
    var tx = a.tx + (Math.random()-0.5)*c.err*W, ty = a.ty + (Math.random()-0.5)*c.err*H*0.5;
    var pts = sc.aimPath(tx, ty, a.curve, 30);

    /* did the flight actually go through the wall */
    var hitWall = false;
    for(var i=0;i<pts.length;i++){
      if(Math.abs(pts[i].y - this.wallY) < 12 && Math.abs(pts[i].x - this.wallX) < 34
         && a.power < 0.80){ hitWall = true; break; }
    }
    var cross = null;
    for(var j=1;j<pts.length;j++){
      if(pts[j-1].y > this.gy+this.gh*0.55 && pts[j].y <= this.gy+this.gh*0.55){ cross = pts[j]; break; }
    }
    if(!cross) cross = pts[pts.length-1];
    var relX = (cross.x - this.gx)/this.gw;
    var keepX = (this.keeper.x - this.gx)/this.gw;
    var reach = 0.12 + c.gk*0.0015 - (Math.abs(a.curve)>0.45 ? 0.05 : 0) - a.power*0.04;
    var beaten = Math.abs(relX - keepX) > reach;

    var res = hitWall ? "wall"
            : ty < this.gy - 6 ? "over"
            : (relX <= 0.02 || relX >= 0.98) ? "wide"
            : !beaten ? "save" : "goal";

    Base.fly(sc, this.ball, pts, 420 + (1-a.power)*300, function(){
      if(res==="goal"){ Base.puff(sc, sc.ball.x, sc.ball.y, 0x1baf7a, 22); sc.cameras.main.shake(180, 0.014); }
      else Base.puff(sc, sc.ball.x, sc.ball.y, res==="wall"?0xeb6834:0x4A3AA7, 12);
    });
    if(!hitWall){
      sc.tweens.add({targets:this.keeper, x:this.gx+this.gw*Phaser.Math.Clamp(relX,0.1,0.9),
        angle: relX<keepX?-55:55, duration:340, delay:200, ease:"Back.easeOut"});
    }
    MINI.msg({goal:"⚽ ישירות מהבעיטה!", save:"🧤 השוער הגיע", wall:"🧱 בחומה",
      over:"⤴ מעל", wide:"↗ החוצה"}[res], res==="goal");
    var grade = res==="goal"?"great":res==="save"?"good":res==="wall"?"poor":"fail";
    Base.finish(sc, {grade:grade, forced:{shot:res==="goal"?"goal":(res==="save"?"save":"wide"),
      goal:res==="goal", onTarget:(res==="goal"||res==="save")}});
  };

  function host(){ return document.getElementById("miniHost"); }

  /* put the canvas exactly over the placeholder the card rendered */
  function placeHost(){
    var h = host(), ph = document.getElementById("miniCanvas"), app = document.getElementById("app");
    if(!h || !ph || !app) return null;
    var a = app.getBoundingClientRect(), r = ph.getBoundingClientRect();
    var k = (typeof APP_K === "number" && APP_K > 0) ? APP_K : 1;
    h.style.display = "block";
    h.style.left   = ((r.left - a.left)/k) + "px";
    h.style.top    = ((r.top  - a.top )/k) + "px";
    h.style.width  = (r.width /k) + "px";
    h.style.height = (r.height/k) + "px";
    return h;
  }
  MINI_place = placeHost;

  function boot(el){
    if(game) return game;
    game = new Phaser.Game({
      type: Phaser.AUTO, parent: el, width: W, height: H,
      transparent:false, banner:false, audio:{noAudio:true},
      /* FIT lets Phaser own the canvas size and, more importantly, keep the
         pointer-to-scene mapping correct — with NONE the mapping went stale
         every time the canvas moved to another mini-game's container */
      scale:{mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH,
             width: W, height: H},
      /* No scenes in the config: Phaser auto-starts the first one in the
         array, which would run with no config, throw inside create(), and
         leave the scene manager unable to start any of the others. They are
         added explicitly with autoStart false and started on demand. */
      scene: [],
      render:{antialias:true, powerPreference:"low-power"}
    });
    game.scene.add("shot", ShotScene, false);
    game.scene.add("pass", PassScene, false);
    game.scene.add("dribble", DribbleScene, false);
    game.scene.add("freekick", FreeKickScene, false);
    return game;
  }

  function play(key, cfg, done){
    var h = placeHost();
    if(!h || !ok()){ done && done(null); return; }
    cb = done;
    boot(h);
    curKey = key;
    var go = function(){
      var fit = function(){
        placeHost();
        /* let the scale manager measure the host itself — feeding it a size
           by hand raced with the layout and produced a canvas bigger than
           its own container */
        try { game.scale.refresh(); } catch(e){}
      };
      fit(); setTimeout(fit, 50); setTimeout(fit, 220);
      /* stop every scene unconditionally: a sleeping one still owns input */
      ["shot","pass","dribble","freekick"].forEach(function(k){
        try { game.scene.stop(k); } catch(e){}
      });
      game.scene.start(key, cfg);
    };
    if(game.isBooted) go(); else game.events.once("ready", go);
  }

  return {
    ok: ok, play: play, tapFn: null,
    tap: function(){},
    /* the running scene, for the DOM half and for tests */
    scene: function(){ return (game && curKey) ? game.scene.getScene(curKey) : null; },
    stage: function(txt){
      var s = document.getElementById("miniStage");
      if(s) s.textContent = txt || "";
    },
    msg: function(txt, good){
      var m = document.getElementById("miniMsg");
      if(!m) return;
      m.textContent = txt || "";
      m.className = txt ? ("minimsg on " + (good ? "good" : "bad")) : "minimsg";
    },
    place: function(){ return placeHost(); },
    hide: function(){ var h = host(); if(h) h.style.display = "none"; },
    destroy: function(){
      cb = null;
      var h = host(); if(h) h.style.display = "none";
      if(game){ try { game.destroy(true); } catch(e){} game = null; }
    }
  };
})();


/* ══════════════════════════════════════════════════════════════════
   WHICH MINI-GAME A CHOICE OPENS
   New Star Soccer never resolved anything with a dice roll: shooting,
   passing, dribbling and set pieces were all played. So are they here.
   Anything with no natural mini-game — a leadership call, a tactical
   decision, an off-ball run — still uses the execution meter, which is
   also the fallback if the engine did not load.
   ════════════════════════════════════════════════════════════════ */
function miniFor(choice, kind){
  if(!MINI.ok() || !choice) return null;
  var out = choice.out || "none";
  if(S.pos === "GK") return null;
  if(out === "goal")   return (kind === "setpiece") ? "freekick" : "shot";
  if(out === "assist" || out === "chance") return "pass";
  if((kind === "carry" || kind === "receive") && (out === "keep" || out === "chance" || out === "win"))
    return "dribble";
  return null;
}

function miniHtml(type){
  var TIP = {
    shot:     "לחץ על הכדור, גרור לאן שאתה רוצה שילך, ושחרר. מרחק = עוצמה · צד הכדור = סיבוב",
    pass:     "גרור מהכדור אל הרץ. ככל שתגרור רחוק יותר, המסירה חזקה יותר",
    dribble:  "חכה שהוא יישבר לצד — ואז גרור לצד השני",
    freekick: "גרור מעל החומה או סביבה. פגיעה בצד הכדור מעקמת אותו"
  };
  return '<div class="mini" id="miniBox">'
    + '<span class="ministage" id="miniStage">' + (TIP[type]||"") + '</span>'
    + '<div class="minicanvas" id="miniCanvas"></div>'
  + '</div>';
}

/* the numbers each scene needs, all of them read off the player */
function miniCfg(type, choice){
  var me = club(S.club), opp = M ? M.opp : {rep:55, c:"#888"};
  var at = S.a[choice.at] || 45;
  var gk = clamp(38 + opp.rep*0.55, 35, 92);
  var comp = S.a.cmp || 45, acc = S.a.acc || 45;
  var form = 1 + Math.max(0, S.load-45)*0.006 + Math.max(0, 70-S.fit)*0.005 - S.sharp*0.0015;

  var cfg = {
    myColour: parseInt(me.c.replace("#",""), 16),
    oppColour: parseInt((opp.c || "#8a8a8a").replace("#",""), 16),
    gk: gk,
    /* the drag itself: how big the ball's hit area is, how far a full-power
       pull is, and how hard the strike point bends the flight */
    ballR: 11, grab: 34, maxDrag: 210,
    curveGain: clamp(0.55 + at*0.0075 + (hasTrait("finisher") ? 0.10 : 0), 0.4, 1.35),
    bendPx: 78
  };

  if(type === "shot" || type === "freekick"){
    var fin = S.a[choice.at] || S.a.fin || 45;
    cfg.err = clamp((0.13 - fin*0.00090 - acc*0.00030) * form, 0.012, 0.13);
    cfg.readChance = clamp(0.08 + gk*0.0050 - comp*0.0016, 0.05, 0.55);
    cfg.curveGain *= 1 + (S.a.crs||45)*0.0035;
  }
  if(type === "pass"){
    var vis = S.a.vis || 45, spa = S.a.spa || 45;
    cfg.err = clamp((0.11 - vis*0.00075 - spa*0.00045) * form, 0.010, 0.11);
    cfg.tolerance = clamp(22 + vis*0.34 + spa*0.20, 24, 74);
    cfg.cutRadius = clamp(20 - comp*0.06 + opp.rep*0.14, 12, 30);
    cfg.mates = 2; cfg.foes = (M && M.opp.rep > 62) ? 3 : 2;
  }
  if(type === "dribble"){
    var drb = S.a.drb || 45, agi = S.a.agi || 45;
    cfg.err = 0.02;
    cfg.window = clamp(260 + drb*4.4 + agi*2.8 - opp.rep*3.4, 170, 680);
    cfg.closeMs = clamp(2700 - opp.rep*8, 1600, 2900);
  }
  return cfg;
}

function startMini(type, choice){
  var card = document.querySelector("#momentLayer .mcard");
  if(card) card.classList.add("playing");
  var box = document.getElementById("moExec");
  box.innerHTML = miniHtml(type);
  box.style.display = "block";
  MO.shooting = true;
  var picked = document.getElementById("moPicked");
  if(picked) picked.textContent = choice.b;

  var cfg = miniCfg(type, choice);
  var info = document.getElementById("moInfo");
  if(info) info.innerHTML = "";

  MINI.msg("");
  MINI.play(type, cfg, function(res){
    if(!res){ MO.shooting = false; return startMeterFor(choice); }
    if(res.forced && res.forced.goal){ confetti(60, ["#1baf7a","#E8C766","#FFFFFF"]); shake(); }
    resolveMoment(choice, res.grade, false, MO && MO.sit ? MO.sit.k : "", res.forced);
  });
}

/* ══════════════════════════════════════════════════════════════════
   THE SHOT — New Star Soccer's contribution to this game
   When the action you picked is a shot, the generic meter is replaced by
   the thing NSS built its whole game on: you look at the goal, you see
   the keeper, and you place the ball yourself. Two inputs — where, then
   how hard — and the result is decided by what you actually did, not by
   a dice roll behind the curtain. Attributes make the aim easier to
   land and the keeper easier to beat; they never take the shot for you.
   ════════════════════════════════════════════════════════════════ */
var SHOT = null, SHOT_LAST = null;

function isShotChoice(c){ return c && (c.out === "goal") && S.pos !== "GK"; }

function shotHtml(){
  return '<div class="shot" id="shotBox">'
    + '<div class="goalwrap">'
      + '<div class="crowd"></div>'
      + '<div class="goal">'
        + '<div class="net"></div>'
        + '<div class="post l"></div><div class="post r"></div><div class="bar"></div>'
        + '<div class="keeper" id="shKeep"><i></i></div>'
        + '<div class="aim" id="shAim"></div>'
        + '<div class="ball" id="shBall"></div>'
        + '<div class="shotmsg" id="shMsg"></div>'
      + '</div>'
      + '<div class="grass"></div>'
    + '</div>'
    + '<div class="powwrap"><span class="lbl" id="shStage">כוון — לחץ כדי לנעול</span>'
      + '<div class="pow"><i id="shPow"></i><span class="sweet" id="shSweet"></span></div></div>'
    + '<button class="btn pri big" id="shFire">כוון ▸</button>'
  + '</div>';
}

function startShot(choice){
  var box = document.getElementById("moExec");
  box.innerHTML = shotHtml();
  box.style.display = "block";

  var fin = S.a[choice.at] || S.a.fin || 45;
  var comp = S.a.cmp || 45;
  var gkSkill = clamp(38 + (M ? M.opp.rep : 55)*0.55, 35, 92);

  /* aim sweeps slower the calmer and sharper you are; tired legs speed it up */
  var aimSpeed = 1.55 - comp*0.0068 - S.sharp*0.0022
               + Math.max(0, S.load-45)*0.010 + Math.max(0, 70-S.fit)*0.009
               - (S.perkPsych ? 0.12 : 0) + (choice.risk < 0 ? 0.18 : 0);
  aimSpeed = clamp(aimSpeed, 0.55, 2.4);

  /* the band of power that actually beats a keeper — finishing widens it */
  var sweetW = clamp(16 + fin*0.30 + (hasTrait("finisher") ? 6 : 0) + (S.perkBoots ? 4 : 0)
                     - Math.max(0, S.load-55)*0.10, 12, 48);
  var sweetC = clamp(52 + (rnd()-0.5)*22, 26, 78);

  SHOT = {
    choice:choice, phase:"aim", x:8, dir:1, speed:aimSpeed,
    aimX:null, pow:0, powDir:1, powSpeed:1.9,
    sweetC:sweetC, sweetW:sweetW, gk:gkSkill,
    keepX:50, keepDir:(rnd()<0.5?-1:1), keepSpeed:0.35 + gkSkill*0.008,
    done:false, raf:null
  };

  document.getElementById("shSweet").style.left = (sweetC - sweetW/2) + "%";
  document.getElementById("shSweet").style.width = sweetW + "%";

  var fire = document.getElementById("shFire");
  fire.onclick = shotTap;
  document.getElementById("shotBox").onclick = function(e){
    if(e.target !== fire) shotTap();
  };

  var info = document.getElementById("moInfo");
  if(info) info.innerHTML = '';

  shotLoop();
}

function shotLoop(){
  if(!SHOT || SHOT.done) return;
  var aim = document.getElementById("shAim");
  var keep = document.getElementById("shKeep");
  var pow = document.getElementById("shPow");
  if(!aim || !keep){ SHOT = null; return; }

  /* the keeper never stands still */
  SHOT.keepX += SHOT.keepDir * SHOT.keepSpeed;
  if(SHOT.keepX > 74){ SHOT.keepX = 74; SHOT.keepDir = -1; }
  if(SHOT.keepX < 26){ SHOT.keepX = 26; SHOT.keepDir = 1; }
  keep.style.left = SHOT.keepX + "%";

  if(SHOT.phase === "aim"){
    SHOT.x += SHOT.dir * SHOT.speed;
    if(SHOT.x > 96){ SHOT.x = 96; SHOT.dir = -1; }
    if(SHOT.x < 4){ SHOT.x = 4; SHOT.dir = 1; }
    aim.style.left = SHOT.x + "%";
  } else if(SHOT.phase === "power"){
    SHOT.pow += SHOT.powDir * SHOT.powSpeed;
    if(SHOT.pow > 100){ SHOT.pow = 100; SHOT.powDir = -1; }
    if(SHOT.pow < 0){ SHOT.pow = 0; SHOT.powDir = 1; }
    pow.style.width = SHOT.pow + "%";
  }
  SHOT.raf = requestAnimationFrame(shotLoop);
}

function shotTap(){
  if(!SHOT || SHOT.done) return;
  if(SHOT.phase === "aim"){
    SHOT.aimX = SHOT.x;
    SHOT.phase = "power";
    document.getElementById("shAim").classList.add("locked");
    document.getElementById("shStage").textContent = "עוצמה — עצור בתוך הירוק";
    document.getElementById("shFire").textContent = "בעט ▸";
    return;
  }
  if(SHOT.phase === "power"){
    SHOT.phase = "fly";
    resolveShot();
  }
}

function resolveShot(){
  SHOT.done = true;
  if(SHOT.raf) cancelAnimationFrame(SHOT.raf);

  /* Two things stop perfect input from being a perfect goal, and both are
     football: the ball does not go exactly where you meant, and a good
     keeper sometimes reads you. Skill shrinks the first and the second
     stays honest — which is why a striker beats a great keeper more often
     than a teenager does, but never every time. */
  var acc = S.a.acc || 45, fin = S.a[SHOT.choice.at] || S.a.fin || 45;
  var err = clamp(29 - fin*0.20 - acc*0.06, 3.5, 22);
  var aimX = clamp(SHOT.aimX + (rnd()-0.5)*err, 0, 100);
  var power = SHOT.pow;

  var readChance = clamp(0.08 + SHOT.gk*0.0050 - (S.a.cmp||45)*0.0016, 0.05, 0.55);
  if(rnd() < readChance){
    var lean = clamp((aimX - SHOT.keepX) * (0.55 + rnd()*0.35), -26, 26);
    SHOT.keepX = clamp(SHOT.keepX + lean, 14, 86);
    SHOT.read = true;
  }
  var offCentre = Math.abs(power - SHOT.sweetC);
  var powerOk = offCentre <= SHOT.sweetW/2;
  var powerBad = offCentre > SHOT.sweetW;

  /* outside the posts is a miss, and the corners are the best place to be */
  var wide = aimX < 9 || aimX > 91;
  var corner = (aimX >= 9 && aimX <= 22) || (aimX >= 78 && aimX <= 91);

  /* how far the keeper can reach, in goal-width percent */
  var reach = 11 + SHOT.gk*0.17 + (powerOk ? 0 : 5) + (powerBad ? 5 : 0);
  if(corner) reach -= 4;
  var gap = Math.abs(aimX - SHOT.keepX);
  var beaten = gap > reach;

  var result, grade;
  if(wide && !powerOk){ result = "wide"; grade = "fail"; }
  else if(powerBad && power > SHOT.sweetC){ result = "over"; grade = "fail"; }
  else if(powerBad){ result = "weak"; grade = "poor"; }
  else if(!beaten){ result = "save"; grade = powerOk ? "good" : "poor"; }
  else if(wide){ result = "post"; grade = "poor"; }
  else { result = "goal"; grade = powerOk ? "great" : "good"; }

  var ball = document.getElementById("shBall");
  var msg  = document.getElementById("shMsg");
  var keep = document.getElementById("shKeep");
  if(ball){
    ball.style.transition = "left .42s cubic-bezier(.2,.7,.3,1), bottom .42s cubic-bezier(.2,.7,.3,1), transform .42s";
    ball.style.left = aimX + "%";
    ball.style.bottom = (26 + clamp(power, 0, 100)*0.52) + "%";
    ball.style.transform = "scale(.62)";
  }
  if(keep){
    keep.style.left = SHOT.keepX + "%";
    keep.classList.add(aimX < SHOT.keepX ? "diveL" : "diveR");
  }

  SHOT_LAST = result;
  var TXT = {
    goal:"⚽ גול!", save:(SHOT.read ? "🧤 הוא קרא אותך" : "🧤 השוער הדף"),
    wide:"↗ החוצה", over:"⤴ מעל המסגרת",
    weak:"😐 חלש מדי", post:"🅾 העמוד!"
  };
  if(msg){ msg.textContent = TXT[result]; msg.className = "shotmsg on " + (result==="goal"?"good":"bad"); }
  if(result === "goal"){ confetti(60, ["#1baf7a","#E8C766","#FFFFFF"]); shake(); }

  var st = document.getElementById("shStage");
  if(st) st.textContent = result === "goal" ? "בדיוק לשם כיוונת." :
    (result === "save" ? "הוא היה שם. פעם הבאה לפינה." : "לא הפעם.");

  setTimeout(function(){
    resolveMoment(SHOT.choice, grade, false, MO && MO.sit ? MO.sit.k : "shoot",
      {shot:result, goal:result === "goal", onTarget:(result === "goal" || result === "save")});
    SHOT = null;
  }, 620);
}

function fireMoment(){
  if(!MO || MO.pick===null || MO.fired || MO.shooting) return;
  MO.fired = true;
  if(MO.raf) cancelAnimationFrame(MO.raf);
  var fb = document.getElementById("moFire");
  if(fb) fb.disabled = true;

  var off = Math.abs(MO.pos - MO.center);
  var half = MO.w/2;
  var grade = off <= half*0.35 ? "great" : (off <= half ? "good" : (off <= half*1.9 ? "poor" : "fail"));
  resolveMoment(MO.choices[MO.pick], grade, false);
}

/* every Skill Moment leaves a line in the box score — that line, not the
   position, is what the rating engine later reads */
function momentStats(kind, out, grade, made, shot){
  var ok  = (grade === "great" || grade === "good");
  var bad = (grade === "fail");
  var gk  = (S.pos === "GK");

  if(out === "goal"){
    stat("shots");
    if(shot){
      if(shot.goal) stat("shotOnTarget");
      else if(shot.onTarget) stat("shotOnTarget");
      else stat("shotOffTarget");
      if(!shot.goal && shot.onTarget && rnd() < 0.4) stat("bigChanceMissed");
    }
    else if(made) stat("shotOnTarget");
    else if(ok){ stat("shotOnTarget"); if((kind === "shoot" || kind === "aerial") && rnd() < 0.45) stat("bigChanceMissed"); }
    else { stat("shotOffTarget"); if(bad && rnd() < 0.5) stat("bigChanceMissed"); }
  }
  else if(out === "assist"){
    if(shot && shot.pass){
      stat("passes");
      if(shot.pass === "cut"){ stat("passFailed"); stat("possessionLost"); }
      else if(made){ stat("keyPass"); stat("bigChanceCreated"); }
      else if(shot.onTarget){ stat("keyPass"); }
      else stat("passCompleted");
    }
    else if(made){ stat("keyPass"); stat("bigChanceCreated"); }
    else if(ok){
      if(rnd() < 0.5){ stat("keyPass"); if(rnd() < 0.30) stat("bigChanceCreated"); }
      else { stat("passes"); stat("passCompleted"); }
    }
    else { stat("passes"); stat("passFailed"); stat("possessionLost"); }
  }
  else if(out === "chance"){
    if(ok){
      if(rnd() < 0.55){ stat("keyPass"); if(grade === "great" && rnd() < 0.4) stat("bigChanceCreated"); }
      else { stat("passes"); stat("passCompleted"); }
    }
    else { stat("passes"); stat("passFailed"); if(bad) stat("possessionLost"); }
  }
  else if(out === "win"){
    if(ok){
      if(kind === "aerial") stat("aerialWon");
      else { stat("duelWon"); stat(rnd() < 0.5 ? "tackle" : "interception"); }
    } else {
      if(kind === "aerial") stat("aerialLost"); else stat("duelLost");
      if(bad && rnd() < 0.5){ stat("foul"); if(rnd() < 0.18) stat("yellow"); }
      if(bad && rnd() < 0.14) stat("error");
    }
  }
  else if(out === "save"){
    if(gk){
      if(ok){ stat("save"); if(grade === "great") stat("bigSave"); }
      else { stat("goalConceded"); if(bad && rnd() < 0.30) stat("error"); }
    } else {
      if(ok){ stat("block"); if(rnd() < 0.5) stat("clearance"); }
      else { stat("duelLost"); if(bad && rnd() < 0.35) stat("error"); }
    }
  }
  else if(out === "keep"){
    if(ok){ stat("passes"); stat("passCompleted"); if(rnd() < 0.5) stat("recovery"); if(rnd() < 0.3) stat("fouled"); }
    else { stat("passes"); stat("passFailed"); stat("possessionLost"); }
  }
  else {                       /* off-ball work, leadership, image — rarely a box-score line */
    if(grade === "great") stat("recovery");
    else if(bad) stat("possessionLost");
  }

  if(shot && shot.dribble){
    if(shot.made) stat("dribbleWon");
    else { stat("dribbleLost"); stat("possessionLost"); }
  }
  else if(kind === "carry" && out !== "keep"){ if(ok) stat("dribbleWon"); else { stat("dribbleLost"); stat("possessionLost"); } }
  if(kind === "setpiece" && ok && out !== "goal" && rnd() < 0.35) stat("fouled");
}

function resolveMoment(choice, grade, silent, kind, forced){
  var txt, cls, pts;
  var out  = choice ? (choice.out || "none") : "none";
  var risky = choice ? choice.risk < 2 : false;
  if(kind === undefined) kind = (MO && MO.sit) ? MO.sit.k : "";

  if(grade==="great"){ pts = risky ? 1.9 : 1.2; cls="great"; txt="ביצוע נקי. יצא בדיוק כפי שהתכוונת."; }
  else if(grade==="good" || grade==="ok"){ pts = risky ? 1.0 : 0.8; cls="good"; txt="יצא, אבל לא מושלם. עכשיו זה תלוי גם בחבר ליד וביריב."; }
  else if(grade==="poor"){ pts = -0.4; cls="poor"; txt="איבדת דיוק. דוח התפקיד עדיין יכיר בבחירה הנכונה."; }
  else { pts = risky ? -1.3 : -0.8; cls="fail"; txt="לא יצא. זה לא Game Over — זו שורה בדוח."; }

  M.score += pts; M.count++;
  if(grade==="fail") M.errors = (M.errors||0)+1;

  /* WHAT the action produces comes from the choice, never from the position.
     A centre-back who wins a header at a corner can score; a striker who
     slides a through ball gets the assist. */
  var landed = (grade === "great") || (grade === "good" && rnd() < 0.38);
  /* anything you played yourself is not re-rolled behind your back */
  if(forced && (forced.shot || forced.pass || forced.dribble)) landed = !!(
    forced.goal || forced.made || forced.onTarget);
  var outcome = "";

  var made = false;

  if(landed && out === "goal" && (forced && forced.shot ? forced.goal
        : rnd() < (hasTrait("finisher") ? 0.44 : 0.34))){
    made = true;
    if(M.me===M.home) M.hg++; else M.ag++;
    S.goals++; S.careerGoals++; M.gAdded++; M.score += 1.2; stat("goals");
    outcome = " שער!";
    if(!silent){ addEv(M.min, "⚽ שער שלך! "+M.home.ab+" "+M.hg+"–"+M.ag+" "+M.away.ab, "goal"); goalFlash(true); }
  }
  else if(landed && out === "assist" && (forced && forced.pass ? forced.made : rnd() < 0.34)){
    made = true;
    if(M.me===M.home) M.hg++; else M.ag++;
    S.assists++; S.careerAssists++; M.aAdded++; M.score += 0.9; stat("assists");
    outcome = " בישול!";
    if(!silent){ addEv(M.min, "🅰 בישול שלך — הכדור מגיע ומסתיים ברשת.", "goal"); goalFlash(true); }
  }
  else if(landed && out === "chance"){
    M.chances = (M.chances||0)+1; M.score += 0.3;
    outcome = " הזדמנות נוצרה.";
    if(!silent) addEv(M.min, "✳ יצרת מצב — האנליסט יסמן את זה.", "you");
  }
  else if(landed && (out === "win" || out === "save")){
    M.duels = (M.duels||0)+1; M.score += 0.35;
    outcome = out === "save" ? " הצלה!" : " ניצחת את הדו־קרב.";
    if(!silent) addEv(M.min, (out==="save" ? "🧤 הצלה שלך." : "🛡 חילוץ נקי שלך."), "you");
  }
  else if(landed && out === "keep"){
    M.keeps = (M.keeps||0)+1; M.score += 0.12;
  }
  else if(grade === "fail" && !silent){
    addEv(M.min, (out==="save" ? "🥅 הכדור עבר אותך." : "❌ איבוד כדור שלך באזור מסוכן."), "bad");
  }
  else if(grade === "great" && !silent){
    addEv(M.min, "✔ פעולה נקייה שלך.", "you");
  }

  momentStats(kind, out, grade, made, forced && forced.shot ? forced : null);

  /* momentum answers to what just happened */
  if(M){
    if(made) M.mom = clamp((M.mom||0) + 18, -100, 100);
    else if(grade === "great") M.mom = clamp((M.mom||0) + 6, -100, 100);
    else if(grade === "fail")  M.mom = clamp((M.mom||0) - 7, -100, 100);
    paintMom();
  }

  /* a signature move that lands is worth remembering */
  if(choice && choice.sig && (grade === "great" || (grade === "good" && made))){
    M.sigLanded = (M.sigLanded||0) + 1;
    S.sigCount = (S.sigCount||0) + 1;
    if(!silent){
      var mvo = MOVES.filter(function(x){ return x.id === choice.sig; })[0];
      if(mvo) addEv(M.min, mvo.i + " " + mvo.n + " — בדיוק כמו באימונים.", "you");
      confetti(40, ["#E8C766","#1baf7a","#FFFFFF"]);
    }
  }

  if(silent) return;

  var hg = document.getElementById("mHG"), ag = document.getElementById("mAG");
  if(hg) hg.textContent = M.hg; if(ag) ag.textContent = M.ag;

  var r = document.getElementById("moRes");
  r.className = "res " + cls;
  r.innerHTML = "<b>" + (grade==="great"?"מצוין":(grade==="good"?"סביר":(grade==="poor"?"לקוי":"כישלון"))) + outcome + "</b>" + txt;

  var tEl = document.getElementById("mTouch"); if(tEl) tEl.textContent = "מגעים " + M.count;
  var rt = document.getElementById("mRate"); if(rt) rt.textContent = "ציון " + liveRating().toFixed(1);

  var nx = document.getElementById("moNext");
  nx.style.display = "block";
  nx.onclick = closeMoment;
}

/* ══════════════════════════════════════════════════════════════════
   MATCH RATING — event-weighted, in the style of the public analytics
   providers. Every player starts at 6.0 and moves on what they actually
   did. Weights sit in one table so they can be tuned in one place.

   Positional multipliers reflect how NOTABLE an action is for that role:
   a centre-back's clearance is routine (x1.0) while his assist is
   exceptional (x1.5); a striker's tackle is unusual (x1.4) while his
   shot is his job (x1.0). Volume does the rest — defenders accumulate
   many defensive actions, attackers accumulate many attacking ones.
   A striker with no goal but two assists therefore rates well.
   ════════════════════════════════════════════════════════════════ */
var RW = {
  /* the headline events — these are what a rating is actually made of */
  goals:1.00, assists:0.80, bigChanceCreated:0.26, keyPass:0.13,
  shotOnTarget:0.07, shotOffTarget:-0.030, bigChanceMissed:-0.30,
  penaltyWon:0.42, penaltyMissed:-0.55, ownGoal:-1.10,
  /* carrying and contesting */
  dribbleWon:0.070, dribbleLost:-0.055, duelWon:0.030, duelLost:-0.035,
  aerialWon:0.050, aerialLost:-0.035,
  /* defending — small per action, meaningful in volume */
  tackle:0.060, interception:0.060, clearance:0.025, block:0.060, recovery:0.018,
  /* the run of play */
  passCompleted:0.004, passFailed:-0.014, possessionLost:-0.018,
  foul:-0.040, fouled:0.015, yellow:-0.22, red:-1.30,
  /* the goal itself */
  save:0.13, bigSave:0.26, goalConceded:-0.18, cleanSheet:0.38, error:-0.70
};

var RW_GROUP = {
  goals:"att", assists:"att", bigChanceCreated:"att", keyPass:"att",
  shotOnTarget:"att", shotOffTarget:"att", bigChanceMissed:"att",
  dribbleWon:"att", dribbleLost:"att", penaltyWon:"att", penaltyMissed:"att",
  duelWon:"neu", duelLost:"neu", recovery:"neu", passCompleted:"neu",
  passFailed:"neu", possessionLost:"neu", foul:"neu", fouled:"neu",
  yellow:"neu", red:"neu", error:"neu", ownGoal:"neu",
  aerialWon:"def", aerialLost:"def", tackle:"def", interception:"def",
  clearance:"def", block:"def",
  save:"gk", bigSave:"gk", goalConceded:"gk", cleanSheet:"gk"
};

/* att = attacking actions, def = defensive actions, gk = goalkeeping */
var RATE_POS = {
  GK :{att:1.3, def:1.0, gk:1.00, neu:1.0, par:0.55},
  CB :{att:1.5, def:1.00, gk:0, neu:1.0, par:1.51},
  LB :{att:1.3, def:1.05, gk:0, neu:1.0, par:1.33},
  RB :{att:1.3, def:1.05, gk:0, neu:1.0, par:1.33},
  LWB:{att:1.2, def:1.05, gk:0, neu:1.0, par:1.47},
  RWB:{att:1.2, def:1.05, gk:0, neu:1.0, par:1.47},
  CDM:{att:1.3, def:1.05, gk:0, neu:1.0, par:1.35},
  CM :{att:1.1, def:1.15, gk:0, neu:1.0, par:1.48},
  CAM:{att:1.0, def:1.30, gk:0, neu:1.0, par:1.39},
  LM :{att:1.05,def:1.20, gk:0, neu:1.0, par:1.63},
  RM :{att:1.05,def:1.20, gk:0, neu:1.0, par:1.63},
  LW :{att:1.0, def:1.40, gk:0, neu:1.0, par:1.65},
  RW :{att:1.0, def:1.40, gk:0, neu:1.0, par:1.65},
  CF :{att:1.0, def:1.40, gk:0, neu:1.0, par:1.42},
  ST :{att:1.0, def:1.45, gk:0, neu:1.0, par:1.35}
};

function blankStats(){
  return {
    goals:0, assists:0, shots:0, shotOnTarget:0, shotOffTarget:0,
    bigChanceCreated:0, bigChanceMissed:0, keyPass:0,
    passes:0, passCompleted:0, passFailed:0,
    dribbleWon:0, dribbleLost:0, duelWon:0, duelLost:0,
    aerialWon:0, aerialLost:0,
    tackle:0, interception:0, clearance:0, block:0, recovery:0,
    possessionLost:0, foul:0, fouled:0, yellow:0, red:0, error:0,
    save:0, bigSave:0, goalConceded:0, cleanSheet:0,
    penaltyWon:0, penaltyMissed:0, ownGoal:0
  };
}
function stat(k, n){
  if(!M || !M.st) return;
  M.st[k] = (M.st[k]||0) + (n===undefined ? 1 : n);
}

function ratingFrom(st, mins, pos, teamGoals, oppGoals, oppRep){
  var mult = RATE_POS[pos] || RATE_POS.CM;
  var r = 6.0, contrib = 0;

  for(var k in RW){
    var n = st[k] || 0;
    if(!n) continue;
    var g = RW_GROUP[k] || "neu";
    var m = g === "gk" ? (mult.gk || 0) : (mult[g] === undefined ? 1 : mult[g]);
    if(RW[k] < 0 && g !== "gk") m = 1;   /* the bonus is for the rare deed, not the rare mistake */
    contrib += RW[k] * n * m;
  }
  /* PAR — what a competent player in this role accumulates in a normal
     ninety minutes. Subtracting it is what makes 6.0 mean "average" and
     not "showed up": a goalkeeper makes saves every week, so saves alone
     are not a good game; a striker's par is low, so a goal really moves
     the needle. Scaled by minutes, because a substitute cannot be
     expected to reach a full match's par. */
  /* Expectation rises with ability. A 6.8 for a 48-rated teenager and a 6.8
     for an 85-rated international are not the same afternoon, and it is the
     same scale for both — so par grows as you do, and it saturates, because
     the ceiling on how much football one player can do is not infinite.
     Without this term, improving would quietly inflate every rating you
     ever get again: exactly how you end up "above 7.0 for 25 straight". */
  var par = (mult.par || 0) + 1.35 * (1 - Math.exp(-Math.max(0, ovr()-47)/16));
  par *= clamp(mins/90, 0.15, 1);
  r += contrib - par;

  /* being anonymous is its own penalty — no shots, no key passes, no
     defensive actions in a full match is a 5.9, whatever your position */
  var involvement = (st.shots||0) + (st.keyPass||0) + (st.tackle||0) + (st.interception||0)
                  + (st.dribbleWon||0) + (st.aerialWon||0) + (st.save||0) + (st.clearance||0)
                  + (st.goals||0)*3 + (st.assists||0)*3;
  if(mins >= 60 && involvement <= 1) r -= 0.45;
  else if(mins >= 60 && involvement <= 3) r -= 0.18;

  /* keeping the ball out is part of the job in proportion to the job:
     a clean sheet is worth a lot to a centre-back and almost nothing to
     a winger, and conceding costs on the same scale. Keepers already got
     paid for it through the gk weights above. */
  if(pos !== "GK"){
    var dw = (POS[pos] && POS[pos].w.DEF) || 0;
    if(st.cleanSheet) r += 0.08 + dw*0.80;
    else r -= clamp(oppGoals, 0, 4) * dw * 0.15;
  }

  /* team context, lightly */
  r += teamGoals > oppGoals ? 0.18 : (teamGoals < oppGoals ? -0.14 : 0.02);
  r += clamp((oppRep - club(S.club).rep)/60, -0.18, 0.22);

  /* a cameo cannot swing to the extremes */
  var w = clamp(mins/70, 0.34, 1);
  r = 6.15 + (r - 6.15) * w;

  /* Both ends of the scale are compressed, the way published ratings are:
     a hat-trick is a 9, four goals is not a 12, and one bad afternoon is
     a 4.9 rather than a 3.1. Tens exist — they are just very expensive. */
  if(r > 7.6) r = 7.6 + (r - 7.6) * 0.70;
  if(r > 8.4) r = 8.4 + (r - 8.4) * 0.55;
  if(r < 5.6) r = 5.6 - (5.6 - r) * 0.70;

  return clamp(r, 3.0, 10);
}

/* minutes YOU have played, which is not the same as the clock — a
   substitute must be judged against a substitute's share of the match */
function minutesPlayed(){
  if(!M || !M.playing) return 0;
  if(M.min >= 90) return M.mins;
  return clamp(M.min - (M.entryMin || 0), 0, 90);
}

function liveRating(){
  if(!M || !M.playing) return 0;
  var myG = M.me===M.home ? M.hg : M.ag;
  var opG = M.me===M.home ? M.ag : M.hg;
  if(M.noise === undefined) M.noise = (rnd()-0.5) * 0.20;
  return clamp(ratingFrom(M.st, Math.max(minutesPlayed(), 10), S.pos, myG, opG, M.opp.rep) + M.noise, 3.0, 10);
}

/* the stat line, grouped the way a match report groups it */
var STAT_GROUPS = [
  {n:"התקפה", keys:[["goals","שערים"],["assists","בישולים"],["shots","בעיטות"],
    ["shotOnTarget","למסגרת"],["bigChanceMissed","החמצות גדולות"],["penaltyWon","פנדלים שהושגו"]]},
  {n:"יצירה", keys:[["keyPass","מסירות מפתח"],["bigChanceCreated","מצבים גדולים שנוצרו"],
    ["passCompleted","מסירות שהגיעו"],["passFailed","מסירות שאבדו"]]},
  {n:"נשיאת כדור", keys:[["dribbleWon","דריבלים מוצלחים"],["dribbleLost","דריבלים שנכשלו"],
    ["fouled","עבירות שספגת"],["possessionLost","איבודי כדור"]]},
  {n:"הגנה", keys:[["tackle","תיקולים"],["interception","יירוטים"],["clearance","הרחקות"],
    ["block","חסימות"],["recovery","כדורים שנאספו"],["duelWon","דו־קרבות שנוצחו"],
    ["duelLost","דו־קרבות שאבדו"],["aerialWon","ניצחונות אוויריים"],["aerialLost","הפסדים אוויריים"],
    ["cleanSheet","שער נקי"]]},
  {n:"שוער", keys:[["save","הצלות"],["bigSave","הצלות גדולות"],["goalConceded","ספג"]]},
  {n:"משמעת", keys:[["foul","עבירות"],["yellow","צהובים"],["red","אדומים"],["error","טעויות שהובילו לשער"]]}
];

var STAT_NAME = (function(){
  var m = {};
  for(var i=0;i<STAT_GROUPS.length;i++)
    for(var j=0;j<STAT_GROUPS[i].keys.length;j++)
      m[STAT_GROUPS[i].keys[j][0]] = STAT_GROUPS[i].keys[j][1];
  m.possessionLost = "איבודי כדור"; m.shotOffTarget = "בעיטות שהחטיאו";
  m.ownGoal = "שער עצמי"; m.penaltyMissed = "פנדל שהוחמץ";
  m.bigChanceCreated = "מצבים גדולים שנוצרו"; m.passes = "מסירות";
  return m;
})();

/* the same arithmetic the rating used, opened up so you can read it —
   this is the part the published ratings never show you */
function ratingBreakdown(st, pos){
  var mult = RATE_POS[pos] || RATE_POS.CM, out = [];
  for(var k in RW){
    var n = st[k] || 0; if(!n) continue;
    var g = RW_GROUP[k] || "neu";
    var m = g === "gk" ? (mult.gk || 0) : (mult[g] === undefined ? 1 : mult[g]);
    if(RW[k] < 0 && g !== "gk") m = 1;
    var d = RW[k] * n * m;
    if(Math.abs(d) < 0.03) continue;
    out.push({k:k, n:n, d:d, name:(STAT_NAME[k] || k), boost:(m > 1.05)});
  }
  out.sort(function(a,b){ return Math.abs(b.d) - Math.abs(a.d); });
  return out;
}

function statLineHtml(st, pos){
  var groups = STAT_GROUPS.map(function(g){
    var rows = g.keys.filter(function(kk){ return (st[kk[0]]||0) !== 0; });
    if(!rows.length) return "";
    return '<div class="statgrp"><p class="lbl">'+g.n+'</p>'
      + rows.map(function(kk){
          return '<div class="kv"><span>'+kk[1]+'</span><b class="n">'+(st[kk[0]]||0)+'</b></div>';
        }).join("")
      + '</div>';
  }).filter(Boolean).join("");

  var pa = st.passes ? Math.round((st.passCompleted/st.passes)*100) : 0;
  var head = '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px">'
    + '<span class="tag">'+(st.passes||0)+' מסירות</span>'
    + (st.passes ? '<span class="tag '+(pa>=85?"ok":(pa>=75?"":"w"))+'">'+pa+'% דיוק</span>' : '')
    + '<span class="tag">'+((st.duelWon||0)+(st.duelLost||0))+' דו־קרבות · '+(st.duelWon||0)+' נוצחו</span>'
    + (st.shots ? '<span class="tag">'+st.shots+' בעיטות</span>' : '')
    + '</div>';

  var bd = ratingBreakdown(st, pos);
  var max = bd.length ? Math.abs(bd[0].d) : 1;
  var bdHtml = bd.slice(0,9).map(function(b){
    var w = clamp(Math.abs(b.d)/max*50, 3, 50);
    var up = b.d > 0;
    return '<div class="bdrow">'
      + '<span class="bn">'+b.name+' <span class="muted">×'+b.n+'</span>'+(b.boost?' <span class="tag g" style="padding:1px 6px">נדיר בעמדה</span>':'')+'</span>'
      + '<span class="bt"><i class="'+(up?"":"dn")+'" style="'+(up?"left:50%":"right:50%;left:auto")+';width:'+w+'%"></i><span class="bdmid"></span></span>'
      + '<span class="bv '+(up?"up":"dn")+'">'+(up?"+":"−")+Math.abs(b.d).toFixed(2)+'</span>'
      + '</div>';
  }).join("");

  return '<div class="p"><h3>גיליון הביצועים</h3><div class="pb">'
    + head
    + (groups ? '<div class="statwrap">'+groups+'</div>' : '<div class="empty">אין נתונים.</div>')
    + '</div></div>'
    + '<div class="p"><h3>מה הזיז את הציון</h3><div class="pb">'
    + '<p class="muted xs" style="margin:0 0 8px">בסיס 6.0 · כל פעולה נשקלת לפי סוגה ולפי כמה היא חריגה לעמדה שלך</p>'
    + '<div class="bd">'+bdHtml+'</div>'
    + '</div></div>';
}

function closeMoment(){
  if(SHOT && SHOT.raf) cancelAnimationFrame(SHOT.raf);
  SHOT = null;
  MINI.tapFn = null;
  MINI.hide();
  var el = document.getElementById("momentLayer");
  if(el) el.remove();
  MO = null;
  M.timer = setTimeout(tickMatch, 120);
}

/* ── finish ────────────────────────────────────────────────────── */
function finishMatch(){
  if(M.timer) clearTimeout(M.timer);
  stopPitch();
  M.running = false;

  if(M.playing && M.st){
    var conc = (M.me===M.home ? M.ag : M.hg);
    if(S.pos === "GK") M.st.goalConceded = conc;
    if(conc === 0 && M.mins >= 55) M.st.cleanSheet = 1;
  }

  var rating = M.playing ? liveRating() : 0;
  var fx = M.fx;
  fx.res = M.hg + "–" + M.ag;

  var myG = M.me===M.home ? M.hg : M.ag;
  var opG = M.me===M.home ? M.ag : M.hg;

  if(S.nemesis && M.fx.opp === S.nemesis.club){
    var h = S.nemesis.h2h;
    if(myG > opG) h.w++; else if(myG < opG) h.l++; else h.d++;
    S.brand = clamp((S.brand||0) + (myG > opG ? 4 : 1), 0, 100);
    M.wasNemesis = true;
    news((myG > opG ? "🔥 " : "") + S.name + " מול <bdi>" + S.nemesis.n + "</bdi>: "
      + myG + "–" + opG + " · ראש בראש " + h.w + "-" + h.d + "-" + h.l,
      myG > opG ? "ok" : (myG < opG ? "b" : "w"));
  }

  applyResult(S.club, M.fx.opp, myG, opG);
  awardGoals(S.league, S.club, myG); awardGoals(S.league, M.fx.opp, opG);
  simWorld(S.club);

  if(M.playing){
    S.apps++; S.careerApps++; S.minutes += M.mins; S.ratings.push(rating);
    M.hurt = null;
    var risk = injuryRisk(M.mins) + reinjuryRisk()*0.55 + (M.load2 ? 0.012 : 0)
             + (S.knock > 0 ? 0.035 : 0);
    if(rnd() < risk){
      var kind = rollSeverity();
      /* inside the comeback window it is rarely just a knock */
      if(S.comeback && kind.sev < 3 && rnd() < 0.5) kind = INJ[kind.sev];
      var part = INJ_PART[ri(0, INJ_PART.length-1)];
      var wks = applyInjury(kind, part);
      M.hurt = {n:kind.n, part:part, weeks:wks, sev:kind.sev};
      news((wks ? "🚑 " : "🩹 ") + S.name + " — " + kind.n + " ב" + part
        + (wks ? " · " + wks + " שבועות בחוץ." : " · ממשיך לשחק."), wks ? "b" : "w");
    }
    if(rating > S.bestRating) S.bestRating = rating;
    S.streak = rating >= 7 ? S.streak + 1 : 0;
    if(S.streak > S.bestStreak) S.bestStreak = S.streak;
    /* the manager weighs the job description as heavily as the score line */
    M.role = roleReport(M.st, M.mins, S.pos);
    if(!S.seasonSt) S.seasonSt = blankStats();
    for(var sk in M.st) S.seasonSt[sk] = (S.seasonSt[sk]||0) + M.st[sk];
    S.roleScores.push(M.role.score);
    if(S.roleScores.length > 40) S.roleScores.shift();

    var dTrust = (rating-6.6)*3.0 + (M.role.score-58)*0.055 + (myG>opG?1.5:(myG<opG?-0.8:0.3));
    if(hasTrait("leader") && dTrust < 0) dTrust *= 0.6;
    dTrust += (coachFit()-55) * 0.05;
    S.trust = clamp(S.trust + dTrust, 0, 100);
    S.sharp = clamp(S.sharp + 9, 0, 100);
    S.load  = clamp(S.load + M.mins*(hasTrait("engine") ? 0.12 : 0.16), 0, 100);
    S.fit   = clamp(S.fit - M.mins*0.09, 20, 100);
    S.morale= clamp(S.morale + (myG>opG?7:(myG<opG?-4:1)) + (rating-6.6)*3, 0, 100);
  } else {
    S.trust = clamp(S.trust - 1.5, 0, 100);
    S.morale = clamp(S.morale - 4, 0, 100);
  }

  if(M.playing){
    S.matches.unshift({
      s:S.season, w:S.week, opp:M.opp.ab, oppN:M.opp.n, home:M.fx.home,
      res:(M.me===M.home ? M.hg+"–"+M.ag : M.ag+"–"+M.hg),
      mins:M.mins, r:Number(rating.toFixed(1)), g:M.gAdded||0, a:M.aAdded||0,
      st:M.st, role:M.role ? M.role.score : 0, comp:"ליגה"
    });
    if(S.matches.length > 60) S.matches.pop();
  }

  var scoutHit = false;
  if(M.playing && rating>=7.4 && rnd()<0.45){
    var pool = suitorPool();
    if(pool.length){
      var e = pool[ri(0,pool.length-1)];
      if(!S.interest.some(function(x){return x.id===e.id})){
        S.interest.push({id:e.id, n:e.n, ab:e.ab, c:e.c, lg:LEAGUES[e.lg].n, rep:e.rep, lvl:1});
        scoutHit = true;
      }
    }
  }

  /* ── rewards ─────────────────────────────────────────────────── */
  var ovrBefore = ovr();
  S.valuePrev = value();

  var xp = S.trainXp || 0;
  var xpRows = [];
  if(S.trainXp) xpRows.push({l:"אימוני השבוע", v:S.trainXp});

  var matchGains = [];
  if(M.playing){
    var mx = 40 + Math.round(M.mins*0.9) + Math.round(Math.max(0,(rating-6))*70);
    xpRows.push({l:M.mins+" דקות משחק", v:40 + Math.round(M.mins*0.9)});
    if(rating>6) xpRows.push({l:"ציון "+rating.toFixed(1), v:Math.round((rating-6)*70)});
    xp += mx;
    if(M.gAdded){ xp += M.gAdded*120; xpRows.push({l:M.gAdded+" שערים", v:M.gAdded*120}); }
    if(M.aAdded){ xp += M.aAdded*80;  xpRows.push({l:M.aAdded+" בישולים", v:M.aAdded*80}); }
    if(myG>opG){ xp += 60; xpRows.push({l:"ניצחון", v:60}); }
    if(S.streak>=3){ xp += 50*S.streak; xpRows.push({l:"רצף "+S.streak+" משחקים", v:50*S.streak}); }
    if(M.sigLanded){ xp += M.sigLanded*90; xpRows.push({l:M.sigLanded+" מהלכי חתימה", v:M.sigLanded*90}); }
    if(M.role && M.role.score >= 78){ xp += 70; xpRows.push({l:"תפקיד מבוצע במלואו", v:70}); }

    /* learning by doing: the attributes you actually leaned on this match */
    var used = POS[S.pos].key.slice(0, 3);
    matchGains = grow(used, 0.16 + Math.max(0, rating-6.5)*0.22);
  }

  (S.trainGains||[]).forEach(function(g){ matchGains.push(g); });

  var levels = addXp(xp);
  var ovrAfter = ovr();
  S.ovrPrev = ovrBefore;

  /* brand, season counters, and whoever is keeping score of you */
  if(M.playing){
    S.brand = clamp((S.brand||0) + brandGain(rating, M.role ? M.role.score : 55,
      M.gAdded||0, M.aAdded||0, M.sigLanded||0), 0, 100);
    S.sigSeason = (S.sigSeason||0) + (M.sigLanded||0);
    if(M.st && M.st.cleanSheet) S.cleanSheets = (S.cleanSheets||0) + 1;
    S.lowRuns = rating < 6.0 ? (S.lowRuns||0) + 1 : 0;
    if(S.sponsor){
      var spd = SPONSORS.filter(function(x){ return x.id === S.sponsor.id; })[0];
      if(spd && spd.ask === "perform" && S.lowRuns >= 3) dropSponsor("שלושה משחקים חלשים ברצף");
      if(spd && spd.ask === "clean" && M.st && M.st.red) dropSponsor("כרטיס אדום");
    }
  }
  var objPaid = checkObjectives();
  nemesisWeek();

  var badges = checkBadges();
  var newTraits = checkTraits();
  var newMoves = checkMoves();

  showPostMatch(rating, myG, opG, scoutHit, {
    xp:xp, rows:xpRows, levels:levels, gains:matchGains,
    ovrBefore:ovrBefore, ovrAfter:ovrAfter, badges:badges, traits:newTraits, moves:newMoves,
    obj:objPaid
  });
  if(newMoves.length) setTimeout(function(){ showMove(newMoves[0]); }, 1500);
  S.trainXp = 0; S.trainGains = [];
}

function applyResult(a, b, ga, gb){
  var T = S.tables[CLUBS[a].lg];
  var ta = T[a], tb = T[b];
  ta.p++; tb.p++; ta.gf+=ga; ta.ga+=gb; tb.gf+=gb; tb.ga+=ga;
  if(ga>gb){ta.w++;tb.l++;ta.pts+=3}
  else if(ga<gb){tb.w++;ta.l++;tb.pts+=3}
  else {ta.d++;tb.d++;ta.pts++;tb.pts++}
}

/* one matchday across every modelled league */
function simWorld(skipId){
  LG_IDS.forEach(function(lid){
    var pool = LEAGUES[lid].clubs.filter(function(c){
      return c.id !== skipId && c.id !== (S.fixtures[S.week-1]||{}).opp;
    }).map(function(c){ return c.id; });
    for(var i=pool.length-1;i>0;i--){ var j=ri(0,i); var tmp=pool[i]; pool[i]=pool[j]; pool[j]=tmp; }
    for(var k=0;k+1<pool.length;k+=2){
      var A = club(pool[k]), B = club(pool[k+1]);
      var sa = A.rep + ri(0,16), sb = B.rep + ri(0,16);
      var ga = clamp(Math.round((sa-sb)/17 + ri(0,2)), 0, 5);
      var gb = clamp(Math.round((sb-sa)/17 + ri(0,2)), 0, 5);
      applyResult(A.id, B.id, ga, gb);
      awardGoals(lid, A.id, ga); awardGoals(lid, B.id, gb);
    }
  });
  advanceRivals();
  makeNews();
}

function awardGoals(lid, clubId, n){
  if(!n) return;
  var list = S.scorers[lid].filter(function(s){ return s.club === clubId; });
  if(!list.length){
    var s = {n:playerName(), club:clubId, g:0};
    S.scorers[lid].push(s); list = [s];
  }
  for(var i=0;i<n;i++) list[ri(0,list.length-1)].g++;
}

function advanceRivals(){
  S.rivals.forEach(function(r){
    if(rnd() < 0.30 && r.ovr < r.pot) r.ovr += 1;
  });
}

var NEWS_T = [
  function(){ var l = LEAGUES[pickLg()]; var c = topOf(l.id);
    return {t:"⚽ "+c.n+" בראש "+l.n+".", k:""}; },
  function(){ var c = anyClub();
    return {t:"🔁 "+c.n+" פיטרו את המאמן אחרי רצף תוצאות רע.", k:"w"}; },
  function(){ var a = anyClub(), b = anyClub();
    if(a.id===b.id) return null;
    return {t:"💰 "+a.n+" רכשו קשר מ"+b.n+" תמורת "+money(ri(2,38)*1000000)+".", k:""}; },
  function(){ var l = LEAGUES[pickLg()]; var s = S.scorers[l.id].slice().sort(function(x,y){return y.g-x.g})[0];
    if(!s || s.g<3) return null;
    return {t:"🥇 "+s.n+" ("+club(s.club).ab+") מוביל את מלך השערים ב"+l.n+" עם "+s.g+".", k:""}; },
  function(){ var r = S.rivals[ri(0,S.rivals.length-1)];
    if(!r || r.ovr < ovr()) return null;
    return {t:"👀 "+r.n+" ("+club(r.club).ab+") מקבל דקות ועלה ל-OVR "+r.ovr+".", k:"w"}; },
  function(){ var c = anyClub();
    return {t:"🏟 "+c.n+" הודיעו על שדרוג האצטדיון.", k:""}; },
  function(){ var c = anyClub();
    return {t:"🩺 חלוץ "+c.n+" ייעדר 6 שבועות בעקבות פציעה.", k:"b"}; }
];
function pickLg(){ return LG_IDS[ri(0, LG_IDS.length-1)]; }
function anyClub(){ var l = LEAGUES[pickLg()]; return l.clubs[ri(0,l.clubs.length-1)]; }
function topOf(lid){
  var T = S.tables[lid];
  return LEAGUES[lid].clubs.slice().sort(function(a,b){
    return T[b.id].pts-T[a.id].pts || (T[b.id].gf-T[b.id].ga)-(T[a.id].gf-T[a.id].ga);
  })[0];
}
function makeNews(){
  for(var i=0;i<3;i++){
    var f = NEWS_T[ri(0,NEWS_T.length-1)];
    var item = f();
    if(item && !S.news.some(function(x){ return x.t === item.t; })){
      item.w = S.week; S.news.unshift(item);
    }
  }
  if(S.news.length > 60) S.news.length = 60;
}

function countXp(total){
  var el = document.getElementById("xpCount");
  var bar = document.getElementById("pmXp");
  if(!el) return;
  var t0 = performance.now(), dur = 1100;
  var startPct = parseFloat(bar.style.width) || 0;
  var endPct = clamp((S.xp/xpNeed(S.level))*100, 0, 100);
  (function step(now){
    var k = clamp((now-t0)/dur, 0, 1);
    var e = 1 - Math.pow(1-k, 3);
    el.textContent = "+" + Math.round(total*e);
    bar.style.width = (startPct + (endPct-startPct)*e) + "%";
    if(k < 1) requestAnimationFrame(step);
  })(t0);
}
